   included -- belongs to no month and is left out. A record with no Rec'd
   Date is not evidence that it belongs to the one being reported. */
// Written without a backslash class so the literal is the same character for
// character wherever it is read back -- [0-9] rather than the shorter escape.
const ISO_DAY_PREFIX = /^([0-9]{4})-([0-9]{2})-[0-9]{2}/;

function cosRecdMonth(value) {
  const s = String(value == null ? "" : value).trim();
  if (!s) return "";
  const iso = ISO_DAY_PREFIX.exec(s);
  if (iso) return iso[1] + "/" + iso[2];
  const d = new Date(s);
  if (isNaN(d.getTime())) return "";
  return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0");
}

/* The rows the workbook is actually generated from: this page's rows, narrowed
   to the ones whose Rec'd Date falls in the Report Month written down column A.

   Narrowing here rather than in buildCosSheetXml keeps it pure and testable,
   and keeps the sheet builder answering one question ("write these rows")
   instead of two.

   A blank reportMonth narrows to NOTHING rather than to everything. The
   Generate button is disabled without a month, so the only thing this decides
   is the count the dialog prints -- and "every row on the page" would be a
   count the button could never produce. */
function cosControlRowsFor(records, reportMonth, columns) {
  const month = String(reportMonth || "").trim();
  const kept = (records || []).filter(r => month && cosRecdMonth(r && r.recdDate) === month);
  return cosControlRowsFrom(kept, columns);
}

// EXTRA blank rows, on top of the Master Records rows the file is generated
// from -- 0, because a file that already carries its rows does not want twenty
// empty ones under them. It was 20 while the button produced an empty form and
// there were no data rows for it to sit under.
const COS_CONTROL_DEFAULT_ROWS = 0;
const COS_CONTROL_MAX_ROWS = 500;

// "2026-08" (what <input type="month"> hands back) -> "2026/07".
// Returns "" for anything that is not a year-month, so a caller handed a blank
// picker writes no month rather than writing "NaN/NaN" down 20 rows.
function cosReportMonth(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(ym || "").trim());
  if (!m) return "";
  let y = Number(m[1]), mo = Number(m[2]);
  if (mo < 1 || mo > 12) return "";
  mo -= 1;
  if (mo === 0) { mo = 12; y -= 1; }
  return y + "/" + String(mo).padStart(2, "0");
}

// The file is named after the month that was PICKED, not after the month its
// rows report -- the real one is `202608 ...` and says 2026/07 inside.
function cosControlFileName(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(ym || "").trim());
  const stamp = m ? (m[1] + m[2]) : "COS";
  return stamp + " COS control file_V0 1.xlsx";
}

function colLetter(i) {
  let n = i + 1, s = "";
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

function xmlEscape(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}

/* styles.xml. The xf table is generated rather than written out, so a column
   added to COS_CONTROL_COLUMNS gets its header style and its data format
   without a second edit: xf 0 is the default, 1..N are the headers in column
   order, and N+1..2N are the data cells under them. */
function buildCosStylesXml(columns) {
  const cols = columns || COS_CONTROL_COLUMNS;
  const fillColours = [];
  cols.forEach(c => { if (c.fill && fillColours.indexOf(c.fill) < 0) fillColours.push(c.fill); });
  // Fills 0 and 1 are reserved by the format (none, gray125) and Excel will not
  // open a workbook that drops them, whether or not anything uses them.
  const fills = ['<fill><patternFill patternType="none"/></fill>',
                 '<fill><patternFill patternType="gray125"/></fill>']
    .concat(fillColours.map(rgb => '<fill><patternFill patternType="solid"><fgColor rgb="FF' + rgb + '"/><bgColor indexed="64"/></patternFill></fill>'));
  const fillIndex = (rgb) => (rgb ? 2 + fillColours.indexOf(rgb) : 0);

  const headerXfs = cols.map(c =>
    '<xf numFmtId="0" fontId="2" fillId="' + fillIndex(c.fill) + '" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>');
  const dataXfs = cols.map(c =>
    '<xf numFmtId="' + (c.numFmt || 0) + '" fontId="1" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1"/>');

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<fonts count="3">'
    + '<font><sz val="11"/><color theme="1"/><name val="Calibri"/><family val="2"/><scheme val="minor"/></font>'
    + '<font><sz val="11"/><color theme="1"/><name val="Arial"/><family val="2"/></font>'
    + '<font><b/><sz val="11"/><name val="Arial"/><family val="2"/></font>'
    + '</fonts>'
    + '<fills count="' + fills.length + '">' + fills.join("") + '</fills>'
    + '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'
    + '<border><left style="thin"><color indexed="64"/></left><right style="thin"><color indexed="64"/></right>'
    + '<top style="thin"><color indexed="64"/></top><bottom style="thin"><color indexed="64"/></bottom><diagonal/></border></borders>'
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + '<cellXfs count="' + (1 + headerXfs.length + dataXfs.length) + '">'
    + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    + headerXfs.join("") + dataXfs.join("")
    + '</cellXfs>'
    + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
    + '</styleSheet>';
}

/* sheet1.xml. Every data cell is written, empty, carrying its own style: a
   blank grid that is already bordered and already number-formatted is what
   makes the file paste-into-able, and a row of genuinely absent cells would
   have neither the moment somebody typed in it. */
function buildCosSheetXml(reportMonth, rowCount, columns, rows) {
  const cols = columns || COS_CONTROL_COLUMNS;
  // The data rows come first and the blank ones are whatever the reviewer
  // asked for ON TOP of them. `rows` is optional and defaults to none, so a
  // three-argument call writes exactly the sheet it always did -- the same
  // rule every engine parameter follows, and what lets the existing tests
  // stay byte-for-byte assertions.
  const data = Array.isArray(rows) ? rows : [];
  const n = Math.max(0, Math.min(COS_CONTROL_MAX_ROWS, Math.floor(Number(rowCount) || 0)));
  const last = colLetter(cols.length - 1);
  const headerBase = 1, dataBase = 1 + cols.length;

  const colTags = cols.map((c, i) =>
    '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + c.width + '" style="' + (dataBase + i) + '" customWidth="1"/>').join("");

  const headerRow = '<row r="1" spans="1:' + cols.length + '" ht="60" customHeight="1">'
    + cols.map((c, i) =>
        '<c r="' + colLetter(i) + '1" s="' + (headerBase + i) + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(c.header) + '</t></is></c>').join("")
    + '</row>';

  const bodyRows = [];
  const total = data.length + n;
  for (let r = 0; r < total; r++) {
    const rowNo = r + 2;
    const values = r < data.length ? (data[r] || []) : null;
    const cells = cols.map((c, i) => {
      const ref = colLetter(i) + rowNo;
      const s = dataBase + i;
      // Column A is filled in on EVERY row, data and blank alike. It is
      // written as TEXT, exactly as the real file does -- its A cells are
      // shared strings reading "2026/07", not dates.
      const v = i === 0 ? reportMonth : (values ? values[i] : "");
      // Every value is inlineStr, including the two date-formatted columns.
      // Vendor PO Date arrives already formatted ("28 Sep 2026") and Vendor
      // Invoice Date is the literal "NIL"; written as a date, the first would
      // be re-laid-out by whatever locale the reviewer's Excel is set to and
      // the second is not one at all.
      // Plain <t>, no xml:space -- every value here is already trimmed
      // (cosCellText) or a literal, and the header row is the only part of the
      // sheet that needs a trailing space kept. Keeping it plain is also what
      // makes a call with no `rows` byte-identical to the old one.
      if (v) {
        return '<c r="' + ref + '" s="' + s + '" t="inlineStr"><is><t>' + xmlEscape(v) + '</t></is></c>';
      }
      // An empty cell is still WRITTEN, with its style -- a genuinely absent
      // cell loses its border and its number format the moment somebody types
      // in it, which is the whole point of handing over a formatted grid.
      return '<c r="' + ref + '" s="' + s + '"/>';
    }).join("");
    bodyRows.push('<row r="' + rowNo + '" spans="1:' + cols.length + '">' + cells + '</row>');
  }

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + '<dimension ref="A1:' + last + (total + 1) + '"/>'
    + '<sheetViews><sheetView tabSelected="1" zoomScale="85" zoomScaleNormal="85" workbookViewId="0"/></sheetViews>'
    + '<sheetFormatPr defaultColWidth="9.140625" defaultRowHeight="14.25"/>'
    + '<cols>' + colTags + '</cols>'
    + '<sheetData>' + headerRow + bodyRows.join("") + '</sheetData>'
    + '<autoFilter ref="A1:' + last + (total + 1) + '"/>'
    + '</worksheet>';
}

// CRC-32, the one thing a zip needs that JS has no builtin for.
function crc32(bytes) {
  let c, crc = 0 ^ (-1);
  for (let i = 0; i < bytes.length; i++) {
    c = (crc ^ bytes[i]) & 0xFF;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ (-1)) >>> 0;
}

/* A stored (uncompressed) zip. `entries` is [{name, text}] and comes back as a
   Uint8Array. Deflate is what a real .xlsx uses and what this deliberately does
   not do: Excel reads a stored entry identically, and the alternative is
   pulling in a compression library to save a few tens of kilobytes on a file
   that is mostly empty cells anyway. */
function zipStore(entries) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const u16 = (n) => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = (n) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

  entries.forEach(e => {
    const name = enc.encode(e.name);
    const data = enc.encode(e.text);
    const crc = crc32(data);
    // Flag bit 11 says the name is UTF-8. Every name here is ASCII, but saying
    // so costs nothing and is what keeps a renamed part safe.
    const local = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(local), name, data);
    central.push({ name: name, crc: crc, size: data.length, offset: offset });
    offset += local.length + name.length + data.length;
  });

  const dir = [];
  central.forEach(c => {
    const head = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(c.crc), u32(c.size), u32(c.size), u16(c.name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(c.offset));
    dir.push(new Uint8Array(head), c.name);
  });
  const dirBytes = dir.reduce((n, p) => n + p.length, 0);
  const end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0),
    u16(central.length), u16(central.length), u32(dirBytes), u32(offset), u16(0)));

  const all = parts.concat(dir, [end]);
  const total = all.reduce((n, p) => n + p.length, 0);
  const out = new Uint8Array(total);
  let at = 0;
  all.forEach(p => { out.set(p, at); at += p.length; });
  return out;
}

// Pure: the whole workbook as bytes, so the harness can unzip it and read the
// headers and the fills back without a browser.
function buildCosControlXlsx(ym, rowCount, rows) {
  const reportMonth = cosReportMonth(ym);
  // The sheet is named for the year the rows REPORT, which for a January pick
  // is the year before the file's own name.
  const sheetName = (reportMonth && reportMonth.slice(0, 4)) || String(new Date().getFullYear());
  const sheetXml = buildCosSheetXml(reportMonth, rowCount, COS_CONTROL_COLUMNS, rows);
  return zipStore([
    { name: "[Content_Types].xml", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + '</Types>' },
    { name: "_rels/.rels", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '</Relationships>' },
    { name: "xl/workbook.xml", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      + '<sheets><sheet name="' + xmlEscape(sheetName) + '" sheetId="1" r:id="rId1"/></sheets>'
      + '</workbook>' },
    { name: "xl/_rels/workbook.xml.rels", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
      + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>' },
    { name: "xl/styles.xml", text: buildCosStylesXml(COS_CONTROL_COLUMNS) },
    { name: "xl/worksheets/sheet1.xml", text: sheetXml },
  ]);
}

// The half that touches the page, kept out of buildCosControlXlsx for the same
// reason buildRecordPayload is kept out of goSave.
function downloadCosControlFile(ym, rowCount, rows) {
  const bytes = buildCosControlXlsx(ym, rowCount, rows);
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = cosControlFileName(ym);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// "YYYY-MM" for today, which is the value <input type="month"> wants.
function currentYearMonth() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

/* ---------- Manage modal (verbatim from PR Assistant App.html's
   MasterRecordDetailModal -- see that file's own comment block above it for
   the full reasoning on admin_btbtype/admin_quotationexpirydate/admin_hkd/
   admin_reviewapproval). ---------- */

const MANAGE_WORKFLOW_STEPS = ["Submit LIS System", "Waiting UM Review", "Waiting PR Request Approval", "Input PO No.", "Completed"];

// Not a member of MANAGE_WORKFLOW_STEPS on purpose: a cancelled record is not
// at a stage, it is off the ladder entirely. Keeping it out is what lets
// workflowStepsFor/ManageWorkflowStepper still draw the ladder a record WOULD
// have walked, greyed out, underneath the cancellation banner.
const MANAGE_WORKFLOW_CANCELLED = "Cancelled";

// The stage list a record actually walks, which depends on its own amount. A
// record whose PR amount needs no approver never passes through "Waiting PR
// Request Approval", so that step is dropped from the stepper as well as from
// the state machine -- leaving it drawn, greyed and permanently unreachable,
// reads as a stage still to come rather than as one that does not apply.
function workflowStepsFor(hasApprover) {
  return hasApprover ? MANAGE_WORKFLOW_STEPS : MANAGE_WORKFLOW_STEPS.filter(s => s !== "Waiting PR Request Approval");
}

// Same 5-stage colour map as the reference screen's own STATUS_BADGE_CLASS,
// keyed by MANAGE_WORKFLOW_STEPS so the Master Records table's Workflow
// Status pill and ManageWorkflowStepper's own "current step" chip can never
// silently drift onto different colours for the same step name.
const MANAGE_WORKFLOW_BADGE_CLASS = {
  "Submit LIS System": "bg-[#F3EBE2] text-[#6B6B6B]",
  "Waiting UM Review": "bg-[#FEF3C7] text-[#D97706]",
  "Waiting PR Request Approval": "bg-[#EDE9FE] text-[#6D28D9]",
  "Input PO No.": "bg-[#FEE2E2] text-[var(--red)]",
  "Completed": "bg-[#DCFCE7] text-[var(--green)]",
  [MANAGE_WORKFLOW_CANCELLED]: "bg-[#FEE2E2] text-[#991B1B]",
};

/* ---------- Hong Kong's own calendar day ---------- */
// Every expiry and countdown in this page measures against HKT's calendar
// day, not the viewer's machine timezone. A reviewer on a laptop still set to
// UTC would otherwise read a quotation as "Expired" up to a day early, and one
// on US time up to a day late -- and the amber "Expiring Soon" band is only 14
// days wide, so a one-day slip moves records in and out of it.
function getCurrentHKTDate() {
  const now = new Date();
  const hkt = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Hong_Kong" }));
  return new Date(hkt.getFullYear(), hkt.getMonth(), hkt.getDate());
}

/* ---------- Approver threshold matrix ---------- */
// The PR amount decides WHO has to approve, and a BTB case is held to a far
// higher bar than a NON-BTB one. The thresholds are stated as ".99" ceilings
// rather than round numbers on purpose: "> 499999.99" and ">= 500000" differ
// for any amount carrying cents, and these are the reference screen's own
// figures.
//
// An amount below the lowest band returns an EMPTY approver, and that is not a
// missing value -- it is the answer "no approval is required", which removes a
// whole stage from the workflow below and disables the Approval upload.
//
// Nothing here is stored. btbType (admin_btbtype) and the PR amount
// (admin_hkd) both are, so the approver is derived from them on every render,
// the same way the Workflow Status column already is -- there is no
// approver/approval-status column on admin_btb_lis_excel_datas to drift out of
// step with them.
const APPROVER_BANDS = {
  "BTB": [
    { over: 23399999.99, approver: "MD" },
    { over: 1999999.99,  approver: "SVP" },
    { over: 999999.99,   approver: "VP" },
    { over: 499999.99,   approver: "AVP" },
  ],
  "NON-BTB": [
    { over: 779999.99, approver: "MD" },
    { over: 155999.99, approver: "SVP" },
    { over: 38999.99,  approver: "AVP or VP" },
  ],
};

function getDualApprovers(btbType, amount) {
  const type = String(btbType == null ? "" : btbType).trim().toUpperCase();
  // The table's own PR Amount arrives as a display string that may carry
  // thousand separators ("128,400.00"); the Manage modal's draft arrives bare.
  // Both have to read as the same number, or the same record would sit in
  // different approval bands depending on which one asked.
  const numAmount = parseFloat(String(amount == null ? "" : amount).replace(/,/g, "")) || 0;
  // Anything that is not the literal "BTB" is held to the NON-BTB ladder, same
  // as the reference's own if/else: an unset BTB Type must not inherit BTB's
  // much higher -- i.e. far more permissive -- thresholds by default.
  const bands = type === "BTB" ? APPROVER_BANDS["BTB"] : APPROVER_BANDS["NON-BTB"];
  const hit = bands.find(b => numAmount > b.over);
  const approver = hit ? hit.approver : "";
  if (!approver) return { approver: "", statusDisplay: "Not Required" };
  return { approver: approver, statusDisplay: "Waiting PR Request Approval (" + approver + ")" };
}

function hasValue(v) {
  return Boolean(v) && String(v).trim() !== "" && v !== "—";
}

// The Workflow strip's own tabs, ported from the reference screen's
// STATUS_TABS. Two of them ("Expired", "Expiring Soon") are NOT workflow
// stages at all -- they are quotation-expiry date checks that cut across every
// stage, which is why matchesWorkflowTab below answers them separately rather
// than comparing them to a stage name.
const WORKFLOW_TABS = ["All", "Expired", "Expiring Soon", "Submit LIS System", "Waiting UM Review",
  "Waiting PR Request Approval", "Input PO No.", "Completed", "Cancelled"];

function matchesWorkflowTab(r, tab) {
  if (tab === "All") return true;
  if (tab === "Expired" || tab === "Expiring Soon") {
    // Both exclude cancelled records, same as the reference's own tab counts:
    // a cancelled requisition's quotation going stale is not work anyone has
    // to pick up, so counting it would inflate the two tabs a reviewer uses
    // to decide what to chase today.
    if (r.status === "Cancel") return false;
    const info = quotationExpiryInfo(r.quotationExpiryDate);
    return Boolean(info) && info.tone === (tab === "Expired" ? "expired" : "soon");
  }
  return masterRecordWorkflowStep(r) === tab;
}

// Table-header click-to-sort (see toggleSort in RecordsPage). Compares the
// column's own exportValue -- already the plain, unformatted value each
// column's Excel export uses, so sorting can never disagree with what a
// reviewer would see if they exported the same view. Empty/placeholder
// values ("", "—") always sort to the end regardless of direction, rather
// than bouncing between top and bottom when the arrow flips.
function isEmptySortValue(v) {
  return v === null || v === undefined || String(v).trim() === "" || String(v).trim() === "—";
}
const SORT_DATE_LIKE = /^\d{1,2}\s+[A-Za-z]{3,}\s+\d{4}$/;
const SORT_ISO_DATE_LIKE = /^\d{4}-\d{2}-\d{2}/;
const SORT_NUMERIC_LIKE = /^-?\d+(\.\d+)?$/;
function compareMasterRecordSortValues(va, vb) {
  const aEmpty = isEmptySortValue(va), bEmpty = isEmptySortValue(vb);
  if (aEmpty && bEmpty) return 0;
  if (aEmpty) return 1;
  if (bEmpty) return -1;
  const sa = String(va).trim(), sb = String(vb).trim();
  // "DD Mon YYYY" (fmtLisDate's own format, also DEMO_RECORDS') or ISO --
  // only when BOTH sides look date-shaped, so a stray numeric-looking string
  // on one side doesn't get misread as a date.
  if ((SORT_DATE_LIKE.test(sa) || SORT_ISO_DATE_LIKE.test(sa)) && (SORT_DATE_LIKE.test(sb) || SORT_ISO_DATE_LIKE.test(sb))) {
    const da = new Date(sa), db = new Date(sb);
    if (!isNaN(da.getTime()) && !isNaN(db.getTime())) return da.getTime() - db.getTime();
  }
  // Numeric only when the WHOLE value (after stripping thousand separators)
  // is a number -- "REC-2026-129" must fall through to string compare, not
  // get coerced into a number from its embedded digits.
  const na = SORT_NUMERIC_LIKE.test(sa.replace(/,/g, "")) ? Number(sa.replace(/,/g, "")) : NaN;
  const nb = SORT_NUMERIC_LIKE.test(sb.replace(/,/g, "")) ? Number(sb.replace(/,/g, "")) : NaN;
  if (!isNaN(na) && !isNaN(nb)) return na - nb;
  return sa.toLowerCase().localeCompare(sb.toLowerCase());
}

// The Master Records table's own PR Amount cell -- strips whatever separators
// the source already carries (DEMO_RECORDS' comma-formatted strings, or
// fetchRecordsFromDataverse's bare numeric string) and reformats as
// "HK$ 1,234,567.00", same shape as the reference screen. A value that isn't
// a parseable number (missing, "—") reads as "-", never as "HK$ NaN".
function formatPrAmountDisplay(v) {
  if (!hasValue(v)) return "-";
  const n = parseFloat(String(v).replace(/,/g, ""));
  if (Number.isNaN(n)) return "-";
  return `HK$ ${n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function plainDecimalDraft(v) {
  return hasValue(v) ? String(v).replace(/,/g, "") : "";
}

// The state machine, ported from the reference screen's evaluateWorkflowState.
// Order matters and every gate is a hard one:
//
//   cancelled              -> "Cancelled"                    (nothing else asked)
//   no PR No.              -> "Submit LIS System"
//   no UM Review document  -> "Waiting UM Review"
//   approver required and
//     no approval document -> "Waiting PR Request Approval"
//   no PO No.              -> "Input PO No."
//   otherwise              -> "Completed"
//
// The approver gate is the only CONDITIONAL one, and that conditionality is the
// whole point of the threshold matrix: when getDualApprovers returns no
// approver the approval document is never asked for at all, so a small-amount
// record steps straight from UM Review to Input PO No. rather than stalling
// forever on a stage nobody will ever action.
//
// btbType/prAmount are optional so an older two-key call still answers -- with
// neither stated the NON-BTB ladder reads 0 and returns no approver, i.e. the
// approval stage is skipped rather than silently demanded.
function evaluateManageWorkflowState({ prNo, reviewDoc, approvalDoc, poNo, btbType, prAmount, cancelled }) {
  if (cancelled) return MANAGE_WORKFLOW_CANCELLED;
  if (!hasValue(prNo)) return "Submit LIS System";
  if (!reviewDoc) return "Waiting UM Review";
  const { approver } = getDualApprovers(btbType, prAmount);
  if (approver && !approvalDoc) return "Waiting PR Request Approval";
  if (!hasValue(poNo)) return "Input PO No.";
  return "Completed";
}

// `steps` is whichever ladder workflowStepsFor handed back (4 stages when no
// approver is required, 5 when one is), defaulting to the full five so a caller
// that does not care still renders. A cancelled record keeps its ladder drawn
// and greyed under a banner rather than losing it: a reviewer looking at a
// cancelled record still wants to see how far it had got.
function ManageWorkflowStepper({ currentStep, steps }) {
  const list = steps && steps.length ? steps : MANAGE_WORKFLOW_STEPS;
  const cancelled = currentStep === MANAGE_WORKFLOW_CANCELLED;
  const currentIndex = cancelled ? -1 : list.indexOf(currentStep);
  return (
    <div className="flex flex-col gap-2">
      {cancelled && (
        <div className="flex justify-center">
          <span className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#FEE2E2] border border-[#FCA5A5] text-[var(--red)] font-bold text-[14px]">
            &#128683; Status: Cancelled
          </span>
        </div>
      )}
      <ol className={"flex items-start" + (cancelled ? " opacity-50" : "")}>
        {list.map((step, i) => {
          const done = currentIndex >= 0 && (i < currentIndex || (i === currentIndex && step === "Completed"));
          const current = i === currentIndex && !done;
          const lineFilled = currentIndex >= 0 && i < currentIndex;
          return (
            <React.Fragment key={step}>
              <li className="flex flex-col items-center gap-1.5 shrink-0 w-[104px]">
                <span className={"flex items-center justify-center w-6 h-6 rounded-full text-[11px] font-bold ui-transition " +
                  (done ? "bg-[var(--green)] text-white" :
                   current ? "bg-[#FFF3D6] text-[var(--orange-dark)] ring-2 ring-[var(--orange-dark)]" :
                   "bg-white text-[#8E8E93] border-2 border-[var(--line)]")}>
                  {done ? <Icon name="check" className="w-3.5 h-3.5" /> : i + 1}
                </span>
                <span className={"text-[11px] text-center leading-tight " + (done || current ? "font-bold text-[var(--ink)]" : "text-[#8E8E93]")}>
                  {step}
                </span>
              </li>
              {i < list.length - 1 && (
                <div className={"h-[2px] flex-1 mt-[11px] ui-transition " + (lineFilled ? "bg-[var(--green)]" : "bg-[var(--line)]")} />
              )}
            </React.Fragment>
          );
        })}
      </ol>
    </div>
  );
}

function parseReviewApproval(raw) {
  if (!raw) return { review: null, approval: null };
  try {
    const parsed = JSON.parse(raw);
    return { review: parsed.review || null, approval: parsed.approval || null };
  } catch (e) {
    return { review: null, approval: null };
  }
}
function serializeReviewApproval(review, approval) {
  return JSON.stringify({ review: review || null, approval: approval || null });
}

// The Master Records table's own Workflow Status cell -- same inputs
// MasterRecordDetailModal's ManageWorkflowStepper derives its current step
// from (record.prNo/poNo, plus admin_reviewapproval's two document names), so the
// table row and the modal it opens into can never disagree about which stage
// a record is on.
function masterRecordWorkflowStep(r) {
  const { review, approval } = parseReviewApproval(r.reviewApprovalRaw);
  return evaluateManageWorkflowState({
    prNo: r.prNo, reviewDoc: review, approvalDoc: approval, poNo: r.poNo,
    // btbType/hkd are what decide whether the approval stage applies at all,
    // so the table's own pill has to be handed them too -- without them every
    // row would report "Waiting PR Request Approval" while the modal it opens
    // into (which does pass them) showed "Input PO No." for the same record.
    btbType: r.btbType, prAmount: r.hkd,
    // There is no workflow-status column on admin_btb_lis_excel_datas. What
    // marks a record cancelled is the manual Status field (admin_prstatus) the
    // Status cell and the Cancel tab already read -- so cancelling is one
    // write to a column that exists, and "Cancelled" needs no second source of
    // truth that could disagree with the badge in the same row.
    cancelled: r.status === "Cancel",
  });
}

// The derived approver for a table row, same inputs as above. Read by the
// Approver column and by the Manage modal's own notice; nothing writes it --
// see getDualApprovers' note on why it is never stored.
function masterRecordApprover(r) {
  return getDualApprovers(r.btbType, r.hkd).approver;
}

function formatIsoDateDisplay(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return isNaN(d.getTime()) ? "—"
    : d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

// The grid's date-kind cells (PO Date, Receipt Date, Invoice/DN Date) are
// plain text inputs pre-filled with formatIsoDateDisplay's own "DD Mon
// YYYY" -- a reviewer editing one is just as likely to retype that same
// shape as to type ISO. Accepts either, rejects everything else (returns
// null, which the caller reads as "leave this field out of the write").
const ISO_DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
const DISPLAY_DATE_RE = /^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/;
const SHORT_MONTH_NAMES = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
// The Manage grid's own date parser, and deliberately NOT the lenient
// parseIsoDate buildRecordPayload uses. That one hands anything to
// `new Date()` and takes whatever comes back; this one accepts only an
// ISO date or the "12 Mar 2026" form the table itself displays, and
// answers null for everything else -- which is what makes
// saveAllPendingChanges leave a mistyped date OUT of the write and on
// screen, still dirty, instead of silently storing a date nobody meant.
function parseEditableDate(input) {
  const val = String(input || "").trim();
  if (!val) return null;
  const isoMatch = val.match(ISO_DATE_RE);
  if (isoMatch) {
    const d = new Date(val + "T00:00:00");
    return isNaN(d.getTime()) ? null : val;
  }
  const dispMatch = val.match(DISPLAY_DATE_RE);
  if (dispMatch) {
    const day = parseInt(dispMatch[1], 10);
    const monthIdx = SHORT_MONTH_NAMES.indexOf(dispMatch[2].slice(0, 3).toLowerCase());
    const year = parseInt(dispMatch[3], 10);
    if (monthIdx === -1) return null;
    const d = new Date(year, monthIdx, day);
    if (isNaN(d.getTime()) || d.getDate() !== day || d.getMonth() !== monthIdx) return null;
    return `${year}-${String(monthIdx + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  }
  return null;
}

// Measured against HKT's calendar day (see getCurrentHKTDate) rather than the
// viewer's, and it reports the day count as well as the tone so the KPI strip,
// the workflow tabs and the Manage modal's countdown line all read the same
// number off one function instead of each redoing the arithmetic.
function quotationExpiryInfo(dateStr) {
  if (!dateStr) return null;
  const expiry = new Date(dateStr + "T00:00:00");
  if (isNaN(expiry.getTime())) return null;
  const diffDays = Math.ceil((expiry - getCurrentHKTDate()) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return { text: "Expired", tone: "expired", days: diffDays };
  if (diffDays <= 14) return { text: `${diffDays} day${diffDays === 1 ? "" : "s"} remaining`, tone: "soon", days: diffDays };
  return { text: `${diffDays} days remaining`, tone: "ok", days: diffDays };
}

// workflowStatus is excluded too -- it is the same computed step the
// "Workflow Status (preview)" stepper above already shows, just as a table
// pill instead of a stepper.
const MANAGE_GRID_EXCLUDED_KEYS = new Set(["status", "prNo", "poNo", "recordId", "btbType", "hkd", "quotationExpiryDate", "workflowStatus", "approver"]);

// What KIND of value each editable grid field holds -- one entry per
// gridColumns key (MASTER_RECORDS_COLUMNS minus MANAGE_GRID_EXCLUDED_KEYS).
// The COLUMN NAME is deliberately not here: it comes from SCHEMA.lis.records
// under the same field key, so this app keeps ONE transcription of the two
// sides' column names instead of two that can drift (see the note at the top
// of this section for the two truncated names that drift produced).
// "date" entries are real Dataverse Date columns (fetchRecordsFromDataverse
// runs fmtLisDate on them); Quotation Start/End Date are deliberately "text"
// even though they look like dates -- they are Text columns that can carry a
// stated period ("TBC", a range), same as buildRecordPayload's own comment on
// these two elsewhere in this file.
const MASTER_RECORDS_EDITABLE_FIELDS = {
  no:                 { kind: "text" },
  recdDate:           { kind: "date" },
  customerName:       { kind: "text" },
  vendor:             { kind: "text" },
  prDescription:      { kind: "text" },
  uid:                { kind: "text" },
  startDate:          { kind: "date" },
  endDate:            { kind: "date" },
  contractNo:         { kind: "text" },
  usdOthers:          { kind: "text" },
  handledBy:          { kind: "text" },
  iptUnitMgr:         { kind: "text" },
  quotationStartDate: { kind: "text" },
  quotationEndDate:   { kind: "text" },
  poDate:             { kind: "date" },
  receiptDate:        { kind: "date" },
  poAmountHkd:        { kind: "number" },
  umMgr:              { kind: "text" },
  prIssuedMonth:      { kind: "text" },
  prIssuedOn:         { kind: "text" },
  worksOrderCode:     { kind: "text" },
  yn:                 { kind: "text" },
  remarks:            { kind: "text" },
  invoiceDnNo:        { kind: "text" },
  invoiceDnDate:      { kind: "date" },
  issueBy:            { kind: "text" },
  chargeCcc:          { kind: "text" },
  accountCode:        { kind: "text" },
  // new_-prefixed, not admin_-with-a-"2" -- Status Remark is one of the three
  // columns added alongside admin_flagged/admin_prstatus (see the fetch query
  // below, which already reads it). It was in the editable grid with no entry
  // here, so saveAllPendingChanges''' own "no config -> skip" guard silently
  // discarded anything a reviewer typed into it.
  statusRemark:       { kind: "text" },
};

function MasterRecordDetailModal({ record, onClose, onStatusChange, onToggleFlag, updateMasterRecordField, updateMasterRecordFields, fieldSaveError, dismissFieldSaveError }) {
  const [prEditing, setPrEditing] = useState(false);
  const [prDraft, setPrDraft] = useState(hasValue(record.prNo) ? record.prNo : "");
  const [poEditing, setPoEditing] = useState(false);
  const [poDraft, setPoDraft] = useState(hasValue(record.poNo) ? record.poNo : "");

  // The former read-only grid's own drafts, one entry per MASTER_RECORDS_
  // EDITABLE_FIELDS key, keyed the same way prDraft/poDraft are but as a
  // single object -- 29 separate useState calls would be unreadable. Absent
  // from this object means "showing the record's own current value", not
  // "empty"; gridFieldValue below is what actually resolves that.
  const [fieldDrafts, setFieldDrafts] = useState({});
  const gridFieldValue = (key) =>
    key in fieldDrafts ? fieldDrafts[key] : (hasValue(record[key]) ? String(record[key]) : "");
  const setGridFieldDraft = (key, val) => setFieldDrafts(prev => ({ ...prev, [key]: val }));
  const isGridFieldDirty = (key) => {
    if (!(key in fieldDrafts)) return false;
    const val = fieldDrafts[key].trim();
    const current = hasValue(record[key]) ? String(record[key]).trim() : "";
    return val !== current;
  };
  // A field key sits here for a moment right after "Save" writes it to
  // Dataverse -- the green flash confirming "saved", not "editable now".
  const [flashKeys, setFlashKeys] = useState(new Set());
  const flashSaved = (key) => {
    setFlashKeys(prev => { const next = new Set(prev); next.add(key); return next; });
    setTimeout(() => {
      setFlashKeys(prev => { const next = new Set(prev); next.delete(key); return next; });
    }, 700);
  };
  const [prAmountDraft, setPrAmountDraft] = useState(plainDecimalDraft(record.hkd));
  // BTB Type and Quotation Expiry used to write on the instant they changed;
  // they now sit in a draft like every other field here, so a select/date
  // pick is just as easy to highlight-then-batch as a typed value is.
  const [btbTypeDraft, setBtbTypeDraft] = useState(record.btbType || "");
  const [quotationExpiryDraft, setQuotationExpiryDraft] = useState(record.quotationExpiryDate || "");
  const isPrDirty = prDraft.trim() !== (hasValue(record.prNo) ? record.prNo : "");
  const isPoDirty = poDraft.trim() !== (hasValue(record.poNo) ? record.poNo : "");
  const isPrAmountDirty = prAmountDraft.trim() !== plainDecimalDraft(record.hkd);
  const isBtbTypeDirty = btbTypeDraft !== (record.btbType || "");
  const isQuotationExpiryDirty = quotationExpiryDraft !== (record.quotationExpiryDate || "");

  const initialDocs = parseReviewApproval(record.reviewApprovalRaw);
  const [reviewDoc, setReviewDoc] = useState(initialDocs.review ? { name: initialDocs.review, url: null } : null);
  const [approvalDoc, setApprovalDoc] = useState(initialDocs.approval ? { name: initialDocs.approval, url: null } : null);

  // Every refusal below says WHY in this one line rather than just greying a
  // control out. A disabled button with no explanation and a rule the reviewer
  // could satisfy in one step are the same pixel otherwise, and only one of
  // them is a problem they can act on -- the same reasoning App.html's own
  // Save lock follows.
  const [notice, setNotice] = useState(null);
  const refuse = (msg) => setNotice(msg);

  // ---- Derived approval + stage, off the DRAFTS, not off `record` ----------
  // Every gate below is measured against what is currently on screen, so
  // raising the PR Amount past a threshold reveals the approval stage (and its
  // upload) immediately, before anything is saved -- rather than after a save,
  // a close and a re-open.
  const approval = getDualApprovers(btbTypeDraft, prAmountDraft);
  const hasApprover = Boolean(approval.approver);
  const cancelled = record.status === "Cancel";
  const workflowStep = evaluateManageWorkflowState({
    prNo: prDraft, reviewDoc, approvalDoc, poNo: poDraft,
    btbType: btbTypeDraft, prAmount: prAmountDraft, cancelled,
  });
  const completed = workflowStep === "Completed";
  const expiryInfo = quotationExpiryInfo(quotationExpiryDraft);

  // ---- Field locking, ported from updateFieldLockingAndApprovalUI ---------
  // Two whole-record locks come first and the per-field rules only apply
  // inside them:
  //   Cancelled -- nothing is editable at all; the footer's red button becomes
  //                "Re-open".
  //   Completed -- everything is frozen EXCEPT PO No., which procurement still
  //                corrects after the fact (a mistyped PO is found later, and
  //                re-opening a finished record to fix one would be worse).
  const fieldsLocked = cancelled || completed;
  // PR No. stops being editable the moment a UM Review document exists: the
  // reviewer signed off against THAT number, so changing it afterwards would
  // silently re-point a signed review at a different requisition. Deleting the
  // document is the deliberate way back.
  const prLockReason = cancelled ? "This record is cancelled — re-open it to make changes."
    : completed ? "This record is completed. Only PO No. stays editable."
    : reviewDoc ? "A UM Review document is attached, and it was reviewed against this PR Number. Delete the document first if the number has to change."
    : null;
  // PO No. only opens at its own stage. Completed is deliberately NOT locked
  // here -- that is the one field a finished record still allows.
  const poLockReason = cancelled ? "This record is cancelled — re-open it to make changes."
    : (!completed && (workflowStep === "Submit LIS System" || workflowStep === "Waiting UM Review" || workflowStep === "Waiting PR Request Approval"))
      ? "PO No. opens at the \"Input PO No.\" stage. This record is still at \"" + workflowStep + "\"."
      : null;
  // Both uploads need a PR Number first: the document is filed against the
  // requisition, so attaching one to a record that does not yet name a PR
  // leaves a file with nothing to belong to.
  const reviewUploadReason = cancelled ? "This record is cancelled — re-open it to attach documents."
    : completed ? "This record is completed."
    : !hasValue(prDraft) ? "Enter and save a PR Number first — the UM Review is filed against it."
    : null;
  const approvalUploadReason = cancelled ? "This record is cancelled — re-open it to attach documents."
    : completed ? "This record is completed."
    : !hasApprover ? "Not required — a " + (btbTypeDraft || "NON-BTB") + " PR at this amount is below every approval threshold."
    : !hasValue(prDraft) ? "Enter and save a PR Number first — the approval is filed against it."
    : (workflowStep === "Submit LIS System" || workflowStep === "Waiting UM Review") ? "Attach the UM Review document first."
    : null;

  const saveReviewApproval = (nextReviewName, nextApprovalName) => {
    updateMasterRecordField(record.recordId, "review",
      serializeReviewApproval(nextReviewName, nextApprovalName),
      { reviewApprovalRaw: serializeReviewApproval(nextReviewName, nextApprovalName) });
  };
  const pickReviewDoc = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (reviewUploadReason) { refuse(reviewUploadReason); return; }
    setNotice(null);
    setReviewDoc({ name: file.name, url: URL.createObjectURL(file) });
    saveReviewApproval(file.name, approvalDoc ? approvalDoc.name : null);
  };
  const pickApprovalDoc = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (approvalUploadReason) { refuse(approvalUploadReason); return; }
    setNotice(null);
    setApprovalDoc({ name: file.name, url: URL.createObjectURL(file) });
    saveReviewApproval(reviewDoc ? reviewDoc.name : null, file.name);
  };
  // Deleting either document steps the record BACKWARDS, so it asks first --
  // the review/approval names are the only thing on this screen that writes to
  // Dataverse the instant it changes (they drive the stage), so there is no
  // draft to abandon if the reviewer changes their mind after the fact.
  const deleteReviewDoc = () => {
    if (fieldsLocked) { refuse(prLockReason || "This record is not editable."); return; }
    if (!window.confirm("Remove the UM Review document? This record steps back to \"Waiting UM Review\".")) return;
    setNotice(null);
    setReviewDoc(null);
    saveReviewApproval(null, approvalDoc ? approvalDoc.name : null);
  };
  const deleteApprovalDoc = () => {
    if (fieldsLocked) { refuse(prLockReason || "This record is not editable."); return; }
    if (!window.confirm("Remove the PR Approval document? This record steps back to \"Waiting PR Request Approval\".")) return;
    setNotice(null);
    setApprovalDoc(null);
    saveReviewApproval(reviewDoc ? reviewDoc.name : null, null);
  };

  // ---- Cancel / Re-open ---------------------------------------------------
  // Both write the ONE column that already exists for this: admin_prstatus, the
  // same manual Status the table's own cell and its Cancel tab read. There is
  // no previous-status column to restore from on re-open, and none is needed --
  // the workflow stage is recomputed from PR No./documents/PO No. every render,
  // so a re-opened record lands back on exactly the stage its own contents put
  // it at. Re-open therefore only has to clear the cancellation, which it does
  // by setting the manual Status to "Pending".
  const [confirming, setConfirming] = useState(null); // null | "cancel" | "reopen"
  const doCancel = () => { setConfirming(null); setNotice(null); onStatusChange(record, "Cancel"); onClose(); };
  const doReopen = () => { setConfirming(null); setNotice(null); onStatusChange(record, "Pending"); };

  const gridColumns = MASTER_RECORDS_COLUMNS.filter(c => !MANAGE_GRID_EXCLUDED_KEYS.has(c.key));

  // Nothing above writes on its own any more -- every field just sits in a
  // draft, amber-highlighted while it disagrees with `record`. This is the
  // ONE place anything reaches Dataverse: it gathers every dirty field into
  // a single writeMasterRecordFields call (one id lookup, one updateRecord
  // covering however many columns changed), flashes each one green on
  // success, then closes so the reviewer sees the table holding the values
  // they just typed. A field that fails to parse (bad number/date) is
  // silently left out and stays dirty on screen, same as before batching.
  // On failure nothing is cleared and the modal stays open -- fieldSaveError
  // explains why, and every draft is still there to retry.
  const saveAllPendingChanges = async () => {
    // A cancelled record refuses the whole write. A completed one lets PO No.
    // through and nothing else -- the same asymmetry the per-field locks
    // above draw, enforced here too so a draft that was already dirty when
    // the record reached Completed cannot ride along on the next Save.
    if (cancelled) { refuse("This record is cancelled — re-open it before saving changes."); return; }
    // Keyed by the app's OWN field key, never by a column name --
    // updateMasterRecordFields resolves each one through SCHEMA.lis.records
    // and drops a key this side has no column for, so a missing column costs
    // that one value instead of the whole update.
    const fields = {};
    const localPatch = {};
    const keys = [];
    const put = (key, dvValue, displayValue) => {
      fields[key] = dvValue;
      localPatch[key] = displayValue;
      keys.push(key);
    };

    const prVal = prDraft.trim();
    if (prVal && isPrDirty && !prLockReason) put("prNo", prVal, prVal);
    const poVal = poDraft.trim();
    if (poVal && isPoDirty && !poLockReason) put("poNo", poVal, poVal);
    if (isPrAmountDirty && !fieldsLocked) {
      const amtVal = prAmountDraft.trim();
      put("hkd", amtVal === "" ? null : parseFloat(amtVal), amtVal);
    }
    if (isBtbTypeDirty && !fieldsLocked) put("btbType", btbTypeDraft || null, btbTypeDraft);
    if (isQuotationExpiryDirty && !fieldsLocked) {
      put("quotationExpiryDate", quotationExpiryDraft || null, quotationExpiryDraft);
    }
    Object.keys(fieldDrafts).forEach(key => {
      if (fieldsLocked) return;
      if (!isGridFieldDirty(key)) return;
      const config = MASTER_RECORDS_EDITABLE_FIELDS[key];
      if (!config) return;
      const val = gridFieldValue(key).trim();
      let dvValue, displayValue;
      if (config.kind === "number") {
        const n = val === "" ? null : parseFloat(val.replace(/,/g, ""));
        if (val !== "" && Number.isNaN(n)) return;
        dvValue = n;
        displayValue = val === "" ? "—" : val;
      } else if (config.kind === "date") {
        if (val === "") { dvValue = null; displayValue = "—"; }
        else {
          const iso = parseEditableDate(val);
          if (!iso) return;
          dvValue = iso;
          displayValue = formatIsoDateDisplay(iso);
        }
      } else {
        dvValue = val === "" ? null : val;
        displayValue = val === "" ? "—" : val;
      }
      put(key, dvValue, displayValue);
    });

    if (keys.length === 0) { onClose(); return; }

    const ok = await updateMasterRecordFields(record.recordId, fields, localPatch);
    if (!ok) return; // fieldSaveError is up; every draft stays put to retry

    keys.forEach(flashSaved);
    setPrEditing(false);
    setPoEditing(false);
    setFieldDrafts(prev => {
      const next = { ...prev };
      keys.forEach(k => { delete next[k]; });
      return next;
    });
    onClose();
  };

  return (
    <div onClick={onClose} role="dialog" aria-modal="true" aria-label={"Manage " + record.recordId}
      className="modal-backdrop fixed inset-0 z-50 bg-[#F4F0E8]/85 backdrop-blur-sm flex items-center justify-center p-4 md:p-8">
      <div onClick={e => e.stopPropagation()}
        className="modal-pop bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">

        <div className="px-6 py-4 border-b border-[var(--line)] flex items-center justify-between shrink-0">
          <div>
            <div className="flex items-center gap-2 flex-wrap">
              <div className="text-[19px] font-bold text-[var(--ink)]" style={{ fontFamily: "'Funnel Sans', system-ui, sans-serif" }}>{record.recordId}</div>
              <span className={"inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold " +
                (MANAGE_WORKFLOW_BADGE_CLASS[workflowStep] || "bg-[#F3EBE2] text-[#6B6B6B]")}>{workflowStep}</span>
            </div>
            <div className="text-[14px] text-[#6B6B6B]">{record.customerName} · {record.vendor}</div>
          </div>
          <div className="flex items-center gap-3 shrink-0">
            <button type="button" onClick={saveAllPendingChanges} disabled={cancelled}
              title={cancelled ? "This record is cancelled — re-open it before saving changes." : undefined}
              className={`ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-semibold border-[1.5px] border-transparent ${
                cancelled ? "bg-[var(--line)] text-white cursor-not-allowed" : "bg-[var(--orange)] text-[var(--ink)] hover:bg-[#FFF3D6]"}`}>
              Save
            </button>
            <button type="button" onClick={onClose} aria-label="Close"
              className="ui-transition pressable text-[14px] font-semibold text-[#6B6B6B] hover:text-[var(--ink)] flex items-center gap-1">
              <Icon name="close" className="w-4 h-4" /> Close
            </button>
          </div>
        </div>

        <div className="p-6 overflow-y-auto flex flex-col gap-5">
          {fieldSaveError && (
            <div className="flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[14px] leading-5 text-[#3D3D3D]">{fieldSaveError} The change was not saved and has been reverted.</div>
              <button type="button" onClick={dismissFieldSaveError} className="text-[13px] font-semibold text-[#B23B3B] shrink-0">Dismiss</button>
            </div>
          )}

          {notice && (
            <div className="flex gap-2 px-4 py-3 bg-[#FFF3D6] border-l-4 border-[var(--orange-dark)] rounded-lg">
              <div className="flex-1 text-[14px] leading-5 text-[#3D3D3D]">{notice}</div>
              <button type="button" onClick={() => setNotice(null)} className="text-[13px] font-semibold text-[var(--orange-dark)] shrink-0">Dismiss</button>
            </div>
          )}

          <div className="bg-[#FBF6EF] p-4 rounded-xl border border-[#EBE3D7]">
            <div className="flex items-center justify-between mb-3 gap-3 flex-wrap">
              <div className="text-[13px] font-bold text-[#6B6B6B] uppercase tracking-wider">Sequential Workflow Stage</div>
              <span className="text-[12px] text-[#6B6B6B] italic">Computed from PR No. · documents · PO No. — not a stored field</span>
            </div>
            {/* 4 stages, not 5, when the amount needs no approver -- see
                workflowStepsFor. */}
            <ManageWorkflowStepper currentStep={workflowStep} steps={workflowStepsFor(hasApprover)} />
            <div className="mt-3 pt-3 border-t border-[#EBE3D7] flex items-center gap-2 flex-wrap">
              <span className="text-[12px] font-bold uppercase tracking-wider text-[#6B6B6B]">Approval required</span>
              {hasApprover ? (
                <React.Fragment>
                  <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-[12px] font-bold bg-[#EDE9FE] text-[#6D28D9]">{approval.approver}</span>
                  <span className="text-[13px] text-[#6B6B6B]">
                    — a {btbTypeDraft || "NON-BTB"} PR at {formatPrAmountDisplay(prAmountDraft)} needs {approval.approver} sign-off before PO No. opens.
                  </span>
                </React.Fragment>
              ) : (
                <span className="text-[13px] text-[#6B6B6B]">
                  <span className="font-semibold text-[var(--ink)]">Not required</span> — below every threshold for a {btbTypeDraft || "NON-BTB"} PR, so this record skips the approval stage entirely.
                </span>
              )}
            </div>
          </div>

          <div className="flex flex-wrap items-end gap-6">
            <div className="flex flex-col gap-1">
              <label className="text-[13px] font-semibold text-[#6B6B6B]">Status</label>
              <select value={record.status || ""} onChange={e => onStatusChange(record, e.target.value)}
                aria-label={`Status for ${record.recordId}`}
                className={`text-[13px] font-semibold rounded-full pl-2.5 pr-1.5 py-1 border-0 outline-none cursor-pointer ui-transition ${record.status ? STATUS_STYLES[record.status] : "bg-[#F3EBE2] text-[#6B6B6B]"}`}>
                {!record.status && <option value="">—</option>}
                {Object.values(PR_STATUS_CHOICES).map(label => <option key={label} value={label}>{label}</option>)}
              </select>
            </div>
            <button type="button" onClick={() => onToggleFlag(record)}
              title={record.flagged ? "Remove flag" : "Add flag"} aria-label={record.flagged ? "Remove flag" : "Add flag"}
              className={`ui-transition pressable flex items-center gap-1.5 ${record.flagged ? "" : "opacity-25 grayscale hover:opacity-60"}`}>
              🚩 <span className="text-[13px] text-[#6B6B6B]">Flagged</span>
            </button>
          </div>

          {/* Both Edit buttons stay CLICKABLE when their field is locked, and
              answer with the reason instead of doing nothing -- a greyed
              button and a rule the reviewer could satisfy in one step look
              identical otherwise. */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="flex flex-col gap-1">
              <label className="text-[13px] font-semibold text-[#6B6B6B]">PR No.</label>
              <div className="flex gap-2 items-center">
                <input value={prDraft} onChange={e => setPrDraft(e.target.value)} disabled={!prEditing || Boolean(prLockReason)} placeholder="Enter PR Number…"
                  className={`flex-1 px-3 py-2 text-[16px] rounded-lg border-[1.5px] ui-transition focus:border-[var(--orange)] focus:outline-none ${
                    flashKeys.has("prNo") ? "bg-[#DCFCE7] border-[var(--green)] text-[var(--ink)]" :
                    (prEditing && isPrDirty) ? "bg-[#FEF3C7] border-[var(--amber)] text-[var(--ink)]" :
                    (prEditing && !prLockReason) ? "bg-white border-[var(--line)] text-[var(--ink)]" : "bg-[var(--surface-soft)] border-[var(--line)] text-[#6B6B6B]"}`} />
                <button type="button" title={prLockReason || undefined}
                  onClick={() => { if (prLockReason) { refuse(prLockReason); return; } setNotice(null); setPrEditing(e => !e); }}
                  className={`ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-semibold border-[1.5px] border-transparent whitespace-nowrap ${
                    prLockReason ? "bg-[var(--line)] text-white" : "bg-[var(--orange)] text-[var(--ink)] hover:bg-[#FFF3D6]"}`}>
                  {prLockReason ? "🔒 Locked" : prEditing ? "Done" : "Edit"}
                </button>
              </div>
              {prLockReason && <div className="text-[12px] text-[#6B6B6B] leading-4 mt-0.5">{prLockReason}</div>}
            </div>
            <div className="flex flex-col gap-1">
              <label className="text-[13px] font-semibold text-[#6B6B6B]">PO No.</label>
              <div className="flex gap-2 items-center">
                <input value={poDraft} onChange={e => setPoDraft(e.target.value)} disabled={!poEditing || Boolean(poLockReason)} placeholder="Enter PO Number…"
                  className={`flex-1 px-3 py-2 text-[16px] rounded-lg border-[1.5px] ui-transition focus:border-[var(--orange)] focus:outline-none ${
                    flashKeys.has("poNo") ? "bg-[#DCFCE7] border-[var(--green)] text-[var(--ink)]" :
                    (poEditing && isPoDirty) ? "bg-[#FEF3C7] border-[var(--amber)] text-[var(--ink)]" :
                    (poEditing && !poLockReason) ? "bg-white border-[var(--line)] text-[var(--ink)]" : "bg-[var(--surface-soft)] border-[var(--line)] text-[#6B6B6B]"}`} />
                <button type="button" title={poLockReason || undefined}
                  onClick={() => { if (poLockReason) { refuse(poLockReason); return; } setNotice(null); setPoEditing(e => !e); }}
                  className={`ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-semibold border-[1.5px] border-transparent whitespace-nowrap ${
                    poLockReason ? "bg-[var(--line)] text-white" : "bg-[var(--orange)] text-[var(--ink)] hover:bg-[#FFF3D6]"}`}>
                  {poLockReason ? "🔒 Locked" : poEditing ? "Done" : "Edit"}
                </button>
              </div>
              {poLockReason && <div className="text-[12px] text-[#6B6B6B] leading-4 mt-0.5">{poLockReason}</div>}
            </div>
          </div>

          <div className="border border-[#E5E5EA] rounded-xl p-4 bg-[#F9F9FB] flex flex-col gap-3">
            <div className="text-[15px] font-bold text-[var(--ink)]">BTB Type · PR Amount · Quotation Expiry · Documents</div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {/* These two are what the approval matrix reads, so they carry
                  the same whole-record lock as everything else: a cancelled or
                  completed record must not have its approval band moved under
                  a sign-off that already happened. */}
              <div className="flex flex-col gap-1">
                <label className="text-[13px] font-semibold text-[#6B6B6B]">BTB / NON-BTB</label>
                <select value={btbTypeDraft} onChange={e => setBtbTypeDraft(e.target.value)} disabled={fieldsLocked}
                  className={`w-full px-3 py-2 text-[16px] rounded-lg border-[1.5px] ui-transition ${
                    fieldsLocked ? "bg-[var(--surface-soft)] border-[var(--line)] text-[#6B6B6B] cursor-not-allowed" :
                    flashKeys.has("btbType") ? "bg-[#DCFCE7] border-[var(--green)] text-[var(--ink)]" :
                    isBtbTypeDirty ? "bg-[#FEF3C7] border-[var(--amber)] text-[var(--ink)]" :
                    "bg-white border-[var(--line)] text-[var(--ink)]"}`}>
                  <option value="">— Select —</option>
                  <option value="BTB">BTB</option>
                  <option value="NON-BTB">NON-BTB</option>
                </select>
              </div>
              <div className="flex flex-col gap-1">
                <label className="text-[13px] font-semibold text-[#6B6B6B]">PR Amount (HKD)</label>
                <input type="number" step="0.01" value={prAmountDraft} onChange={e => setPrAmountDraft(e.target.value)}
                  placeholder="0.00" disabled={fieldsLocked}
                  className={`w-full px-3 py-2 text-[16px] rounded-lg border-[1.5px] ui-transition focus:border-[var(--orange)] focus:outline-none ${
                    fieldsLocked ? "bg-[var(--surface-soft)] border-[var(--line)] text-[#6B6B6B] cursor-not-allowed" :
                    flashKeys.has("hkd") ? "bg-[#DCFCE7] border-[var(--green)] text-[var(--ink)]" :
                    isPrAmountDirty ? "bg-[#FEF3C7] border-[var(--amber)] text-[var(--ink)]" :
                    "bg-white border-[var(--line)] text-[var(--ink)]"}`} />
              </div>
              {/* An expired quotation turns its whole box red, not just its
                  countdown line -- this is the one field on the screen a
                  reviewer has to notice without reading it. */}
              <div className={`flex flex-col gap-1 p-2.5 -m-2.5 rounded-lg border ui-transition ${
                expiryInfo && expiryInfo.tone === "expired" ? "bg-[#FEE2E2] border-[var(--red)]" : "border-transparent"}`}>
                <label className="text-[13px] font-semibold text-[#6B6B6B]">Quotation Expiry Date</label>
                <input type="date" value={quotationExpiryDraft} onChange={e => setQuotationExpiryDraft(e.target.value)} disabled={fieldsLocked}
                  className={`w-full px-3 py-2 text-[16px] rounded-lg border-[1.5px] ui-transition ${
                    fieldsLocked ? "bg-[var(--surface-soft)] border-[var(--line)] text-[#6B6B6B] cursor-not-allowed" :
                    flashKeys.has("quotationExpiryDate") ? "bg-[#DCFCE7] border-[var(--green)] text-[var(--ink)]" :
                    isQuotationExpiryDirty ? "bg-[#FEF3C7] border-[var(--amber)] text-[var(--ink)]" :
                    "bg-white border-[var(--line)] text-[var(--ink)]"}`} />
                {expiryInfo && (
                  <div className={`text-[13px] mt-0.5 ${expiryInfo.tone === "ok" ? "text-[#6B6B6B] font-medium" : "text-[var(--red)] font-bold"}`}>
                    {expiryInfo.text}
                  </div>
                )}
              </div>
            </div>
            <div>
              <span className="text-[12px] text-[#6B6B6B] italic">Only the file name is saved (Review_Approval is a text column) — the file itself stays on this device for this session only.</span>
              {/* A blocked upload renders as a real button that ANSWERS -- the
                  <label>+hidden-input form cannot, because a disabled file
                  input makes its label silently inert, which is exactly the
                  "nothing happened and nobody said why" the reasons exist to
                  avoid. The Approval slot's whole panel also greys out when no
                  approver is required, so "not applicable" and "not done yet"
                  do not look the same. */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                {[["UM Review Document", reviewDoc, pickReviewDoc, deleteReviewDoc, "review", reviewUploadReason, false],
                  ["PR Request Approval Document", approvalDoc, pickApprovalDoc, deleteApprovalDoc, "approval", approvalUploadReason, !hasApprover]]
                  .map(([label, doc, onPick, onDelete, key, reason, notApplicable]) => (
                  <div key={key} className={`flex flex-col gap-2 ui-transition ${notApplicable && !doc ? "opacity-60" : ""}`}>
                    <div className="flex items-baseline justify-between gap-2 flex-wrap">
                      <span className="text-[15px] font-semibold text-[var(--ink)]">{label}</span>
                      {notApplicable && !doc && <span className="text-[11px] font-bold uppercase tracking-wider text-[#6B6B6B]">Not required</span>}
                    </div>
                    {doc ? (
                      <div className="flex items-center justify-between bg-white p-3 rounded-lg border border-[var(--line)]">
                        {doc.url ? (
                          <a href={doc.url} target="_blank" rel="noreferrer" className="text-[14px] font-medium text-[#1D4ED8] hover:underline truncate">{doc.name}</a>
                        ) : (
                          <span className="text-[14px] font-medium text-[var(--ink)] truncate">📎 {doc.name}</span>
                        )}
                        <button type="button" onClick={onDelete} title={fieldsLocked ? "This record is not editable." : undefined}
                          className={`text-[13px] font-semibold px-2 py-1 ${fieldsLocked ? "text-[#8E8E93] cursor-not-allowed" : "text-[var(--red)] hover:underline"}`}>Delete</button>
                      </div>
                    ) : reason ? (
                      <button type="button" onClick={() => refuse(reason)} title={reason}
                        className="w-full ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-semibold bg-[var(--surface-soft)] border border-[var(--line)] text-[#6B6B6B] text-center">
                        🔒 Upload unavailable
                      </button>
                    ) : (
                      <label className="w-full ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-semibold bg-white border border-[#B8B8BD] text-[var(--ink)] hover:bg-[#FFF3D6] text-center cursor-pointer">
                        <Icon name="upload" className="w-3.5 h-3.5 inline-block mr-1.5 -mt-0.5" /> Upload
                        <input type="file" className="hidden" onChange={onPick} />
                      </label>
                    )}
                    {!doc && reason && <div className="text-[12px] text-[#6B6B6B] leading-4">{reason}</div>}
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Was a read-only display grid (label + plain <span> value) --
              every field here now has a real Dataverse column mapped in
              MASTER_RECORDS_EDITABLE_FIELDS, so each value is a text input
              that saves on blur (same convention as PR Amount above). A
              value showing "—" (nothing saved) edits from a blank box, same
              as PR No./PO No. already do. */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3">
            {gridColumns.map(c => (
              <div key={c.key} className="flex flex-col gap-1 py-1 border-b border-[#EFEAE2]">
                <label className="text-[14px] font-semibold text-[#6B6B6B]">{c.label}</label>
                <input value={gridFieldValue(c.key)} onChange={e => setGridFieldDraft(c.key, e.target.value)}
                  aria-label={c.label} disabled={fieldsLocked}
                  className={`w-full px-[7px] py-[3px] text-[15px] rounded-md border-[1.5px] ui-transition focus:bg-white focus:border-[var(--orange)] focus:outline-none ${
                    fieldsLocked ? "bg-transparent border-transparent text-[#6B6B6B] cursor-not-allowed" :
                    flashKeys.has(c.key) ? "bg-[#DCFCE7] border-[var(--green)] text-[var(--ink)]" :
                    isGridFieldDirty(c.key) ? "bg-[#FEF3C7] border-[var(--amber)] text-[var(--ink)]" :
                    "bg-transparent border-transparent text-[var(--ink)]"}`} />
              </div>
            ))}
          </div>
        </div>

        {/* Cancel / Re-open. Both write ONE column -- admin_prstatus, the manual
            Status the table's own cell and its Cancel tab already read -- so
            cancelling needs no workflow-status column, and re-opening needs no
            stored previous status: the stage is recomputed from the record's
            own contents (see the comment above `confirming`). The confirmation
            is an inline panel rather than a nested modal: this screen is
            already a modal, and stacking a second one over it is where the
            reference screen's own two dialogs fought with its backdrop. */}
        <div className="px-6 py-4 border-t border-[var(--line)] shrink-0 flex flex-col gap-3">
          {confirming && (
            <div className={"panel-rise rounded-xl border p-4 flex flex-col gap-3 " +
              (confirming === "cancel" ? "bg-[#FDECEC] border-[#FCA5A5]" : "bg-[#FFF3D6] border-[var(--orange-dark)]")}>
              <div className="flex items-center gap-2">
                <span className="text-[18px]">{confirming === "cancel" ? "⚠️" : "🔄"}</span>
                <span className="text-[15px] font-bold text-[var(--ink)]">
                  {confirming === "cancel" ? "Cancel this record?" : "Re-open this record?"}
                </span>
              </div>
              <div className="text-[14px] leading-5 text-[#3D3D3D]">
                {confirming === "cancel"
                  ? "Its Status becomes \"Cancel\" and every field on this screen turns read-only. Nothing is deleted — re-opening it later restores the stage its own PR No., documents and PO No. put it at."
                  : "Its Status returns to \"Pending\" and the fields unlock. The workflow stage is recomputed from this record's own PR No., documents and PO No., so it lands back exactly where it left off."}
              </div>
              <div className="flex gap-2 justify-end">
                <button type="button" onClick={() => setConfirming(null)}
                  className="ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-semibold border-[1.5px] border-[#B8B8BD] bg-white text-[var(--ink)] hover:bg-[#FFF3D6]">
                  Leave
                </button>
                <button type="button" onClick={confirming === "cancel" ? doCancel : doReopen}
                  className={"ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-bold text-white border-[1.5px] border-transparent " +
                    (confirming === "cancel" ? "bg-[var(--red)] hover:bg-[#B91C1C]" : "bg-[var(--orange-dark)] hover:bg-[#8A4A00]")}>
                  Confirm
                </button>
              </div>
            </div>
          )}
          <div className="flex items-center justify-between gap-3 flex-wrap">
            {cancelled ? (
              <button type="button" onClick={() => setConfirming("reopen")}
                className="ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-bold bg-[var(--orange-dark)] text-white hover:bg-[#8A4A00] border-[1.5px] border-transparent">
                🔄 Re-open
              </button>
            ) : (
              <button type="button" onClick={() => setConfirming("cancel")}
                className="ui-transition pressable px-4 py-2 rounded-lg text-[14px] font-bold bg-[var(--red)] text-white hover:bg-[#B91C1C] border-[1.5px] border-transparent">
                Record Cancel
              </button>
            )}
            <span className="text-[12px] text-[#6B6B6B]">
              Stage: <span className="font-semibold text-[var(--ink)]">{workflowStep}</span>
              {hasApprover ? ` · Approver: ${approval.approver}` : " · No approval required"}
            </span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Records page ----------
   Two routes reach this one component and it does not need to know which:
   the "Master Records" step of the dev rail (page === "records"), and the
   admin_MasterRecords.html web resource, which renders it alone with no rail
   around it (IS_RECORDS_ONLY). It carries no "+ New Record" of its own -- the
   rail already has one on the route that has a rail, and the records-only
   route has no upload flow to start -- and no row-click-to-Reply either,
   since a row click now opens the Manage modal. A Demo Mode toggle and the
   version pill take their place in the header. ---------- */

function RecordsPage({ records, demoMode, toggleDemo, recordsLoadError, updateMasterRecordField, updateMasterRecordFields, fieldSaveError, dismissFieldSaveError }) {
  const [filter, setFilter] = useState("All Records");
  // A SECOND, independent filter, ANDed with `filter` above. The two answer
  // different questions and both are worth keeping: `filter` is the manual
  // Status a reviewer set by hand (admin_prstatus -- Completed/Pending/Cancel/
  // Return/Duplicate), while this one is the computed workflow stage plus the
  // two quotation-expiry checks. Collapsing them into one strip would have
  // meant dropping one set, and "a reviewer marked this Duplicate" and "this
  // record is waiting on a UM review" are not alternatives to each other.
  const [workflowFilter, setWorkflowFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [handledByFilter, setHandledByFilter] = useState("");
  const [vendorFilter, setVendorFilter] = useState("");
  const [customerFilter, setCustomerFilter] = useState("");
  const [visibleColumnKeys, setVisibleColumnKeys] = useState(loadMasterRecordsVisibleColumns);
  const [columnsOpen, setColumnsOpen] = useState(false);
  // The COS control file dialog. Its month is seeded from TODAY rather than
  // from last month, because the picker names the month the FILE is for and the
  // reviewer producing August's file is in August; cosReportMonth is what walks
  // it back by one for the column A value.
  const [cosOpen, setCosOpen] = useState(false);
  const [cosMonth, setCosMonth] = useState(currentYearMonth);
  const [cosRows, setCosRows] = useState(String(COS_CONTROL_DEFAULT_ROWS));
  const columnsRef = useRef(null);
  // Table header click-to-sort -- ported from the reference screen's own
  // handleSort/applySort (its "Record ID ↕" etc. column headers). No default
  // sort column, unlike the reference's `sortCol: 'Title'`: this page already
  // has its own default row order (Dataverse's own fetch order / DEMO_RECORDS'
  // order), and picking a silent default here would reorder rows before a
  // reviewer ever touched a header.
  const [sortKey, setSortKey] = useState(null);
  const [sortAsc, setSortAsc] = useState(true);
  const toggleSort = (key) => {
    if (sortKey === key) { setSortAsc(a => !a); return; }
    setSortKey(key);
    setSortAsc(true);
  };
  const [managingRecordId, setManagingRecordId] = useState(null);
  const managingRecord = managingRecordId ? records.find(r => r.recordId === managingRecordId) : null;
  const tabs = ["All Records", "Completed", "Pending", "Cancel", "Return", "Duplicate"];
  const pagination = demoMode ? DEMO_PAGINATION : EMPTY_PAGINATION;

  const onStatusChange = (r, newLabel) => {
    if (!newLabel || newLabel === r.status) return;
    updateMasterRecordField(r.recordId, "status", PR_STATUS_VALUES[newLabel], { status: newLabel });
  };
  const onToggleFlag = (r) => {
    const next = !r.flagged;
    updateMasterRecordField(r.recordId, "flagged", next, { flagged: next });
  };

  const filtered = useMemo(() => {
    const rows = records.filter(r => {
      const matchesTab = filter === "All Records" || r.status === filter;
      const matchesWorkflow = matchesWorkflowTab(r, workflowFilter);
      const q = search.toLowerCase();
      // Searches EVERY value on the row, same as the reference screen's own
      // `Object.values(item).some(...)`. The old five-field list silently
      // missed the UID, the contract number and the PR No. -- the three things
      // a reviewer is most likely to paste in from an email.
      const matchesSearch = !q || Object.keys(r).some(k =>
        k !== "reviewApprovalRaw" && String(r[k] == null ? "" : r[k]).toLowerCase().includes(q));
      const matchesHandledBy = !handledByFilter || (r.handledBy || "").toLowerCase().includes(handledByFilter.toLowerCase());
      const matchesVendor = !vendorFilter || (r.vendor || "").toLowerCase().includes(vendorFilter.toLowerCase());
      const matchesCustomer = !customerFilter || (r.customerName || "").toLowerCase().includes(customerFilter.toLowerCase());
      return matchesTab && matchesWorkflow && matchesSearch && matchesHandledBy && matchesVendor && matchesCustomer;
    });
    if (!sortKey) return rows;
    const col = MASTER_RECORDS_COLUMNS.find(c => c.key === sortKey);
    if (!col) return rows;
    const sorted = [...rows].sort((a, b) => {
      const cmp = compareMasterRecordSortValues(col.exportValue(a), col.exportValue(b));
      return sortAsc ? cmp : -cmp;
    });
    return sorted;
  }, [records, filter, workflowFilter, search, handledByFilter, vendorFilter, customerFilter, sortKey, sortAsc]);

  useEffect(() => {
    try { window.localStorage.setItem(MASTER_RECORDS_COLUMNS_STORAGE_KEY, JSON.stringify(visibleColumnKeys)); } catch (e) {}
  }, [visibleColumnKeys]);

  useEffect(() => {
    if (!columnsOpen) return;
    const onOutside = (e) => { if (columnsRef.current && !columnsRef.current.contains(e.target)) setColumnsOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setColumnsOpen(false); };
    window.addEventListener("mousedown", onOutside);
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("mousedown", onOutside);
      window.removeEventListener("keydown", onKey);
    };
  }, [columnsOpen]);

  const toggleColumn = (key) => setVisibleColumnKeys(prev => {
    if (prev.includes(key)) return prev.length > 1 ? prev.filter(k => k !== key) : prev;
    return MASTER_RECORDS_COLUMN_KEYS.filter(k => prev.includes(k) || k === key);
  });

  const activeColumns = useMemo(() => {
    const cols = MASTER_RECORDS_COLUMNS.filter(c => visibleColumnKeys.includes(c.key));
    return cols.map((c, i) => (i === cols.length - 1 ? { ...c, width: "flex-1 min-w-0" } : c));
  }, [visibleColumnKeys]);

  /* The COS control file's rows. `filtered` and not `records`, so this button
     and "Export Excel" beside it answer the same question about which rows the
     reviewer means -- what is on the page. Recomputed rather than held in
     state: a draft captured when the dialog opened would disagree with the
     count the dialog prints the moment a filter changed behind it. */
  const cosDataRows = useMemo(() => cosControlRowsFor(filtered, cosReportMonth(cosMonth)),
    [filtered, cosMonth]);

  const exportExcel = () => {
    if (typeof XLSX === "undefined") {
      window.alert("Excel export isn't available right now.");
      return;
    }
    const rows = filtered.map(r => {
      const row = {};
      activeColumns.forEach(c => { row[c.label] = c.exportValue(r); });
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(rows, { header: activeColumns.map(c => c.label) });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Master Records");
    XLSX.writeFile(wb, `MasterRecords_${new Date().toISOString().slice(0, 10)}.xlsx`);
  };

  const counts = {
    total: records.length,
