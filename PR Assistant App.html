    completed: records.filter(r => r.status === "Completed").length,
    pending: records.filter(r => r.status === "Pending").length,
    cancel: records.filter(r => r.status === "Cancel").length,
    return: records.filter(r => r.status === "Return").length,
    duplicate: records.filter(r => r.status === "Duplicate").length,
    flagged: records.filter(r => r.flagged).length,
  };

  // The KPI strip's own counts -- deliberately NOT `counts` above. That one is
  // keyed off the manual Status field (Completed/Pending/Cancel/Return/
  // Duplicate) the tabs still use; the reference screen's 5 cards are keyed
  // off the computed Workflow Status (masterRecordWorkflowStep, same as the
  // table's own column) and two date checks, same as the reference's own
  // updateDashboard(). endDate is fmtLisDate's "DD Mon YYYY" display string
  // (also what DEMO_RECORDS carries), which `new Date(...)` parses the same
  // way fmtLisDate's own `new Date(raw)` does -- an unparseable/placeholder
  // value ("—") reads as "not expired" rather than throwing.
  // Completed/Pending deliberately EXCLUDE cancelled records rather than
  // counting them as pending, same as the reference's own updateDashboard: a
  // cancelled record is not outstanding work, and rolling it into Pending
  // would make the number a reviewer reads as "still to do" wrong by exactly
  // the count of the card beside it. Expired/Expiring Soon are the quotation
  // expiry checks (against HKT's day, via quotationExpiryInfo), not the
  // contract end date -- the quotation is the thing that has to be re-quoted
  // if it lapses.
  const kpi = {
    total: records.length,
    completedTasks: records.filter(r => r.status !== "Cancel" && masterRecordWorkflowStep(r) === "Completed").length,
    pendingTasks: records.filter(r => r.status !== "Cancel" && masterRecordWorkflowStep(r) !== "Completed").length,
    quotationExpired: records.filter(r => matchesWorkflowTab(r, "Expired")).length,
    expiringSoon: records.filter(r => matchesWorkflowTab(r, "Expiring Soon")).length,
    cancelled: records.filter(r => r.status === "Cancel").length,
  };
  const tabCounts = {
    "All Records": counts.total, Completed: counts.completed, Pending: counts.pending,
    Cancel: counts.cancel, Return: counts.return, Duplicate: counts.duplicate,
  };

  return (
    <React.Fragment>
      <TopBar title="Master Records" desc="Search and browse the saved records"
        right={<React.Fragment>
          {/* The app's ONE version. This page used to be its own file with a
              counter of its own, which is exactly what a reviewer on the
              admin_MasterRecords.html resource could not compare against the
              version the rest of the team quoted. */}
          <Pill className="bg-[#F3EBE2] text-[#6B6B6B]" title="PR Assistant version">V{APP_VERSION}</Pill>
          {demoMode && <Pill className="bg-[#FBF0E8] text-[#D4916E]">Demo Mode</Pill>}
          <div className="flex items-center gap-2 px-3.5 py-2 bg-white border-[1.5px] border-[#C5BEB6] rounded-full w-[240px]">
            <span className="text-[#6B6B6B] text-[13px]">🔍</span>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search customer, vendor, PO No…"
              aria-label="Search records"
              className="flex-1 text-[14px] outline-none bg-transparent placeholder:text-[#6B6B6B]" />
          </div>
          <GhostButton onClick={() => setFiltersOpen(o => !o)} className={"flex items-center gap-1.5" + (filtersOpen ? " !border-[var(--orange-dark)] !bg-[#FFF3D6]" : "")}>
            Filter Data
            <Icon name="chevronDown" className={"w-3.5 h-3.5 ui-transition" + (filtersOpen ? " rotate-180" : "")} />
          </GhostButton>
          <div ref={columnsRef} className="relative inline-block">
            <GhostButton onClick={() => setColumnsOpen(o => !o)} className="flex items-center gap-1.5">
              Columns
              <Icon name="chevronDown" className={"w-3.5 h-3.5 ui-transition" + (columnsOpen ? " rotate-180" : "")} />
            </GhostButton>
            {columnsOpen && (
              <div className="absolute z-20 right-0 mt-1.5 w-56 dropdown-pop rounded-lg border-[1.5px] border-[var(--line)] bg-white shadow-[0_12px_28px_rgba(29,29,31,0.14)] p-2"
                style={{ transformOrigin: "top" }}>
                {MASTER_RECORDS_COLUMNS.map(c => (
                  <label key={c.key} className="flex items-center gap-2.5 px-2 py-1.5 rounded-md cursor-pointer hover:bg-[#FFF4DE]">
                    <input type="checkbox" checked={visibleColumnKeys.includes(c.key)} onChange={() => toggleColumn(c.key)}
                      className="w-[16px] h-[16px] accent-[#D4916E] rounded border-[1.5px] border-[#C5BEB6] shrink-0" />
                    <span className="flex-1 text-[13px] text-[#3D3D3D]">{c.label}</span>
                  </label>
                ))}
              </div>
            )}
          </div>
          <GhostButton onClick={exportExcel} className="flex items-center gap-1.5">
            <Icon name="sheet" className="w-4 h-4" />
            Export Excel
          </GhostButton>
          {/* Deliberately NOT beside "Export Excel" in meaning: that one is this
              page's own rows in this page's own columns, this one is
              procurement's monthly form with no rows in it at all. Same shelf,
              different jobs, which is why it names the form rather than saying
              "Export" a second time. */}
          {FEATURES.cosControlFile && (
            <GhostButton onClick={() => setCosOpen(true)} className="flex items-center gap-1.5">
              <Icon name="sheet" className="w-4 h-4" />
              COS Control File
            </GhostButton>
          )}
          <GhostButton onClick={toggleDemo} className={demoMode ? "!border-[var(--orange)] !bg-[#FFF4DE] !text-[var(--ink)]" : ""}>
            {demoMode ? "Exit Demo" : "Demo Mode"}
          </GhostButton>
        </React.Fragment>} />

      {/* The month picker behind "COS Control File". It states the file name and
          the Report Month it is about to write BEFORE generating, because those
          two deliberately disagree -- picking 2026/08 gives a 202608 file whose
          every row says 2026/07 -- and a reviewer who did not expect that should
          see it here rather than in the downloaded workbook. */}
      {cosOpen && FEATURES.cosControlFile && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/45 px-4"
          onClick={() => setCosOpen(false)}>
          <div className="w-full max-w-[440px] bg-white rounded-2xl border-[1.5px] border-[var(--line)] shadow-[0_18px_44px_rgba(29,29,31,0.22)] p-5"
            role="dialog" aria-label="Generate COS control file" onClick={e => e.stopPropagation()}>
            <div className="text-[17px] font-bold text-[var(--ink)]">COS Control File</div>
            <p className="mt-1.5 text-[13px] leading-[19px] text-[#6B6B6B]">
              Procurement's monthly workbook, formatted exactly like it: the same 18
              headers, colours, column widths and filter. The rows shown on this page
              whose Rec'd Date falls in the Report Month are written into it;
              Engineering Team, Product Line, Currency and Currency Amount have no
              column to come from and are left blank.
            </p>

            <div className="mt-4 grid grid-cols-2 gap-3">
              <div className="flex flex-col gap-1">
                <label htmlFor="cos-month" className="text-[12px] font-semibold text-[#6B6B6B]">Month the file is for</label>
                <input id="cos-month" type="month" value={cosMonth} onChange={e => setCosMonth(e.target.value)}
                  className="w-full px-3 py-2 text-[14px] text-[#1A1A1A] bg-white rounded-lg border-[1.5px] border-[var(--line)] ui-transition focus:border-[var(--orange)] focus:outline-none" />
              </div>
              <div className="flex flex-col gap-1">
                <label htmlFor="cos-rows" className="text-[12px] font-semibold text-[#6B6B6B]">Extra blank rows</label>
                <input id="cos-rows" type="number" min="0" max={COS_CONTROL_MAX_ROWS} value={cosRows}
                  onChange={e => setCosRows(e.target.value)}
                  className="w-full px-3 py-2 text-[14px] text-[#1A1A1A] bg-white rounded-lg border-[1.5px] border-[var(--line)] ui-transition focus:border-[var(--orange)] focus:outline-none" />
              </div>
            </div>

            <div className="mt-3 px-3.5 py-2.5 rounded-lg bg-[#FBF6EF] border-[1.5px] border-[var(--line)] text-[13px] leading-[20px] text-[#3D3D3D]">
              <div>File name: <span className="font-semibold">{cosControlFileName(cosMonth)}</span></div>
              <div>Column A (Report Month): <span className="font-semibold">{cosReportMonth(cosMonth) || "not set"}</span></div>
              {/* Said BEFORE generating for the same reason the file name and the
                  Report Month are: the count comes from whatever the tabs, the
                  search box and the filters have left on the page, so a reviewer
                  who forgot a filter was on should meet that here rather than in
                  a downloaded workbook that is short by half. */}
              <div>
                Rows with a Rec'd Date in {cosReportMonth(cosMonth) || "that month"}:{" "}
                <span className="font-semibold">{cosDataRows.length}</span>
                {/* Both halves of the narrowing are said, because they fail in
                    opposite directions and only one of them is visible on the
                    page behind the dialog. A reviewer who left a filter on sees
                    a small "of M"; one who expected every row of the month sees
                    that the page itself is what M counts. */}
                {filtered.length !== cosDataRows.length && (
                  <span className="text-[#6B6B6B]"> · {filtered.length - cosDataRows.length} of
                    the {filtered.length} rows on this page were received in another month</span>
                )}
              </div>
            </div>

            <div className="mt-4 flex items-center justify-end gap-2">
              <GhostButton onClick={() => setCosOpen(false)}>Cancel</GhostButton>
              <PrimaryButton
                disabled={!cosReportMonth(cosMonth)}
                onClick={() => { downloadCosControlFile(cosMonth, cosRows, cosDataRows); setCosOpen(false); }}>
                Generate Excel
              </PrimaryButton>
            </div>
          </div>
        </div>
      )}

      {/* Clicking a card sets the Workflow strip below to the same view, so a
          count and the rows behind it are one click apart. Total Records and
          Cancelled Records map onto "All" and "Cancelled"; the card whose tab
          is already active toggles back to All. */}
      <div className="px-5 md:px-8 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-5">
        {[["Total Records", kpi.total, "text-[#6B6B6B]", "bg-[var(--orange)]", "All", "text-[var(--ink)]"],
          ["Completed Tasks", kpi.completedTasks, "text-[var(--green)]", "", "Completed", "text-[var(--ink)]"],
          ["Pending Tasks", kpi.pendingTasks, "text-[#6B6B6B]", "bg-[var(--amber)]", null, "text-[var(--ink)]"],
          ["Quotation Expired", kpi.quotationExpired, "text-[#6B6B6B]", "bg-[var(--red)]", "Expired", "text-[var(--ink)]"],
          ["Expiring Soon (14 Days)", kpi.expiringSoon, "text-[#6B6B6B]", "bg-[var(--amber)]", "Expiring Soon", "text-[var(--ink)]"],
          ["Cancelled Records", kpi.cancelled, "text-[var(--red)]", "bg-[var(--red)]", "Cancelled", "text-[var(--red)]"]]
          .map(([label, value, labelClass, dotClass, tab, valueClass]) => {
          const active = tab && workflowFilter === tab && tab !== "All";
          return (
            <Card key={label} className={"p-4 ui-transition " + (tab ? "cursor-pointer pressable hover:bg-[#FBF6EF] " : "") + (active ? "!border-[var(--orange-dark)]" : "")}>
              <div role={tab ? "button" : undefined} tabIndex={tab ? 0 : undefined}
                onClick={tab ? () => setWorkflowFilter(active ? "All" : tab) : undefined}
                onKeyDown={tab ? (e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setWorkflowFilter(active ? "All" : tab); } }) : undefined}>
                <div className={`flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-[0.06em] ${labelClass}`}>
                  {dotClass && <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${dotClass}`} />}
                  {label}
                </div>
                <div className={`mt-2 text-[26px] font-bold ${valueClass}`}>{value}</div>
              </div>
            </Card>
          );
        })}
      </div>

      {filtersOpen && (
        <div className="px-5 md:px-8 mb-5">
          <Card className="p-4 grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="flex flex-col gap-1">
              <label className="text-[12px] font-semibold text-[#6B6B6B]">Handled By</label>
              <input value={handledByFilter} onChange={e => setHandledByFilter(e.target.value)} placeholder="Name…"
                className="w-full px-3 py-2 text-[14px] text-[#1A1A1A] bg-white rounded-lg border-[1.5px] border-[var(--line)] ui-transition focus:border-[var(--orange)] focus:outline-none" />
            </div>
            <div className="flex flex-col gap-1">
              <label className="text-[12px] font-semibold text-[#6B6B6B]">Vendor</label>
              <input value={vendorFilter} onChange={e => setVendorFilter(e.target.value)} placeholder="Vendor…"
                className="w-full px-3 py-2 text-[14px] text-[#1A1A1A] bg-white rounded-lg border-[1.5px] border-[var(--line)] ui-transition focus:border-[var(--orange)] focus:outline-none" />
            </div>
            <div className="flex flex-col gap-1">
              <label className="text-[12px] font-semibold text-[#6B6B6B]">Customer Name</label>
              <input value={customerFilter} onChange={e => setCustomerFilter(e.target.value)} placeholder="Customer…"
                className="w-full px-3 py-2 text-[14px] text-[#1A1A1A] bg-white rounded-lg border-[1.5px] border-[var(--line)] ui-transition focus:border-[var(--orange)] focus:outline-none" />
            </div>
          </Card>
        </div>
      )}

      <div className="flex flex-col gap-6 px-5 md:px-8 pb-8">
        <div className="flex-1 flex flex-col">
          {recordsLoadError && (
            <div className="mb-4 w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[#B23B3B]">Could not load records from Dataverse.</span>{" "}
                {recordsLoadError} The list below may be empty or out of date because of this, not because there is nothing saved.
              </div>
            </div>
          )}
          {fieldSaveError && (
            <div className="mb-4 w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">{fieldSaveError} The change was not saved and has been reverted.</div>
              <button type="button" onClick={dismissFieldSaveError} className="text-[12px] font-semibold text-[#B23B3B] shrink-0">Dismiss</button>
            </div>
          )}
          {/* Workflow stage strip -- the computed stage (plus the two quotation
              expiry checks), ANDed with the manual Status tabs below it. Its
              counts are computed over `records`, not over `filtered`, so a
              count never changes just because another filter is narrowing the
              rows -- it always answers "how many records are at this stage",
              which is what makes it safe to click. */}
          <div className="flex items-center gap-2 flex-wrap mb-2">
            <span className="text-[11px] font-bold uppercase tracking-[0.06em] text-[#6B6B6B] shrink-0">Workflow</span>
            {WORKFLOW_TABS.map(t => {
              const active = workflowFilter === t;
              const count = t === "All" ? records.length : records.filter(r => matchesWorkflowTab(r, t)).length;
              return (
                <button key={t} type="button" onClick={() => setWorkflowFilter(t)} aria-pressed={active}
                  className={`ui-transition pressable flex items-center gap-1.5 px-2.5 py-1 rounded-full border-[1.5px] ${
                    active ? "border-[var(--orange-dark)] bg-[#FFF3D6]" : "border-[var(--line)] bg-white hover:bg-[#FBF6EF]"}`}>
                  <span className={`text-[12px] whitespace-nowrap ${active ? "text-[var(--ink)] font-semibold" : "text-[#6B6B6B]"}`}>{t}</span>
                  <span className={`px-1.5 rounded-full text-[10px] font-bold ${active ? "bg-white text-[var(--orange-dark)]" : "bg-[#F3EBE2] text-[#6B6B6B]"}`}>{count}</span>
                </button>
              );
            })}
          </div>

          <div className="flex border-b border-[#C5BEB6] flex-wrap">
            <span className="text-[11px] font-bold uppercase tracking-[0.06em] text-[#6B6B6B] self-center pr-3 shrink-0">Status</span>
            {tabs.map(t => (
              <button key={t} type="button" onClick={() => setFilter(t)} aria-pressed={filter === t}
                className={`px-4 py-2.5 border-b-2 -mb-px ui-transition pressable flex items-center gap-1.5 ${filter === t ? "border-[#D4916E]" : "border-transparent"}`}>
                <span className={`text-[13px] whitespace-nowrap ${filter === t ? "text-[#D4916E] font-semibold" : "text-[#6B6B6B]"}`}>{t}</span>
                <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-bold ${filter === t ? "bg-[#FBF0E8] text-[#D4916E]" : "bg-[#F3EBE2] text-[#6B6B6B]"}`}>{tabCounts[t]}</span>
              </button>
            ))}
          </div>

          <Card className="w-full rounded-t-none overflow-hidden">
            <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
              <div className="flex px-4 py-3 bg-[#F3EBE2] sticky top-0 z-10">
                {activeColumns.map(c => (
                  <button type="button" key={c.key} onClick={() => toggleSort(c.key)}
                    aria-label={`Sort by ${c.label}`}
                    className={`flex items-center gap-1 text-left text-[12px] font-semibold ui-transition cursor-pointer select-none hover:text-[var(--orange-dark)] ${sortKey === c.key ? "text-[var(--orange-dark)]" : "text-[#6B6B6B]"} ${c.width.startsWith("flex-1") ? "" : "shrink-0"} ${c.width}`}>
                    {c.label}
                    <span className="text-[10px]">{sortKey === c.key ? (sortAsc ? "↑" : "↓") : "↕"}</span>
                  </button>
                ))}
                <div className="w-[140px] shrink-0 text-[12px] font-semibold text-[#6B6B6B] text-right">Action</div>
              </div>
              {filtered.map(r => (
                <div key={r.id} className="w-full flex px-4 py-3.5 border-b border-[#C5BEB6] hover:bg-[#FBF6EF] ui-transition items-center text-left">
                  {activeColumns.map(c => (
                    <span key={c.key} className={`${c.width} ${c.width.startsWith("flex-1") ? "" : "shrink-0"} ${c.cellClassName || ""}`}>
                      {c.render(r, { onStatusChange, onToggleFlag })}
                    </span>
                  ))}
                  <div className="w-[140px] shrink-0 text-right">
                    <button type="button" onClick={() => setManagingRecordId(r.recordId)}
                      className="ui-transition pressable px-3 py-1.5 rounded-lg text-[12px] font-bold whitespace-nowrap bg-[var(--orange)] text-[#1A1A1A] hover:bg-[#FFF3D6] hover:border-[var(--orange-dark)] border-[1.5px] border-transparent">
                      View &amp; Manage
                    </button>
                  </div>
                </div>
              ))}
              {filtered.length === 0 && <div className="px-4 py-8 text-center text-[13px] text-[#6B6B6B]">No records match.</div>}
            </div>
            <div className="flex justify-between items-center px-4 py-3">
              <div className="text-xs text-[#6B6B6B]">Showing 1–{filtered.length} of {records.length} records</div>
              <div className="flex gap-1">
                {pagination.map((p,i) => (
                  <div key={i} className={`px-3 py-1.5 rounded-md border text-xs ${p==="1" ? "bg-[#D4916E] text-white border-transparent font-semibold" : "bg-white border-[#C5BEB6] text-[#3D3D3D]"}`}>{p}</div>
                ))}
              </div>
            </div>
          </Card>
        </div>
      </div>

      {managingRecord && (
        <MasterRecordDetailModal key={managingRecord.recordId} record={managingRecord}
          onClose={() => setManagingRecordId(null)}
          onStatusChange={onStatusChange} onToggleFlag={onToggleFlag}
          updateMasterRecordField={updateMasterRecordField}
          updateMasterRecordFields={updateMasterRecordFields}
          fieldSaveError={fieldSaveError} dismissFieldSaveError={dismissFieldSaveError} />
      )}
    </React.Fragment>
  );
}

function ReplyPage({ record = EMPTY_REPLY_RECORD, goRecords, markSent, replyFiles, demoMode, adminMode }) {
  const [checklist, setChecklist] = useState(demoMode ? DEMO_PRESEND_CHECKLIST : EMPTY_PRESEND_CHECKLIST);
  const [delivery, setDelivery] = useState("outlook");
  const [sent, setSent] = useState(false);
  const allChecked = checklist.every(Boolean);

  const toggle = i => setChecklist(prev => prev.map((v, idx) => idx === i ? !v : v));

  const send = () => {
    setSent(true);
    markSent(record.id);
    setTimeout(() => { setSent(false); goRecords(); }, 1200);
  };

  return (
    <React.Fragment>
      <TopBar title="Reply PR / PI" desc="Create the reply email for this request"
        right={<React.Fragment>
          {adminMode && <Pill className="bg-[#FBF0E8] text-[#D4916E]">Admin bypass</Pill>}

              <div className="px-3 py-1 bg-[#F4F0E8] border border-[#D8D3C9] rounded-full text-[11px] font-semibold text-[var(--orange-dark)]">Edit</div>
