              <label className="text-[12px] font-semibold text-[#6B6B6B]">Vendor</label>
              <input value={vendorFilter} onChange={e => setVendorFilter(e.target.value)} placeholder="Vendor…"
                className="w-full px-3 py-2 text-[14px] text-[#1A1A1A] bg-white rounded-lg border-[1.5px] border-[var(--line)] ui-transition focus:border-[var(--orange)] focus:outline-none" />
            </div>
            <div className="flex flex-col gap-1">
              <label className="text-[12px] font-semibold text-[#6B6B6B]">Customer Name</label>
              <input value={customerFilter} onChange={e => setCustomerFilter(e.target.value)} placeholder="Customer…"
                className="w-full px-3 py-2 text-[14px] text-[#1A1A1A] bg-white rounded-lg border-[1.5px] border-[var(--line)] ui-transition focus:border-[var(--orange)] focus:outline-none" />
            </div>
          </Card>
        </div>
      )}

      <div className="flex flex-col gap-6 px-5 md:px-8 pb-8">
        <div className="flex-1 flex flex-col">
          {recordsLoadError && (
            <div className="mb-4 w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[#B23B3B]">Could not load records from Dataverse.</span>{" "}
                {recordsLoadError} The list below may be empty or out of date because of this, not because there is nothing saved.
              </div>
            </div>
          )}
          {fieldSaveError && (
            <div className="mb-4 w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">{fieldSaveError} The change was not saved and has been reverted.</div>
              <button type="button" onClick={dismissFieldSaveError} className="text-[12px] font-semibold text-[#B23B3B] shrink-0">Dismiss</button>
            </div>
          )}
          {/* Workflow stage strip -- the computed stage (plus the two quotation
              expiry checks), ANDed with the manual Status tabs below it. Its
              counts are computed over `records`, not over `filtered`, so a
              count never changes just because another filter is narrowing the
              rows -- it always answers "how many records are at this stage",
              which is what makes it safe to click. */}
          <div className="flex items-center gap-2 flex-wrap mb-2">
            <span className="text-[11px] font-bold uppercase tracking-[0.06em] text-[#6B6B6B] shrink-0">Workflow</span>
            {WORKFLOW_TABS.map(t => {
              const active = workflowFilter === t;
              const count = t === "All" ? records.length : records.filter(r => matchesWorkflowTab(r, t)).length;
              return (
                <button key={t} type="button" onClick={() => setWorkflowFilter(t)} aria-pressed={active}
                  className={`ui-transition pressable flex items-center gap-1.5 px-2.5 py-1 rounded-full border-[1.5px] ${
                    active ? "border-[var(--orange-dark)] bg-[#FFF3D6]" : "border-[var(--line)] bg-white hover:bg-[#FBF6EF]"}`}>
                  <span className={`text-[12px] whitespace-nowrap ${active ? "text-[var(--ink)] font-semibold" : "text-[#6B6B6B]"}`}>{t}</span>
                  <span className={`px-1.5 rounded-full text-[10px] font-bold ${active ? "bg-white text-[var(--orange-dark)]" : "bg-[#F3EBE2] text-[#6B6B6B]"}`}>{count}</span>
                </button>
              );
            })}
          </div>

          <div className="flex border-b border-[#C5BEB6] flex-wrap">
            <span className="text-[11px] font-bold uppercase tracking-[0.06em] text-[#6B6B6B] self-center pr-3 shrink-0">Status</span>
            {tabs.map(t => (
              <button key={t} type="button" onClick={() => setFilter(t)} aria-pressed={filter === t}
                className={`px-4 py-2.5 border-b-2 -mb-px ui-transition pressable flex items-center gap-1.5 ${filter === t ? "border-[#D4916E]" : "border-transparent"}`}>
                <span className={`text-[13px] whitespace-nowrap ${filter === t ? "text-[#D4916E] font-semibold" : "text-[#6B6B6B]"}`}>{t}</span>
                <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-bold ${filter === t ? "bg-[#FBF0E8] text-[#D4916E]" : "bg-[#F3EBE2] text-[#6B6B6B]"}`}>{tabCounts[t]}</span>
              </button>
            ))}
          </div>

          <Card className="w-full rounded-t-none overflow-hidden">
            <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
              <div className="flex px-4 py-3 bg-[#F3EBE2] sticky top-0 z-10">
                {activeColumns.map(c => (
                  <button type="button" key={c.key} onClick={() => toggleSort(c.key)}
                    aria-label={`Sort by ${c.label}`}
                    className={`flex items-center gap-1 text-left text-[12px] font-semibold ui-transition cursor-pointer select-none hover:text-[var(--orange-dark)] ${sortKey === c.key ? "text-[var(--orange-dark)]" : "text-[#6B6B6B]"} ${c.width.startsWith("flex-1") ? "" : "shrink-0"} ${c.width}`}>
                    {c.label}
                    <span className="text-[10px]">{sortKey === c.key ? (sortAsc ? "↑" : "↓") : "↕"}</span>
                  </button>
                ))}
                <div className="w-[140px] shrink-0 text-[12px] font-semibold text-[#6B6B6B] text-right">Action</div>
              </div>
              {filtered.map(r => (
                <div key={r.id} className="w-full flex px-4 py-3.5 border-b border-[#C5BEB6] hover:bg-[#FBF6EF] ui-transition items-center text-left">
                  {activeColumns.map(c => (
                    <span key={c.key} className={`${c.width} ${c.width.startsWith("flex-1") ? "" : "shrink-0"} ${c.cellClassName || ""}`}>
                      {c.render(r, { onStatusChange, onToggleFlag })}
                    </span>
                  ))}
                  <div className="w-[140px] shrink-0 text-right">
                    <button type="button" onClick={() => setManagingRecordId(r.recordId)}
                      className="ui-transition pressable px-3 py-1.5 rounded-lg text-[12px] font-bold whitespace-nowrap bg-[var(--orange)] text-[#1A1A1A] hover:bg-[#FFF3D6] hover:border-[var(--orange-dark)] border-[1.5px] border-transparent">
                      View &amp; Manage
                    </button>
                  </div>
                </div>
              ))}
              {filtered.length === 0 && <div className="px-4 py-8 text-center text-[13px] text-[#6B6B6B]">No records match.</div>}
            </div>
            <div className="flex justify-between items-center px-4 py-3">
              <div className="text-xs text-[#6B6B6B]">Showing 1–{filtered.length} of {records.length} records</div>
              <div className="flex gap-1">
                {pagination.map((p,i) => (
                  <div key={i} className={`px-3 py-1.5 rounded-md border text-xs ${p==="1" ? "bg-[#D4916E] text-white border-transparent font-semibold" : "bg-white border-[#C5BEB6] text-[#3D3D3D]"}`}>{p}</div>
                ))}
              </div>
            </div>
          </Card>
        </div>
      </div>

      {managingRecord && (
        <MasterRecordDetailModal key={managingRecord.recordId} record={managingRecord}
          onClose={() => setManagingRecordId(null)}
          onStatusChange={onStatusChange} onToggleFlag={onToggleFlag}
          updateMasterRecordField={updateMasterRecordField}
          updateMasterRecordFields={updateMasterRecordFields}
          fieldSaveError={fieldSaveError} dismissFieldSaveError={dismissFieldSaveError} />
      )}
    </React.Fragment>
  );
}

/* ---------- Dataverse read/write (verbatim from PR Assistant App.html's own
   findExistingLisRecordId/writeMasterRecordField/DATAVERSE_LIS_SOURCE and
   its RecordsPage fetch effect) ---------- */

const DATAVERSE_LIS_SOURCE = {
  entity: "admin_btb_lis_excel_datas",
  titleField: "admin_title",
  select: ["admin_title", "admin_customerx0020name2", "admin_vendor2",
    "admin_hkd2", "admin_contractx0020nox002e2",
    "admin_startx0020date", "admin_odatax0020endx0020date2",
    "admin_prx0020reference2", "admin_uidx0020x00232",
    "admin_issuex0020by2", "admin_chargex0020ccc2",
    "admin_worksx0020orderx0020code2", "admin_accountx0020code2",
    "admin_prx0020issuedx0020on2", "admin_prx0020nox002e2",
    "admin_handledx0020byx00202", "admin_iptx0020unitx0020mgr2",
    "admin_startx0020date2", "admin_odatax0020endx0020date3"],
};

function dataverseVerifyQuery(recordId, source) {
  const escaped = String(recordId || "").replace(/'/g, "''");
  return "?$select=" + source.select.join(",") + "&$filter=" + source.titleField + " eq '" + escaped + "'";
}

// null   -- no existing row for this Record_ID
// ""     -- an existing row was found but its id column was not on the response
// <guid> -- an existing row's id
async function findExistingLisRecordId(recordId, webApi) {
  if (!webApi || !recordId) return null;
  const response = await webApi.retrieveMultipleRecords(
    DATAVERSE_LIS_SOURCE.entity, dataverseVerifyQuery(recordId, DATAVERSE_LIS_SOURCE));
  const entity = response.entities && response.entities[0];
  if (!entity) return null;
  return entity[DATAVERSE_LIS_SOURCE.entity + "id"] || "";
}

// One id lookup, one updateRecord call, however many columns are in `fields`
// -- the Manage modal's "Save" button batches every dirty field of a record
// into a single write through this, rather than one round trip per field.
async function writeMasterRecordFields(recordId, fields, webApi) {
  if (!webApi || !recordId) return { ok: false, error: "Not connected to Dataverse." };
  try {
    const existingId = await findExistingLisRecordId(recordId, webApi);
    if (!existingId) {
      return { ok: false, error: "No BTB_LIS_Excel_Datas row found for Record_ID " + recordId + "." };
    }
    await webApi.updateRecord("admin_btb_lis_excel_datas", existingId, fields);
    return { ok: true };
  } catch (err) {
    console.error("Could not update " + Object.keys(fields).join(", ") + " for Record_ID " + recordId + ":", err);
    return { ok: false, error: err.message || String(err) };
  }
}

async function writeMasterRecordField(recordId, fieldName, fieldValue, webApi) {
  return writeMasterRecordFields(recordId, { [fieldName]: fieldValue }, webApi);
}

/* ---------- App shell ---------- */

function MasterRecordsApp() {
  const [demoMode, setDemoMode] = useState(false);
  const [records, setRecords] = useState(EMPTY_RECORDS);
  const [recordsLoadError, setRecordsLoadError] = useState(null);
  const [fieldSaveError, setFieldSaveError] = useState(null);

  useEffect(() => {
    // Same read PR Assistant App.html's own Master Records step uses --
    // field names confirmed 2026-09-11 against the live Dataverse column
    // list (see that file's CLAUDE.md section for the full reasoning on the
    // "2" suffix / new_-prefixed exceptions). Follows this repo's own
    // "Dataverse embedded mode vs. standalone/demo" rule: no
    // parent.Xrm.WebApi degrades to a local fallback (an empty list plus a
    // console.warn) instead of throwing -- a reviewer opening this page from
    // inside the model-driven app gets real data, opening the bare file
    // in a browser gets an empty page with a Demo Mode toggle to preview it.
    const fmtLisDate = (raw) => {
      const d = raw ? new Date(raw) : null;
      return d && !isNaN(d.getTime())
        ? d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' }) : "—";
    };
    const fetchRecordsFromDataverse = async () => {
      try {
        const query = "?$select=admin_title,admin_nox002e2,admin_prx0020nox002e2,admin_recx0027dx0020datex00202,admin_pox0020nox002e2,"
          + "admin_customerx0020name2,admin_vendor2,admin_prx0020description2,new_flagged,new_prstatus,new_statusremark,"
          + "admin_uidx0020x00232,admin_startx0020date,admin_odatax0020endx0020date2,admin_contractx0020nox002e2,"
          + "admin_hkd2,admin_usdx0020x002fx0020others2,admin_handledx0020byx00202,admin_iptx0020unitx0020mgr2,"
          + "admin_startx0020date2,admin_odatax0020endx0020date3,admin_pox0020date2,admin_receiptx0020date2,"
          + "admin_pox0020amountx0020hkx00242,admin_umx002fmgr2,admin_prx0020issuedx0020month2,admin_prx0020issuedx0020on2,"
          + "admin_worksx0020orderx0020code2,admin_yx0020x002fx0020n2,admin_remarks2,"
          + "admin_invoicex0020x0023x0020x002,admin_invoicex0020x002fx0020dnx2,"
          + "admin_issuex0020by2,admin_chargex0020ccc2,admin_accountx0020code2,"
          + "new_btb_type,new_quotation_expiry_date,new_review";
        const response = await parent.Xrm.WebApi.retrieveMultipleRecords("admin_btb_lis_excel_datas", query);

        const mappedRecords = response.entities.map((item, i) => ({
          id: item.admin_title || String(i),
          status: item.new_prstatus != null ? (PR_STATUS_CHOICES[String(item.new_prstatus)] || "") : "",
          flagged: item.new_flagged === true,
          statusRemark: item.new_statusremark || "—",
          no: item.admin_nox002e2 || "—",
          prNo: item.admin_prx0020nox002e2 || "—",
          recdDate: fmtLisDate(item.admin_recx0027dx0020datex00202),
          poNo: item.admin_pox0020nox002e2 || "—",
          customerName: item.admin_customerx0020name2 || "—",
          vendor: item.admin_vendor2 || "—",
          prDescription: item.admin_prx0020description2 || "—",
          recordId: item.admin_title || "—",
          uid: item.admin_uidx0020x00232 || "—",
          startDate: fmtLisDate(item.admin_startx0020date),
          endDate: fmtLisDate(item.admin_odatax0020endx0020date2),
          contractNo: item.admin_contractx0020nox002e2 || "—",
          hkd: item.admin_hkd2 != null ? String(item.admin_hkd2) : "—",
          usdOthers: item.admin_usdx0020x002fx0020others2 || "—",
          handledBy: item.admin_handledx0020byx00202 || "—",
          iptUnitMgr: item.admin_iptx0020unitx0020mgr2 || "—",
          quotationStartDate: item.admin_startx0020date2 || "—",
          quotationEndDate: item.admin_odatax0020endx0020date3 || "—",
          poDate: fmtLisDate(item.admin_pox0020date2),
          receiptDate: fmtLisDate(item.admin_receiptx0020date2),
          poAmountHkd: item.admin_pox0020amountx0020hkx00242 != null ? String(item.admin_pox0020amountx0020hkx00242) : "—",
          umMgr: item.admin_umx002fmgr2 || "—",
          prIssuedMonth: item.admin_prx0020issuedx0020month2 || "—",
          prIssuedOn: item.admin_prx0020issuedx0020on2 || "—",
          worksOrderCode: item.admin_worksx0020orderx0020code2 || "—",
          yn: item.admin_yx0020x002fx0020n2 || "—",
          remarks: item.admin_remarks2 || "—",
          invoiceDnNo: item.admin_invoicex0020x0023x0020x002 || "—",
          invoiceDnDate: fmtLisDate(item.admin_invoicex0020x002fx0020dnx2),
          issueBy: item.admin_issuex0020by2 || "—",
          chargeCcc: item.admin_chargex0020ccc2 || "—",
          accountCode: item.admin_accountx0020code2 || "—",
          btbType: item.new_btb_type || "",
          quotationExpiryDate: item.new_quotation_expiry_date ? item.new_quotation_expiry_date.split('T')[0] : "",
          reviewApprovalRaw: item.new_review || "",
        }));

        setRecords(mappedRecords);
        setRecordsLoadError(null);
      } catch (error) {
        console.error("Failed to load records from Dataverse:", error);
        setRecordsLoadError(error.message || String(error));
      }
    };

    if (parent && parent.Xrm && parent.Xrm.WebApi) {
      fetchRecordsFromDataverse();
    } else {
      console.warn("Master Records: parent.Xrm.WebApi not found -- add this page inside the model-driven app to load real data. Showing an empty list; use Demo Mode to preview with sample records.");
    }
  }, []);

  // Same optimistic-update + revert-on-failure pipeline as PR Assistant
  // App.html's own updateMasterRecordField. `fields` is Dataverse column name
  // -> value (however many changed at once); `localPatch` is the matching
  // app-shaped patch merged into the row immediately, before the write even
  // resolves, so the table is current the instant the modal closes.
  const updateMasterRecordFields = async (recordId, fields, localPatch) => {
    const previous = records.find(r => r.recordId === recordId);
    if (!previous) return false;
    setFieldSaveError(null);
    setRecords(prev => prev.map(r => (r.recordId === recordId ? { ...r, ...localPatch } : r)));
    const webApi = parent && parent.Xrm && parent.Xrm.WebApi;
    if (!webApi) return true; // Demo/standalone mode: the local update above is the whole write.
    const result = await writeMasterRecordFields(recordId, fields, webApi);
    if (!result.ok) {
      setRecords(prev => prev.map(r => (r.recordId === recordId ? previous : r)));
      setFieldSaveError(`Could not save changes for ${recordId}: ${result.error}`);
      return false;
    }
    return true;
  };
  const updateMasterRecordField = (recordId, fieldName, dvValue, localPatch) =>
    updateMasterRecordFields(recordId, { [fieldName]: dvValue }, localPatch);

  const toggleDemo = () => {
    const next = !demoMode;
    setDemoMode(next);
    setRecords(next ? DEMO_RECORDS : EMPTY_RECORDS);
    setRecordsLoadError(null);
    setFieldSaveError(null);
  };

  return (
    <RecordsPage records={records} demoMode={demoMode} toggleDemo={toggleDemo}
      recordsLoadError={recordsLoadError}
      updateMasterRecordField={updateMasterRecordField}
      updateMasterRecordFields={updateMasterRecordFields}
      fieldSaveError={fieldSaveError} dismissFieldSaveError={() => setFieldSaveError(null)} />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MasterRecordsApp />);
</script>
<script>
  // A <script type="text/babel-jsx"> is inert to the browser -- it never
  // executes on its own, which is the point (so Babel can read its text
  // before anything runs). PR Assistant App.html's own bootstrap does this
  // same manual transform-then-append instead of relying on babel-standalone's
  // automatic DOMContentLoaded script scan, so this file matches it exactly.
  var src = document.getElementById("app-src").textContent;
  var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
  var s = document.createElement("script");
  s.textContent = out;
  document.body.appendChild(s);
</script>
