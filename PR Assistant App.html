                const cc = crosschecks[key];
                // The ATQ (Excel) column is blank on its own fairly often --
                // see the Quotation No. soloRole note above -- and that is
                // NOT, by itself, "no value to compare": if the Agreement or
                // the Quotation has one, there is plainly something to check
                // this field against, just not from the ATQ side. So every
                // OTHER compare role is read up front, and a blank ATQ falls
                // back to the first one that has an answer, exactly the same
                // move the Quotation No. row already makes on its own. Only
                // when EVERY source -- ATQ included -- comes back empty is
                // this genuinely "no data value to do the cross check".
                const breakdownCols = EXTRACTED_FIELD_COLUMNS.filter(c => config.compare.indexOf(c.roleKey) >= 0);
                const compareReadings = breakdownCols.map(c => ({
                  col: c, value: verifyCellValue(crosschecks, key, c.roleKey, dataverseVerify, recordId, c.kind),
                }));
                const fallback = !excelValue ? compareReadings.find(r => r.value) : null;
                // Value column: prefer the ATQ Excel Dataverse record (what was
                // actually saved), fall back to the extracted document value.
                const atqExcelVal = atqExcelCellValue(dataverseVerify, key);
                const value = atqExcelVal || excelValue || (fallback ? fallback.value : "");
                const tone = verifyValueTone(cc, value);
                const flagged = cc && (cc.severity === "different" || cc.severity === "similar");
                // True absence: reads the SAME values the breakdown panel
                // below is about to render (compareReadings), not the raw
                // document extraction underneath them. In Dataverse mode
                // that is deliberate -- the module comment above
                // (dataverseCellValue) says it outright: "the Agreement and
                // Quotation columns then answer for Dataverse and for
                // nothing else". A document's OCR having once found a
                // Customer Name is not "data to cross-check" once this page
                // has moved to asking Dataverse instead; the reviewer is
                // looking at a breakdown that says "not in Dataverse" for
                // both roles, and the row has to agree with what it is
                // showing rather than silently trusting a reading the panel
                // itself does not display. Outside Dataverse mode
                // compareReadings already falls back to the plain document
                // extraction (verifyCellValue's own non-Dataverse branch), so
                // this is still "nothing on the ATQ workbook and nothing on
                // any comparable document" there, same as before.
                const missing = cc && !compareReadings.some(r => r.value);
                // Both states need the reviewer's attention: a real
                // disagreement, or nothing to compare at all. `passed` is the
                // same dismissedDiffs/toggleDismissDiff state Verify's own
                // Automatic Checks panel already uses -- passing a row here
                // shows up as resolved there too, and the reverse.
                const passed = !!(cc && dismissedDiffs && dismissedDiffs.has(cc.dismissKey));
                const problem = cc && (flagged || missing) && !passed;
                const pass = cc && toggleDismissDiff ? () => toggleDismissDiff(cc.dismissKey) : null;
                // The row's status logo now lives at the end of the Field
                // Name cell instead of beside the value -- one glance down
                // the left column tells the reviewer which rows need
                // attention, same priority order the value column used to
                // encode: resolved beats missing beats a real conflict.
                const rowIcon = passed
                  ? { name: "checkCircleBig", color: "text-[#3D8B5F]" }
                  : missing
                  ? { name: "alertTriangle", color: "text-[#CA8A04]" }
                  : (flagged && tone.icon)
                  ? { name: tone.icon, color: tone.iconColor }
                  : null;
                // Every row with a comparison to run can be opened to see
                // what the OTHER document(s) for this field said -- not just
                // the ones currently in conflict, because comparing these
                // fields is the mandatory step, and a reviewer confirming an
                // agreeing row still needs to see (and Pass) what it agreed
                // against. Whichever source is already sitting in the row --
                // ordinarily ATQ (Excel), or the fallback source when ATQ has
                // none -- is left out of its own breakdown, since repeating a
                // value beside itself proves nothing. `config.compare` names
                // which roles this field is even comparable against
                // (Agreement Number only ever appears on the Agreement;
                // Customer Name genuinely appears on all three), so the panel
                // never offers a column that could not have produced the
                // disagreement. Still resolved the same way as before
                // (verifyCellValue / columnDocSource). A plain <details>
                // rather than React state for the open/closed part: the
                // breakdown is then part of the static markup (openable with
                // no JS, and directly assertable in a test) instead of a
                // click this harness cannot simulate. It opens by default
                // only when there IS a problem (`problem`, below) -- an
                // agreeing row starts collapsed, since nothing there needs
                // the reviewer's eye first.
                const shownBreakdownCols = fallback ? breakdownCols.filter(c => c !== fallback.col) : breakdownCols;
                const breakdown = (
                  <div className="mt-2 inline-block rounded-lg border border-[#EEE7DE] bg-[#FAF7F2] px-3 py-2 text-left min-w-[240px]">
                    <table className="w-full fs-13-19 border-collapse">
                      <tbody>
                        {shownBreakdownCols.map(c => {
                          const v = verifyCellValue(crosschecks, key, c.roleKey, dataverseVerify, recordId, c.kind);
                          const fromDataverse = dataverseIsActive(dataverseVerify, c.roleKey);
                          const csrc = columnDocSource(census, c);
                          const openCDoc = openDocButton(csrc, c.roleKey);
                          return (
                            <tr key={c.key}>
                              <td className="pr-3 py-1 align-top text-[#6B6B6B] font-semibold whitespace-nowrap">{c.label}</td>
                              <td className="py-1 align-top">
                                {n8nVerifyMode && v && (c.roleKey === "agreement" || c.roleKey === "quotation")
                                  ? <button onClick={() => selectLisValue(row.id, v)}
                                      title={"Use this " + c.label + " value as LIS Value"}
                                      className="text-left text-[#1A1A1A] font-semibold underline underline-offset-2 decoration-[#D4916E] hover:text-[#B87551] ui-transition pressable">
                                      {v}
                                    </button>
                                  : <span className={v ? "text-[#1A1A1A]" : "text-[#C5BEB6] italic"}>
                                      {v || (fromDataverse ? "not in Dataverse" : "not extracted")}
                                    </span>}
                              </td>
                              <td className="pl-2 py-1 align-top text-right">
                                <DocOpenButton onClick={openCDoc} title={"Open " + sourceBaseName(csrc)} />
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                    {/* Every problem row gets the same resolution: a reviewer
                        who has actually looked at the documents and decided
                        the flag (or the blank) is fine says so here. Reuses
                        the app's existing per-field dismissal, so passing a
                        row is the same action as dismissing it in Verify's
                        Automatic Checks -- one state, not two that could
                        disagree. */}
                    {pass &&
                      <div className="mt-2 pt-2 border-t border-[#EEE7DE] flex justify-end">
                        <button onClick={pass}
                          className="inline-flex items-center gap-1 fs-12-19 font-semibold text-[#3D8B5F] hover:text-[#2E6B47] ui-transition pressable">
                          <Icon name="checkCircleBig" className="w-4 h-4" /> Pass
                        </button>
                      </div>}
                  </div>
                );
                // Comparing is the mandatory step, not just flagging a
                // conflict -- so EVERY row with a comparison to run (cc
                // exists) gets the same expandable breakdown and the same
                // Pass button, not only the ones currently in trouble.
                // Agreeing and uncorroborated rows just start collapsed,
                // since nothing there needs the reviewer's eye first; a real
                // conflict or a missing value starts open, per `problem` above.
                return (
                  <tr key={row.id} className={verifyRowClass(row)}>
                    <td className="px-3 py-2 text-[#3D3D3D] font-medium">
                      <span className="inline-flex items-center gap-2">
                        {renderFieldLabel(row, label)}
                      </span>
                    </td>
                    {/* 3. Value — ATQ Excel Dataverse value, plain */}
                    <td className="px-3 py-2 text-right">
                      {value
                        ? <span className="fs-14-19 text-[#1A1A1A]">{value}</span>
                        : <span className="fs-13-19 text-[#C5BEB6] italic">not extracted</span>}
                    </td>
                    {/* 4. Cross Check — breakdown with Pass/undo */}
                    <td className="px-3 py-2 align-top">
                      {cc
                        ? n8nVerifyMode
                          ? breakdown
                          : <details open={problem} className="inline-block">
                            <summary title={missing
                              ? "No document this field is compared against has a value"
                              : flagged ? tone.title : "Click to see what each document says"}
                              className="inline-flex items-baseline gap-1.5 cursor-pointer outline-none list-none [&::-webkit-details-marker]:hidden">
                              {missing
                                ? <span className="inline-flex items-center gap-1 fs-13-19 font-bold text-[#B23B3B]">No value to compare</span>
                                : flagged
                                ? <span className={`inline-flex items-center gap-1 fs-13-19 ${tone.text}`}>{tone.glyph} compared</span>
                                : <span className="fs-13-19 text-[#3D8B5F] font-medium">Agrees</span>}
                              <Icon name="chevronDown" className="w-3.5 h-3.5 text-[#8E847A] shrink-0" />
                            </summary>
                            {breakdown}
                            {pass && !missing &&
                              <div className="mt-2 pt-2 border-t border-[#EEE7DE] flex justify-end">
                                <button onClick={pass}
                                  className="inline-flex items-center gap-1 fs-12-19 font-semibold text-[#3D8B5F] hover:text-[#2E6B47] ui-transition pressable">
                                  <Icon name="checkCircleBig" className="w-4 h-4" /> Pass
                                </button>
                              </div>}
                          </details>
                        : <span className="fs-13-19 text-[#C5BEB6] italic">—</span>}
                    </td>
                    {lisValueCell(row, key, row.lisAutoFill ? value : undefined)}
                  </tr>
                );
              })}
              {/* The one-sentence detection summary, as its own LIS row --
                  ahead of Company Chop's own per-mark detail below it. Its
                  content sits in the LAST column, not Value -- these rows
                  carry wide content (reminder text, chop crops) that would
                  otherwise stretch the Value column and drag "Value (ATQ
                  Excel)" / "Cross Check" off-centre for every other row in
                  the table, since column widths are shared across the whole
                  table, not per-row. */}
              <tr className="border-b border-[#EEE7DE]">
                {n8nVerifyMode && <td className="w-8 px-1 py-2"></td>}
                <td className="px-3 py-2 text-[#3D3D3D] font-medium align-top">Chop / Sign Detection</td>
                <td className="px-3 py-2 align-top"></td>
                <td className="px-3 py-2 align-top"></td>
                <td className="px-3 py-2 align-top text-right">
                  {chop
                    ? <span className="text-[#3D3D3D] font-medium">{chop}</span>
                    : <span className="text-[#C5BEB6] italic">not extracted</span>}
                </td>
              </tr>
              {/* Company Chop is the agreement's own ink, not a cross-checked
                  field, so it draws as its own spanning row rather than
                  pretending to be the ATQ value. What it draws is the
                  detection itself -- one line per mark the ink pass found,
                  named, placed on a page, and openable -- rather than the
                  one-sentence "Signed & Chopped" summary it used to. The
                  summary survives only as the fallback for a result that knows
                  a chop was found but kept no marks (demo data, an older
                  parse); it is a weaker answer, not a different one. */}
              <tr className="border-b border-[#EEE7DE]">
                {n8nVerifyMode && <td className="w-8 px-1 py-2"></td>}
                <td className="px-3 py-2 fs-17-19 text-[#3D3D3D] font-bold align-top">Company Chop</td>
                <td className="px-3 py-2 align-top"></td>
                <td className="px-3 py-2 align-top"></td>
                {/* The ink goes in the LAST column, not Value -- see the Chop

                    detail here are wide enough to drag every other row's

                    column with them. This row used to carry two filler cells
                    and push its content one column right, which left it with

                <td className="px-3 py-2 align-top text-right">
                  {chop === "No Chop Position"

                    ? <span className="flex flex-col gap-1.5 items-end">
                        {chops.map(m => (
                          <span key={m.key} className="flex flex-col gap-0.5 items-end">
                            {/* The chop itself, cut out of the page. The
                                whole reason a reviewer opens the document
                                here is to see one 2cm ring, and the crop
                                carries the printed sign-off block with it
                                -- which is where the name beside it came
                                from, since the ink's own OCR is unreadable
                                (measured: "0", null, "One Center"). A mark
                                with no crop keeps every other part of its
                                line. */}
                            {m.crop &&
                              <button onClick={() => setChopZoom(m)}

                            Signature also found — {signatures.map(s =>

                </td>
              </tr>
            </tbody>
          </table>
          </div>
          {/* Static reminder, always shown beneath the table -- not
              conditional on a detected mismatch, per the reviewer's own
              manual-review process. Moved out of the table (it used to be a

              Value / Cross Check columns off-centre -- the table's column

          <div className="rounded-lg border border-[#F3D9B1] bg-[#FFF8EC] px-4 py-3 fs-13-19 leading-relaxed text-[#8A5A1E]">
            <p className="font-semibold text-[#3D3D3D] mb-1">Chop Reminder</p>
            <p>Please note that this case requires further manual review as the company chop does not match the company name on the signed contract/customer PO. Before submitting the LIS, please complete one of the following two actions:</p>

          <div className="flex justify-end">

              <span className="inline-flex items-center gap-2"><Icon name="check" className="w-4 h-4" />

      {chopZoom && (
        <div onClick={() => setChopZoom(null)} role="dialog" aria-modal="true"
          aria-label="Company chop, enlarged"
          className="modal-backdrop fixed inset-0 z-50 bg-[#F4F0E8]/85 backdrop-blur-sm flex items-center justify-center p-8">
          <div onClick={e => e.stopPropagation()}
            className="modal-pop bg-white rounded-xl p-4 flex flex-col gap-3 max-w-[92vw] max-h-[88vh]">
            <div className="flex items-baseline gap-3">

                {[chopZoom.ours ? OUR_COMPANY.label + "'s own chop" : "chop",

                  .filter(Boolean).join(" · ")}
              </span>
              <button onClick={() => setChopZoom(null)}
                className="ml-auto fs-12-19 text-[#6B6B6B] hover:text-[#1A1A1A] ui-transition pressable">
                Close ✕
              </button>
            </div>
            <img src={chopZoom.crop} alt={"Company chop on page " + chopZoom.page}
              className="block max-w-full max-h-[72vh] object-contain bg-white rounded-md border border-[#C5BEB6]" />
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/**
 * @param {Blob} blob 
 * @returns {Promise<string>} - base64 string representation of the blob
 */
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const result = reader.result;
      if (!result || typeof result !== "string") {
        reject(new Error("Failed to convert blob to base64"));
        return;
      }
      const base64 = result.substring(result.indexOf(",") + 1); // Remove the data URL prefix
      resolve(base64)
    };
    reader.readAsDataURL(blob);
  });
}

const N8N_SAVE_ONEDRIVE_URL = "https://d1u4t2v5sfu1y7.cloudfront.net/webhook/c109d139-821d-40d6-a929-05eb276892cd";

/**
 * Send Email and attachments to PowerFlow (through n8n flow)
 * @param {string} recordId 
 * @param {import("./types/AttachmentRecord").IAttachments} attachments 
 */
async function saveAttachmentToPowerFlow(recordId, attachments){
  if (!recordId || recordId.length === 0) {
    throw new Error("recordId is required to save attachments to PowerFlow");
  }
  /** @type {{recordId: string, attachments: {filename: string; base64: string}[]}} */
  const postObj = {
    recordId,
    attachments: []
  }
  const emailFile = attachments["Vendor Quotation"].fileObj

  const promises = attachments["Vendor Quotation"].docs.map(async (doc) => {
      if (!doc.fileName) throw new Error("Invalid filename") ;
      return ({
        filename: doc.fileName,
        base64: await blobToBase64(doc.blob)
      })
    }
  )
  promises.push(blobToBase64(emailFile).then((base64)=>({
    filename: emailFile.name,
    base64
  })))
  const base64Files = (await Promise.allSettled(promises)).filter(res=> res.status === 'fulfilled')
  postObj.attachments = base64Files.map((res) => res.value)
  const response = await fetch(N8N_SAVE_ONEDRIVE_URL, {
    method: "POST",
    body: JSON.stringify(postObj), 
  })
  return response
}

// No `census` prop: every role this page names travels inside the crosscheck
// already, so taking the census too would be a second way to answer the same
// question and a second way to be out of date.
function LisRemarkPage({ fields, lisRowValues, attachments, itemIndex, selectItem, itemRecordIds, savedRecordIds, processAnotherItem, goUpload, goSave, saving, recordId, savedRecordId, setField, adminMode = false, records = [], lisStartWritten = {}, processedItems = {} }) {
  // The sales contact the reviewer picked HERE. `null` means they have not
  // touched the picker -- distinct from `""`, which is them CLEARING it, and
  // the picker really does offer a blank row. That is why this is a sentinel
  // rather than the plain `""` the Admin Name override can get away with.
  const [salesContactPick, setSalesContactPick] = useState(null);
  // The Admin Name the reviewer picked HERE, and nothing else -- "" means they
  // have not picked one, which is a state the old `useState(BTB_ADMIN_NAMES[0])`
  // could not express: "nobody has chosen" and "somebody chose Mandy Lee" were
  // the same value, so nothing could follow the Issue By column without also
  // overriding a real choice.
  const [adminNameOverride, setAdminNameOverride] = useState("");
  const [btbRemarkText, setBtbRemarkText] = useState("");
  // Same sentinel, same reason: a pill can be turned ON but there is no
  // "unpick" click, so `null` here is only ever "the reviewer has not chosen".
  const [supplierOptionPick, setSupplierOptionPick] = useState(null);
  const [supplierRemarkText, setSupplierRemarkText] = useState("");
  const items = recordsBearingEntry(attachments) || [];
  // There is no picker HERE any more -- the card is the button alone, and the
  // item is chosen on the Document Workbench, whose own Item selector the
  // button highlights on arrival. Two item pickers on one page meaning two
  // different things was the hazard the old draft selection worked around;
  // having only one, on the page where the choice actually takes effect, is
  // the same hazard answered by removing it. The rules for `done` are on
  // itemProcessOptions.
  const currentAtqNo = currentAtqNoOf(fields, attachments);
  const itemOptions = itemProcessOptions(items, itemRecordIds, savedRecordIds, records, currentAtqNo, lisStartWritten, true, processedItems);
  // The item the button opens ON: the next one there is actually work to do
  // on, skipping the one already on screen -- landing on the current item
  // would make the button read as a no-op. Falls back to any unsaved item,
  // then to the first. DERIVED, not state: with the select gone there is
  // nothing for a reviewer to have chosen, so a stale useState initialiser
  // would be the only way this could disagree with savedRecordIds.
  const nextOption = itemOptions.find(o => !o.done && o.index !== itemIndex)
    || itemOptions.find(o => !o.done)
    || itemOptions.find(o => o.index === 0)
    || null;
  // Every EXCEL_COLUMN_MAP key now has a matching fields[key] (quotationStartDate/
  // quotationEndDate were added for this), so this page reads/writes the same
  // App-level fields state as everywhere else. lisRowValues (the Extracted
  // Fields page's own LIS Value column, snapshotted at "Continue to save")
  // is a last-resort fallback for a row whose value never reached `fields`.
  //
  // ⚠️ It is keyed by ROW ID, not by field key, so it only ever answers for the
  // rows whose two names happen to coincide -- `prAmount`/`hkd` and the two
  // contract dates do not, and never did. That is exactly why the real seeding
  // goes through LIS_ROW_TO_FIELD_KEY in goLis instead.
  const valueOf = key => (fields[key] && fields[key].value) || (lisRowValues && lisRowValues[key]) || "";
  // The Quotation Start/End Date seed effect that used to sit here is gone:
  // goLis now seeds EVERY LIS row through seedFieldsFromLisRows, which covers
  // these two and applies the wider "blank or still-auto" guard the two-key
  // version could not (its blank-only test is why a reviewer's changed Vendor
  // never made it across).
  //
  // One behaviour went with it, deliberately: the old effect re-ran on every
  // mount, so a reviewer who CLEARED one of these boxes and came back found it
  // refilled. Seeding at "Continue to save" happens when the values are
  // produced, so a cleared box now stays cleared -- which is what every other
  // field on this page already does.
  const salesContactOf = key => BTB_SALES_CONTACTS.find(c => c.key === key) || null;
  // Three things on this page are answered by the LIS row before the reviewer
  // arrives -- who handled it, which Admin issued it, and which case type it is
  // -- and all three are DERIVED from `fields` rather than copied into state by
  // an effect. That is one decision, not three: an effect that copies has to run
  // after the render it corrects, so every other effect queued in that same
  // render rebuilds the two sentences from the value it is about to replace.
  //
  // The Sales Name auto-match used to be the copying kind, and the Case Type
  // default is what would have made that visible: with a case type selected on
  // the very first render, the Admin Name effect below would have rebuilt the To
  // Supplier text from a sales contact that had not committed yet and dropped
  // "For case details, please contact Ms. Abby Chan at 2883 0385" out of it.
  // Derived, there is nothing to race.
  const autoSalesContact = findSalesContact(valueOf("handledBy"));
  const salesContactKey = salesContactPick != null
    ? salesContactPick : (autoSalesContact ? autoSalesContact.key : "");
  // Whoever the LIS row's Issue By column already names (FEATURES.adminNameFromIssueBy),
  // or "" when it names nobody this list knows -- an Admin who has left, a
  // typo, or a blank column all land here and the old first-in-the-list default
  // still answers.
  const autoAdminName = (FEATURES.adminNameFromIssueBy && findBtbAdminName(valueOf("issueBy"))) || "";
  // DERIVED, not state, and that is the load-bearing part: Issue By is seeded
  // into `fields` by "Continue to save" before this page ever mounts, so an
  // effect that set state would have to race the two remark-building effects
  // below -- both of which read `adminName` out of the render they were queued
  // in and would print the name this one replaced. Derived, there is nothing to
  // race: the first render already has the right name and every btbTextFor /
  // supplierTextFor default picks it up.
  const adminName = adminNameOverride || autoAdminName || BTB_ADMIN_NAMES[0];
  // Which Case Type pill the LIS row's Charge CCC column already answers
  // (FEATURES.caseTypeFromChargeCcc), or "" -- see caseTypeForChargeCcc for why
  // a blank column lights neither pill.
  const autoSupplierOption = FEATURES.caseTypeFromChargeCcc
    ? caseTypeForChargeCcc(valueOf("chargeCcc")) : "";
  const supplierOption = supplierOptionPick != null ? supplierOptionPick : autoSupplierOption;
  // The one place that knows how this page builds the To Supplier text, so the
  // three call sites below cannot drift about which arguments it gets --
  // forgetting `adminName` at one of them would silently leave that rebuild
  // naming the hard-coded Mandy Lee. `admin` is passed explicitly rather than
  // read off state because selectAdminName rebuilds with the name just picked,
  // which setAdminNameOverride has not committed yet.
  // Same reasoning as supplierTextFor below: three call sites, one place that
  // knows the arguments, so none of them can quietly keep the trailing sign-off
  // this side dropped.
  const btbTextFor = (contact, admin = adminName) =>
    buildBtbRemark(contact, admin, FEATURES.btbBuyerSignoff);
  const supplierTextFor = (option, contact, admin = adminName) =>
    buildToSupplierRemark(option, fields, contact, FEATURES.toSupplierPeriod,
      FEATURES.toSupplierIssuedBy ? admin : null);
  // One selection, two remarks. The picker sits on the To Supplier card now,
  // but it still drives the BTB sentence -- so both texts are rebuilt here
  // rather than each card owning its own copy of the choice.
  const selectSalesContact = key => {
    setSalesContactPick(key);
    const contact = salesContactOf(key);
    setBtbRemarkText(contact ? btbTextFor(contact) : "");
    // Only when a case type has already been picked: with none there is no
    // supplier template to rebuild, same rule selectAdminName follows below.
    if (supplierOption) setSupplierRemarkText(supplierTextFor(supplierOption, contact));
  };
  // The Admin Name dropdown only rebuilds the sentence when a sales contact is
  // already selected -- with none selected there is no template to rebuild
  // (buildBtbRemark requires a contact), so the change is remembered for the
  // next selectSalesContact/auto-match instead of producing text now.
  const selectAdminName = name => {
    setAdminNameOverride(name);
    const contact = BTB_SALES_CONTACTS.find(c => c.key === salesContactKey);
    if (contact) setBtbRemarkText(btbTextFor(contact, name));
    // The To Supplier sentence names the same Admin on its "PR Issued by" line,
    // so this picker drives BOTH remarks now. Guarded on the CASE TYPE, not on
    // the contact the BTB line above needs: that line is built by
    // buildToSupplierRemark from a template the contact only signs, so a
    // reviewer who picked a case type but no contact still gets the new name.
    if (supplierOption) setSupplierRemarkText(supplierTextFor(supplierOption, salesContactOf(salesContactKey), name));
  };
  const selectSupplierOption = option => {
    setSupplierOptionPick(option);
    setSupplierRemarkText(supplierTextFor(option, salesContactOf(salesContactKey)));
  };
  // ONE effect for all three, replacing the per-value ones that came before it.
  // The three derived values above are what the sentences are BUILT from, so
  // "keep the text in step with them" is a single rule -- and written per value
  // it was not one: each effect read the other two out of the render it was
  // queued in, so whichever ran first was undone by the next with a stale copy
  // of what it had just set.
  //
  // It only ever ADDS text. Clearing is left to selectSalesContact, which is the
  // one place a reviewer can ask for an empty BTB sentence -- a `null` contact
  // here means the LIS row has not named one yet, not that anybody cleared it.
  useEffect(() => {
    const contact = salesContactOf(salesContactKey);
    if (contact) setBtbRemarkText(btbTextFor(contact, adminName));
    if (supplierOption) setSupplierRemarkText(supplierTextFor(supplierOption, contact, adminName));
  }, [salesContactKey, adminName, supplierOption]);

  const renderExcelTable = (title, columns) => (
    <Card className="overflow-hidden">
      <div className="flex items-center justify-between px-4 py-3 bg-[var(--surface-soft)] border-b border-[var(--line)]">
        <div className="fs-12-16 font-bold tracking-[1.2px] uppercase text-[var(--muted)]">{title}</div>
        <div className="fs-11-16 text-[#6E6E73]">{columns[0][0]}–{columns[columns.length - 1][0]}</div>
      </div>
      {/* Drawn as the spreadsheet it is about to be pasted into, because that
          is the comparison the reviewer is actually making -- they have the
          destination sheet open beside this. Three things carry it, and the
          gutter is the one doing most of the work: Excel's own chrome (grey
          letter bar ACROSS the top, grey number gutter DOWN the side, thin grid
          on every cell) frames the white cells, so "the grey is the app talking,
          the white is your data" needs no explaining. The label row is sheet
          row 1 -- bold on white, exactly how a header row looks in the real
          workbook -- rather than a third band of app chrome. */}
      <div className="overflow-x-auto">
        <table className="w-full min-w-[1240px] border-collapse text-left"
          style={{fontFamily:"Calibri, 'Segoe UI', system-ui, sans-serif"}}>
          <thead>
            <tr className="bg-[#E7E6E6] fs-12-16 font-normal text-[#5A5A5A]">
              {/* The select-all corner. Empty on purpose: it is where the
                  letter bar and the number gutter meet and names neither. */}
              <th className="sticky left-0 z-10 w-10 min-w-[40px] bg-[#E7E6E6] border border-[#B7B7B7] px-2 py-1.5" aria-label=""></th>
              {columns.map(([column]) => <th key={column} className="min-w-[120px] border border-[#B7B7B7] px-3 py-1.5 text-center font-normal">{column}</th>)}
            </tr>
            <tr className="bg-white fs-13-16 font-bold text-[var(--ink)]">
              <th className="sticky left-0 z-10 w-10 min-w-[40px] bg-[#E7E6E6] border border-[#B7B7B7] px-2 py-2 text-center fs-12-16 font-normal text-[#5A5A5A]">1</th>
              {columns.map(([column, label]) => <th key={column} className="min-w-[120px] border border-[#D0D0D0] px-3 py-2 text-left align-top">{label}</th>)}
            </tr>
          </thead>
          <tbody><tr className="bg-white fs-13-16">
            <td className="sticky left-0 z-10 w-10 min-w-[40px] bg-[#E7E6E6] border border-[#B7B7B7] px-2 py-2 text-center fs-12-16 text-[#5A5A5A] align-top">2</td>
            {columns.map(([column, label, key]) => <td key={column} className="min-w-[120px] border border-[#D0D0D0] p-0 align-top">
              <input value={valueOf(key)} onChange={e => setField(key, e.target.value)}
                placeholder="Blank" aria-label={label}
                className="w-full px-3 py-2 bg-transparent text-[var(--ink)] placeholder:text-[#A6A6A6] placeholder:italic outline-none focus:bg-[#FFF8E8]" />
            </td>)}
          </tr></tbody>
        </table>
      </div>
    </Card>
  );

  // One picker, two possible homes -- built once here so the To Supplier card
  // and the BTB card cannot drift into two selects that disagree about their
  // options, their placeholder or what selecting one does. Both call sites are
  // direct children of a `grid-cols-6` Card, which is why label and trigger
  // each carry their own col-span rather than sitting in a wrapper div.
  const buyerNamePicker = (
    <React.Fragment>
      <div className="col-span-6 fs-12-19 font-bold text-[var(--muted)]">Sales Name :</div>
      <AnimatedSelect value={salesContactKey} onChange={v => selectSalesContact(v)}
        placeholder="— Select sales contact —" fullWidth optionClassName="fs-13-19"
        options={[{ value: "", label: "— Select sales contact —" }, ...BTB_SALES_CONTACTS.map(c => ({ value: c.key, label: c.key }))]}
        triggerClassName="col-span-6 w-full flex items-center justify-between gap-1.5 px-3 py-2 fs-14-19 text-[var(--ink)] rounded-xl border-[1.5px] border-[var(--line)] bg-white outline-none focus:border-[var(--orange)]" />
    </React.Fragment>
  );
  // The Admin Name picker, built once for the same reason buyerNamePicker is:
  // it has two possible homes now (the BTB card, or the row above the cards)
  // and two copies would drift into two selects that disagree about their
  // options or what selecting one does.
  const adminNamePicker = (
    <React.Fragment>
      <div className="col-span-6 fs-12-19 font-bold text-[var(--muted)]">Admin Name :</div>
      <AnimatedSelect value={adminName} onChange={v => selectAdminName(v)}
        placeholder="— Select Admin Name —" fullWidth optionClassName="fs-13-19"
        options={BTB_ADMIN_NAMES.map(n => ({ value: n, label: n }))}
        triggerClassName="col-span-6 w-full flex items-center justify-between gap-1.5 px-3 py-2 fs-14-19 text-[var(--ink)] rounded-xl border-[1.5px] border-[var(--line)] bg-white outline-none focus:border-[var(--orange)]" />
    </React.Fragment>
  );

  return <React.Fragment>
    <TopBar title="LIS & Remark" desc="Review the LIS row and add remarks"
      right={<React.Fragment>
        {adminMode && <Pill className="bg-[#FFF4DE] text-[var(--orange-dark)] border border-[var(--orange)]">Admin bypass</Pill>}
        {/* The plain view-switcher, kept for the side that has no "Process
            Another Item" card. Drawing both would put two item pickers on one
            page meaning two different things -- this one switches which item is
            DISPLAYED, the card's one chooses which item to go and process next. */}
        {items.length > 1 && !FEATURES.processAnotherItem && <AnimatedSelect value={itemIndex} onChange={v => selectItem(Number(v))}
          options={items.map((_, i) => ({ value: i, label: `Item ${i + 1}` }))}
          triggerClassName="inline-flex items-center gap-1.5 px-3 py-2 rounded-full border-[1.5px] border-[var(--line)] bg-white text-[13px] font-semibold text-[var(--ink)]" />}
        <GhostButton onClick={goUpload}><span className="inline-flex items-center gap-1.5"><Icon name="chevronLeft" className="w-4 h-4" />Upload</span></GhostButton>
        <PrimaryButton 
          disabled={saving || !!savedRecordId} 
          onClick={async (e)=>{
            await goSave(e);
            saveAttachmentToPowerFlow(recordId, attachments)
          }}
        >
          {saving ? "Saving..." : savedRecordId ? "Saved" : "Save to master"}
        </PrimaryButton>
      </React.Fragment>} />
    <div className="px-5 md:px-8 pb-8 flex flex-col gap-5">
      {/* Dev side only (FEATURES.processAnotherItem), and only when this ATQ
          really covers more than one item. Placed here rather than in the
          TopBar: the greyed-out rows need a sentence beside them saying why
          they are greyed, and a rail of round pills has no room for one. */}
      {FEATURES.processAnotherItem && items.length > 1 && (
        <Card className="p-5 flex flex-wrap items-center justify-between gap-3">
          <div className="min-w-0">
            <div className="fs-12-17 font-bold tracking-[1.2px] uppercase text-[var(--orange-dark)]">Another item on this email</div>
            <div className="mt-1 max-w-3xl fs-14-18 text-[var(--muted)]">
              This ATQ covers {items.length} items and the email already carries the documents for all of them.
              Press the button and you are taken back to the Document Workbench with the next unsaved item selected
              and its Item selector highlighted — change it there if you want a different one, choose that item's
              documents and press Start again, and a new Record ID is created for it. Items already saved to master
              are greyed out in that selector.
            </div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <GhostButton disabled={!nextOption || nextOption.done} onClick={() => processAnotherItem(nextOption.index)}
              title={nextOption && nextOption.done ? "Every item on this email has already been saved to master." : undefined}>
              Process Another Item
            </GhostButton>
          </div>
        </Card>
      )}
      <Card className="p-5 flex flex-wrap items-center justify-between gap-3">
        <div><div className="fs-12-17 font-bold tracking-[1.2px] uppercase text-[var(--orange-dark)]">Excel row preview</div>
          <div className="mt-1 fs-14-18 text-[var(--muted)]">All 33 destination columns appear in the same order as the copy button below writes them.</div></div>
        <CopyIconButton text={EXCEL_COLUMN_MAP.map(([, , key]) => valueOf(key)).join("\t")} title="Copy for Excel"
          successMessage="Copied — paste starting at column A" />
      </Card>
      {renderExcelTable("Top half", EXCEL_COLUMN_MAP.slice(0, 17))}
      {renderExcelTable("Bottom half", EXCEL_COLUMN_MAP.slice(17))}
      {/* Dev side (FEATURES.remarkPickersAbove): the two pickers stand in their
          own row directly ABOVE the two remark cards, Sales Name left and Admin
          Name right, because both sentences below show the selected value --
          inside one of the two cards the picker reads as signing that card
          alone. The wrapper repeats the remark grid exactly, so each picker
          sits over the card its name appears in. Admin draws them inside the
          cards instead and renders nothing here. */}
      {/* `relative z-30` is load-bearing, not spacing. Card carries `panel-rise`,
          an animation filled `both` that ends on `transform: translateY(0)` --
          a non-`none` transform, so EVERY Card is its own stacking context and
          an open dropdown's z-20 is capped inside the card it was opened in.
          The remark cards come later in the DOM and painted straight over the
          expanded list. Lifting this whole row is the only fix; no z-index on
          the panel itself can climb out of its card. */}
      {FEATURES.remarkPickersAbove && (
        <div className="relative z-30 grid grid-cols-1 xl:grid-cols-2 gap-5 items-start">
          <Card className="grid grid-cols-6 gap-2 p-3 text-sm">{buyerNamePicker}</Card>
          <Card className="grid grid-cols-6 gap-2 p-3 text-sm">{FEATURES.btbAdminName && adminNamePicker}</Card>
        </div>
      )}
      <div className="grid grid-cols-1 xl:grid-cols-2 gap-5 items-start">
        <Card className="grid grid-cols-6 gap-2 p-3 text-sm">
          <div className="col-span-6 flex justify-between items-center"><div className="fs-18-19 font-bold text-[var(--ink)]">To Supplier Remark</div>
            <CopyIconButton text={supplierRemarkText} title="Copy remark" /></div>
          {/* Drawn here on the dev side only -- the Admin side draws the same
              picker on the BTB Remark card instead (FEATURES.buyerNameOnBtbCard),
              which is where it started. It is labelled either way: here it
              stands beside Case Type, and there it stands beside Admin Name, so
              on both cards there is a second control to be told apart from. The
              same selection still signs both sentences wherever it is drawn. */}
          {!FEATURES.buyerNameOnBtbCard && !FEATURES.remarkPickersAbove && buyerNamePicker}
          <div className="col-span-6 fs-12-19 font-bold text-[var(--muted)]">Case Type</div>
          <div className="col-span-6 flex gap-2">{TO_SUPPLIER_CASE_TYPES.map(opt => <button key={opt} onClick={() => selectSupplierOption(opt)}
            className={`px-3.5 py-1.5 rounded-full border-[1.5px] fs-12-19 font-semibold ui-transition pressable ${supplierOption === opt ? "bg-[#FFF4DE] border-[var(--orange)] text-[var(--orange-dark)]" : "bg-[var(--surface-soft)] border-[var(--line)] text-[var(--muted)]"}`}>{opt}</button>)}</div>
          <textarea value={supplierRemarkText} onChange={e => setSupplierRemarkText(e.target.value)} rows={11}
            placeholder="Pick a case type above, or type the remark manually."
            className="col-span-6 w-full px-3 py-2 fs-14-19 text-[var(--ink)] rounded-xl border-[1.5px] border-[var(--line)] bg-white outline-none focus:border-[var(--orange)] resize-y" />
        </Card>
        <Card className="grid grid-cols-6 gap-2 p-3 text-sm">
          <div className="col-span-6 flex justify-between items-center"><div className="fs-18-19 font-bold text-[var(--ink)]">BTB Remark (To Buyer)</div>
            <CopyIconButton text={btbRemarkText} title="Copy remark" /></div>
          {/* Back on this card on the Admin side, beside Admin Name. The two
              labels are what keep them apart -- this card's sentence names two
              different people, so an unlabelled pair would be unreadable. On
              dev this renders nothing and the picker stays on the To Supplier
              card. */}
          {FEATURES.buyerNameOnBtbCard && !FEATURES.remarkPickersAbove && buyerNamePicker}
          {FEATURES.btbAdminName && !FEATURES.remarkPickersAbove && adminNamePicker}
          <textarea value={btbRemarkText} onChange={e => setBtbRemarkText(e.target.value)} rows={11}
            placeholder={FEATURES.buyerNameOnBtbCard || FEATURES.remarkPickersAbove
              ? "Select a Sales Name above, or type the remark manually."
              : "Select a Sales Name on the To Supplier Remark card, or type the remark manually."}
            className="col-span-6 w-full px-3 py-2 fs-14-19 text-[var(--ink)] rounded-xl border-[1.5px] border-[var(--line)] bg-white outline-none focus:border-[var(--orange)] resize-y" />
        </Card>
      </div>
    </div>
  </React.Fragment>;
}

function VerifyPage({ attachments, fields, manualChecks, toggleManualCheck, goUpload, goSave, demoMode, adminMode, itemRecordIds, saveStatus, saving, savedRecordId, crosschecks, dismissedDiffs, toggleDismissDiff, openViewer, itemIndex, selectItem }) {
  const items = recordsBearingEntry(attachments) || [];
  const collidedItems = (itemRecordIds || []).filter(x => x.collided);
  // itemRecordIds is [] for a single-item ATQ, so this is 0 or >= 2, never 1 --
  // there is nothing to warn about when the email's ATQ holds one item.
  const itemsSharingThisAtq = (itemRecordIds || []).length;
  const plannedRecordId = ((itemRecordIds || [])[itemIndex] || {}).recordId || "";
  // "Item N" for the panel's failure line -- 1-based position in itemRecordIds,
  // the same order savePlans built its payloads in. Falls back to just the
  // Record_ID when there is no multi-item list to place it in (a single-record
  // save failing has no "Item N" to name).
  const failedItemLabel = saveStatus && saveStatus.failedRecordId != null
    ? (() => {
        const idx = (itemRecordIds || []).findIndex(x => x.recordId === saveStatus.failedRecordId);
        return idx >= 0 ? `Item ${idx + 1} (${saveStatus.failedRecordId})` : saveStatus.failedRecordId;
      })()
    : null;
  const parsedCount = Object.values(attachments).filter(a => a.parsed).length;
  const attachmentsOk = ATTACHMENT_TYPES.every(t => attachments[t] && attachments[t].parsed);

  // Three outcomes, not two. `ok` means genuinely cross-checked and agreeing;
  // amber means documents disagree; `weak` means there was nothing to compare,
  // which must not wear the same green as a check that actually ran.
  const autoChecks = AUTO_CHECK_GROUPS.map(({ label, keys }) => {
    const present = keys.map(k => crosschecks[k]).filter(Boolean);
    // A pair is what "cross-checked" means: two different roles that both spoke.
    // The old test was diff.sourceCount > 1, which counted an ATQ's PDF print
    // and the workbook behind it as two documents corroborating each other and
    // turned a slot agreeing with itself into a green cross-document check.
    const compared = present.filter(cc => cc.pairs.length > 0 || cc.intra.length > 0);
    const live = compared.filter(cc => !dismissedDiffs.has(cc.dismissKey));
    const waved = compared.filter(cc => dismissedDiffs.has(cc.dismissKey));
    const bad = live.filter(cc => cc.severity === "different");
    const soft = live.filter(cc => cc.severity === "similar");
    if (bad.length) {
      return { label, ok: false, rows: bad.concat(soft),
        desc: bad.map(cc => cc.label + " — " + crosscheckSentence(cc)).join(" ") };
    }
    if (!compared.length) {
      return { label, ok: false, weak: true, rows: [],
        // Not lowercased: FIELD_LABELS holds "HKD" and "ATQ Ref. No.", which
        // become "hkd" and "atq ref. no." the moment you try to make the
        // sentence flow.
        desc: present.length
          ? "Only one document reports " + joinLabels(present) + " — nothing to cross-check"
          : "No document reported this field" };
    }
    // A dismissed conflict is resolved, not unexamined, so the row passes --
    // otherwise one known-bad OCR read jams the page forever. It says so out
    // loud rather than quietly turning green.
    const parts = [];
    // A group is several fields, and they are not all cross-checked just
    // because one of them was. "Reference numbers" holds four keys; if three
    // agree across documents and the fourth is reported by one slot only, the
    // row is green and the fourth field is sitting inside it uncorroborated.
    // Name it, or the green covers for it.
    const uncompared = present.filter(cc => compared.indexOf(cc) < 0);
    // Counted in documents that actually took part, not in sources: a source is
    // a record or a sub-document too, so sourceCount says four where two files
    // were read.
    if (live.length) parts.push("Agrees across " +
      Math.max.apply(null, live.map(cc => crosscheckDocKeys(cc).length)) + " documents");
    // Each soft row says why it is soft: "wording" is right for CENTRE vs CTR
    // and wrong for a cell that lists every vendor on the workbook.
    if (soft.length) parts.push(soft.map(cc =>
      cc.label + " " + ((cc.pairs.filter(p => p.severity === "similar")[0] || {}).softReason || "differs only in wording")).join("; "));
    if (waved.length) parts.push(joinLabels(waved) + " conflict dismissed by reviewer");
    if (uncompared.length) parts.push(joinLabels(uncompared) +
      (uncompared.length > 1 ? " were" : " was") + " not cross-checked — only one document reports " +
      (uncompared.length > 1 ? "them" : "it"));
    return { label, ok: true, rows: soft, desc: parts.join(" — ") };
  }).concat([
    { label: "Attachments:", ok: attachmentsOk, rows: [],
      desc: `${parsedCount}/${ATTACHMENT_TYPES.length} types parsed` +
        (attachmentsOk ? "" : " — some still missing") },
  ]);

  const passCount = autoChecks.filter(c => c.ok).length;
  const dismissedList = dismissedCrosscheckList(crosschecks, dismissedDiffs);
  const allManualChecked = manualChecks.every(Boolean);

  const viewDiff = (cc) => {
    const s = crosscheckDissent(cc);
    if (s) openViewer(s.typeKey, s.docIndex);
  };

  return (
    <React.Fragment>
      <TopBar title="Save Check" desc="Confirm the checks and save the record"
        right={<React.Fragment>
          {adminMode && <Pill className="bg-[#FFF4DE] text-[var(--orange-dark)]">Admin bypass</Pill>}
          <Pill className={passCount === autoChecks.length ? "bg-[#DCFCE7] text-[var(--green)]" : "bg-[#FEF3C7] text-[var(--amber)]"}>{passCount}/{autoChecks.length} checks pass</Pill>
          <GhostButton onClick={goUpload}>← Upload</GhostButton>
          {/* No title= here: PrimaryButton does not forward one, so a tooltip
              would silently do nothing. The panel below says which record was
              saved and why the button is closed. */}
          <PrimaryButton disabled={saving || !!savedRecordId || (!adminMode && !allManualChecked)} onClick={goSave}>
            {saving ? "Saving..." : savedRecordId ? "Saved" : "Save to master"}</PrimaryButton>
        </React.Fragment>} />

      <div className="flex flex-col md:flex-row gap-6 px-5 md:px-8 pb-8 items-stretch md:items-start">
        <div className="flex-1 flex flex-col gap-5">
          <Card className="w-full p-6 flex flex-col gap-3.5">
            {items.length > 1 && (
              <div className="flex gap-2 flex-wrap">
                {items.map((rec, i) => {
                  const active = i === itemIndex;
                  return (
                    <button key={i} onClick={() => selectItem(i)}
                      className={`flex items-center gap-[7px] px-3.5 py-2 rounded-full border-[1.5px] ui-transition pressable
                        ${active ? "bg-[#FBF0E8] border-[#D4916E]" : "bg-[#F3EBE2] border-[#C5BEB6]"}`}>
                      <span className={`text-xs font-semibold ${active ? "text-[#D4916E]" : "text-[#6B6B6B]"}`}>Item {i + 1}</span>
                    </button>
                  );
                })}
              </div>
            )}
            <div className="flex justify-between items-center">
              <div className="text-lg font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Automatic Checks</div>
              <Pill className={passCount === autoChecks.length ? "bg-[#E8F5EC] text-[#3D8B5F]" : "bg-[#FDF6E0] text-[#B78312]"}>{passCount}/{autoChecks.length} pass</Pill>
            </div>
            {autoChecks.map((c, i) => {
              const tone = c.ok ? "text-[#3D8B5F]" : c.weak ? "text-[#6B6B6B]" : "text-[#B78312]";
              return (
                <div key={i} className={`flex items-start gap-2.5 px-3.5 py-3 rounded-lg
                  ${c.ok ? "bg-[#E8F5EC]" : c.weak ? "bg-[#F3EBE2]" : "bg-[#FDF6E0]"}` }>
                  <div className={`shrink-0 leading-5 ${tone}`}>{c.ok ? "✓" : c.weak ? "–" : "!"}</div>
                  <div className="flex-1 min-w-0 flex flex-col gap-1.5">
                    <div className="flex flex-wrap gap-x-1.5 items-baseline">
                      <span className={`text-[13px] font-bold ${tone}`}>{c.label}</span>
                      <span className="text-[13px] text-[#3D3D3D]">{c.desc}</span>
                    </div>
                    {/* One line per pair of documents that was actually
                        compared, naming the two roles before the two values.
                        Pairs a reviewer can act on: each names a document to
                        open or to cite in the reply. */}
                    {c.rows.map(cc => (
                      <div key={cc.key} className="flex items-start gap-3">
                        <div className="flex-1 min-w-0 flex flex-col gap-1">
                          <div className="text-[11px] font-bold text-[#3D3D3D]">{cc.label}</div>
                          {cc.pairs.map(p => (
                            <div key={p.key} className="flex items-baseline gap-1.5 flex-wrap">
                              <span className={`shrink-0 w-3 text-[12px] font-bold leading-[17px]
                                ${p.agrees ? "text-[#3D8B5F]" : p.severity === "similar" ? "text-[#A39B92]" : "text-[#B78312]"}`}>
                                {p.agrees ? "=" : p.severity === "similar" ? "≈" : "≠"}
                              </span>
                              <span className="shrink-0 text-[11px] font-semibold leading-[17px] text-[#3D3D3D]">
                                {p.a.label} vs {p.b.label}
                              </span>
                              <span className="text-[12px] leading-[17px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>
                                {p.agrees
                                  ? <React.Fragment>both say <span className="font-semibold text-[#1A1A1A]">{p.aValue}</span></React.Fragment>
                                  : <React.Fragment>
                                      <span className="font-semibold text-[#1A1A1A]">{p.aValue}</span>
                                      {" vs "}
                                      <span className="font-semibold text-[#1A1A1A]">{p.bValue}</span>
                                      {p.softReason ? " — " + p.softReason : ""}
                                    </React.Fragment>}
                              </span>
                            </div>
                          ))}
                          {/* Two documents sharing one slot that contradict each
                              other. Not a pair, and not something to hide. */}
                          {cc.intra.map(x => (
                            <div key={x.role.key} className="flex items-baseline gap-1.5 flex-wrap">
                              <span className="shrink-0 w-3 text-[12px] font-bold leading-[17px] text-[#B78312]">!</span>
                              <span className="shrink-0 text-[11px] font-semibold leading-[17px] text-[#3D3D3D]">
                                {x.role.label} disagrees with itself
                              </span>
                              <span className="text-[12px] leading-[17px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>
                                {x.values.join(" vs ")}
                              </span>
                            </div>
                          ))}
                          {/* The roles that could not take part, said out loud
                              rather than left as a line that silently is not
                              there. */}
                          {DOC_ROLES.filter(r => cc.roles[r.key].state !== "speaks").length > 0 && (
                            <div className="text-[11px] leading-[16px] text-[#A39B92]" style={{fontFamily:"Newsreader, serif"}}>
                              Not cross-checked: {DOC_ROLES.filter(r => cc.roles[r.key].state !== "speaks")
                                .map(r => r.label + " (" + (cc.roles[r.key].state === "silent" ? "does not mention it"
                                  : cc.roles[r.key].state === "promoted" ? "signed, listed under Agreement"
                                  : "not in this upload") + ")").join("; ")}
                            </div>
                          )}
                        </div>
                        <button onClick={() => viewDiff(cc)}
                          className="shrink-0 text-[12px] font-semibold text-[#B78312] hover:underline whitespace-nowrap">
                          View documents →
                        </button>
                        {/* An OCR misread must not be able to block the gate
                            forever; dismissing is per-value, so a later, real
                            conflict comes back on its own. */}
                        <button onClick={() => toggleDismissDiff(cc.dismissKey)}
                          className="shrink-0 text-[12px] text-[#6B6B6B] hover:text-[#3D3D3D] whitespace-nowrap">
                          Dismiss
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
            {dismissedList.length > 0 && (
              <div className="flex flex-wrap items-center gap-2 pt-0.5">
                <span className="text-[11px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>Dismissed:</span>
                {dismissedList.map(d => (
                  <button key={d.dismissKey} onClick={() => toggleDismissDiff(d.dismissKey)}
                    className="px-2.5 py-[3px] rounded-full text-[11px] bg-[#F3EBE2] text-[#6B6B6B] hover:text-[#B78312]">
                    {d.label} ↺ restore
                  </button>
                ))}
              </div>
            )}
          </Card>

          {/* TEMPORARY, paired with savePlans' narrowing: one upload writes one
              record. Said on screen rather than left to the disabled button,
              because "Save is greyed out" and "this ATQ has another item that
              still needs saving" are the same pixel otherwise, and only one of
              them is a problem the reviewer can act on. */}
          {(savedRecordId || itemsSharingThisAtq > 1) && (
            <div className={"w-full flex gap-2 px-4 py-3 border-l-4 rounded-lg " +
              (savedRecordId ? "bg-[#E8F5EC] border-[#3D8B5F]" : "bg-[#FDF6E0] border-[#B78312]")}>
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                {savedRecordId ? (
                  <React.Fragment>
                    <span className="font-bold text-[#3D8B5F]">✓ Saved {savedRecordId}.</span>{" "}
                    This upload writes one record. Switching Item tab will not save again —
                    press <span className="font-semibold">+ New Record</span> and drop that item's own email.
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <span className="font-bold">This ATQ covers {itemsSharingThisAtq} items.</span>{" "}
                    Save writes one record{plannedRecordId ? " — " + plannedRecordId : ""}, for the item selected above.
                    The other {itemsSharingThisAtq - 1 > 1 ? "items each need their own email" : "item needs its own email"}.
                  </React.Fragment>
                )}
              </div>
            </div>
          )}

          {/* A collision means two items would silently overwrite each
              other's primary name column in Dataverse. Named here, not just
              disambiguated behind the scenes -- a reviewer who sees "-a"/"-b"
              land on the record without knowing why has no way to tell
              whether that was intended. */}
          {collidedItems.length > 0 && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FDF6E0] border-l-4 border-[#B78312] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                <span className="font-bold">Record_ID collision:</span> {collidedItems.length} item{collidedItems.length > 1 ? "s" : ""} would
                have shared the same Record_ID and {collidedItems.length > 1 ? "were" : "was"} given a suffix to keep them distinct —
                {" "}{collidedItems.map(x => x.recordId).join(", ")}.
              </div>
            </div>
          )}

          {/* Replaces the old alert() on a partial Save failure. Sequential
              writes mean everything before the failure already reached
              Dataverse and stays there -- no rollback -- so this says what
              is safe (already saved, will be skipped on retry) and what
              still needs fixing. */}
          {saveStatus && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[#B23B3B]">Save failed partway through.</span>{" "}
                Saved {saveStatus.savedCount}/{saveStatus.total}.
                {failedItemLabel ? ` ${failedItemLabel} failed: ${saveStatus.message}` : ` ${saveStatus.message}`}
                {" "}The {saveStatus.savedCount} already saved {saveStatus.savedCount === 1 ? "is" : "are"} kept — fix the issue and press
                Save again; what already saved will be skipped automatically.
              </div>
            </div>
          )}

          <Card className="w-full p-6 flex flex-col gap-3.5">
            <div className="text-lg font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Manual Confirmation</div>
            {MANUAL_CHECK_LABELS.map((label, i) => (
              <label key={i} className="flex items-center gap-3 py-2.5 border-b border-[#C5BEB6] last:border-b-0 cursor-pointer">
                <input type="checkbox" checked={manualChecks[i]} onChange={() => toggleManualCheck(i)}
                  className="w-[18px] h-[18px] accent-[#3D8B5F] rounded-md border-[1.5px] border-[#C5BEB6]" />
                <span className="flex-1 text-[13.5px] text-[#1A1A1A]">{label}</span>
              </label>
            ))}
          </Card>

          <div className="w-full flex gap-2 px-4 py-3 bg-[#FDF6E0] border-l-4 border-[#B78312] rounded-lg">
            <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
              If any document is wrong → reply the original RPA email to clear the alert. Do not save the record.
            </div>
          </div>
        </div>

        <div className="w-full md:w-[280px] md:shrink-0 flex flex-col gap-4">
          <Card className="p-5 flex flex-col gap-3">
            <div className="text-[15px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Attachment Status</div>
            {ATTACHMENT_STATUS_ROWS.map(([label, key]) => {
              const ok = attachments[key].parsed;
              return (
                <div key={key} className="flex justify-between items-center py-2 border-b border-[#C5BEB6] last:border-b-0">
                  <span className="text-[13px] text-[#3D3D3D]">{label}</span>
                  <Pill className={ok ? "bg-[#E8F5EC] text-[#3D8B5F]" : "bg-[#FDECEB] text-[#C0392B]"}>{ok ? "Parsed" : "Missing"}</Pill>
                </div>
              );
            })}
          </Card>

          <Card className="p-5 flex flex-col gap-3">
            <div className="text-[15px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Record Snapshot</div>
            {[["Customer", fields.customerName.value], ["Amount", ((fields.currency && fields.currency.value) || "HKD") + " " + fields.hkd.value], ["Contract No.", fields.contractNo.value],
              ["Vendor", fields.vendor.value], ["Period", demoMode ? DEMO_PERIOD : EMPTY_PERIOD], ["SB Entity", demoMode ? DEMO_SB_ENTITY : EMPTY_SB_ENTITY]].map(([k,v]) => (
              <div key={k} className="flex flex-col gap-0.5 py-1.5 border-b border-[#C5BEB6] last:border-b-0">
                <span className="text-[11px] text-[#6B6B6B]">{k}</span>
                <span className="text-[13px] font-semibold text-[#1A1A1A]">{v}</span>
              </div>
            ))}
          </Card>

          <div className="w-full flex gap-2 p-3.5 bg-[#F4F0E8] border border-[#D8D3C9] rounded-lg">
            <div className="text-[#D4916E]">💡</div>
            <div className="flex-1 text-xs leading-[18px] text-[var(--muted)]">Tick all manual items before saving the record.</div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------- Master Records page ----------

   Merged in from the standalone "PR Assistant App_MasterRecords.html" so the
   two stop being two files with two version numbers: this app is now the one
   script, and the admin_MasterRecords.html web resource serves IT (see
   MODE_BY_RESOURCE above). What that file had and the old RecordsPage here
   did not: the Manage modal, the approval threshold matrix, the workflow
   stepper and tabs, per-column sorting, and the Dataverse WRITES behind them.

   One thing changed on the way in, and it is not cosmetic. The standalone
   file carried its own second copy of every admin_btb_lis_excel_datas column
   NAME, hard-coded, beside the copy in DATAVERSE_SCHEMAS -- and the two copies
   DISAGREED about the two Invoice columns. The standalone's short names
   (admin_invoicex0020x0023x0020x002, admin_invoicex0020x002fx0020dnx2) are the
   real ones; DATAVERSE_SCHEMAS carried longer spellings that do not exist on
   the table, which made the whole Master Records $select fail with "Could not
   find a property named ..." and left the list empty as though nothing had
   ever been saved. Dataverse truncates these encoded names -- the Admin side's
   own two are short for the same reason -- so a name reading like a complete
   one is not evidence that it is.

   Every column here is therefore looked up through SCHEMA.lis.records by the
   app's own field key, so there is ONE transcription to correct instead of two
   to keep in step, and a key this side has no column for is dropped rather
   than written -- the same rule mapPayload follows. ---------- */

const MASTER_RECORDS_COLUMNS = [
  { key: "status", label: "Status", width: "w-[130px]", cellClassName: "flex items-center gap-1.5",
    render: (r, helpers) => (<React.Fragment>
      <select value={r.status || ""} onClick={e => e.stopPropagation()}
        onChange={e => helpers.onStatusChange(r, e.target.value)}
        aria-label={`Status for ${r.recordId}`}
        className={`text-[12px] font-semibold rounded-full pl-2.5 pr-1.5 py-1 border-0 outline-none cursor-pointer ui-transition ${r.status ? STATUS_STYLES[r.status] : "bg-[#F3EBE2] text-[#6B6B6B]"}`}>
        {!r.status && <option value="">—</option>}
        {Object.values(PR_STATUS_CHOICES).map(label => <option key={label} value={label}>{label}</option>)}
      </select>
      <button type="button" onClick={e => { e.stopPropagation(); helpers.onToggleFlag(r); }}
        title={r.flagged ? "Remove flag" : "Add flag"} aria-label={r.flagged ? "Remove flag" : "Add flag"}
        className={`ui-transition pressable ${r.flagged ? "" : "opacity-25 grayscale hover:opacity-60"}`}>
        🚩
      </button>
    </React.Fragment>),
    exportValue: r => r.status || "" },
  { key: "no", label: "No.", width: "w-[50px]", cellClassName: "text-[14px] text-[#3D3D3D] tabular-nums",
    render: r => r.no, exportValue: r => r.no },
  { key: "recdDate", label: "Rec'd Date", width: "w-[100px]", cellClassName: "text-[13px] text-[#6B6B6B] tabular-nums",
    render: r => r.recdDate, exportValue: r => r.recdDate },
  { key: "poNo", label: "PO No.", width: "w-[110px]", cellClassName: "text-[14px] text-[#3D3D3D]",
    render: r => r.poNo, exportValue: r => r.poNo },
  { key: "uid", label: "UID #", width: "w-[130px]", cellClassName: "text-[14px] text-[#3D3D3D] truncate", defaultVisible: true,
    render: r => r.uid, exportValue: r => r.uid },
  // Computed, not stored -- same evaluateManageWorkflowState the Manage modal's
  // stepper uses, read off the row's already-fetched prNo/poNo/reviewApprovalRaw
  // so this can never disagree with what the modal itself would show for the
  // same record. Colours ported from the reference screen's own 5-stage map.
  { key: "workflowStatus", label: "Workflow Status", width: "w-[170px]", cellClassName: "whitespace-nowrap", defaultVisible: true,
    render: r => {
      const step = masterRecordWorkflowStep(r);
      return (
        <span className={"inline-flex items-center px-3 py-1 rounded-full text-[12px] leading-4 font-bold " +
          (MANAGE_WORKFLOW_BADGE_CLASS[step] || "bg-[#F3EBE2] text-[#6B6B6B]")}>
          {step}
        </span>
      );
    },
    exportValue: r => masterRecordWorkflowStep(r) },
  { key: "recordId", label: "Record ID", width: "w-[140px]", cellClassName: "text-[13px] text-[#6B6B6B] truncate",
    render: r => r.recordId, exportValue: r => r.recordId },
  { key: "customerName", label: "Customer Name", width: "w-[170px]", cellClassName: "text-[14px] font-medium text-[#1A1A1A] truncate", defaultVisible: true,
    render: r => r.customerName, exportValue: r => r.customerName },
  { key: "vendor", label: "Vendor", width: "w-[150px]", cellClassName: "text-[14px] text-[#3D3D3D] truncate", defaultVisible: true,
    render: r => r.vendor, exportValue: r => r.vendor },
  // BTB Type pill -- styling ported from the reference screen (NON-BTB warm,
  // BTB charcoal, unset reads as an explicit "Unset" rather than an em dash
  // so it doesn't look like a formatting glitch).
  { key: "btbType", label: "BTB / NON-BTB", width: "w-[110px]", cellClassName: "whitespace-nowrap", defaultVisible: true,
    render: r => r.btbType
      ? <span className={"inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold " +
          (r.btbType === "NON-BTB" ? "bg-[#FFF3D6] text-[var(--orange-dark)]" : "bg-[var(--charcoal)] text-[var(--graphite)]")}>
          {r.btbType}
        </span>
      : <span className="text-[12px] text-[#8E8E93] italic">Unset</span>,
    exportValue: r => r.btbType || "" },
  // Derived from BTB Type + PR Amount by the approval threshold matrix, never
  // read from or written to Dataverse -- see getDualApprovers. An empty
  // approver reads as an explicit "Not required", not an em dash: "no approval
  // needed" and "nobody has filled this in yet" are opposite answers and must
  // not share a glyph.
  { key: "approver", label: "Approver", width: "w-[110px]", cellClassName: "whitespace-nowrap", defaultVisible: true,
    render: r => {
      const approver = masterRecordApprover(r);
      return approver
        ? <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-[#EDE9FE] text-[#6D28D9]">{approver}</span>
        : <span className="text-[12px] text-[#8E8E93]">Not required</span>;
    },
    exportValue: r => masterRecordApprover(r) || "Not required" },
  { key: "prDescription", label: "PR Description", width: "flex-1 min-w-0", cellClassName: "text-[14px] text-[#3D3D3D] truncate",
    render: r => r.prDescription, exportValue: r => r.prDescription },
  { key: "prNo", label: "PR No.", width: "w-[110px]", cellClassName: "text-[14px] text-[#3D3D3D]",
    render: r => r.prNo, exportValue: r => r.prNo },
  { key: "startDate", label: "Start Date", width: "w-[100px]", cellClassName: "text-[13px] text-[#6B6B6B] tabular-nums",
    render: r => r.startDate, exportValue: r => r.startDate },
  { key: "endDate", label: "End Date", width: "w-[100px]", cellClassName: "text-[13px] text-[#6B6B6B] tabular-nums",
    render: r => r.endDate, exportValue: r => r.endDate },

const MASTER_RECORDS_COLUMNS_STORAGE_KEY = "prAssistant.masterRecords.visibleColumns";

function loadMasterRecordsVisibleColumns() {
  try {
    const raw = window.localStorage.getItem(MASTER_RECORDS_COLUMNS_STORAGE_KEY);

    return MASTER_RECORDS_DEFAULT_COLUMN_KEYS;

/* ---------- The COS control file -- the monthly workbook Master Records hands out ----------

   Procurement keeps one Excel per month ("202608 COS control file_V0 1.xlsx")
   and fills it in by hand. What this button produces is that file with no data
   in it: the 18 headers, their colours, their widths, the borders, the row
   height and the AutoFilter, plus N blank rows whose column A already carries
   the Report Month. Everything else is typed in afterwards.

   Two things about that are deliberate.

   **The workbook is written by hand, not by SheetJS.** The vendored build is
   0.18.5 community, which READS cell styles and does not WRITE them -- an
   `XLSX.writeFile` of this sheet comes out with every header white. A reviewer
   would then re-colour 18 headers every month, which is the whole thing the
   button exists to avoid. So the OOXML parts are strings here and `zipStore`
   packs them with no compression (a stored-entry zip, which Excel opens the
   same as a deflated one) -- about sixty lines, and no new dependency.

   **Report Month is the month BEFORE the one that names the file.** The real
   file is called `202608 ...` and every one of its rows says `2026/07`: the
   August file reports July. `cosReportMonth` is the only place that says so,
   and `cosControlFileName` deliberately does NOT go through it -- picking
   2026/08 has to give the 202608 file, not a 202607 one.

   The colours and widths below are read off the workbook's own styles.xml and
   sheet1.xml, not eyeballed. A header that is nearly the right orange is
   indistinguishable on screen from one that is right. ---------- */

const COS_CONTROL_COLUMNS = [
  { header: "Report Month",              fill: null,     width: 11.42578125 },
  { header: "AO / Input Person Name",    fill: "FF0000", width: 20.42578125, source: "issueBy" },

  // wrong value here reads as an answered cell, which is the failure this
  // codebase refuses everywhere else.
  { header: "Engineering Team",          fill: "92D050", width: 17.85546875 },
  { header: "Product Line",              fill: "92D050", width: 14.7109375 },
  { header: "Issue Type",                fill: "FF0000", width: 8.5703125, fixed: "PO" },
  { header: "PO",                        fill: "FF0000", width: 13, source: "poNo" },
  { header: "MA No.",                    fill: "00B0F0", width: 29, source: "contractNo" },
  { header: "COS Details / Description", fill: "00B0F0", width: 14.42578125, source: "btbType" },
  // The one header with a line break in it. It needs wrapText, which every
  // header cell already has, and a literal newline in the inline string.
  // Column J uses admin_hkdusd (currency) and Column K uses admin_hkd (currency amount).
  { header: "Currency\n(e.g. HKD,USD)",  fill: "FFFF00", width: 19, source: "admin_hkdusd" },
  { header: "Currency Amount",           fill: "FFFF00", width: 13.28515625, numFmt: 4, source: "admin_hkd" },
  // The trailing space is in the real file's header. Kept, so a column pasted
  // against the original lines up character for character.
  { header: "Vendor Invoice Date ",      fill: "FFC000", width: 19.140625, numFmt: 15, fixed: "NIL" },
  { header: "Vendor PO Date",            fill: "FFC000", width: 19.85546875, numFmt: 15, source: "poDate" },
  { header: "CCC",                       fill: "92D050", width: 7.140625, source: "chargeCcc" },
  { header: "WO#",                       fill: "92D050", width: 12.7109375, source: "worksOrderCode" },
  { header: "A/C#",                      fill: "92D050", width: 12.85546875, source: "accountCode" },
  { header: "Vendor Name",               fill: "FF0000", width: 53.5703125, source: "vendor" },
  { header: "UID",                       fill: "00B0F0", width: 34.140625, source: "uid" },

/* Master Records rows -> COS control file rows.

   `source` above is a key on the row objects the Master Records fetch builds
   (see fetchRecordsFromDataverse), NOT a Dataverse column name -- every column
   this reads is already in SCHEMA.lis.records and already read out per row, so
   nothing here transcribes a column name and DATAVERSE_SCHEMAS stays the one
   place that does.

   `fixed` is a literal the form always carries: Issue Type is "PO" and Vendor
   Invoice Date is "NIL", both stated by the user rather than derived.

   The fetch writes an em dash for a column with no value, so an unfilled cell
   would otherwise come out of here carrying one -- a value, in a workbook
   procurement then types into. cosCellText blanks it. */
const COS_EMPTY_CELL = String.fromCharCode(8212);

function cosCellText(v) {
  const s = String(v == null ? "" : v).trim();
  return (s === COS_EMPTY_CELL || s === "-") ? "" : s;
}

function cosControlRowValues(record, columns) {
  const cols = columns || COS_CONTROL_COLUMNS;
  return cols.map(c => {
    if (c.fixed) return c.fixed;
    if (!c.source) return "";
    let val = "";
    if (record) {
      if (record[c.source] !== undefined && record[c.source] !== null && record[c.source] !== "") {
        val = record[c.source];
      } else {
        switch (c.source) {
          case "admin_hkdusd":
          case "currency":
            val = record.admin_hkdusd ?? record.currency ?? record.Currency ?? "";
            break;
          case "admin_hkd":
          case "currencyAmount":
            val = record.admin_hkd ?? record.hkd ?? record.prAmount ?? record.PRAmount ?? "";
            break;
          default:
            val = record[c.source] ?? "";
            break;
        }
      }
    }
    return cosCellText(val);
  });
}

/* Pure, so the harness can check what a row of the workbook would say without
   a browser or a Dataverse. Column A is deliberately NOT filled in here --
   buildCosSheetXml writes the Report Month into it for data rows and blank
   rows alike, so there is one place that says what column A holds. */
function cosControlRowsFrom(records, columns) {
  return (records || []).map(r => cosControlRowValues(r, columns));
}

/* Which Report Month a record belongs to, as "YYYY/MM" -- the same shape
   cosReportMonth hands back, so the two can be compared directly.

   Read off Rec'd Date (admin_recx0027dx0020datex0020), which is what the
   Master Records fetch has already formatted into the row as "22 Jul 2026"
   (fmtLisDate, en-GB and pinned, so the shape does not move with the
   reviewer's locale). The demo rows carry that same spelling, which is why
   this reads the row rather than a raw column nothing but the live fetch
   would have.

   Two shapes, and the ISO one is handled as TEXT on purpose: new Date() takes
   a bare YYYY-MM-DD as UTC midnight, so at a negative offset the 1st of a
   month reads back as the last day of the previous one -- a record filed into
   the month before the one it was received in, silently.

   Anything unreadable -- the fetch's own em dash for an empty column
