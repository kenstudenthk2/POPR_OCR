// is on HKT paper, so HKT is sitting at the top of all of them waiting to be
// mistaken for a party.
//
// Deliberately not a correction. Both values stay, both chips stay clickable,
// and the severity only softens — because HKT genuinely is the customer on an
// internal PCCW requisition, and genuinely is one of the vendors on some ATQ
// items. This can lower a warning; it must never resolve one.
function ourCompanyOnlyDissent(groups) {
  const ours = groups.filter(g => isOurCompanyName(g.norm));
  // Nobody named us, or everybody did — either way the disagreement, if there
  // is one, is about something else.
  if (!ours.length || ours.length === groups.length) return false;
  const rest = groups.filter(g => !isOurCompanyName(g.norm));
  // The documents that name somebody else must all name the SAME somebody.
  // Two real counterparties in disagreement stays a conflict, whatever else is
  // in the pile.
  return new Set(rest.map(g => g.norm)).size === 1;
}

// True when exactly one group lists several parties and every other group names
// one of them. That is one document summarising the others, not a conflict.
function listCoversRest(key, groups) {
  const listed = groups.filter(g => listParts(key, g.value));
  if (listed.length !== 1) return false;
  const parts = listParts(key, listed[0].value);
  return groups.every(g => g === listed[0] ||
    parts.some(p => p === g.norm || tokenJaccard(p, g.norm) >= DIFF_JACCARD_MIN));
}

// Which item a record belongs to, named rather than numbered. A workbook
// narrowed to the items one requisition covers keeps the form's own item
// numbers while its positions differ, so pairing by position compares item 2
// of one document against item 1 of another. Both record producers emit
// "Item No.", so there is a real key to pair on. Module scope because both
// computeFieldDiffs (cross-check) and detectFromRoles (form fill) have to
// agree on which item is live -- two copies of this drifting apart is exactly
// how they end up anchoring on different rows.
function itemNoOf(rec) {
  const f = ((rec && rec.fields) || []).find(x => /^item\s*no\.?$/i.test((x.label || "").trim()));
  const v = f && String(f.value == null ? "" : f.value).trim();
  return v || null;
}

// Which revision the offered items were read from, and which newer one the
// email also carries. The engine stamps `supersededBy` on a kept record when
// its group held a HIGHER revision that was not a workbook -- the measured
// case is a V01 workbook beside a V02 print, where the items are the
// workbook's Cost worksheet (correct: that is the list this requisition
// covers) but the VALUES on them are the ones V02 was issued to change.
//
// Read off the records the selector is actually offering, so a notice can
// never appear for an item nobody can select. Returns "" for `newer` when
// there is nothing to say, which is the overwhelmingly common case.
function supersededRevisionOf(itemRecords) {
  const withNotice = (itemRecords || []).filter(r => r && r.supersededBy);
  if (!withNotice.length) return { current: "", newer: "" };
  const refField = ((withNotice[0].fields) || [])
    .find(x => /^atq\s*ref\.?\s*no\.?$/i.test((x.label || "").trim()));
  return {
    current: (refField && String(refField.value || "").trim()) || "",
    newer: String(withNotice[0].supersededBy || "").trim(),
  };
}

// Record_ID for one item. parseCostItems reads "ATQ Ref. No." as a per-row
// cost-sheet column, so items on the same ATQ can legitimately carry different
// ones -- the record's own value wins when it has one. The PDF-print path
// (atqRecordsFromTables) deliberately does not read that column onto its
// records, so `fallbackBase` exists for that case: the caller has already
// resolved doc-level atqRefNo -> recordNo || contractNo || a session fallback,
// in that order. Kept out of this function so it stays pure and table-driven --
// recordid.test.js calls it directly with fixed inputs, no Date.now() involved.
function recordIdFor(rec, fallbackBase) {
  const refField = ((rec && rec.fields) || []).find(x => /^atq\s*(?:ref(?:erence)?\.?\s*)?(?:no\.?|number|#)?$/i.test((x.label || "").trim()));
  const ownRef = refField && String(refField.value == null ? "" : refField.value).trim();
  const base = (ownRef || String(fallbackBase == null ? "" : fallbackBase).trim());
  const n = itemNoOf(rec);
  return n ? `${base}-${String(n).trim()}` : base;
}

// Disambiguates Record_IDs that would otherwise collide. The ID becomes each
// table's primary name column (admin_title on BTB_LIS_Excel_Datas /
// admin_purchaserequest, admin_title2 on the other three) -- two items
// silently sharing one would have the second overwrite the first's meaning,
// not just its label.
// -a/-b/... in first-seen order; a record_id that nothing else shares is
// untouched, matching today's single-item behaviour exactly.
function assignRecordIds(records, fallbackBase) {
  const list = records || [];
  const ids = list.map(rec => recordIdFor(rec, fallbackBase));
  const counts = {};
  ids.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
  const seen = {};
  return list.map((rec, i) => {
    const id = ids[i];
    if (counts[id] <= 1) return { rec, recordId: id, collided: false };
    seen[id] = (seen[id] || 0) + 1;
    const suffix = String.fromCharCode(96 + seen[id]); // a, b, c...
    return { rec, recordId: `${id}-${suffix}`, collided: true };
  });
}

// Which of an ATQ's items an email is about. Procurement sends ONE email per
// item, so this is the subject's real authority: it does not fill a value --
// the Cost worksheet stays the document of record for every one of those -- it
// decides which record's values are the ones under review.
//
// 0 for anything it cannot resolve, which is exactly the old behaviour: a
// subject with no item marker, an upload that is not an email, or an item
// number no record carries. An unmatched number is deliberately NOT treated as
// a near miss to fall back from -- landing on the wrong item is worse than
// landing on the first, because every value on the page then belongs to
// something the reviewer did not ask about and nothing says so.
//
// Compared numerically when both sides look like numbers: a workbook can hand
// back "10" or "10.0" for the same cell, and a string compare would call the
// email a stranger to its own item.
function itemIndexForSubject(records, subject) {
  const wanted = subject && subject.itemNo;
  const list = records || [];
  if (!wanted || !list.length) return 0;
  const same = (a, b) => {
    if (a == null || b == null) return false;
    const na = Number(a), nb = Number(b);
    if (isFinite(na) && isFinite(nb) && String(a).trim() !== "" && String(b).trim() !== "") return na === nb;
    return String(a).trim() === String(b).trim();
  };
  const i = list.findIndex(r => same(itemNoOf(r), wanted));
  return i < 0 ? 0 : i;
}

// The Record_ID one item will actually be saved under, read off the same
// savePlans list goSave writes from rather than recomputed from the records.
// A preview that did its own arithmetic would be free to disagree with what is
// saved, and being trusted about that is the entire job of the row that shows
// it -- including the -a/-b suffix assignRecordIds adds on a collision, which a
// recomputation from recordIdFor alone would silently drop.
//
// Clamped rather than indexed blind: a single-item upload has exactly one plan
// whatever the item tab says, and an item tab can outlive the records behind it
// for a render.
function recordIdForItem(savePlans, itemIndex) {
  const list = savePlans || [];
  if (!list.length) return "";
  const i = Math.min(Math.max(Math.floor(itemIndex) || 0, 0), list.length - 1);
  return (list[i] && list[i].recordId) || "";
}

// What Save will write, as a list of plans. Pure for the same reason
// buildRecordPayload is: goSave's create loop cannot be exercised under the
// harness, so the arithmetic it writes from has to be testable without one.
//
// TEMPORARY, and deliberately narrower than the end state: an ATQ covering
// "Item 2 & 3" really is TWO Dataverse records, and procurement sends one email
// per item to produce them. Until that per-item flow is finished the list is
// always length 1 -- the item on screen. goSave still loops over whatever it is
// given, so restoring per-item saves is this function and the savedRecordId
// lock in App, nothing else.
//
// assignRecordIds still runs over EVERY item before the pick. Its -a/-b
// collision suffix is only correct against the whole set, so narrowing the
// input rather than the output would hand item 2 an id that silently overwrites
// item 3's in Dataverse.
function planSavesForItem(itemRecords, fallbackBase, itemIndex, fields, itemPlans) {
  const list = itemRecords || [];
  if (list.length < 2) {
    const rec = list[0];
    return [{ fieldsSnapshot: fields, recordId: rec ? recordIdFor(rec, fallbackBase) : fallbackBase }];
  }
  const all = assignRecordIds(list, fallbackBase);
  // Clamped, not indexed blind: an item tab can outlive the records behind it
  // for a render, and an out-of-range index would otherwise read undefined and
  // save a record with no id at all.
  const i = Math.min(Math.max(Math.floor(itemIndex) || 0, 0), all.length - 1);
  return [{ fieldsSnapshot: (itemPlans || {})[i] || fields, recordId: all[i].recordId }];
}

// The one Record_ID this upload has already written, or "" if it has written
// none. TEMPORARY, the other half of planSavesForItem's narrowing: one upload
// writes one record, and switching to another Item tab does not earn a second
// write.
//
// Derived from savedRecordIds rather than kept as its own flag, so there is a
// single answer to "has this upload written anything" and no way for the two to
// disagree. resetRecordData / toggleDemo already clear that map, which is
// exactly when a new record legitimately starts. A FAILED save never reaches
// the map, so the lock stays open and the retry still works.
// `currentRecordId` is OPTIONAL and defaults to the old behaviour, the same
// rule every other widened helper in this file follows (buildBtbRemark's
// adminName, openViewer's page/only): called with one argument this still
// answers "has this upload written ANYTHING".
//
// Passed a Record_ID, the lock becomes PER ITEM instead. That is what "Process
// Another Item" on LIS & Remark needs: one procurement email carries the
// documents for every item its ATQ covers, so a reviewer who has saved item 2
// goes back to the Document Workbench and starts item 3 -- under a different
// Record_ID, which the whole-upload lock would refuse to let them save.
// savedRecordIds itself is untouched and still keyed by recordId, so goSave's
// retry-after-partial-failure guard is unchanged and item 2 stays recorded as
// written.
function savedRecordIdOf(savedRecordIds, currentRecordId) {
  const map = savedRecordIds || {};
  if (currentRecordId) return map[currentRecordId] ? currentRecordId : "";
  return Object.keys(map)[0] || "";
}

// The LIS & Remark item picker: every purchased item this ATQ covers, each
// carrying the Record_ID it would be saved under and whether that record has
// already been written.
//
// `done` is derived from savedRecordIds -- the same map savedRecordIdOf reads
// -- rather than kept as a second flag, so "is this item finished" has one
// answer and no way for the two to disagree.
//
// Deliberately SAVED and not merely started: an item whose Start created a
// BTB_LIS_Excel_Datas stub but whose Save never landed is exactly the item a
// reviewer still has to come back to, and greying it out would strand it with
// Checks whether a saved or Dataverse master record represents the same ATQ line item.
// Matches by exact recordId, or by matching the same ATQ no (admin_atqno /
// recordId prefix) AND matching the item number (admin_itemno / recordId suffix).
// Cancelled records do not count as active processed items.
function isRecordMatchItem(r, currentAtqNo, itemNo, recordId) {
  if (!r) return false;
  if (r.status === "Cancelled" || r.status === "Cancel") return false;

  // Direct match by recordId
  if (recordId && (r.recordId === recordId || r.id === recordId)) return true;

  // Match by same ATQ no and Item No
  if (currentAtqNo) {
    const normTargetAtq = normRef(currentAtqNo);
    const rAtq = (r.atqNo && r.atqNo !== "—") ? r.atqNo : "";
    const normRAtq = rAtq ? normRef(rAtq) : null;
    const rRecId = String(r.recordId || r.id || "");
    const normRRecId = rRecId ? normRef(rRecId) : null;

    const atqMatches = (normRAtq && normTargetAtq && normRAtq === normTargetAtq) ||
      (normRRecId && normTargetAtq && (normRRecId === normTargetAtq || normRRecId.startsWith(normTargetAtq)));

    if (atqMatches) {
      const rItemNo = (r.itemNo && r.itemNo !== "—") ? String(r.itemNo).trim() : "";
      if (rItemNo && itemNo) {
        if (normRef(rItemNo) === normRef(itemNo) || (isFinite(Number(rItemNo)) && isFinite(Number(itemNo)) && Number(rItemNo) === Number(itemNo))) {
          return true;
        }
      }
      if (itemNo && rRecId) {
        const itemPattern = new RegExp('[-_]' + itemNo + '(?:-[a-z])?$', 'i');
        if (itemPattern.test(rRecId)) return true;
      }
    }
  }

  return false;
}

// Resolves the current ATQ reference number from form fields, attachment records, or fallback.
function currentAtqNoOf(fields, attachments) {
  const fromField = (fields && fields.atqRefNo && fields.atqRefNo.value) ? String(fields.atqRefNo.value).trim() : "";
  if (fromField) return fromField;
  const itemRecords = recordsBearingEntry(attachments);
  if (itemRecords && itemRecords.length) {
    for (const rec of itemRecords) {
      const refField = ((rec && rec.fields) || []).find(x => /^atq\s*(?:ref(?:erence)?\.?\s*)?(?:no\.?|number|#)?$/i.test((x.label || "").trim()));
      if (refField && refField.value && String(refField.value).trim()) {
        return String(refField.value).trim();
      }
    }
  }
  // Check if any attachment fileName carries an ATQ reference
  for (const typeKey of ATTACHMENT_TYPES) {
    const fn = (attachments && attachments[typeKey] && attachments[typeKey].file) || "";
    const m = fn.match(/\b(ATQ[-\s]?\d+[-\s]?\d+)\b/i);
    if (m) return m[1].replace(/\s+/g, "-").toUpperCase();
  }
  return "";
}

// Derives the options for the ATQ line items on Document Workbench and LIS & Remark.
// When filterEnabled is true (active only when returning via "Process Another Item"),
// an item is marked `done` (disabled) if:
// 1. It is recorded in savedRecordIds (saved in current session);
// 2. It is recorded in lisStartWritten (started in current session);
// 3. It is in processedItems (tracked by recordId or ATQ_Item key);
// 4. Or it exists in `records` (Dataverse) matching the SAME ATQ no and same Item No.
// When filterEnabled is false (processing a new record), all items remain enabled.
// Single-item uploads without a distinct recordId are never marked done.
function itemProcessOptions(itemRecords, itemRecordIds, savedRecordIds, records, currentAtqNo, lisStartWritten, filterEnabled = true, processedItems = {}) {
  const list = itemRecords || [];
  const ids = itemRecordIds || [];
  const saved = (filterEnabled && savedRecordIds) ? savedRecordIds : {};
  const started = (filterEnabled && lisStartWritten) ? lisStartWritten : {};
  const proc = (filterEnabled && processedItems) ? processedItems : {};
  const recList = (filterEnabled && Array.isArray(records)) ? records : [];
  const targetAtq = (filterEnabled && currentAtqNo) ? (currentAtqNo || "").trim() : "";

  return list.map((rec, i) => {
    const itemNo = itemNoOf(rec);
    const displayItemNo = itemNo || String(i + 1);
    const recordId = (ids[i] || {}).recordId || "";
    // An item with no Record_ID of its own is never done (single-item upload)
    if (!recordId && list.length <= 1) {
      return {
        index: i,
        label: "Item 1",
        recordId: "",
        done: false,
      };
    }
    const refField = ((rec && rec.fields) || []).find(x => /^atq\s*(?:ref(?:erence)?\.?\s*)?(?:no\.?|number|#)?$/i.test((x.label || "").trim()));
    const ownRef = refField && String(refField.value == null ? "" : refField.value).trim();
    const effectiveAtq = targetAtq || ownRef || (recordId ? recordId.replace(/-\d+.*$/, "") : "");

    const isSaved = filterEnabled ? !!(recordId && saved[recordId]) : false;
    const isStarted = !!(recordId && started[recordId]);
    const atqItemKey = effectiveAtq ? (normRef(effectiveAtq) + "_" + String(displayItemNo).trim()) : "";
    const isProc = filterEnabled ? !!((recordId && proc[recordId]) || (atqItemKey && proc[atqItemKey])) : false;
    const isDataverseProcessed = filterEnabled && recList.some(r => isRecordMatchItem(r, effectiveAtq, displayItemNo, recordId));
    const done = isSaved || isStarted || isProc || isDataverseProcessed;

    return {
      index: i,
      label: itemNo ? "Item " + itemNo : "Item " + (i + 1),
      recordId: recordId,
      done: done,
    };
  });
}

// The first ATTACHMENT_TYPES entry carrying multi-item ATQ records -- the same
// scan anchorRecordsOf does below, factored out because Record_ID assignment
// needs it too and the two must never disagree about which attachment holds
// "the items."
function recordsBearingEntry(attachments) {
  for (const typeKey of ATTACHMENT_TYPES) {
    const recs = attachments && attachments[typeKey] && attachments[typeKey].records;
    if (recs && recs.length) return recs;
  }
  return null;
}

// doc-level atqRefNo -> recordNo || contractNo || sessionFallback, the second
// and third tiers of the Record_ID fallback chain (the first, a record's own
// ATQ Ref. No., is recordIdFor's job). `fieldsSrc` is whatever fields object
// is live for the item in question -- the shared form state, or one item's
// own itemPlans snapshot.
function fallbackBaseFor(fieldsSrc, sessionFallback) {
  const v = key => (fieldsSrc[key] && fieldsSrc[key].value) ? String(fieldsSrc[key].value).trim() : "";
  return v("atqRefNo") || v("recordNo") || v("contractNo") || sessionFallback;
}

function parseDecimal(v) {
  if (!v) return null;
  const num = parseFloat(String(v).replace(/[^0-9.-]/g, ""));
  return isNaN(num) ? null : num;
}

function parseIsoDate(v) {
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d.toISOString().split("T")[0]; // YYYY-MM-DD
}

/* Today as YYYY-MM-DD off the LOCAL clock, not toISOString().

   Hong Kong is +8, so a UTC day string is YESTERDAY's date for the first eight
   hours of every working day -- the whole of a morning shift. parseIsoDate
   above can afford that because what it converts is a date somebody already
   typed; this is the clock itself, and a record created at 09:00 on the 29th
   that says the 28th is wrong in the one column a reviewer sorts by.

   `d` is a parameter so the payload builders stay pure and the harness can pin
   a day rather than compare against its own new Date(). */
function localIsoDay(d) {
  const t = d ? new Date(d) : new Date();
  if (isNaN(t.getTime())) return null;
  const pad = n => String(n).padStart(2, "0");
  return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
}

function localIsoTomorrow(d, offsetDays = 1) {
  const t = d ? new Date(d) : new Date();
  if (isNaN(t.getTime())) return null;
  t.setDate(t.getDate() + offsetDays);
  return localIsoDay(t);
}

// Rate: 1 USD : 7.9 HKD for PR Amount currency conversion
const HKD_PER_USD = 7.9;

function convertPrAmount(numValue, currency) {
  if (numValue == null || isNaN(numValue)) {
    return { prAmountHkd: null, prAmountUsd: null };
  }
  const isUsd = String(currency || "").toUpperCase() === "USD";
  if (isUsd) {
    const hkdVal = Number((numValue * HKD_PER_USD).toFixed(2));
    return { prAmountUsd: String(numValue), prAmountHkd: String(hkdVal) };
  } else {
    const usdVal = Number((numValue / HKD_PER_USD).toFixed(2));
    return { prAmountHkd: String(numValue), prAmountUsd: String(usdVal) };
  }
}

// The Dataverse payload for one Record_ID, built from one item's own fields
// snapshot -- module scope and pure so save.test.js can call it directly; the
// harness has no parent.Xrm.WebApi to build the payload against otherwise.
// The dev BTB_LIS_Excel_Datas columns lost their "2" suffix in the 2026-09-18
// table rebuild (see CLAUDE.md); Record_ID (admin_title) never carried one.
// admin_title and admin_prx0020reference both take the resolved Record_ID
// rather than one shared prReferenceValue.
function buildRecordPayload(fieldsSnapshot, recordId, manualChecks) {
  const getVal = (key) => (fieldsSnapshot[key] && fieldsSnapshot[key].value) ? String(fieldsSnapshot[key].value).trim() : "";
  const prAmountNum = parseDecimal(getVal("hkd"));
  const rawCurrency = getVal("currency");
  const prCurrency = rawCurrency
    ? (rawCurrency.toUpperCase() === "USD" ? "USD" : "HKD")
    : (/\bUSD\b/i.test(getVal("hkd")) ? "USD" : (prAmountNum != null ? "HKD" : ""));
  const { prAmountHkd, prAmountUsd } = convertPrAmount(prAmountNum, prCurrency);

  // Keyed by the app's own field keys, not by Dataverse column names --
  // SCHEMA.lis.write turns them into this side's columns and drops any key
  // this side has no column for (see mapPayload). That is what lets one file
  // serve both sides: a key lands on a real column where the side has one and
  // simply vanishes where it does not, instead of being written to a name that
  // does not exist there.
  //
  // ⚠️ This comment used to name `prNo`, `issueBy`, `chargeCcc` and
  // `accountCode` as the four that vanish on dev. That is no longer true of any
  // of them -- the 2026-09-18 rebuild gave dev `admin_prx0020nox002e`, and
  // chargeCcc / accountCode / issueBy each joined dev's `write` map as the
  // Verify Table grew a row to type them in. Do not read the example list here
  // as a statement about which side has what; read SCHEMA.lis.write.
  return mapPayload(SCHEMA.lis.write, {
    // Primary Name Column (Record_ID) -- Dataverse requires every record to
    // carry a primary name value. prReference takes the resolved Record_ID
    // too, rather than one shared prReferenceValue.
    recordId:           recordId,
    prReference:        recordId,
    recordNo:           getVal("recordNo"),
    prNo:               getVal("prNo"),
    // Column J. A text column on both sides (confirmed 2026-09-17), so no
    // parseDecimal here even though it reads like money -- same call as
    // usdOthers and the two Quotation dates.
    totalRevenue:       getVal("totalRevenue"),
    recdDate:           parseIsoDate(getVal("recdDate")),
    customerName:       getVal("customerName"),
    uid:                getVal("uid"),
    startDate:          parseIsoDate(getVal("startDate")),
    endDate:            parseIsoDate(getVal("endDate")),
    contractNo:         getVal("contractNo"),
    hkd:                prAmountNum,
    currency:           prCurrency,
    prAmountHkd:        prAmountHkd,
    prAmountUsd:        prAmountUsd,
    usdOthers:          getVal("usdOthers"),
    vendor:             getVal("vendor"),
    handledBy:          getVal("handledBy"),
    iptUnitMgr:         getVal("iptUnitMgr"),
    // Text columns, not Date -- Quotation Start/End Date can carry a non-ISO
    // string ("TBC", a stated period), so parseIsoDate must not run here.
    quotationStartDate: getVal("quotationStartDate"),
    quotationEndDate:   getVal("quotationEndDate"),
    poPrDescription:    getVal("poPrDescription"),
    poDate:             parseIsoDate(getVal("poDate")),
    poNo:               getVal("poNo"),
    receiptDate:        parseIsoDate(getVal("receiptDate")),
    poAmountHkd:        parseDecimal(getVal("poAmountHkd")),
    umMgr:              getVal("umMgr"),
    prIssuedMonth:      getVal("prIssuedMonth"),
    prIssuedOn:         getVal("prIssuedOn"),
    worksOrderCode:     getVal("worksOrderCode"),
    issueBy:            getVal("issueBy"),
    chargeCcc:          getVal("chargeCcc"),
    accountCode:        getVal("accountCode"),
    yn:                 getVal("yn"),
    remarks:            getVal("remarks"),
    invoiceDnNo:        getVal("invoiceDnNo"),
    invoiceDnDate:      parseIsoDate(getVal("invoiceDnDate")),
    // Text column standing in for Status until the table has a real Status
    // column: "Completed" / "Pending".
    colorTag:           manualChecks.every(Boolean) ? "Completed" : "Pending",
  });
}

// The BTB_ATQ_Excel payload for one item, built the same way as
// buildRecordPayload -- module scope and pure so it can be tested without
// parent.Xrm.WebApi. Only the columns with an actual App-side data source are
// filled; ATQ_Excel_LIS, BTB_Verify, Contract_Revenue and the Dataverse
// system columns (Created, Modified, Compliance Asset Id, Color Tag, and the
// table's own primary key) are left for Dataverse/n8n to fill, same as the
// "no form input wired up yet" columns in buildRecordPayload.
function buildAtqExcelPayload(fieldsSnapshot, recordId) {
  const getVal = (key) => (fieldsSnapshot[key] && fieldsSnapshot[key].value) ? String(fieldsSnapshot[key].value).trim() : "";
  return mapPayload(SCHEMA.atqExcel.write, {
    recordId:     recordId,
    externalKey:  recordId,
    contractNo:   getVal("contractNo"),
    customerName: getVal("customerName"),
    startDate:    parseIsoDate(getVal("startDate")),
    endDate:      parseIsoDate(getVal("endDate")),
    hkd:          parseDecimal(getVal("hkd")),
    vendor:       getVal("vendor"),
    handledBy:    getVal("handledBy"),
    iptUnitMgr:   getVal("iptUnitMgr"),
  });
}

async function writeAtqExcelRecord(fieldsSnapshot, recordId, alreadyWritten, markWritten, webApi) {
  if (alreadyWritten || !recordId) return "";
  try {
    const payload = buildAtqExcelPayload(fieldsSnapshot, recordId);
    if (webApi) {
      await webApi.createRecord(SCHEMA.atqExcel.entity, payload);
    } else {
      console.warn("parent.Xrm.WebApi not detected. Skipping BTB_ATQ_Excel write (Demo / Standalone mode).");
    }
    if (markWritten) markWritten();
    return "";
  } catch (err) {
    console.error(err);
    return "Sent to n8n, but could not write the BTB_ATQ_Excel row: " + (err.message || String(err));
  }
}

// The Cost sheet's one-character Back-to-Back reading, said the way every
// OTHER consumer of it spells it. Two vocabularies are in play and they are
// not interchangeable:
//
//   the ATQ Cost sheet says   "Y" / "N"
//   admin_btbtype / new_btb_type, the Master Records BTB column, the Manage
//   modal's <select> and APPROVER_BANDS all say   "BTB" / "NON-BTB"
//
// Writing the raw "Y" into that column would not fail. It would sit there
// reading as neither, and getDualApprovers -- `type === "BTB" ? BTB : NON-BTB`
// -- would silently band it as NON-BTB, which is the wrong approval threshold
// arrived at without a word on screen. So the translation happens once, here,
// and every caller goes through it.
//
// "" for anything that is not exactly Y or N, which covers a blank cell, an
// ATQ with no Back-to-Back row, and a Cost sheet this app could not read.
// mapPayload drops "" so the column is simply not written -- deliberately NOT
// defaulted to either case: the Non-BTB gate triggers on N, so guessing "BTB"
// would wave an unread sheet straight past it, and guessing "NON-BTB" would
// demand three confirmations for a case nobody established. The same rule the
// Record ID card's own pill follows, which is why both read this function.
function btbTypeOf(value) {
  const v = normText(value);
  return v === "Y" ? "BTB" : v === "N" ? "NON-BTB" : "";
}

// The BTB_LIS_Excel_Datas payload written when the Document Workbench's
// "Start" button is pressed -- deliberately a stub: only the four values that
// exist before Process/OCR has even run (Record_ID, Handled By, IPT Unit Mgr,
// UID), so this row already exists by the time the reviewer reaches Verify
// Table's "Continue to save", which now updates it straight through instead
// of asking whether to (see ExtractedFieldsPage's continueToSaveAfterGate).
//
// `btbType` is the fifth value and the only one not read off the form: it comes
// from the ATQ Cost sheet via btbTypeOf, so it is passed IN rather than dug out
// of fieldsSnapshot (there is no Back-to-Back form field -- see EXCEL_COLUMN_MAP
// column AD's open question). Optional and defaulting to "", so a caller that
// has no reading yet writes exactly the four-value stub this always wrote.
//
// `atqNo` and `itemNo` (2026-09-30, dev only): saved to admin_atqno and
// admin_itemno at Start. If atqNo is omitted or "", it falls back to
// fieldsSnapshot's extracted atqRefNo.
function buildLisStartPayload(fieldsSnapshot, recordId, uidValue, btbType, createdOn, atqNo, itemNo) {
  const getVal = (key) => (fieldsSnapshot[key] && fieldsSnapshot[key].value) ? String(fieldsSnapshot[key].value).trim() : "";
  const resolvedAtqNo = (atqNo != null && String(atqNo).trim() !== "") ? String(atqNo).trim() : getVal("atqRefNo");
  return mapPayload(SCHEMA.lis.write, {
    recordId:   recordId,
    handledBy:  getVal("handledBy"),
    iptUnitMgr: getVal("iptUnitMgr"),
    uid:        (uidValue || "").trim(),
    btbType:    (btbType || "").trim(),
    // Rec'd Date = the day the record was created (2026-09-28, BOTH sides --
    // admin_recx0027dx0020datex0020 on dev, ...x00204 on admin, and both were
    // already in `write`, so nothing new is transcribed here).
    //
    // A real Date column, written as YYYY-MM-DD -- the shape buildRecordPayload
    // already sends it in, which is the existing writer and therefore the one
    // that says what type this column holds. It does NOT go through
    // parseIsoDate: that converts a value somebody typed, and this is the
    // clock (see localIsoDay on why UTC is the wrong reading of it).
    //
    // buildLisExcelPayload deliberately does not carry this key, so "Continue
    // to save" leaves the creation date alone rather than restating it.
    recdDate:   createdOn || localIsoDay(),
    atqNo:      resolvedAtqNo,
    itemNo:     itemNo != null ? String(itemNo).trim() : "",
  });
}

// `btbType`, `atqNo`, and `itemNo` are optional trailing arguments so existing
// calls without them keep their exact behaviour.
async function writeLisStartRecord(fieldsSnapshot, recordId, uidValue, alreadyWritten, markWritten, webApi, btbType, atqNo, itemNo) {
  if (alreadyWritten || !recordId) return "";
  try {
    const payload = buildLisStartPayload(fieldsSnapshot, recordId, uidValue, btbType, null, atqNo, itemNo);
    if (webApi) {
      await webApi.createRecord(SCHEMA.lis.entity, payload);
    } else {
      console.warn("parent.Xrm.WebApi not detected. Skipping BTB_LIS_Excel_Datas stub write (Demo / Standalone mode).");
    }
    if (markWritten) markWritten({ recordId, atqNo, itemNo });
    return "";
  } catch (err) {
    console.error(err);
    return "Could not create the BTB_LIS_Excel_Datas row: " + (err.message || String(err));
  }
}

// The BTB_LIS_Excel_Datas payload written when the reviewer clicks "Continue
// to save" on the Verify Table -- `values` is a plain {rowId: string} map of
// what the LIS Value column actually shows for the rows that have a column
// on this table (see ExtractedFieldsPage's lisExcelValues), not the form
// fieldsSnapshot buildRecordPayload reads, since this write happens before
// the LIS & Remark page's own fields exist. Quotation No., Contract Revenue
// and UID were asked to be left off this table on purpose.
// Which form field each Verify Table LIS row feeds, for seedFieldsFromLisRows
// below. Two things make this a hand-written map rather than anything derived:
//
//   - `lisRowValues` is keyed by VERIFY_TABLE_ROWS **id** and `fields` by field
//     KEY, and they differ for three rows (prAmount -> hkd, contractStartDate/
//     contractEndDate -> startDate/endDate).
//   - the row's own `key` is the WRONG bridge for the two quotation dates:
//     quotationStartDate carries `key: "startDate"` because it shares the
//     contract's crosscheck bucket, while its form field is its own
//     `quotationStartDate`. Deriving from row.key would write the quotation's
//     period into the contract's boxes -- silently, since both are plausible
//     dates.
//
// `yn` is deliberately absent. lisExcelValues puts the BACK-TO-BACK reading
// there, not an LIS Value the reviewer chose, and whether Back-to-Back should
// keep filling the form's "Y / N" field is the open product question already
// recorded against EXCEL_COLUMN_MAP's column AD -- not something this seeding
// should decide on the way past.
const LIS_ROW_TO_FIELD_KEY = {
  customerName:        "customerName",
  vendor:              "vendor",
  contractNo:          "contractNo",
  prAmount:            "hkd",
  currency:            "currency",
  contractStartDate:   "startDate",
  contractEndDate:     "endDate",
  quotationStartDate:  "quotationStartDate",
  quotationEndDate:    "quotationEndDate",
  quotationExpireDate: "quotationExpireDate",
  handledBy:           "handledBy",
  iptUnitMgr:          "iptUnitMgr",
};

// The Verify Table's LIS Value column, pushed into the App-level `fields` state
// at "Continue to save".
//
// It exists because LisRemarkPage's `valueOf` reads `fields[key].value` first
// and `lisRowValues` only as a fallback -- and by the time Continue to save is
// pressed, detectFromRoles has already filled those fields with the DOCUMENT's
// own reading. So a reviewer who changed Vendor from "NEXUS2S" to "NEXUS2S Asia
// Limited" in the LIS Value column arrived on LIS & Remark still looking at
// "NEXUS2S", and buildRecordPayload saved that one too: the stale automatic
// answer beat the explicit human one, everywhere.
//
// Pure, and returns a NEW object, so it can be tested without React and fed
// straight to setFields(prev => ...).
//
// Three guards, each removing a way this could destroy something:
//   - a blank LIS Value writes nothing. The column is empty for every row
//     nobody touched, and writing those through would blank correct fields.
//   - a field the reviewer edited BY HAND (`auto === false`) is left alone --
//     the same rule detectFromRoles follows. The LIS Value column outranks an
//     extraction, never a person.
//   - the seeded value stays flagged `auto: true`, so an edit made afterwards
//     on LIS & Remark still wins over the next pass.
function seedFieldsFromLisRows(fields, values) {
  if (!values) return fields;
  let next = null;
  Object.keys(LIS_ROW_TO_FIELD_KEY).forEach(rowId => {
    const value = String(values[rowId] == null ? "" : values[rowId]).trim();
    if (!value) return;
    const key = LIS_ROW_TO_FIELD_KEY[rowId];
    const cur = fields[key];
    if (cur && cur.value && !cur.auto) return;
    if (cur && cur.value === value) return;
    if (!next) next = Object.assign({}, fields);
    next[key] = { value, auto: true };
  });
  return next || fields;
}

function buildLisExcelPayload(values, recordId, remark) {
  const v = key => ((values && values[key]) || "").trim();
  // const prAmountNum = parseDecimal(v("prAmount"));
  const prAmountNum = v("prAmount");
  const rawCurrency = v("currency") || v("prCurrency");
  const prCurrency = rawCurrency
    ? (rawCurrency.toUpperCase() === "USD" ? "USD" : "HKD")
    : (/\bUSD\b/i.test(v("prAmount")) ? "USD" : (prAmountNum != null ? "HKD" : ""));
  const { prAmountHkd, prAmountUsd } = convertPrAmount(prAmountNum, prCurrency);

  const isHkd = prCurrency === "HKD";
  const isUsd = prCurrency === "USD";
  // On dev, admin_pramount is a text/string column (Edm.String), whereas
  // on admin prAmount lands on admin_hkd4 (decimal).
  const prAmountVal = !IS_ADMIN
    ? (prAmountNum != null ? String(prAmountNum) : (v("prAmount") || null))
    : prAmountNum;

  return mapPayload(SCHEMA.lis.write, {
    recordId:           recordId,
    customerName:       v("customerName"),
    vendor:             v("vendor"),
    contractNo:         v("contractNo"),
    prAmount:           prAmountVal,
    currency:           prCurrency,
    prAmountHkd:        prAmountHkd,
    prAmountUsd:        prAmountUsd,
    hkd:                isHkd ? prAmountNum : null,
    usdOthers:          isUsd ? (prAmountNum != null ? String(prAmountNum) : (v("prAmount") || null)) : null,
    contractStartDate:  parseIsoDate(v("contractStartDate")),
    contractEndDate:    parseIsoDate(v("contractEndDate")),
    // Text columns on this table, not Date columns -- unlike every other date
    // field in this payload, so parseIsoDate must not run here. Quotation
    // Start/End Date often carries a non-ISO string (a quotation's own
    // wording, "TBC", a period like "1 Apr 2026 - 31 Mar 2027"), and
    // parseIsoDate returned null for anything new Date() cannot parse -- the
    // sanitizer then dropped the key outright, so the LIS & Remark table
    // showed no value at all for a field the reviewer had right in front of
    // them on screen.
    quotationStartDate: v("quotationStartDate"),
    quotationEndDate:   v("quotationEndDate"),
    // A real Date column on both sides, UNLIKE the two Quotation dates above
    // it -- so parseIsoDate DOES run here, and a value it cannot read (a
    // quotation that prints "TBC", or a period rather than a day) comes back
    // null and is dropped by mapPayload. That drop is deliberate: Dataverse
    // rejects the whole update on a bad date, which would lose every other
    // field in the same Save. It is said on screen rather than left silent --
    // see quotationExpiryUnwritable in ExtractedFieldsPage.
    quotationExpireDate: parseIsoDate(v("quotationExpireDate")),
    handledBy:          v("handledBy"),
    iptUnitMgr:         v("iptUnitMgr"),
    // The Verify Table's Product Type row -> admin_producttype on this table
    // (dev only; the Admin table has no transcribed column, so mapPayload
    // drops it there). Plain text: a product type is a label, not a number.
    productType:        v("productType"),
    // The Verify Table's Contract Revenue row -> admin_totalrevenue.
    //
    // ⚠️ It reuses the EXISTING `totalRevenue` schema key rather than adding a
    // `contractRevenue` one. Both would name the very same column, and two
    // keys pointing at one column is a silent last-one-wins inside mapPayload
    // -- the kind of thing that only shows up as a value that will not stick.
    // The `values` key stays "contractRevenue" because that is the Verify row
    // id lisExcelValues is keyed by; only the SCHEMA key is shared.
    //
    // Two writers of admin_totalrevenue now: this, and buildRecordPayload's
    // own `totalRevenue` from the LIS & Remark form. They cannot erase each
    // other because mapPayload drops "" -- the same single reason the two
    // writers of admin_issuex0020by are safe.
    //
    // ⚠️ NO parseDecimal, even though it reads like money. Column J is a TEXT
    // column on both sides (confirmed 2026-09-17), which is why
    // buildRecordPayload writes it with a bare getVal and says so in its own
    // note. This line WAS parseDecimal for one revision and Dataverse rejected
    // the whole update -- "Could not write the BTB_LIS_Excel_Datas row", with
    // every other field in the same Continue to save lost with it. The other
    // writer's type is the specification here: two writers of one column that
    // disagree about its type means one of them always fails.
    totalRevenue:       v("contractRevenue"),
    // Columns E / G / F -- the Verify Table's three code rows (see
    // FEATURES.verifyLisCodes). Plain Text columns, so no parseIsoDate and no
    // parseDecimal: an account code is a code, not a number, and reading
    // "0012" as 12 would silently drop its leading zeros.
    //
    // Blank on the Admin side and on any dev upload where the reviewer typed
    // nothing -- lisExcelValues has no entry for a row that is not on screen,
    // `v` turns that into "", and mapPayload drops "" rather than blanking a
    // column somebody filled in elsewhere.
    chargeCcc:          v("chargeCcc"),
    accountCode:        v("accountCode"),
    worksOrderCode:     v("worksOrderCode"),
    // Column AD ("Y / N") -- the same schema column buildRecordPayload's own
    // "yn" writes for the LIS & Remark page's manual field, but here it
    // carries the Back-to-Back reading off the Verify Table's own crosscheck
    // (see ExtractedFieldsPage's btbValue), not a reviewer's typed value.
    yn:                 v("yn"),
    // Only ever set by Admin's "Save & Return"; the dev tables have no such
    // column, so this key is dropped there.
    statusRemark:       (remark || "").trim(),
  });
}

// `existingId` is the GUID of an already-existing BTB_LIS_Excel_Datas row for
// this Record_ID (see findExistingLisRecordId) -- when given, this updates
// that row instead of creating a new one. Without it, a reviewer re-saving a
// Record_ID that already has a row hit the connector's own create-time
// uniqueness handling, which surfaced as a generic "ISV 程式碼中發生未預期的
// 錯誤" instead of a clean duplicate-key error.
async function writeLisExcelRecord(values, recordId, alreadyWritten, markWritten, webApi, existingId) {
  if (alreadyWritten || !recordId) return "";
  try {
    const payload = buildLisExcelPayload(values, recordId);
    if (webApi) {
      if (existingId) {
        await webApi.updateRecord(SCHEMA.lis.entity, existingId, payload);
      } else {
        await webApi.createRecord(SCHEMA.lis.entity, payload);
      }
    } else {
      console.warn("parent.Xrm.WebApi not detected. Skipping BTB_LIS_Excel_Datas write (Demo / Standalone mode).");
    }
    if (markWritten) markWritten();
    return "";
  } catch (err) {
    console.error(err);
    return "Could not write the BTB_LIS_Excel_Datas row: " + (err.message || String(err));
  }
}

// The Item No. the reviewer is looking at, plus the positional fallback for
// documents whose records carry no item number at all. The anchor comes from
// the same list the Item tabs are built from -- the first entry holding
// records -- so it is by construction the item the tab strip has selected.
function anchorRecordsOf(attachments, itemIndex) {
  const pickRecord = (records) => {
    const i = Math.floor(itemIndex) || 0;
    return Math.min(Math.max(i, 0), records.length - 1);
  };
  let anchorItemNo = null;
  for (const typeKey of ATTACHMENT_TYPES) {
    const entry = attachments && attachments[typeKey];
    const recs = entry && entry.records;
    if (recs && recs.length) { anchorItemNo = itemNoOf(recs[pickRecord(recs)]); break; }
  }
  return { anchorItemNo, pickRecord };
}

// The one record of `records` that speaks for the anchored item -- what a
// form-filling caller wants, as opposed to speakingRecords below (every
// sibling a diff caller wants to compare). Same anchor, same itemNoOf, so
// detectFromRoles can never pick a different row than computeFieldDiffs did.
function anchoredRecordOf(records, attachments, itemIndex) {
  if (!records || !records.length) return null;
  const { anchorItemNo, pickRecord } = anchorRecordsOf(attachments, itemIndex);
  if (anchorItemNo) {
    const match = records.find(r => itemNoOf(r) === anchorItemNo);
    if (match) return match;
  }
  return records[pickRecord(records)];
}

// Which quotation attachment(s) the ATQ names for the item currently selected.
//
// The engine already did this matching: `matchQuotationAttachments` resolves
// each ATQ record's quotation reference against the email's other attachments
// and leaves the answer on `record.quotationFiles`. Nothing in the app read it
// until now, which is why a two-item email showed one item's quotation under
// both tabs.
//
// Returns a test — (typeKey, fileName) => "this is another item's quotation" —
// rather than the list itself, because the answer is only meaningful inside the
// one container the engine did the matching in. A quotation dropped on its own
// tab was never a candidate for `quotationFiles` and must not be silenced for
// failing to appear in it.
//
// The test is always false — no filtering at all, exactly as before — when
// there are no ATQ records or the engine matched no quotation to this item.
function normQuotationFile(name) {
  return String(name || "").split("›").pop().replace(/\s+/g, " ").trim().toLowerCase();
}

function recordsBearingTypeKey(attachments) {
  for (const typeKey of ATTACHMENT_TYPES) {
    const recs = attachments && attachments[typeKey] && attachments[typeKey].records;
    if (recs && recs.length) return typeKey;
  }
  return null;
}

// Two documents agree on a vendor if they agree the way the cross-check itself
// would -- `vendor` is already a FUZZY_DIFF_KEYS member, so "DCSS Technology
// (Hong Kong) Ltd" and "DCSS Technology (HK) Limited" are one vendor here for
// the same reason they raise no conflict there.
function vendorsAgree(a, b) {
  const x = DIFF_KEYS.vendor(a), y = DIFF_KEYS.vendor(b);
  if (!x || !y) return false;
  return x === y || tokenJaccard(x, y) >= DIFF_JACCARD_MIN;
}

// Every document of the host container, keyed by file name, with the vendor its
// own page names. Read through mapDetectedFields so a quotation that only names
// its vendor in a sign-off block is included -- that is the common case.
function vendorByQuotationFile(attachments, hostKey) {
  const docs = (attachments && attachments[hostKey] && attachments[hostKey].docs) || [];
  const out = {};
  docs.forEach(doc => {
    if (!doc || !doc.fileName) return;
    const who = mapDetectedFields(doc.fields, "Vendor Quotation", doc.textBlock).vendor;
    if (who) out[normQuotationFile(doc.fileName)] = who;
  });
  return out;
}

function offItemQuotationTest(attachments, itemIndex) {
  const hostKey = recordsBearingTypeKey(attachments);
  const rec = anchoredRecordOf(recordsBearingEntry(attachments), attachments, itemIndex);
  if (!hostKey || !rec) return () => false;
  const files = rec.quotationFiles || [];
  if (files.length) {
    const wanted = new Set(files.map(normQuotationFile));
    return (typeKey, fileName) => typeKey === hostKey && !wanted.has(normQuotationFile(fileName));
  }

  // The engine matched nothing — which on a real ATQ is not rare, because the
  // form's QUOTATION column is optional and often left blank.
  // `ATQ-202603-00386-V23` leaves it empty in BOTH its PDF and its workbook, so
  // there is no reference to resolve and every item was offered the one DCSS
  // quotation in the email; item 1 took it and item 2 — the DCSS item — showed
  // none.
  //
  // The item still says who it bought from, though: "Vendor / Distributor" reads
  // "HUAWEI" for one and "DCSS Technology (Hong Kong) Ltd" for the other, and the
  // quotation names its own issuer. That is enough to rule out a quotation from a
  // vendor this item did not buy from.
  //
  // Deliberately weaker than the reference match: this rules a document OUT, it
  // never rules one in. A document whose vendor cannot be read, or an item that
  // names no vendor, keeps the old "no filtering at all" behaviour — the answer
  // to "which quotation is this item's" is still unknown, and a wrong exclusion
  // would hide the only quotation the email has.
  const itemVendor = mapDetectedFields(rec.fields, "ATQ").vendor;
  if (!itemVendor) return () => false;
  const vendorOf = vendorByQuotationFile(attachments, hostKey);
  return (typeKey, fileName) => {
    if (typeKey !== hostKey) return false;
    const who = vendorOf[normQuotationFile(fileName)];
    if (!who) return false;
    return !vendorsAgree(who, itemVendor);
  };
}

// Walks everything the app is holding — all five attachment-type entries, each
// entry's docs[], each doc's children[] (a .mht's own sub-documents) and the
// one record of each doc's records[] the user currently has selected — and
// groups each comparable field by its normalised value. More than one group is
// a difference.
//
// `itemIndex` is the Item tab selection lifted out of UploadPage. It matters
// that only one record contributes: an ATQ email covering "Item 2 & 3" holds
// sibling rows that are *meant* to name different vendors and quotations, so
// pooling them turned the correct structure of the document into an alert on
// every multi-item upload. Siblings are never compared against each other; the
// selected one is compared against other documents exactly as before.
//
// Returns { [key]: { key, label, severity, softReason, groups, sourceCount,
// dismissKey } } for every key at least one document reported. severity "same"
// still gets an entry: Verify needs to tell "agrees" apart from "nothing to
// compare".
function computeFieldDiffs(attachments, itemIndex) {
  const { anchorItemNo, pickRecord } = anchorRecordsOf(attachments, itemIndex);

  // The records of one document that speak for the anchored item. A document
  // that numbers its items contributes the matching one and nothing else;
  // having no such item is silence, not disagreement. A document whose records
  // carry no item number at all keeps the old positional behaviour.
  const speakingRecords = (records) => {
    if (!records || !records.length) return [];
    if (anchorItemNo) {
      const numbered = records.filter(itemNoOf);
      if (numbered.length) return numbered.filter(r => itemNoOf(r) === anchorItemNo);
    }
    return [records[pickRecord(records)]];
  };

  const recordLabel = (rec, records) =>
    " (item " + (itemNoOf(rec) || (records.indexOf(rec) + 1)) + ")";
  const buckets = {};
  const push = (source, rawFields, docText, skipKeys) => {
    // A document can have no paired fields while its own text still contains
    // recoverable values. This is common for scanned Agreements: dropping the
    // empty field list here made the same Agreement disappear on some item tabs.
    if ((!rawFields || !rawFields.length) && !docText) return;
    // attachmentType null makes mapDetectedFields fall back to every key --
    // correct here, because a document's own labels are the only scope that
    // means anything once it is out of the tab it happened to be dropped on.
    const matches = mapDetectedFields(rawFields, null, docText);
    // Comparison-only keys, read off the document's own labels. First match
    // wins, as in mapDetectedFields.
    for (const { label, value } of rawFields) {
      if (!value) continue;
      const clean = String(label || "").replace(/[:\uFF1A]\s*$/, "").trim();
      for (const { key, patterns } of COMPARE_ONLY_FIELDS) {
        if (matches[key]) continue;
        if (patterns.some(re => re.test(clean))) { matches[key] = String(value).trim(); break; }
      }
    }
    Object.keys(DIFF_KEYS).forEach(key => {
      if (skipKeys && skipKeys[key]) return;
      const raw = matches[key];
      if (!raw || raw.length < (DIFF_MIN_CHARS_BY_KEY[key] || DIFF_MIN_CHARS)) return;
      const norm = DIFF_KEYS[key](raw);
      if (!norm) return;
      (buckets[key] = buckets[key] || []).push({ norm: String(norm), value: raw, source });
    });
  };

  // Whichever quotation documents speak for the item being compared. Stamped
  // onto every source below so autoRoleOfSource can keep the other item's
  // quotation out of this item's Quotation slot.
  const offItemFor = offItemQuotationTest(attachments, itemIndex);

  ATTACHMENT_TYPES.forEach(typeKey => {
    const entry = attachments && attachments[typeKey];
    if (!entry) return;
    // Guarded because DEMO_ATTACHMENTS and EMPTY_ATTACHMENTS carry none of
    // these keys, and inline furniture has no fields to contribute anyway.
    const docs = (entry.docs || []).filter(d => d && !d.inline);
    docs.forEach(d => {
      // Which slot this document fills turns on whether it is signed and on
      // what its first page calls it, so every source built from it carries
      // both. Read once per document rather than once per field.
      const signed = isSignedDoc(d);
      const headingRole = headingRoleOf(docHeadingLines(entry, d));
      const offItem = offItemFor(typeKey, d.fileName);
      const recs = d.records || [];
      const source = { typeKey, docIndex: d.index, fileName: d.fileName, signed, headingRole, offItem };
      const itemScoped = namedRoleOfSource(source) === "atq"
        || (entry.isAtqRecord && d.fileName === entry.file);
      const selectedRecords = itemScoped ? speakingRecords(recs) : [];
      const workbookVendor = isWorkbookDocument(d) && selectedRecords.some(rec =>
        !!mapDetectedFields(rec.fields, null).vendor);
      push(source,
        d.fields, d.textBlock, workbookVendor ? { vendor: true } : null);
      (d.children || []).forEach(c => {
        if (!c || c.inline) return;
        // Sub-documents share their container's docIndex: the container is the
        // deepest thing the viewer can actually navigate to. They are judged on
        // their own ink, but their pages were parsed into a nested result that
        // entry.pages does not index, so they have no heading to read.
        push({ typeKey, docIndex: d.index, fileName: d.fileName + " › " + c.fileName,
          signed: isSignedDoc(c), offItem: offItemFor(typeKey, c.fileName) }, c.fields, c.textBlock);
      });
      selectedRecords.forEach(rec => {
        push(Object.assign({}, source, { fileName: d.fileName + recordLabel(rec, recs) }), rec.fields);
      });
      // The same items read out of a second document — the PDF print of the
      // workbook the roll-up kept. The engine moves these aside instead of
      // discarding them precisely so they can corroborate here; they are never
      // counted as items and never fill the form.
      const corr = d.corroboration || [];
      (itemScoped ? speakingRecords(corr) : []).forEach(rec => {
        push(Object.assign({}, source, { fileName: d.fileName + recordLabel(rec, corr) }), rec.fields);
      });
    });
    // A single dropped PDF is its own only document: the engine leaves
    // attachments[] empty and result.fields is then exactly that one document's
    // own fields, with nothing merged in. Container entries never reach this
    // branch, so the flattened-junk problem stays solved.
    if (!docs.length) {
      const name = entry.file || typeKey;
      const signed = isSignedDoc(entry);
      const headingRole = headingRoleOf(docHeadingLines(entry, { isSelf: true }));
      if (entry.records && entry.records.length) {
        const source = { typeKey, docIndex: -1, fileName: name, signed, headingRole };
        const itemScoped = entry.isAtqRecord || namedRoleOfSource(source) === "atq";
        (itemScoped ? speakingRecords(entry.records) : []).forEach(rec => {
          push({ typeKey, docIndex: -1, fileName: name + recordLabel(rec, entry.records), signed, headingRole }, rec.fields);
        });
      } else {
        push({ typeKey, docIndex: -1, fileName: name, signed, headingRole }, entry.rawFields, entry.text);
      }
    }
  });

  const diffs = {};
  Object.keys(buckets).forEach(key => {
    const rows = buckets[key];
    const groups = [];
    rows.forEach(r => {
      let g = groups.find(x => x.norm === r.norm);
      if (!g) { g = { norm: r.norm, value: r.value, sources: [] }; groups.push(g); }
      g.sources.push(r.source);
    });
    let severity = "same";
    // Only meaningful for "similar", where Verify has to say what kind of
    // not-quite-agreement this is rather than guessing "wording" for both.
    let softReason = "differs only in wording";
    if (groups.length > 1) {
      severity = "different";
      if (FUZZY_DIFF_KEYS.indexOf(key) >= 0) {
        if (groups.every(a => groups.every(b => a === b || tokenJaccard(a.norm, b.norm) >= DIFF_JACCARD_MIN))) {
          severity = "similar";
        } else if (listCoversRest(key, groups)) {
          severity = "similar";
          softReason = "is listed among the other document's values";
        } else if (ourCompanyOnlyDissent(groups)) {
          severity = "similar";
          softReason = "names " + OUR_COMPANY.label +
            " where the rest name the counterparty — likely a letterhead read as a party";
        }
      }
    }
    diffs[key] = {
      key,
      label: FIELD_LABELS[key] || COMPARE_ONLY_LABELS[key] || key,
      severity,
      softReason,
      groups,
      sourceCount: rows.length,
      // Identity for dismissedDiffs. Stable across re-renders, but it changes
      // the moment the values do -- dismissing one known-benign misread must
      // never go on to silently hide the next genuine conflict.
      dismissKey: key + "|" + groups.map(g => g.norm).slice().sort().join("~"),
    };
  });
  return diffs;
}

// Nothing selects off `diffs` directly any more. Every surface reads the
// crosscheck built from it, because a document that disagrees with nothing in a
// role slot should not be lighting warnings on surfaces that speak in roles --
// the field row and the sidebar dot have to be answering the same question or
// one of them is lying. See activeCrosscheckList and friends further down.

/* ---------- Which document backs a field up ----------
   The ⚠ mark answers "do the documents disagree", which is only half of what a
   reviewer standing over a value wants to know. The other half is *which*
   document says what: the agreement, the ATQ, or the vendor's quotation. Three
   fixed slots under every field answer that without opening anything, in the
   same green/amber language the rest of the app already speaks.

   A slot is a role, not a file. Whichever attachment plays the agreement in
   this email fills the Agreement chip regardless of the tab it was dropped on,
   because the tab records where the user put it and the filename records what
   it is. The attachment type is the fallback for a file named after nothing in
   particular. */
// `file` matches the filename, `heading` the title the document prints on its
// own first page, `types` the tab it was dropped on. The heading patterns are
// the stricter pair: a filename is a deliberate short label, where a heading has
// to be picked out of a page that also carries prose.
const DOC_ROLES = [
  { key: "agreement", label: "Agreement",
    file: /agreement|contract|\bmsa\b/i,
    heading: /\b(agreement|contract)\b/i,
    types: ["Contract"] },
  // "(PDF)" because the print is the copy a reviewer opens. The workbook the
  // ATQ was exported from fills the same slot when it is the only one that
  // reported the field — the chip prefers a PDF source when both did, and the
  // tooltip always names the file that actually answered.
  // The form spells its own name out on the page it prints, and a file named
  // after it inherits the spelling. Without the long form "Authority to Quote
  // 2026.pdf" lands in the Quotation slot, because the word Quote is in it.
  { key: "atq", label: "ATQ (Excel)",
    file: /(^|[^a-z])atq|authority\s*to\s*quote/i,
    heading: /\batq\b|authority\s*to\s*quote/i,
    types: ["ATQ", "Excel"] },
  { key: "quotation", label: "Quotation",
    file: /quot|^qt[-_ ]?\d/i,
    heading: /\bquotation\b|\bquote\b/i,
    types: ["Vendor Quotation"] },
];

// Filenames are tested in this order rather than the display order above.
// "Authority to Quote" carries the word Quote, and a quotation for a
// maintenance contract carries the word contract, so the two specific roles get
// first refusal and Agreement — whose vocabulary is the most generic — takes
// what is left.
const ROLE_MATCH_ORDER = ["atq", "quotation", "agreement"]
  .map(k => DOC_ROLES.find(r => r.key === k));

// How far into the first page a title can be, and how long a line can be and
// still be one. A contract announces itself in the first inch of page one —
// "MAINTENANCE SERVICE AGREEMENT" — while a paragraph that happens to mention
// "the quotation attached hereto" runs long, so length alone separates the two
// most of the time.
const ROLE_HEADING_LINES = 12;
const ROLE_HEADING_MAX_CHARS = 60;

// The opening lines of a document's first page, paragraphs only. A grid cell is
// never a title, and reading tables here is how "Quotation" in a cost table's
// column header would come to name the whole document.
function docHeadingLines(entry, doc) {
  const pages = (entry && entry.pages) || [];
  // The user's own top-level file has no join into pages[] -- entry.pages IS its
  // page list. Everything else joins by pagesIndex.
  const node = doc && doc.isSelf ? { pages } : pages[doc && doc.pagesIndex];
  const first = (node && node.pages && node.pages[0]) || null;
  if (!first || !Array.isArray(first.blocks)) return [];
  const out = [];
  for (const b of first.blocks) {
    // Email body pages carry `lines` with no `type`, so presence decides rather
    // than the label. Tables have `rows` and no `lines`, and so are skipped.
    if (!b || !Array.isArray(b.lines)) continue;
    for (const line of b.lines) {
      out.push(String(line));
      if (out.length >= ROLE_HEADING_LINES) return out;
    }
  }
  return out;
}

// Which role a document's own title claims, or null when it never says.
function headingRoleOf(lines) {
  for (const raw of lines || []) {
    const line = String(raw).trim();
    if (line.length < 3 || line.length > ROLE_HEADING_MAX_CHARS) continue;
    // "Quotation Ref: QT-2600008" is a labelled value that an agreement's first
    // page carries perfectly happily. A colon means label and value, not title.
    if (/[:\uFF1A]/.test(line)) continue;
    for (const role of ROLE_MATCH_ORDER) if (role.heading.test(line)) return role.key;
  }
  return null;
}

// Signing outranks the filename. A quotation that has been signed or chopped is
// the document the parties are bound by, whatever the file is still called, and
// that is the copy a reviewer means when they say "the agreement" — so it fills
// the Agreement slot and vacates the one it came from.
//
// ATQ is exempt. It is an internal authorisation form, and a chop on it
// authorises rather than agrees; promoting it would empty the ATQ slot, which
// is the one thing the slot exists to fill.
const PROMOTED_BY_SIGNING = ["quotation"];

// The engine reports both, and either one is enough: a company chop binds a
// document here as firmly as a pen does. `inspected` is a page count, so a
// document nobody looked at reports false — ignorance, not absence, and the
// conservative direction to be wrong in, since it only declines to promote.
function isSignedDoc(doc) {
  const s = doc && doc.signing;
  return !!(s && (s.hasSignature || s.hasChop));
}

// The file that answered, with the decorations computeFieldDiffs appends
// stripped back off: " › child" for a .mht's sub-document, " (item 3)" for one
// record of an ATQ.
function sourceBaseName(source) {
  const name = String((source && source.fileName) || "");
  return name.split("\u203A").pop().replace(/\s*\(item[^)]*\)\s*$/i, "").trim();
}

// What the file is called, what it calls itself, and where it was dropped —
// before signing is taken into account. null for a document that is none of the
// four: a covering letter or a spec sheet has no slot, and says so by never
// appearing in one. Such a document still contributes its values to the diff;
// it is only the cross-check that has nowhere to put it.
//
// The filename is asked first and the heading second, so a name that answers
// keeps the behaviour it already had; the heading is what rescues the scan
// called "20260810_001.pdf", whose name says nothing at all. The tab is last,
// being only a record of where the user happened to drop the file.
function namedRoleOfSource(source) {
  if (!source) return null;
  const base = sourceBaseName(source);
  for (const role of ROLE_MATCH_ORDER) if (role.file.test(base)) return role.key;
  if (source.headingRole) return source.headingRole;
  for (const role of ROLE_MATCH_ORDER) if (role.types.indexOf(source.typeKey) >= 0) return role.key;
  return null;
}

// The slot a document would fill if nobody said otherwise. `source.signed` is
// set by whoever built the source, because signing lives on the document and a
// source is only a reference to one.
//
// `source.offItem` is set by whoever built the source (see itemQuotationFiles):
// an email covering "Item 2 & 3" carries one quotation per item, and the ATQ
// itself says which is which. A quotation the anchored item does not name is
// another item's quotation -- it fills no slot here, so the Quotation column
// stops showing item 3's vendor while item 2 is on screen. It stays in the
// census pool, so an explicit reassignment (handled in roleOfSource, above this
// rule) still overrides.
function autoRoleOfSource(source) {
  const named = namedRoleOfSource(source);
  if (source && source.signed && PROMOTED_BY_SIGNING.indexOf(named) >= 0) return "agreement";
  if (named === "quotation" && source && source.offItem) return null;
  return named;
}

// One document's identity across the whole upload. A sub-document and an ATQ
// record share their container's docIndex — deliberately, because the container
// is the deepest thing the viewer can open, and because a record is not a
// separate document to be assigned a role of its own.
function docKeyOf(source) {
  return source ? source.typeKey + "#" + source.docIndex : "";
}

// The slot a document actually fills, after the reviewer has had their say.
// `overrides` maps a role key to the docKey the reviewer picked for it, and is
// absent everywhere the assignment has never been touched.
//
// Two rules, and the second is the one that is easy to forget: an explicit
// assignment wins, AND a document loses the role it would have taken on its own
// once that role has been handed to somebody else. Without the second rule two
// files would answer for Agreement and the bar would name only one of them.
function roleOfSource(source, overrides) {
  if (!overrides) return autoRoleOfSource(source);
  const key = docKeyOf(source);
  for (const role of DOC_ROLES) {
    if (overrides[role.key] && overrides[role.key] === key) return role.key;
  }
  const auto = autoRoleOfSource(source);
  if (auto && overrides[auto] && overrides[auto] !== key) return null;
  return auto;
}

// Which of the roles this upload actually carries, so the comparison panel can
// say "this document is silent about this field" rather than implying one
// exists.
//
// `promoted` holds the slots a signed document vacated on its way to Agreement.
// Without it the Quotation chip would go grey next to an upload that plainly
// contains a quotation, and say "none here" about a file the reviewer can see.
//
// `offItemTest` is offItemQuotationTest's return value for the item on screen.
// Optional: omitted (goProcess, which has to reach every item's documents, and
// every test that predates per-item quotations) means no document is ever ruled
// out. A ruled-out quotation keeps its place in `docs` -- it is still a file the
// reviewer can hand the slot to by name -- it just no longer takes the slot on
// its own, and does not count as a promoted-away quotation either.
const EMPTY_ROLE_OVERRIDES = {};
function roleCensus(attachments, overrides, offItemTest) {
  const present = new Set();
  const promoted = new Set();
  // Every document the reviewer could hand a role to, in upload order — the
  // options the editor offers, and the pool `assigned` is chosen from.
  const docs = [];
  ATTACHMENT_TYPES.forEach(typeKey => {
    const entry = attachments && attachments[typeKey];
    if (!entry || !entry.parsed) return;
    const own = (entry.docs || []).filter(d => d && !d.inline);
    // A single dropped file is its own only document; the entry carries what
    // the engine said about it. docIndex -1 matches what computeFieldDiffs
    // stamps on that same case, so the two agree on identity.
    const items = own.length
      ? own
      : [{ index: -1, fileName: entry.file || typeKey, signing: entry.signing, isSelf: true }];
    items.forEach(d => {
      // Same three signals in the same order as computeFieldDiffs, or the grey
      // chips would be answering a different question from the coloured ones.
      const source = { typeKey, docIndex: d.index, fileName: d.fileName, signed: isSignedDoc(d),
        headingRole: headingRoleOf(docHeadingLines(entry, d)),
        offItem: !!(offItemTest && offItemTest(typeKey, d.fileName)) };
      const named = namedRoleOfSource(source);
      const actual = roleOfSource(source, overrides);
      if (actual) present.add(actual);
      if (named && named !== actual && !source.offItem && !(overrides && overrides[named])) promoted.add(named);
      // What the form would read out of this document if it were asked. A
      // workbook's per-item rows live in `records` and the form takes one row
      // at a time, so both are carried and the caller picks. ATQ records keep
      // their own unambiguous column names, so they are exempt from the per-tab
      // allowlist exactly as an upload of one is.
      const recs = (d.isSelf ? entry.records : d.records) || [];
      docs.push(Object.assign({ key: docKeyOf(source), role: actual,
        fields: (d.isSelf ? entry.rawFields : d.fields) || [],
        // The document's own text, for the values its labels failed to pair up
        // (quotationRefFromText). Never the whole email's: a container's text
        // is every attachment's at once, which is exactly the flattened-junk
        // problem the per-document view exists to avoid.
        textBlock: (d.isSelf ? entry.text : d.textBlock) || "",
        records: recs.length ? recs : null,
        unrestricted: !!(d.isSelf ? entry.isAtqRecord : recs.length),
        // Whether this document still owes a real OCR read, so a role slot can
        // say "未讀" rather than silently comparing against a page nobody has
        // seen yet.
        ocrPending: !!d.ocrPending, resumable: !!d.resumable }, source));
    });
  });
  // Which document answers for each role. Two contracts can both be agreements;
  // the bar names the one a reviewer would open and counts the rest, rather
  // than picking silently.
  const assigned = {};
  DOC_ROLES.forEach(role => {
    const mine = docs.filter(d => d.role === role.key).sort((a, b) => docRankFor(a, role.key) - docRankFor(b, role.key));
    // An explicit override wins even when the document it names is already
    // standing for another role. One file legitimately IS two roles sometimes --
    // a signed quotation that is also the agreement -- but `d.role` is
    // single-valued (roleOfSource returns the FIRST role whose override matches),
    // so before this the second slot sat empty and n8n was posted three
    // documents while the reviewer was looking at four. The double duty has to be
    // asked for on both sides: nothing here lets a document take a second role on
    // its own, only an override the reviewer set by hand.
    const pinnedKey = overrides && overrides[role.key];
    const pinned = pinnedKey && !mine.some(d => d.key === pinnedKey)
      ? docs.find(d => d.key === pinnedKey)
      : null;
    if (pinned) {
      present.add(role.key);
      assigned[role.key] = { doc: pinned, also: 0, manual: true, shared: true };
      return;
    }
    assigned[role.key] = mine.length
      ? { doc: mine[0], also: mine.length - 1, manual: !!(overrides && overrides[role.key]) }
      : null;
  });
  return { present, promoted, docs, assigned, overrides: overrides || null };
}

// Extra Quotation documents the reviewer added by hand in RoleAssignmentEditor,
// beyond the slot's own `assigned.quotation.doc` -- some items genuinely have
// more than one vendor quotation to send. Deliberately send-only: unlike the
// slot itself, these never run through roleCensus' role resolution, so they
// carry no field extraction and no cross-check -- see roleDocumentsForSend and
// CLAUDE.md's "Quotation slot is per item" note for why the auto-detected slot
// stays single. `overrides.quotationExtra` is a plain array of doc keys, kept
// alongside the DOC_ROLES keys on the same overrides object without disturbing
// any of the DOC_ROLES.forEach / role.key lookups elsewhere, which never touch
// a key outside DOC_ROLES.
function extraQuotationDocs(census) {
  const keys = (census && census.overrides && census.overrides.quotationExtra) || [];
  return keys.map(k => (census.docs || []).find(d => d.key === k)).filter(Boolean);
}

// A PDF print and the workbook it was exported from can both fill the ATQ slot.
// Show the one a reviewer would open. Every other role prefers the PDF (the
// printed document a reviewer would open); the ATQ role prefers the workbook
// instead, because the Cost worksheet -- not the PDF print -- is the document
// of record for per-item values (see atqCostRecordsForItem).
function docRankFor(source, roleKey) {
  const isPdf = /\.pdf$/i.test(sourceBaseName(source));
  if (roleKey === "atq") return isPdf ? 1 : 0;
  return isPdf ? 0 : 1;
}

/* ---------- Documents against each other ----------
   computeFieldDiffs already partitions every source into equivalence classes by
   normalised value, which means the cross-document answer is sitting there
   waiting to be read off:

       two roles agree on a field  <=>  their sources landed in the same group.

   So nothing below re-normalises and nothing below re-compares. This is a
   projection of diff.groups onto the role slots, one bucketing pass, and any
   version of it that calls DIFF_KEYS[key] again is the wrong version.

   It is a separate function from computeFieldDiffs on purpose. That one is
   memoised on the attachments and the item tab and walks every document, child
   and record; roles depend on the reviewer's overrides, which change every time
   they touch a dropdown. Folding the two together would re-read every attachment
   to recompute something already in hand. */

// The role the others are named against when a split has to be described in
// words. It never decides *whether* a pair conflicts — every pair is compared
// either way — only which side reads as the odd one out when the split is
// otherwise symmetrical. The three form-filling roles keep ROLE_DETECT_ORDER's
// precedence.
const REFERENCE_ORDER = ["atq", "agreement", "quotation"];

const SEVERITY_RANK = { same: 0, similar: 1, different: 2 };

function worstSeverity(list) {
  return list.reduce((acc, s) => (SEVERITY_RANK[s] > SEVERITY_RANK[acc] ? s : acc), "same");
}

// How two documents' readings of one field compare. `ga` and `gb` are entries of
// diff.groups, so identity is the whole of the equality test.
//
// The softening rules are computeFieldDiffs' own, applied to a two-element
// slice. Per pair they are strictly more accurate than field-wide: listCoversRest
// needs the listing group to cover *every* other group, so a single unrelated
// third value used to harden a field whose actual relationship was one document
// summarising another.
function pairSeverity(key, ga, gb) {
  if (ga === gb) return { severity: "same", softReason: "" };
  if (FUZZY_DIFF_KEYS.indexOf(key) < 0) return { severity: "different", softReason: "" };
  const sub = [ga, gb];
  if (tokenJaccard(ga.norm, gb.norm) >= DIFF_JACCARD_MIN)
    return { severity: "similar", softReason: "differs only in wording" };
  if (listCoversRest(key, sub))
    return { severity: "similar", softReason: "is listed among the other document's values" };
  if (ourCompanyOnlyDissent(sub))
    return { severity: "similar", softReason: "names " + OUR_COMPANY.label +
      " where the other names the counterparty — likely a letterhead read as a party" };
  return { severity: "different", softReason: "" };
}

// A role nobody filled, or one whose document never mentioned this field. Both
// are silence, and silence is not disagreement: neither joins a pair, neither
// colours anything, and neither can make a check fail. The three cases are told
// apart only so the tooltip can say which one it is.
function quietRole(role, diff, census) {
  const present = census && census.present;
  const promoted = census && census.promoted;
  let state, why;
  if (present && present.has(role.key)) {
    state = "silent";
    why = "The " + role.label + " does not mention " + diff.label;
  } else if (promoted && promoted.has(role.key)) {
    // Not "none here": the file is in the upload, it is just signed, and a
    // signed one is read as the agreement.
    state = "promoted";
    why = "The " + role.label + " in this upload is signed or chopped, so it is listed under Agreement";
  } else {
    state = "absent";
    why = "No " + role.label + " in this upload";
  }
  return { role, state, values: [], selfConsistent: true, docKeys: [], why };
}

// One pair of roles, worst reading wins. Two documents in one slot mean a role
// can hold more than one value, so this is a cross-product and not a comparison
// of two strings.
//
// `weightOf` counts how many roles reported a value across the whole field, and
// is what decides which side of the pair the click opens. The reference role is
// only the tie-break, because the reference can itself be the problem: when an
// ATQ workbook contradicts its own PDF print, every pair the ATQ is in dissents,
// and sending the reviewer to the *other* role would open the one document that
// has nothing wrong with it.
function buildRolePair(key, aKey, bKey, roles, refRole, weightOf) {
  const A = roles[aKey], B = roles[bKey];
  let worst = null;
  A.values.forEach(va => B.values.forEach(vb => {
    const v = pairSeverity(key, va.group, vb.group);
    if (!worst || SEVERITY_RANK[v.severity] > SEVERITY_RANK[worst.severity]) {
      worst = { severity: v.severity, softReason: v.softReason, va, vb };
    }
  }));
  const wa = weightOf(worst.va.group), wb = weightOf(worst.vb.group);
  const offKey = wa !== wb ? (wa < wb ? aKey : bKey)
    : aKey === refRole ? bKey : bKey === refRole ? aKey : bKey;
  const off = offKey === aKey ? worst.va : worst.vb;
  return {
    key: aKey + "|" + bKey,
    a: A.role, b: B.role, aKey, bKey,
    severity: worst.severity, softReason: worst.softReason,
    aValue: worst.va.value, bValue: worst.vb.value,
    agrees: worst.severity === "same",
    dissent: worst.severity === "same" ? null : (off.sources[0] || null),
  };
}

// Two documents sharing one slot that do not agree with each other. An ATQ's PDF
// print and the workbook behind it normally say the same thing; when they do
// not, that is a conflict in its own right and not something to average away by
// picking whichever one the slot happens to name.
function buildIntraSplit(key, roleEntry) {
  const vals = roleEntry.values;
  let worst = { severity: "same", softReason: "", va: vals[0], vb: vals[1] };
  for (let i = 0; i < vals.length; i++) {
    for (let j = i + 1; j < vals.length; j++) {
      const v = pairSeverity(key, vals[i].group, vals[j].group);
      if (SEVERITY_RANK[v.severity] > SEVERITY_RANK[worst.severity]) {
        worst = { severity: v.severity, softReason: v.softReason, va: vals[i], vb: vals[j] };
      }
    }
  }
  return {
    role: roleEntry.role,
    severity: worst.severity, softReason: worst.softReason,
    values: vals.map(v => v.value),
    dissent: (worst.vb && worst.vb.sources[0]) || null,
  };
}

// The cross-check for one field.
function crosscheckField(diff, census) {
  const overrides = census ? census.overrides : null;
  const groups = diff.groups || [];

  // Which role said what, keeping the group identity so agreement stays a
  // pointer comparison rather than another string compare.
  const byRole = {};
  const unslotted = [];
  groups.forEach(g => g.sources.forEach(s => {
    const roleKey = census ? roleOfSource(s, overrides) : null;
    // A document that fills no slot -- a covering letter, a .mht sub-document --
    // still reported a value and is still worth naming, but it has no role to
    // cross-check against and so joins no pair.
