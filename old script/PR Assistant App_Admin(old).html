// A horizontal read of admin_btb_lis_excel_datas4' own admin_processstatus4
// lifecycle (New Create / Data Verifying / Return to SB / PO Waiting /
// Create LIS / Finished) -- sits above every page that shares one
// Record_ID's progress (Upload through LIS & Remark; see App's own render
// for which pages), so it persists across page changes instead of restarting.
//
// `currentStageKey` is one of PROCESS_STAGE_ORDER's four values, or undefined
// before anything local has happened yet (e.g. a record derived from the
// upload but "Start" not clicked). Only those four are ever "done" here --
// "Return to SB" and "PO Waiting" stay on the line because a reviewer who
// knows the backend should still see the full six-stage lifecycle, but this
// app has no page where it would learn either one actually happened, so
// checking them off would be a claim it cannot back up. The connecting LINE
// still runs solid through them once the record has moved past that point in
// time -- only the two node fills themselves stay honest about what is
// unconfirmed. Rendered once in App's own shell rather than per-page, so it
// never restarts its transition when the reviewer moves between pages -- see
// its render for why this is not a Card-based, per-page component.
function ProcessStatusTimeline({ recordId, currentStageKey }) {
  if (!recordId) return null;
  const currentIndex = PROCESS_TIMELINE_STAGES.findIndex(s => s.key === currentStageKey);
  return (
    <div className="w-full px-5 md:px-8 pt-5 shrink-0" aria-label={"Process status: " + (PROCESS_TIMELINE_STAGES[currentIndex] ? PROCESS_TIMELINE_STAGES[currentIndex].label : "not started")}>
      <ol className="flex items-start">
        {PROCESS_TIMELINE_STAGES.map((stage, i) => {
          // "Finished" is terminal -- it is the one node that counts as both
          // current AND done the moment it is reached, since nothing follows
          // it. Every other node hands off "current" to the next one instead.
          const done = stage.tracked && currentIndex >= 0 &&
            (i < currentIndex || (i === currentIndex && stage.key === "finished"));
          const current = i === currentIndex && !done;
          const lineFilled = currentIndex >= 0 && i < currentIndex;
          return (
            <React.Fragment key={stage.key}>
              <li className="flex flex-col items-center gap-1.5 shrink-0 w-[92px]">
                <span className={"flex items-center justify-center w-6 h-6 rounded-full text-[11px] font-bold ui-transition " +
                  (done ? "bg-[var(--green)] text-white" :
                   current ? "bg-[#FFF3D6] text-[var(--orange-dark)] ring-2 ring-[var(--orange-dark)]" :
                   "bg-white text-[#8E8E93] border-2 border-[var(--line)]")}>
                  {done ? <Icon name="check" className="w-3.5 h-3.5" /> : i + 1}
                </span>
                <span className={"text-[16px] text-center leading-tight " +
                  (done || current ? "font-bold text-[var(--ink)]" : "text-[#8E8E93]")}>
                  {stage.label}
                </span>
              </li>
              {i < PROCESS_TIMELINE_STAGES.length - 1 && (
                <div className={"h-[2px] flex-1 mt-[11px] ui-transition " + (lineFilled ? "bg-[var(--green)]" : "bg-[var(--line)]")} />
              )}
            </React.Fragment>
          );
        })}
      </ol>
    </div>
  );
}

// A custom listbox standing in for a native <select> wherever the open/close
// itself should animate -- a native select's own popup is drawn by the OS,
// which no amount of CSS reaches. Kept to open/close only (click a row to
// pick, click outside or Escape to close): no arrow-key roving yet, so this
// is deliberately NOT dropped into the Role Assignment Editor's selects,
// which render.test.js pins by reading real <option selected=""> markup off
// renderToStaticMarkup output -- a component with no <select> at all would
// need that test rewritten, not just restyled.
function AnimatedSelect({ value, onChange, options, disabled, placeholder, title, triggerClassName, panelClassName, optionClassName, fullWidth }) {
  const [open, setOpen] = useState(false);
  const rootRef = useRef(null);
  const current = options.find(o => String(o.value) === String(value));

  useEffect(() => {
    if (!open) return;
    const onOutside = (e) => {
      if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(false);
    };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    window.addEventListener("mousedown", onOutside);
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("mousedown", onOutside);
      window.removeEventListener("keydown", onKey);
    };
  }, [open]);

  return (
    <div ref={rootRef} className={"relative " + (fullWidth ? "col-span-6 block w-full" : "inline-block")}>
      <button type="button" title={title} disabled={disabled}
        onClick={() => setOpen(o => !o)}
        className={triggerClassName}>
        <span className={fullWidth ? "" : "truncate"}>{current ? current.label : (placeholder || "")}</span>
        <Icon name="chevronDown" className={"w-3.5 h-3.5 shrink-0 ui-transition" + (open ? " rotate-180" : "")} />
      </button>
      {open && (
        <div className={"absolute z-20 mt-1.5 min-w-full max-h-64 overflow-auto dropdown-pop " + (panelClassName || "rounded-lg border-[1.5px] border-[var(--line)] bg-white shadow-[0_12px_28px_rgba(29,29,31,0.14)]")}
          style={{ transformOrigin: "top" }}>
          {options.map(opt => (
            <button key={opt.value} type="button"
              onClick={() => { onChange(opt.value); setOpen(false); }}
              className={"block w-full text-left whitespace-nowrap ui-transition hover:bg-[#FFF4DE] " + (optionClassName || "px-3 py-2 text-[13px]") + " " +
                (String(opt.value) === String(value) ? "bg-[#FFF4DE] text-[var(--orange-dark)] font-semibold" : "text-[var(--ink)]")}>
              {opt.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Sidebar ---------- */

// Where each nav item's click actually goes, when that differs from its own
// key -- see the "verify" entry in NAV_ITEMS for why.
const NAV_TARGET_PAGE = { verify: "extracted" };

function Sidebar({ page, setPage, currentRecord, progress, onNewRecord, collapsed, setCollapsed, adminMode, setAdminMode, disabledKeys = [] }) {
  const activeKey = page === "records" ? "records" : page === "reply" ? "reply" : page === "lis" ? "lis" : (page === "verify" || page === "extracted") ? "verify" : "upload";
  const stepIndex = NAV_ITEMS.findIndex(item => item.key === activeKey);
  return (
    <aside className={(collapsed ? "w-[92px] px-3" : "w-[260px] px-4") + " workflow-rail sidebar-float-in bg-[#F4F0E8] border border-[#D8D3C9] rounded-3xl shadow-[0_20px_44px_rgba(29,29,31,0.14)] flex flex-col gap-0 py-5 shrink-0 fixed left-4 top-4 bottom-4 ui-transition"}>
      {/* An edge tab, not a header-row button: anchored to the rail's own
          right border instead of sitting in-flow above the logo, so it reads
          as the rail's own handle rather than a stray toolbar control
          competing with the brand for the first line. `right` is measured
          from the aside's own edge, so the tab rides along for free as
          .workflow-rail's width transitions between collapsed/expanded --
          no separate position tween to keep in sync.
          A direct child of <aside> on purpose, sitting OUTSIDE the scrolling
          wrapper below: <aside> used to carry overflow-y-auto itself, and a
          browser silently turns a lone overflow-y onto overflow-x: auto too
          -- clipping the half of this tab that hangs past the rail's right
          edge. Moving the scroll to its own inner div leaves <aside> with no
          overflow at all, so it stops clipping anything positioned outside
          its padding box. */}
      <button type="button" onClick={() => setCollapsed(!collapsed)}
        aria-label={collapsed ? "Expand sidebar" : "Collapse sidebar"}
        className="clickable-cue ui-transition pressable absolute top-9 -right-3.5 z-10 w-7 h-7 rounded-full flex items-center justify-center bg-white border border-[#D8D3C9] text-[#6E6E73] hover:bg-[var(--orange)] hover:border-[var(--orange)] hover:text-[var(--ink)]">
        <Icon name="chevronLeft" className={"sidebar-toggle-icon w-3.5 h-3.5" + (collapsed ? " rotate-180" : "")} />
      </button>
      <div className="flex-1 min-h-0 flex flex-col overflow-y-auto">
      <div className={(collapsed ? "items-center" : "items-start") + " pb-6 flex flex-col gap-3"}>
        <div className={(collapsed ? "justify-center" : "justify-start") + " flex items-center gap-3"}>
          <div className="w-12 h-12 rounded-2xl bg-[var(--orange)] text-[var(--ink)] flex items-center justify-center shadow-[0_10px_28px_rgba(255,153,0,0.28)]">
            <Icon name="file" className="w-6 h-6" />
          </div>
          {!collapsed && (
            <div>
              <div className="text-[11px] font-bold uppercase text-[var(--orange)] tracking-[0.16em]">{OUR_COMPANY.unit}</div>
              <div className="mt-0.5 text-[25px] leading-7 font-bold text-[var(--ink)]" style={{fontFamily:"'Space Grotesk', system-ui, sans-serif"}}>PR Assistant</div>
            </div>
          )}
        </div>
        {!collapsed && adminMode && (
          <div className="w-fit flex items-center gap-2 pl-3 pr-2 py-1.5 rounded-full bg-[#F59E0B]/15 text-[#FDE68A] text-[12px] font-bold">
            <span>ADMIN MODE</span>
            <button type="button" onClick={() => setAdminMode(false)} aria-label="Exit admin mode"
              className="w-4 h-4 rounded-full flex items-center justify-center hover:bg-[#F59E0B]/30 ui-transition">×</button>
          </div>
        )}
        {collapsed && adminMode && (
          <button type="button" onClick={() => setAdminMode(false)} aria-label="Exit admin mode"
            className="w-2.5 h-2.5 rounded-full bg-[#F59E0B] hover:w-3 hover:h-3 ui-transition" />
        )}
      </div>

      {/* Compact flat menu, not a wizard stepper: a single-line 48px row per
          step (muted number + 19px icon that swaps to a check once done +
          label), state read from icon colour/position/active tint rather
          than a subtitle or a spelled-out Current/Done/Pending word. The word
          is not gone, just not printed -- sr-only keeps it for screen
          readers. */}
      <nav className="py-4 flex flex-col gap-1" aria-label="Workflow">
        {NAV_ITEMS.map((item, index) => {
          const active = activeKey === item.key;
          const done = index < stepIndex;
          const stateLabel = active ? "Current" : done ? "Done" : "Pending";
          // Reply reads whichever record happens to be first in Master
          // Records (or a "--"/"--"/"--" placeholder when there are none) --
          // it has nothing real to show until at least one record exists, so
          // jumping there early looks like a real draft when it is not.
          const disabled = disabledKeys.includes(item.key);
          return (
            <button key={item.key} type="button" onClick={() => { if (!disabled) setPage(NAV_TARGET_PAGE[item.key] || item.key); }}
              disabled={disabled} aria-disabled={disabled || undefined}
              aria-current={active ? "page" : undefined}
              aria-label={collapsed ? item.label : undefined}
              title={disabled ? `${item.label} -- save a record first` : undefined}
              className={((disabled ? "" : "group ") + "relative w-full flex items-center " + (collapsed ? "justify-center px-0" : "gap-3 px-3") + " h-12 border-l-[3px] rounded-r-lg text-left ui-transition pressable-surface " +
                (disabled ? "border-transparent text-[#B5AFA6] cursor-not-allowed" :
                 active ? "border-[var(--orange-dark)] bg-[#FFF3D6]" : "border-transparent hover:bg-white"))}>
              {!collapsed && (
                <span className={"shrink-0 w-4 text-center text-[12px] font-bold tabular-nums " +
                  (disabled ? "text-[#C5BEB6]" : active ? "text-[var(--orange-dark)]" : done ? "text-[var(--green)]" : "text-[#8E8E93] group-hover:text-[var(--ink)]/70")}>
                  {index + 1}
                </span>
              )}
              <span className={"shrink-0 flex items-center justify-center " +
                (disabled ? "text-[#C5BEB6]" : active ? "text-[var(--orange-dark)]" : done ? "text-[var(--green)]" : "text-[#6E6E73] group-hover:text-[var(--ink)]")}>
                {done ? <Icon name="check" className="w-[19px] h-[19px]" /> : <Icon name={item.icon} className="w-[19px] h-[19px]" />}
              </span>
              {!collapsed && (
                <React.Fragment>
                  <span className={"min-w-0 truncate text-[15px] font-bold " + (disabled ? "text-[#B5AFA6]" : "text-[var(--ink)]")}>
                    {item.label}
                  </span>
                  <span className="sr-only">{disabled ? "Locked" : stateLabel}</span>
                </React.Fragment>
              )}
            </button>
          );
        })}
      </nav>

      <div className="flex-1" />
      <button onClick={onNewRecord}
        aria-label={collapsed ? "New Record" : undefined}
        className={"clickable-cue w-full min-h-12 mt-4 py-2.5 rounded-xl bg-[var(--orange)] hover:bg-white text-[var(--ink)] text-[16px] font-bold ui-transition pressable " + (collapsed ? "px-0" : "px-4")}>
        {collapsed ? "+" : "+ New Record"}
      </button>
      <div className="mt-2 text-center text-[11px] text-[#8E8E93]">
        V{APP_VERSION}
      </div>
      </div>
    </aside>
  );
}

/* ---------- Document viewer ---------- */

// Docparse never keeps a scanned page's original appearance -- it extracts text
// and throws the pixels away. But "does this agreement carry a company chop?"
// is a question offline OCR cannot answer, so the original has to be shown to a
// human. The engine now retains each attachment's bytes as a Blob; everything
// below is the read-only surface over those bytes.

const VIEWER_IMAGE_EXTS = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp"];

// Mirrors the engine's own previewKindFor(). Only reached for a `self`
// descriptor that an engine build didn't attach -- every doc the engine
// produces already carries previewKind, so this is a fallback, not a second
// source of truth.
function previewKindForExt(ext) {
  if (ext === "pdf") return "pdf";
  if (VIEWER_IMAGE_EXTS.includes(ext)) return "image";
  if (["xlsx", "xls", "csv"].includes(ext)) return "sheet";
  if (["mht", "mhtml", "html", "htm"].includes(ext)) return "html";
  if (ext === "txt") return "text";
  return "other";
}

const PREVIEW_ICONS = { pdf: "file", image: "image", sheet: "sheet", html: "html", text: "text", other: "file" };

// Amber, for "parsed but degraded" -- the palette's fourth state alongside
// STATUS_STYLES' Pending/Completed/Flagged.
const VIEWER_WARN_PILL = "bg-[#FEF3C7] text-[var(--amber)]";
// Green, for something found rather than something wrong: a signature or a
// company chop on the page.
const VIEWER_FOUND_PILL = "bg-[#DCFCE7] text-[var(--green)]";
// Grey, for a finding that is real but is our own ink. Kept on screen rather
// than dropped -- see markIsOurs -- but not coloured like the counterparty's,
// because our own chop answers no question a reviewer has.
const VIEWER_OURS_PILL = "bg-[#E8E8ED] text-[var(--muted)]";

// "Signed" and "Chopped" are claims about a document, so they say which page
// they are standing on. Absence of a signature is deliberately NOT shown as a
// pill -- most attachments are quotations and workbooks that were never meant
// to be signed, and a row of grey "unsigned" badges would say nothing.
function signingPills(signing) {
  if (!signing) return [];
  const where = (marks) => {
    const pages = Array.from(new Set(marks.map(m => m.page)));
    return pages.length > 1 ? `pages ${pages.join(", ")}` : `page ${pages[0]}`;
  };
  // A document we issued and signed ourselves is not evidence the other side
  // agreed to anything, so the plain pill is about THEIR ink. Ours still gets
  // a pill -- greyed, and saying whose it is -- because a silently dropped
  // finding is indistinguishable from one that was never made.
  const pill = (kind, found, label, describe) => {
    if (!found) return null;
    const all = (signing.marks || []).filter(m => m.kind === kind);
    const theirs = all.filter(m => !markIsOurs(m));
    // `all.length &&` matters: a signing summary with no mark list at all
    // (demo data, an older result) knows only that something was found. That
    // is not the same as knowing it was ours, and claiming so would grey out a
    // real counterparty chop.
    if (all.length && !theirs.length) {
      return { label: `${label} (${OUR_COMPANY.label})`, ours: true,
        title: `Only our own ${describe} was found, on ${where(all)} — the other party has not ${label.toLowerCase()} this` };
    }
    const names = Array.from(new Set(theirs.map(markOwnerName).filter(Boolean)));
    return { label, ours: false,
      title: `${names.length ? names.join(", ") + "'s " : "A "}${describe} was found on ${where(theirs)}` };
  };
  return [
    pill("signature", signing.hasSignature, "Signed", "handwritten signature"),
    pill("chop", signing.hasChop, "Chopped", "company chop"),
  ].filter(Boolean);
}

function formatBytes(n) {
  if (!n) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

// A spreadsheet's "pages" are worksheets; saying "3 pages" for a workbook is
// just wrong. Short form ("6p" / "3sh") is for the narrow right-rail rows.
function countLabel(doc, short) {
  if (!doc.pageCount) return "";
  const sheet = doc.previewKind === "sheet";
  if (short) return doc.pageCount + (sheet ? "sh" : "p");
  return doc.pageCount + " " + (sheet ? "sheet" : "page") + (doc.pageCount > 1 ? "s" : "");
}

// The file the user picked, described exactly like one of its own attachments
// so the viewer can render both with the same components. When that file is an
// email there is no visual original -- pages[0].lines is the body text, which
// is all "the original" can honestly mean.
function selfDocFor(entry) {
  if (!entry) return null;
  let s = entry.self;
  if (!s && entry.fileObj) {
    const ext = (entry.fileObj.name.split(".").pop() || "").toLowerCase();
    s = { fileName: entry.fileObj.name, ext, mimeType: entry.fileObj.type || "",
          size: entry.fileObj.size, blob: entry.fileObj, previewKind: previewKindForExt(ext) };
  }
  if (!s) return null;
  const body = (entry.pages || [])[0];
  const isEmail = !!(body && body.lines);
  // A top-level .mht has BOTH shapes: the engine gives it the email page shape
  // (pages[0].lines is its stripped text) and a self-contained previewHtml.
  // previewHtml wins -- the whole point of the format is that it renders.
  // Reference only, never a copy: this string can run to ~16 MB.
  const previewHtml = entry.previewHtml || null;
  return {
    ...s,
    isSelf: true,
    status: "parsed",
    inline: false,
    note: "",
    hadOcr: false,
    pageCount: 0,
    pagesIndex: -1,
    fields: entry.rawFields || [],
    // The dropped file's own ink, so ViewerHeader's Signed/Chopped pill answers
    // for a single document the same way it does for an email's attachments.
    signing: entry.signing || null,
    previewHtml,
    previewKind: previewHtml ? "html" : (isEmail ? "text" : (s.previewKind || previewKindForExt(s.ext || ""))),
    textLines: isEmail ? body.lines : null,
  };
}

// A doc's render tree lives in result.pages[], joined by pagesIndex. Two traps:
// a skipped/failed doc still has a pagesIndex, pointing at a {skipped:true}
// entry with no `pages` array; and the user's own top-level file has no join at
// all -- result.pages IS its page list.
function sheetPagesFor(entry, doc) {
  const pages = (entry && entry.pages) || [];
  if (doc.isSelf) return Array.isArray(pages) ? pages.filter(p => p && p.html) : [];
  const node = pages[doc.pagesIndex];
  return node && Array.isArray(node.pages) ? node.pages.filter(p => p && p.html) : [];
}

/* ---------- Preview panes, one per previewKind ---------- */

// SheetJS emits a bare <table> with no styling and unverified escaping. The
// sandbox iframe answers both: it makes the markup inert, and it gives the
// table somewhere to be styled without leaking CSS into the app.
function wrapSheetHtml(html) {
  return `<style>
    body{margin:0;padding:14px;font:12px Inter,system-ui,sans-serif;color:#1A1A1A;background:#fff;}
    table{border-collapse:collapse;}
    td,th{border:1px solid #C5BEB6;padding:4px 8px;white-space:nowrap;vertical-align:top;}
    tr:first-child td{background:#F3EBE2;font-weight:600;}
  </style>` + html;
}

// srcDoc rather than src={objectURL}: navigating an iframe to a blob: URL from
// a file:// page lands on an opaque origin that Chrome refuses, and it fails
// silently. srcDoc isn't a navigation, so it works everywhere. sandbox="" (no
// allow-scripts, no allow-same-origin) keeps the content completely inert.
// Shared by every preview PDF's own page-by-page canvas does not cover --
// sheet, image and text renderings have no per-page raster to rescale, so
// they all get the same CSS transform instead, driven by the same zoom state
// PdfPreview's toolbar sets. "fit" reads as 1 (each of their default layouts
// already fits the pane at 100%); only the fixed percentages actually enlarge
// anything.
function zoomScale(zoom) {
  return zoom === "fit" || !zoom ? 1 : zoom;
}

function HtmlFramePreview({ html, title, zoom }) {
  const scale = zoomScale(zoom);
  // The iframe's OWN box stays fixed at the container's full size -- only the
  // transform grows -- so the on-screen result actually scales with `scale`.
  // Sizing the box itself to `100/scale`% cancels back out to a constant
  // on-screen footprint (50% box * scale(2) = 100% either way), which is a
  // zoom control that changes the number without changing anything on screen.
  return (
    <div className="w-full h-full overflow-auto bg-white">
      <iframe sandbox="" srcDoc={html} title={title}
        style={{ transform: `scale(${scale})`, transformOrigin: "top left",
          width: "100%", height: "100%", border: 0 }}
        className="bg-white" />
    </div>
  );
}

function ImagePreview({ url, name, zoom }) {
  const scale = zoomScale(zoom);
  return (
    <div className="w-full h-full overflow-auto flex items-start justify-center p-6">
      <img src={url} alt={name}
        style={{ transform: `scale(${scale})`, transformOrigin: "top center" }}
        className="max-w-full shadow-[0px_2px_12px_0px_#0000001a] rounded" />
    </div>
  );
}

function TextPreview({ lines, zoom }) {
  const scale = zoomScale(zoom);
  return (
    <div className="w-full h-full overflow-auto p-6">
      <div className="max-w-[760px] mx-auto bg-white p-6 rounded-lg shadow-[0px_1px_3px_0px_#0000000a]
        text-[13px] leading-[21px] text-[#3D3D3D] whitespace-pre-wrap"
        style={{fontFamily:"Newsreader, serif", transform: `scale(${scale})`, transformOrigin: "top center"}}>
        {(lines || []).join("\n") || "(no text)"}
      </div>
    </div>
  );
}

// Continuous rather than a handful of fixed stops: a reviewer checking one
// dense corner of a scanned page wants "a bit more", not the next 50% jump.
// Bounded anyway -- 25% steps, floor 25%, ceiling 500% -- because these are
// still real pixels (PdfPreview rasterises at `scale`) or a real CSS
// transform (the other three previews), and an unbounded scale is a way to
// freeze the tab, not a way to read a document.
const ZOOM_MIN = 0.25;
const ZOOM_MAX = 5;
const ZOOM_STEP = 0.25;
function clampZoom(z) {
  return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
}
// Ctrl/Cmd+wheel zooms, centred on nothing in particular -- plain wheel keeps
// meaning "scroll" (pan) inside the same overflow-auto pane every preview
// already sits in, which is the standard split every PDF/map viewer uses so
// the two gestures never fight over one input.
function handleZoomWheel(e, setZoom) {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const dir = e.deltaY < 0 ? 1 : -1;
  setZoom(prev => clampZoom(zoomScale(prev) + dir * ZOOM_STEP));
}

// The +/− stepper PdfPreview's footer and PreviewZoomControls both use --
// one control so the two toolbars can never drift into different zoom
// ranges or step sizes. "Fit" resets to the `zoom === "fit"` sentinel rather
// than a fixed 100%: PdfPreview recomputes what that means from the pane's
// own width every render, and for the other three previews zoomScale reads
// it as 1 anyway.
function ZoomStepper({ zoom, setZoom }) {
  const scale = zoomScale(zoom);
  const step = dir => setZoom(prev => clampZoom(zoomScale(prev) + dir * ZOOM_STEP));
  return (
    <div className="flex items-center gap-1">
      <button onClick={() => step(-1)} disabled={scale <= ZOOM_MIN} title="Zoom out"
        className="w-7 h-7 flex items-center justify-center rounded-full text-[15px] font-semibold text-[#6B6B6B] hover:bg-[#F3EBE2] disabled:opacity-30 ui-transition pressable">
        −
      </button>
      <button onClick={() => setZoom("fit")} title="Reset zoom"
        className="min-w-[48px] px-2 py-1 rounded-full text-[11px] font-semibold text-[#6B6B6B] hover:bg-[#F3EBE2] ui-transition pressable">
        {Math.round(scale * 100)}%
      </button>
      <button onClick={() => step(1)} disabled={scale >= ZOOM_MAX} title="Zoom in"
        className="w-7 h-7 flex items-center justify-center rounded-full text-[15px] font-semibold text-[#6B6B6B] hover:bg-[#F3EBE2] disabled:opacity-30 ui-transition pressable">
        +
      </button>
    </div>
  );
}

// The zoom toolbar PdfPreview draws inline with its page controls -- sheet,
// image and text previews have no page controls to share a footer with, so
// this is the same stepper on its own strip underneath them.
function PreviewZoomControls({ zoom, setZoom }) {
  return (
    <div className="h-[52px] shrink-0 border-t border-[#C5BEB6] bg-white flex items-center justify-center gap-1 px-4">
      <ZoomStepper zoom={zoom} setZoom={setZoom} />
    </div>
  );
}

// The honest fallback: a format with no in-browser rendering path (.docx, .zip,
// a .mht before the engine can inline its parts) is still worth far more as a
// one-click download than as today's invisible attachment.
function UnsupportedPreview({ doc, url, reason }) {
  return (
    <div className="w-full h-full flex items-center justify-center p-8">
      <div className="w-full max-w-[400px] flex flex-col items-center gap-3 p-8 bg-[#F3EBE2] border border-[#C5BEB6] rounded-xl text-center">
        <div className="text-4xl"><Icon name={PREVIEW_ICONS[doc.previewKind] || "file"} className="w-8 h-8" /></div>
        <div className="text-[13px] font-semibold text-[#1A1A1A] break-all">{doc.fileName}</div>
        <div className="text-xs leading-[19px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>{reason}</div>
        {/* Three states, not two: an absent blob is a real limit worth
            explaining, whereas an absent URL is just the one paint before the
            object-URL effect runs -- saying "not retained" there would be a
            lie the user has no way to disprove. */}
        {!doc.blob
          ? <div className="text-xs text-[#B78312]" style={{fontFamily:"Newsreader, serif"}}>
              {doc.demo
                ? "Demo data — there is no original file behind this document."
                : "Original not retained — file over the 25 MB limit. Text was still parsed."}
            </div>
          : url
            ? <GhostButton href={url} download={doc.fileName}>⤓ Download original</GhostButton>
            : <GhostButton disabled>⤓ Download original</GhostButton>}
      </div>
    </div>
  );
}

/* ---------- PDF: pdf.js canvas, one page at a time ---------- */

// Thumbnails are rendered only once scrolled into view, and only after the main
// page has finished -- with pdf.js on the main thread every thumbnail competes
// with the page the user is actually waiting for.
function PdfThumb({ pdf, num, active, enabled, onClick }) {
  const [url, setUrl] = useState("");
  const boxRef = useRef(null);

  useEffect(() => {
    if (!enabled || url || !pdf) return;
    const el = boxRef.current;
    if (!el) return;
    let cancelled = false;
    const io = new IntersectionObserver(entries => {
      if (!entries.some(e => e.isIntersecting)) return;
      io.disconnect();
      renderPdfPage(pdf, num, 0.22, 0.7)
        .then(u => { if (!cancelled) setUrl(u); })
        .catch(() => {});
    }, { rootMargin: "120px" });
    io.observe(el);
    return () => { cancelled = true; io.disconnect(); };
  }, [pdf, num, enabled, url]);

  return (
    <button ref={boxRef} onClick={onClick}
      className={`w-full shrink-0 rounded border-2 overflow-hidden ui-transition pressable-surface
        ${active ? "border-[#D4916E]" : "border-transparent hover:border-[#C5BEB6]"}`}>
      {url
        ? <img src={url} alt={`Page ${num}`} className="w-full block" />
        : <div className="w-full h-[92px] bg-[#F3EBE2] flex items-center justify-center text-[11px] text-[#6B6B6B]">{num}</div>}
    </button>
  );
}

const PAGE_CACHE_MAX = 6;

function PdfPreview({ doc, url, page, setPage, zoom, setZoom, onLoaded }) {
  const [pdf, setPdf] = useState(null);
  const [loadErr, setLoadErr] = useState("");
  const [pageUrl, setPageUrl] = useState("");
  const [rendering, setRendering] = useState(true);
  const [renderErr, setRenderErr] = useState("");
  const [thumbsReady, setThumbsReady] = useState(false);
  const [pageDraft, setPageDraft] = useState("");
  // Degrees clockwise, applied on top of whatever the PDF's own page.rotate
  // already says. Resets whenever a different document is opened -- this is a
  // "the scan came in sideways" reading aid for the current look at the file,
  // not a saved property of it.
  const [rotation, setRotation] = useState(0);
  // page@scale@rotation -> data URL, capped so a long document can be paged
  // through without the tab's memory tracking the page count.
  const cacheRef = useRef(new Map());
  const paneRef = useRef(null);

  // Effect: pdf.js document lifecycle. destroy() on the way out, and a
  // `cancelled` flag so a document that finishes loading after the viewer
  // closed neither sets state nor leaks the worker.
  useEffect(() => {
    let cancelled = false;
    let loaded = null;
    setPdf(null); setLoadErr(""); setPageUrl(""); setRendering(true); setThumbsReady(false); setRotation(0);
    cacheRef.current.clear();
    doc.blob.arrayBuffer()
      .then(buf => pdfjsLib.getDocument({ data: buf }).promise)
      .then(pd => {
        if (cancelled) { pd.destroy(); return; }
        loaded = pd;
        setPdf(pd);
        onLoaded(pd.numPages);
      })
      .catch(e => { if (!cancelled) { setLoadErr(e.message || "Could not open this PDF."); setRendering(false); } });
    return () => { cancelled = true; if (loaded) loaded.destroy(); };
  }, [doc, onLoaded]);

  // Effect: render exactly the current page at the current zoom. Never more --
  // rasterising runs on the main thread here (fake worker), so a page the user
  // has not asked for is a stall they did not ask for either.
  useEffect(() => {
    if (!pdf) return;
    const num = Math.min(Math.max(page, 1), pdf.numPages);
    let cancelled = false;
    setRendering(true);
    setRenderErr("");
    (async () => {
      let scale = zoom;
      if (zoom === "fit") {
        const p = await pdf.getPage(num);
        const w = paneRef.current ? paneRef.current.clientWidth : 800;
        // Rotated 90/270, width and height swap -- fit against the rotated
        // viewport's width or a sideways page keeps the ORIGINAL width's
        // scale and overflows the pane.
        scale = Math.max(0.3, Math.min(3, (w - 48) / p.getViewport({ scale: 1, rotation: (p.rotate + rotation) % 360 }).width));
      }
      const key = num + "@" + scale.toFixed(3) + "@" + rotation;
      const hit = cacheRef.current.get(key);
      const url = hit || await renderPdfPage(pdf, num, scale, 0.92, rotation);
      if (cancelled) return;
      if (!hit) {
        cacheRef.current.set(key, url);
        while (cacheRef.current.size > PAGE_CACHE_MAX) {
          cacheRef.current.delete(cacheRef.current.keys().next().value);
        }
      }
      setPageUrl(url);
      setRendering(false);
      setThumbsReady(true);
    })().catch(e => {
      if (cancelled) return;
      setRenderErr(e.message || "Could not render this page.");
      setRendering(false);
      setThumbsReady(true);
    });
    return () => { cancelled = true; };
  }, [pdf, page, zoom, rotation]);

  if (loadErr) {
    return (
      <div className="flex-1 min-w-0 bg-[#F3EBE2]">
        {/* The bytes are still fine even when pdf.js chokes, so keep the download. */}
        <UnsupportedPreview doc={doc} url={url} reason={"This PDF could not be opened — " + loadErr} />
      </div>
    );
  }

  const total = pdf ? pdf.numPages : 0;
  const commitPage = () => {
    const n = parseInt(pageDraft, 10);
    if (n >= 1 && n <= total) setPage(n);
    setPageDraft("");
  };

  return (
    <div className="flex-1 flex min-w-0">
      {total > 1 && (
        <div className="w-[92px] shrink-0 bg-[#F3EBE2] border-r border-[#C5BEB6] overflow-y-auto p-2 flex flex-col gap-2">
          {Array.from({ length: total }, (_, i) => (
            <PdfThumb key={i + 1} pdf={pdf} num={i + 1} active={i + 1 === page}
              enabled={thumbsReady} onClick={() => setPage(i + 1)} />
          ))}
        </div>
      )}

      <div className="flex-1 flex flex-col min-w-0">
        <div className="h-[52px] shrink-0 border-b border-[#C5BEB6] bg-white flex items-center justify-center gap-3 px-4">
          <button onClick={() => setPage(Math.max(1, page - 1))} disabled={page <= 1}
            className="px-2 py-1 text-[13px] text-[#3D3D3D] disabled:opacity-30">...</button>
          <div className="flex items-center gap-1.5 text-[12px] text-[#6B6B6B]">
            <span>Page</span>
            <input value={pageDraft === "" ? String(page) : pageDraft}
              onChange={e => setPageDraft(e.target.value.replace(/[^0-9]/g, ""))}
              onBlur={commitPage}
              onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); commitPage(); e.target.blur(); } }}
              className="w-[46px] px-1.5 py-1 text-center text-[12px] text-[#1A1A1A] bg-white border-[1.5px] border-[#C5BEB6] rounded-md outline-none focus:border-[#D4916E]" />
            <span>/ {total || "—"}</span>
          </div>
          <button onClick={() => setPage(Math.min(total, page + 1))} disabled={!total || page >= total}
            className="px-2 py-1 text-[13px] text-[#3D3D3D] disabled:opacity-30">...</button>
          <div className="w-px h-5 bg-[#C5BEB6]" />
          <ZoomStepper zoom={zoom} setZoom={setZoom} />
          <div className="w-px h-5 bg-[#C5BEB6]" />
          <button onClick={() => setRotation(r => (r + 270) % 360)} title="Rotate left 90°"
            className="px-2 py-1 rounded-full text-[13px] text-[#6B6B6B] hover:bg-[#F3EBE2] ui-transition pressable">
            ⟲
          </button>
          <button onClick={() => setRotation(r => (r + 90) % 360)} title="Rotate right 90°"
            className="px-2 py-1 rounded-full text-[13px] text-[#6B6B6B] hover:bg-[#F3EBE2] ui-transition pressable">
            ⟳
          </button>
        </div>

        <div ref={paneRef} onWheel={e => handleZoomWheel(e, setZoom)}
          className="flex-1 overflow-auto bg-[#F3EBE2] p-6 flex items-start justify-center">
          {renderErr
            ? <div className="m-auto max-w-[360px] px-4 py-3 bg-[#FDF6E0] border-l-[3px] border-[#B78312] rounded-lg text-xs leading-[19px] text-[#3D3D3D]" style={{fontFamily:"Newsreader, serif"}}>
                {renderErr} Download the original to open it in a PDF reader.
              </div>
            : pageUrl
              ? <img src={pageUrl} alt={`Page ${page}`}
                  style={{ maxWidth: "none", maxHeight: "none" }}
                  className={`shrink-0 shadow-[0px_2px_12px_0px_#0000001a] rounded bg-white ${rendering ? "opacity-50" : ""}`} />
              : <div className="m-auto flex flex-col items-center gap-2">
                  <div className="w-[220px] h-[280px] rounded bg-[#E3D6C8] animate-pulse" />
                  <div className="text-xs text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>Rendering page {page}…</div>
                </div>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Preview dispatch ---------- */

function PreviewPane({ doc, entry, url, page, setPage, zoom, setZoom, onLoaded, sheetIndex, setSheetIndex }) {
  // Every branch below needs the bytes except the three fed by the parse tree
  // (sheet / text / html) -- those still render when the blob was dropped.
  const noBlob = !doc.blob;

  if (doc.previewKind === "sheet") {
    const sheets = sheetPagesFor(entry, doc);
    if (!sheets.length) {
      return (
        <div className="flex-1 min-w-0 bg-[#F3EBE2]">
          <UnsupportedPreview doc={doc} url={url} reason="This spreadsheet has no readable sheets — download the original." />
        </div>
      );
    }
    const i = Math.min(sheetIndex, sheets.length - 1);
    return (
      <div className="flex-1 flex flex-col min-w-0">
        <div className="flex-1 min-h-0" onWheel={e => handleZoomWheel(e, setZoom)}>
          <HtmlFramePreview html={wrapSheetHtml(sheets[i].html)} title={doc.fileName} zoom={zoom} />
        </div>
        {sheets.length > 1 && (
          <div className="h-[52px] shrink-0 border-t border-[#C5BEB6] bg-white flex items-center gap-2 px-4 overflow-x-auto">
            {sheets.map((s, si) => (
              <button key={si} onClick={() => setSheetIndex(si)}
                className={`shrink-0 px-3.5 py-1.5 rounded-full border-[1.5px] text-xs font-semibold ui-transition pressable
                  ${si === i ? "bg-[#FBF0E8] border-[#D4916E] text-[#D4916E]" : "bg-[#F3EBE2] border-[#C5BEB6] text-[#6B6B6B]"}`}>
                {s.sheetName || `Sheet ${si + 1}`}
              </button>
            ))}
          </div>
        )}
        <PreviewZoomControls zoom={zoom} setZoom={setZoom} />
      </div>
    );
  }

  // The .mht case. The engine already inlined every image as a data: URL and
  // stripped scripts, so this string is the whole document -- pass the same
  // reference straight through, no blob and no object URL involved.
  if (doc.previewKind === "html" && doc.previewHtml) {
    return (
      <div className="flex-1 flex flex-col min-w-0">
        <div className="flex-1 min-h-0" onWheel={e => handleZoomWheel(e, setZoom)}><HtmlFramePreview html={doc.previewHtml} title={doc.fileName} zoom={zoom} /></div>
        <PreviewZoomControls zoom={zoom} setZoom={setZoom} />
      </div>
    );
  }

  if (doc.previewKind === "text" && doc.textLines) {
    return (
      <div className="flex-1 flex flex-col min-w-0">
        <div className="flex-1 min-h-0" onWheel={e => handleZoomWheel(e, setZoom)}><TextPreview lines={doc.textLines} zoom={zoom} /></div>
        <PreviewZoomControls zoom={zoom} setZoom={setZoom} />
      </div>
    );
  }

  if (noBlob) {
    return (
      <div className="flex-1 min-w-0 bg-[#F3EBE2]">
        <UnsupportedPreview doc={doc} url={null}
          reason={doc.demo ? "This is demo data — nothing was ever parsed from a real file." : "The original was not kept."} />
      </div>
    );
  }

  if (doc.previewKind === "pdf") {
    return <PdfPreview doc={doc} url={url} page={page} setPage={setPage} zoom={zoom} setZoom={setZoom} onLoaded={onLoaded} />;
  }
  if (doc.previewKind === "image") {
    return (
      <div className="flex-1 flex flex-col min-w-0 bg-[#F3EBE2]">
        <div className="flex-1 min-h-0" onWheel={e => handleZoomWheel(e, setZoom)}><ImagePreview url={url} name={doc.fileName} zoom={zoom} /></div>
        <PreviewZoomControls zoom={zoom} setZoom={setZoom} />
      </div>
    );
  }
  // 'html' with no previewHtml means the archive parsed but had nothing
  // renderable in it -- the honest download panel, not a blank frame.
  return (
    <div className="flex-1 min-w-0 bg-[#F3EBE2]">
      <UnsupportedPreview doc={doc} url={url} reason="Preview not available — download the original to open it." />
    </div>
  );
}

/* ---------- Viewer chrome ---------- */

// The ✕ is drawn in BOTH modes, and what it means differs by mode because
// `onClose` differs. Modal: dismiss the overlay. Inline (the Upload page's
// workspace panel): collapse the whole viewer back to the document list --
// `collapseViewer` there, the same three-part action the panel header's
// "Collapse" button performs, because clearing `viewer` alone would leave
// `viewerExpanded` holding the panel open on the tab's default document. It
// was withheld inline while that was true; a control that does nothing is
// worse than no control, but a defined one beats making the reader hunt for
// the text button in the header above.
function ViewerHeader({ doc, url, onClose, diffCount, inline }) {
  return (
    <div className="h-[60px] shrink-0 flex items-center gap-3 px-5 border-b border-[#C5BEB6]">
      <div className="text-lg shrink-0"><Icon name={PREVIEW_ICONS[doc.previewKind] || "file"} className="w-8 h-8" /></div>
      <div className="min-w-0 flex-1 flex items-center gap-2">
        <div className="text-[15px] font-bold text-[#1A1A1A] truncate" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>{doc.fileName}</div>
        <div className="flex items-center gap-1.5 shrink-0">
          {doc.ext && <Pill className="bg-[#F3EBE2] text-[#6B6B6B]">{doc.ext.toUpperCase()}</Pill>}
          {countLabel(doc) && <Pill className="bg-[#F3EBE2] text-[#6B6B6B]">{countLabel(doc)}</Pill>}
          {doc.hadOcr && <Pill className={VIEWER_WARN_PILL}>OCR</Pill>}
          {diffCount > 0 && <Pill className={VIEWER_WARN_PILL}>⚠ {diffCount} difference{diffCount > 1 ? "s" : ""}</Pill>}
          {doc.status === "failed" && <Pill className={STATUS_STYLES.Flagged}>Parse failed</Pill>}
          {doc.status === "skipped" && <Pill className={VIEWER_WARN_PILL}>Not parsed</Pill>}
          {/* Parsed, but OCR ran out of time before the last page. The fields
              shown are trustworthy; the absence of a field is not. */}
          {doc.truncated && <Pill className={VIEWER_WARN_PILL} title="OCR stopped early — later pages were not read">Partly read</Pill>}
          {signingPills(doc.signing).map(p =>
            <Pill key={p.label} className={p.ours ? VIEWER_OURS_PILL : VIEWER_FOUND_PILL} title={p.title}>{p.label}</Pill>)}
        </div>
      </div>
      {url
        ? <GhostButton href={url} download={doc.fileName} className="shrink-0">⤓ Download</GhostButton>
        : <GhostButton disabled className="shrink-0"
            title={doc.blob ? "Preparing download…"
              : doc.demo ? "Demo data — no original file"
              : "Original not retained — file over the 25 MB limit"}>⤓ Download</GhostButton>}
      <button onClick={onClose} aria-label={inline ? "Close document viewer" : "Close viewer"}
        title={inline ? "Close document viewer" : "Close viewer"}
        className="shrink-0 w-9 h-9 rounded-full text-[#6B6B6B] hover:bg-[#F3EBE2] flex items-center justify-center ui-transition pressable">
        <Icon name="close" className="w-[19px] h-[19px]" />
      </button>
    </div>
  );
}

function ViewerSidebarRow({ doc, active, muted, onClick, flagged, large }) {
  return (
    <button onClick={onClick}
      className={`group w-full flex items-center ${large ? "gap-3.5 px-3.5 py-3" : "gap-3 px-3 py-2.5"} rounded-lg text-left ui-transition pressable-surface
        ${active ? "bg-[#FBF0E8]" : "hover:bg-[#F3EBE2]"}`}>
      <span className={`text-[14px] shrink-0 ${muted ? "opacity-50" : ""}`}><Icon name={PREVIEW_ICONS[doc.previewKind] || "file"} className={large ? "w-6 h-6" : "w-5 h-5"} /></span>
      {/* The underline is the affordance: nothing else in this row says "click
          me", and a reviewer scanning the list should not have to hover to
          find that out. Dotted at rest so it reads as a hint, solid on hover
          so the row being pointed at is unambiguous. */}
      <span className={`flex-1 min-w-0 truncate ${large ? "text-[16px]" : "text-[13px]"} underline underline-offset-2 decoration-dotted decoration-[#C5BEB6]
        group-hover:decoration-solid group-hover:decoration-[#D4916E]
        ${active ? "text-[#D4916E] font-semibold decoration-[#D4916E]" : muted ? "text-[#6B6B6B]" : "text-[#3D3D3D]"}`}>
        {doc.fileName}
      </span>
      {/* A dot, not a word: the sidebar's job is to say which documents are
          worth opening, and the InfoPane says why once you are there. */}
      {flagged && <span title="Takes part in a field difference" className="shrink-0 w-1.5 h-1.5 rounded-full bg-[#B78312]" />}
      {doc.status === "error" ? (
        <span title={doc.note || "Could not parse this file."} className={"shrink-0 font-semibold text-[#C0392B] " + (large ? "text-[14px]" : "text-[11px]")}>Failed</span>
      ) : doc.ocrPending ? (
        <span title="Still reading this document (OCR running in the background)" className={"shrink-0 font-semibold text-[#D4916E] " + (large ? "text-[14px]" : "text-[11px]")}>OCR…</span>
      ) : countLabel(doc, true) && <span className={"shrink-0 text-[#6B6B6B] " + (large ? "text-[15px]" : "text-[12px]")}>{countLabel(doc, true)}</span>}
    </button>
  );
}

function ViewerSidebar({ selfDoc, docs, currentKey, onSelect, showInline, setShowInline, flaggedIndexes, label }) {
  const visible = docs.filter(d => !d.inline);
  const inline = docs.filter(d => d.inline);
  return (
    <div className="flex-1 overflow-y-auto p-3 flex flex-col gap-1.5">
      <div className="px-2.5 pb-1 text-[12px] font-bold tracking-[1px] text-[#6B6B6B]">
        {label} ({visible.length})
      </div>
      {selfDoc && (
        <ViewerSidebarRow doc={{ ...selfDoc, fileName: selfDoc.textLines ? "Email body" : selfDoc.fileName }}
          active={currentKey === "self"} onClick={() => onSelect(-1)} flagged={flaggedIndexes.has(-1)} />
      )}
      {visible.map(d => (
        <ViewerSidebarRow key={d.index} doc={d} active={currentKey === String(d.index)} onClick={() => onSelect(d.index)}
          flagged={flaggedIndexes.has(d.index)} />
      ))}
      {inline.length > 0 && (
        <React.Fragment>
          <button onClick={() => setShowInline(!showInline)}
            className="mt-1 px-2.5 py-1.5 text-left text-[12px] text-[#6B6B6B] hover:text-[#D4916E]"
            style={{fontFamily:"Newsreader, serif"}}>
            {showInline ? "− hide" : "+"} {inline.length} inline image{inline.length > 1 ? "s" : ""}
          </button>
          {showInline && inline.map(d => (
            <ViewerSidebarRow key={d.index} doc={d} muted active={currentKey === String(d.index)} onClick={() => onSelect(d.index)} />
          ))}
        </React.Fragment>
      )}
    </div>
  );
}

function CompactDocumentList({ entry, typeKey, onOpen, onExpand }) {
  const docs = (entry && entry.docs) || [];
  const selfDoc = entry ? selfDocFor(entry) : null;
  const visible = docs.filter(d => !d.inline);
  const documentListLabel = /\.(eml|msg)$/i.test((entry && entry.file) || "")
    ? "DOCUMENTS IN THIS EMAIL"
    : "DOCUMENTS IN THIS FILE";
  const rows = [];
  if (selfDoc) rows.push({ doc: { ...selfDoc, fileName: selfDoc.textLines ? "Email body" : selfDoc.fileName }, index: -1 });
  visible.forEach(d => rows.push({ doc: d, index: d.index }));
  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between gap-3">
        <div className="text-[14px] font-bold tracking-[1px] text-[#6B6B6B]">{documentListLabel}</div>
        <button type="button" onClick={onExpand} disabled={!rows.length}
          className="shrink-0 inline-flex items-center gap-2 px-3.5 py-2 rounded-full border border-[#D4916E]/40 text-[16px] font-semibold text-[#D4916E] hover:bg-[#FBF0E8] disabled:opacity-40 disabled:border-transparent ui-transition pressable">
          <Icon name="chevronRight" className="w-4 h-4" />
          Expand
        </button>
      </div>
      <div className="flex flex-col gap-1.5">
        {rows.map(({ doc, index }) => (
          <ViewerSidebarRow key={index} large doc={doc} active={false} onClick={() => onOpen(typeKey, index)} />
        ))}
        {!rows.length && (
          <div className="h-[200px] flex flex-col gap-2 justify-center items-center rounded-xl bg-[#F4EFE8] px-5 text-center">
            <div className="text-[16px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>
              Nothing to preview yet — drop an attachment above.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// Per-document fields, which the flattened result.fields cannot express: this
// pane is the only place that says which document a value actually came from.
function InfoPane({ doc, typeKey, docIndex, differences, onSelectDoc, setField, onCollapse }) {
  const fields = doc.fields || [];
  const diffs = differences || [];
  // The role each side of a disagreement fills, so this pane speaks the same
  // vocabulary as the field row and the slot bar rather than only naming files.
  const rolesOf = (cc, cluster) => cluster.roleKeys.map(k => cc.roles[k].role.label).join(", ");
  return (
    <div className="w-[280px] shrink-0 border-l border-[#C5BEB6] overflow-y-auto p-4 flex flex-col gap-4 bg-white">
      <div className="flex items-start justify-between gap-3">
        <div className="text-xs font-bold tracking-[1px] text-[#3D3D3D]">FIELDS IN THIS DOCUMENT</div>
        <button type="button" onClick={onCollapse} aria-label="Collapse fields panel"
          className="shrink-0 px-2 py-1 rounded-md text-[11px] font-semibold text-[#6B6B6B] hover:bg-[#F3EBE2] ui-transition pressable">
          Hide
        </button>
      </div>
      {doc.note && (
        <div className="flex gap-2 p-3 bg-[#FDF6E0] border-l-[3px] border-[#B78312] rounded-lg">
          <div className="text-[11px] leading-[19px] text-[#3D3D3D]" style={{fontFamily:"Newsreader, serif"}}>{doc.note}</div>
        </div>
      )}
      <div className="flex flex-col gap-2.5">
        {fields.length === 0 && (
          <div className="text-[11px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>
            {doc.inline ? "Inline images are not parsed - no fields." : "No labelled fields were detected here."}
          </div>
        )}
        {fields.map((f, i) => (
          <div key={i} className="flex flex-col gap-0.5 py-1.5 border-b border-[#C5BEB6] last:border-b-0">
            <span className="text-[10.5px] text-[#6B6B6B]">{f.label}</span>
            <span className="text-[12px] font-semibold text-[#1A1A1A] break-words">{f.value || "—"}</span>
          </div>
        ))}
      </div>
      {/* The deepest of the three difference surfaces: Verify says a field is
          contested, Page 1 marks the box, and this is the only place that puts
          this document's value next to the one it disagrees with. */}
      {diffs.length > 0 && (
        <div className="flex flex-col gap-2.5">
          <div className="text-xs font-bold tracking-[1px] text-[#B78312]">⚠ DIFFERENCES</div>
          {diffs.map(cc => {
            const mine = cc.clusters.filter(c => c.sources.some(s => s.typeKey === typeKey && s.docIndex === docIndex))[0];
            const others = cc.clusters.filter(c => c !== mine);
            // A comparison-only field has no form box to write into, and
            // setField would quietly create an orphan key nothing ever reads.
            const canAdopt = !!FIELD_LABELS[cc.key];
            return (
              <div key={cc.key} className="flex flex-col gap-2 p-2.5 rounded-lg bg-[#FDF6E0]">
                <div className="text-[10.5px] font-bold text-[#B78312]">
                  {cc.label}{cc.severity === "similar" ? " · wording only" : ""}
                </div>
                <div className="flex flex-col gap-0.5">
                  <span className="text-[12px] font-semibold text-[#1A1A1A] break-words">{mine ? mine.value : "—"}</span>
                  <span className="text-[10px] text-[#6B6B6B]">
                    here{mine ? " · " + rolesOf(cc, mine) : ""}
                  </span>
                </div>
                {others.map((c, gi) => {
                  const src = c.sources[0];
                  // Only the current entry's own docs are reachable from this
                  // sidebar; a conflict raised on another attachment type is
                  // named but not clickable, rather than silently doing nothing.
                  const reachable = src && src.typeKey === typeKey;
                  const body = (
                    <React.Fragment>
                      <span className="text-[12px] font-semibold text-[#1A1A1A] break-words">{c.value}</span>
                      <span className="text-[10px] text-[#6B6B6B] break-words">
                        {rolesOf(cc, c)} — {c.sources.map(s => s.fileName).join(", ")}{reachable ? " ›" : ""}
                      </span>
                    </React.Fragment>
                  );
                  return reachable
                    ? <button key={gi} onClick={() => onSelectDoc(src.docIndex)}
                        className="flex flex-col gap-0.5 text-left rounded-md -mx-1 px-1 py-0.5 hover:bg-[#F7E9C4]">{body}</button>
                    : <div key={gi} className="flex flex-col gap-0.5">{body}</div>;
                })}
                {mine && canAdopt && (
                  <PrimaryButton className="w-fit !px-3 !py-1.5 !text-[11px]"
                    onClick={() => setField(cc.key, mine.value, true)}>Use this value</PrimaryButton>
                )}
              </div>
            );
          })}
        </div>
      )}
      <div className="flex flex-col gap-1 pt-1">
        <div className="text-xs font-bold tracking-[1px] text-[#3D3D3D]">FILE</div>
        <div className="text-[11px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>
          {[doc.ext ? doc.ext.toUpperCase() : null, formatBytes(doc.size), countLabel(doc)].filter(Boolean).join(" · ") || "—"}
        </div>
      </div>
    </div>
  );
}

const VIEWER_EMPTY_ENTRY = {};

// The one deliberate non-reuse: this panel needs full height and a heavier
// shadow than Card gives. No createPortal -- nothing here has a stacking
// context to escape, and the modal is already a sibling of the sidebar wrapper.
// `inline` swaps the full-screen modal shell for a panel that sits in the normal
// document flow -- everything inside (document picker, preview, info pane, and
// all of the state and effects above) is the same component either way. Only
// the two modal-specific behaviours, the backdrop and the body-scroll lock, are
// conditional; nothing about which document is open or how it is read changes.
function DocumentViewer({ viewer, attachments, onClose, crosschecks, dismissedDiffs, toggleDismissDiff, setField, fields, openViewer, census, inline }) {
  // A shared constant, not a fresh {} -- entry identity feeds useMemo and the
  // effects below, and a new object every render would re-run them forever.
  const entry = attachments[viewer.typeKey] || VIEWER_EMPTY_ENTRY;
  const allDocs = entry.docs || [];
  // `viewer.only` -- opened from somewhere that means one document, or a
  // specific SET of documents (an array of doc indexes -- a Quotation slot's
  // primary pick plus its extras), and not the whole pile it arrived in. The
  // list is narrowed rather than the chrome removed, so the header still says
  // which file is open and the "Extracted Field" tab still works; there is
  // simply nothing else to switch to.
  //
  // A `docIndex` that is not in the list would leave the picker empty while the
  // preview still resolved through selfDoc, so the narrowing falls back to the
  // whole list rather than showing none.
  const onlyIndexes = Array.isArray(viewer.only) ? viewer.only : (viewer.only ? [viewer.docIndex] : []);
  const onlyDocs = allDocs.filter(d => onlyIndexes.indexOf(d.index) !== -1);
  const narrowed = onlyIndexes.length > 0 && onlyDocs.length > 0;
  const docs = narrowed ? onlyDocs : allDocs;
  const selfDoc = useMemo(() => selfDocFor(entry), [entry]);
  // The email body itself is a sibling of the narrowed-to document, so it goes
  // too -- unless it IS the thing being opened (docIndex < 0). Keyed on
  // `narrowed` rather than on `viewer.only`, so the fallback above restores the
  // whole sidebar and not just the file rows: an "all three documents, no email
  // body" list is a state neither branch means.
  const sidebarSelfDoc = narrowed && viewer.docIndex >= 0 ? null : selfDoc;

  // Which view the left column shows: the document picker (today's default)
  // or a vertical duplicate of Page 1's editable field form, so a value can
  // be checked against the open document and fixed without leaving the modal.
  const [leftTab, setLeftTab] = useState("documents");
  // Inline (the Upload and parse page's expanded viewer) starts with the
  // documents list collapsed so the preview gets the space by default; the
  // modal viewer used elsewhere keeps its old always-open behaviour.
  const [docsOpen, setDocsOpen] = useState(!inline);
  const [docIndex, setDocIndex] = useState(viewer.docIndex);
  const [page, setPage] = useState(viewer.page || 1);
  const [zoom, setZoom] = useState("fit");
  const [numPages, setNumPages] = useState(0);
  const [sheetIndex, setSheetIndex] = useState(0);
  const [showInline, setShowInline] = useState(() => {
    const d = docs.find(x => x.index === viewer.docIndex);
    return !!(d && d.inline);
  });
  const [urlState, setUrlState] = useState({ doc: null, url: "" });
  const panelRef = useRef(null);

  const doc = docIndex < 0 ? selfDoc : (docs.find(d => d.index === docIndex) || selfDoc);

  const selectDoc = (i) => { setDocIndex(i); setPage(1); setNumPages(0); setSheetIndex(0); };
  const onLoaded = useCallback(n => setNumPages(n), []);

  // Both derived from the one `crosschecks` memo App computes -- the viewer
  // never runs its own comparison, it only asks which of these documents are in
  // one. Reading the crosscheck rather than the raw diff is what stops an amber
  // dot appearing on a document whose field row shows no ⚠.
  const flaggedIndexes = useMemo(() => crosscheckDocIndexes(crosschecks, dismissedDiffs, viewer.typeKey),
    [crosschecks, dismissedDiffs, viewer.typeKey]);
  const differences = useMemo(() => crosschecksForDoc(crosschecks, dismissedDiffs, viewer.typeKey, docIndex),
    [crosschecks, dismissedDiffs, viewer.typeKey, docIndex]);
  // Single-open, so the field grid in the left column can only ever grow by one
  // panel however long the list of fields is.
  const [compareKey, setCompareKey] = useState(null);
  const [infoPaneOpen, setInfoPaneOpen] = useState(false);

  // Effect: object-URL ownership. The engine never calls createObjectURL --
  // whoever displays a blob creates the URL and revokes it here, or the blob
  // stays pinned for the life of the tab.
  useEffect(() => {
    if (!doc || !doc.blob) { setUrlState({ doc: doc, url: "" }); return; }
    const url = URL.createObjectURL(doc.blob);
    setUrlState({ doc, url });
    return () => URL.revokeObjectURL(url);
  }, [doc]);

  // Effect: follow a caller that asked for a particular page. The modal is
  // keyed by document, so opening the SAME document at a different page (two
  // chops on one agreement, one link each) never remounts and the initial
  // useState above would not be re-read.
  useEffect(() => {
    if (viewer.page) setPage(viewer.page);
  }, [viewer.page]);

  // Effect: keyboard. Escape closes; arrows and Home/End page through a PDF,
  // except while the page-number box has focus.
  useEffect(() => {
    const onKey = (e) => {
      // Inline the viewer is one panel among many on a scrollable page, so it
      // only answers keys aimed at it -- otherwise arrowing through the page
      // would silently page a PDF nobody was looking at.
      const owns = !inline || (panelRef.current && panelRef.current.contains(e.target));
      if (e.key === "Escape") { if (!inline) { e.preventDefault(); onClose(); } return; }
      if (!numPages || !owns) return;
      const tag = e.target && e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.key === "ArrowRight") { e.preventDefault(); setPage(p => Math.min(numPages, p + 1)); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); setPage(p => Math.max(1, p - 1)); }
      else if (e.key === "Home") { e.preventDefault(); setPage(1); }
      else if (e.key === "End") { e.preventDefault(); setPage(numPages); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose, numPages, inline]);

  // Effect: lock the page behind the modal, and move focus into it so Escape
  // and the arrow keys land here rather than on whatever was focused before.
  // A doc that cannot be resolved closes instead of locking scroll behind an
  // empty panel, which would leave no way back.
  // Inline there is nothing behind to lock, and stealing focus would yank the
  // reader away from the field they were editing further up the page.
  useEffect(() => {
    if (!doc) { onClose(); return; }
    if (inline) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    if (panelRef.current) panelRef.current.focus();
    return () => { document.body.style.overflow = prev; };
  }, []);

  if (!doc) return null;
  // Only hand down a URL that belongs to the doc being shown -- the revoke in
  // the cleanup above lands one render before the replacement arrives.
  const url = urlState.doc === doc ? urlState.url : "";
  const currentKey = docIndex < 0 ? "self" : String(docIndex);
  const documentListLabel = /\.(eml|msg)$/i.test(entry.file || "")
    ? "DOCUMENTS IN THIS EMAIL"
    : "DOCUMENTS IN THIS FILE";

  const body = (
    <React.Fragment>
        <ViewerHeader doc={doc} url={url} onClose={onClose} diffCount={differences.length} inline={inline} />
        <div className="flex-1 flex min-h-0">
          {inline ? (
            docsOpen ? (
              <div className="w-[240px] shrink-0 border-r border-[#C5BEB6] flex flex-col overflow-hidden">
                <div className="flex items-center justify-between gap-1 p-2 border-b border-[#C5BEB6] shrink-0">
                  <div className="px-2 py-1.5 text-[11px] font-semibold text-[#D4916E]">Documents</div>
                  <button type="button" onClick={() => setDocsOpen(false)}
                    aria-label="Collapse documents list" title="Collapse documents list"
                    className="shrink-0 px-2 py-1.5 rounded-md text-[11px] font-semibold text-[#6B6B6B] hover:bg-[#F3EBE2] ui-transition pressable">
                    Collapse
                  </button>
                </div>
                <ViewerSidebar selfDoc={sidebarSelfDoc} docs={docs} currentKey={currentKey} onSelect={selectDoc}
                  showInline={showInline} setShowInline={setShowInline} flaggedIndexes={flaggedIndexes}
                  label={documentListLabel} />
              </div>
            ) : (
              <button type="button" onClick={() => setDocsOpen(true)}
                aria-label="Expand documents list" title="Expand documents list"
                className="w-10 shrink-0 border-r border-[#C5BEB6] bg-white hover:bg-[#F3EBE2] text-[#6B6B6B] flex flex-col items-center justify-center gap-2 ui-transition pressable">
                <span className="text-[11px] font-bold tracking-[1px]" style={{writingMode:"vertical-rl", transform:"rotate(180deg)"}}>Documents</span>
              </button>
            )
          ) : (
            <div className={`${leftTab === "documents" ? "w-[240px]" : "w-[320px]"} shrink-0 border-r border-[#C5BEB6] flex flex-col overflow-hidden`}>
              <div className="flex gap-1 p-2 border-b border-[#C5BEB6] shrink-0">
                <button onClick={() => setLeftTab("documents")}
                  className={`flex-1 px-2 py-1.5 rounded-md text-[11px] font-semibold ui-transition pressable
                    ${leftTab === "documents" ? "bg-[#FBF0E8] text-[#D4916E]" : "text-[#6B6B6B] hover:bg-[#F3EBE2]"}`}>
                  Documents
                </button>
                <button onClick={() => setLeftTab("fields")}
                  className={`flex-1 px-2 py-1.5 rounded-md text-[11px] font-semibold ui-transition pressable
                    ${leftTab === "fields" ? "bg-[#FBF0E8] text-[#D4916E]" : "text-[#6B6B6B] hover:bg-[#F3EBE2]"}`}>
                  Extracted Field
                </button>
              </div>
              {leftTab === "documents" ? (
                <ViewerSidebar selfDoc={sidebarSelfDoc} docs={docs} currentKey={currentKey} onSelect={selectDoc}
                  showInline={showInline} setShowInline={setShowInline} flaggedIndexes={flaggedIndexes}
                  label={documentListLabel} />
              ) : (
                <div className="flex-1 overflow-y-auto p-3 flex flex-col gap-3.5">
                  <div className="w-full flex gap-2 p-2.5 bg-[#FDF6E0] border-l-[3px] border-[#B78312] rounded-lg">
                    <div className="text-[11px] leading-4 text-[#3D3D3D]" style={{fontFamily:"Newsreader, serif"}}>
                      Green = auto-extracted, always verify. White = already edited.
                    </div>
                  </div>
                  {FIELD_DEFS.map(d => renderFieldInput(d, {
                    fields, crosschecks, dismissedDiffs, setField,
                    onDissent: cc => { const s = crosscheckDissent(cc); if (s) openViewer(s.typeKey, s.docIndex); },
                    // Inside the viewer a chip is a way of switching to the
                    // document it names without going back out to the sidebar.
                    // openViewer rather than selectDoc: a chip's document often
                    // sits under a different attachment type, which selectDoc --
                    // an index within the open entry -- cannot reach.
                    onSource: s => { if (s) openViewer(s.typeKey, s.docIndex); },
                    expandedKey: compareKey, onToggleExpand: setCompareKey,
                    onDismiss: toggleDismissDiff,
                  }, "w-full"))}
                </div>
              )}
            </div>
          )}
          <PreviewPane doc={doc} entry={entry} url={url} page={page} setPage={setPage}
            zoom={zoom} setZoom={setZoom} onLoaded={onLoaded}
            sheetIndex={sheetIndex} setSheetIndex={setSheetIndex} />
          {infoPaneOpen ? (
            <InfoPane doc={doc} typeKey={viewer.typeKey} docIndex={docIndex} differences={differences}
              onSelectDoc={selectDoc} setField={setField} onCollapse={() => setInfoPaneOpen(false)} />
          ) : (
            <button type="button" onClick={() => setInfoPaneOpen(true)}
              aria-label="Expand Fields in This Document"
              title="Expand Fields in This Document"
              className="w-10 shrink-0 border-l border-[#C5BEB6] bg-white hover:bg-[#F3EBE2] text-[#6B6B6B] flex flex-col items-center justify-center gap-2 ui-transition pressable">
              <span className="text-[11px] font-bold tracking-[1px]" style={{writingMode:"vertical-rl", transform:"rotate(180deg)"}}>Fields</span>
              {differences.length > 0 && <span className="w-5 h-5 rounded-full bg-[#FDF6E0] text-[#B78312] text-[10px] font-bold flex items-center justify-center">{differences.length}</span>}
            </button>
          )}
        </div>
    </React.Fragment>
  );

  if (inline) {
    return (
      // Focus on mousedown rather than on mount: inline deliberately does not
      // steal focus when it opens, but the arrow keys page by asking whether
      // the panel owns the focused element, so without this they stay inert
      // however many times the reader clicks the preview.
      <div ref={panelRef} tabIndex={-1} role="region" aria-label={"Preview: " + doc.fileName}
        onMouseDown={() => { if (panelRef.current) panelRef.current.focus({ preventScroll: true }); }}
        className="w-full h-[78vh] min-h-[520px] rounded-xl bg-white border border-[#C5BEB6]
          shadow-[0px_10px_24px_0px_#2B21161A] flex flex-col overflow-hidden outline-none">
        {body}
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label={"Preview: " + doc.fileName}>
      <div className="modal-backdrop absolute inset-0 bg-[#1A1A1A]/60" onClick={onClose} />
      <div ref={panelRef} tabIndex={-1}
        className="modal-pop absolute inset-4 rounded-xl bg-white shadow-[0px_18px_50px_0px_#00000040] flex flex-col overflow-hidden outline-none">
        {body}
      </div>
    </div>
  );
}

/* ---------- Right-rail entry points ---------- */

function AttachmentStatusCard({ attachments, onOpen }) {
  return (
    <Card className="p-6 flex flex-col gap-4">
      <div className="text-[14px] font-bold tracking-[1px] text-[#3D3D3D]">ATTACHMENT STATUS</div>
      {ATTACHMENT_TYPES.map(t => {
        const a = attachments[t];
        // Demo rows carry no File at all, so there is nothing to show; the row
        // stays inert rather than opening an empty viewer.
        const canOpen = !!(a.self || a.fileObj);
        return (
          <div key={t} onClick={canOpen ? () => onOpen(t, -1) : undefined}
            onKeyDown={canOpen ? (e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen(t, -1); } }) : undefined}
            tabIndex={canOpen ? 0 : undefined}
            role={canOpen ? "button" : undefined}
            title={canOpen ? "View original" : (a.parsed ? "Demo data — no original file" : undefined)}
            className={`flex items-center gap-3 px-3.5 py-3 rounded-lg outline-none
              ${a.parsed ? "bg-[#E8F5EC]" : "bg-[#F3EBE2]"}
              ${canOpen ? "cursor-pointer hover:brightness-[0.97] focus:ring-2 focus:ring-[#D4916E]" : ""}` }>
            <div className={"text-[18px] leading-none " + (a.parsed ? "text-[#3D8B5F]" : "text-[#6B6B6B]")}>{a.parsed ? "✓" : "○"}</div>
            <div className="flex-1 min-w-0">
              <div className={`text-[16px] font-semibold ${a.parsed ? "text-[#3D8B5F]" : "text-[#6B6B6B]"}`}>{t}</div>
              {a.file && <div className="text-[13px] text-[#6B6B6B] truncate" style={{fontFamily:"Newsreader, serif"}}>{a.file}</div>}
            </div>
            {canOpen && <div className="text-[#6B6B6B] text-[15px] shrink-0">›</div>}
          </div>
        );
      })}
    </Card>
  );
}

// The email's own documents, which until now were only ever visible as a wall
// of concatenated text. Hidden entirely when there is nothing to list -- an
// empty box next to the equally empty RAW EXTRACTED TEXT box would just be two
// ways of saying the same nothing.
function EmailDocumentsCard({ entry, typeKey, onOpen }) {
  const [showInline, setShowInline] = useState(false);
  const docs = (entry && entry.docs) || [];
  const visible = docs.filter(d => !d.inline);
  const inline = docs.filter(d => d.inline);
  if (!visible.length) return null;
  // "In this email" is only true of a container. Demo mode lists one synthetic
  // document per attachment type, and a standalone .mht is a saved page rather
  // than an inbox item, so neither should be called an email.
  const isEmail = /\.(eml|msg)$/i.test((entry && entry.file) || "");

  const row = (d, muted) => (
    <div key={d.index} onClick={() => onOpen(typeKey, d.index)}
      onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen(typeKey, d.index); } }}
      tabIndex={0} role="button" title={d.fileName}
      className="flex items-center gap-2 px-2.5 py-2 rounded-lg bg-[#F3EBE2] cursor-pointer outline-none
        hover:brightness-[0.97] focus:ring-2 focus:ring-[#D4916E]">
      <span className={`text-[13px] shrink-0 ${muted ? "opacity-50" : ""}`}><Icon name={PREVIEW_ICONS[d.previewKind] || "file"} className="w-4 h-4" /></span>
      <span className="flex-1 min-w-0 truncate text-[11px] text-[#3D3D3D]">{d.fileName}</span>
      {countLabel(d, true) && <span className="shrink-0 text-[10px] text-[#6B6B6B]">{countLabel(d, true)}</span>}
      {d.hadOcr && <Pill className={`${VIEWER_WARN_PILL} !px-1.5 !py-0 !text-[9px]`}>OCR</Pill>}
      {d.status === "failed" && <Pill className={`${STATUS_STYLES.Flagged} !px-1.5 !py-0 !text-[9px]`}>failed</Pill>}
      {d.status === "skipped" && <Pill className={`${VIEWER_WARN_PILL} !px-1.5 !py-0 !text-[9px]`}>skipped</Pill>}
      {d.truncated && <Pill className={`${VIEWER_WARN_PILL} !px-1.5 !py-0 !text-[9px]`}>partial</Pill>}
      {signingPills(d.signing).map(p =>
        <Pill key={p.label} className={`${p.ours ? VIEWER_OURS_PILL : VIEWER_FOUND_PILL} !px-1.5 !py-0 !text-[9px]`} title={p.title}>
          {p.label.toLowerCase()}
        </Pill>)}
      <span className="shrink-0 text-[#6B6B6B] text-xs">›</span>
    </div>
  );

  return (
    <Card className="p-4 flex flex-col gap-2">
      <div className="text-xs font-bold tracking-[1px] text-[#3D3D3D]">
        {isEmail ? "DOCUMENTS IN THIS EMAIL" : "DOCUMENTS IN THIS FILE"} ({visible.length})
      </div>
      {visible.map(d => row(d, false))}
      {inline.length > 0 && (
        <React.Fragment>
          <button onClick={() => setShowInline(!showInline)}
            className="w-fit text-[10.5px] text-[#6B6B6B] hover:text-[#D4916E] px-1 py-0.5"
            style={{fontFamily:"Newsreader, serif"}}>
            {showInline ? "− hide" : "+"} {inline.length} inline image{inline.length > 1 ? "s" : ""}
          </button>
          {showInline && inline.map(d => row(d, true))}
        </React.Fragment>
      )}
    </Card>
  );
}

const PRPO_SUMMARY_KEYS = [
  "customerName", "uid", "startDate", "endDate", "contractNo", "hkd", "usdOthers",
  "vendor", "handledBy", "iptUnitMgr", "atqRefNo", "quotation", "projectDescription", "quotationDoc",
];

function PrpoExtractedFieldsCard({ attachments, fields, census, openSource, onEditRoles,
  itemIndex, selectItem, itemSelectionLocked, copied, copyForExcel,
  editingRoles, autoCensus, roleOverrides, onSaveRoles, onCancelRoles,
  documentPaneExpanded, fieldsPaneHidden, setHideFieldsPane, setViewerExpanded,
  closeViewer, viewerTarget, activeTab, defaultDoc, openWorkspaceViewer,
  crosschecks, dismissedDiffs, toggleDismissDiff, setField, emailSubject,
  addDocInputRef, pendingDocStatuses, addDocError, onAddDocument,
  n8nState, sendToN8n, n8nReady, adminMode }) {
  // All three, always, and in one place: `viewerTarget` falls back to the tab's
  // default document while `viewerExpanded` is set, so clearing `viewer` on its
  // own reopens the panel on a different document instead of closing it. The
  // header's "Collapse" text button and the viewer's own ✕ are the same action.
  const collapseViewer = () => { setViewerExpanded(false); setHideFieldsPane(false); closeViewer(); };
  // One tab per ATQ line item actually parsed, and never more: a tab the
  // records do not back still calls selectItem, which snapshots the form into
  // itemPlans[i] and points itemIndex at an item that does not exist. The old
  // bar only appeared at all once there were two records; falling back to 1
  // keeps that floor without having to re-introduce the condition.
  const itemRecords = recordsBearingEntry(attachments);
