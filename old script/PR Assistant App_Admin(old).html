    }
    setLisChecking(false);
    if (existingId === "") {
      setLisSaveError("A BTB_LIS_Excel_Datas4 row already exists for this Record_ID, but its Dataverse row id could not be resolved -- check admin_btb_lis_excel_datas4 in Dataverse directly.");
      return;
    }
    await writeLisAndAdvance(existingId);
  };
  // "Save & Return" -- same gate as "Continue to save" (a Non-BTB case still
  // needs the Back-to-Back / Friendly reminder checks before anything is
  // written), but instead of moving the reviewer on to LIS & Remark, it asks
  // for a remark, writes that remark alongside this item's LIS Value column
  // into BTB_LIS_Excel_Datas4, and once that succeeds resets the record and
  // starts a new one. Mirrors handleContinueToSave's own gate check.
  const handleSaveAndReturn = () => {
    setLisSaveError("");
    const btbPending = btbGated && !btbConfirmed;
    const friendlyPending = periodMismatchSettled && btbGated && !friendlyReminderConfirmed;
    if (btbPending || friendlyPending) { setContinueAttempts(n => n + 1); return; }
    setSaveReturnError("");
    setSaveReturnRemark("");
    setSaveReturnModal(true);
  };
  // Always writes (unlike writeLisAndAdvance, which no-ops once lisExcelWritten
  // is set) -- a reviewer who already clicked "Continue to save" this session
  // still needs this click to land the remark they are about to type, so the
  // existing row is updated rather than skipped.
  const confirmSaveAndReturn = async () => {
    setSaveReturnSaving(true);
    setSaveReturnError("");
    const webApi = parent && parent.Xrm && parent.Xrm.WebApi;
    let existingId = null;
    try {
      existingId = await findExistingLisRecordId(recordId, webApi);
    } catch (checkErr) {
      console.error(checkErr);
    }
    if (existingId === "") {
      setSaveReturnSaving(false);
      setSaveReturnError("A BTB_LIS_Excel_Datas4 row already exists for this Record_ID, but its Dataverse row id could not be resolved -- check admin_btb_lis_excel_datas4 in Dataverse directly.");
      return;
    }
    const err = await writeLisExcelRecord(lisExcelValues(), recordId, false, () => setLisExcelWritten(true), webApi, existingId, saveReturnRemark);
    setSaveReturnSaving(false);
    if (err) { setSaveReturnError(err); return; }
    if (markLisCreated) markLisCreated();
    setSaveReturnModal(false);
    setSaveReturnDone(true);
  };
  // The reviewer's own acknowledgement of "Data template Saved" is what
  // actually resets the record and starts the next one -- the write already
  // happened in confirmSaveAndReturn, this is only the hand-off back to a
  // blank Upload page (same reset App's "+ New Record" button uses).
  const finishSaveAndReturn = () => {
    setSaveReturnDone(false);
    if (onSaveAndReturn) onSaveAndReturn();
  };
  return (
    <React.Fragment>
      <TopBar title="Verify Table" desc="Check and Confirm the values to save"
        right={<React.Fragment>
          {/* Dataverse mode only. In document mode this column is not
              answering for Dataverse at all, so a button that re-reads it would
              be offering to change what the page means rather than to refresh
              what it shows. `recordId` is required on top: the read is a lookup
              by Record_ID and there is nothing to look up without one. */}
          {refreshDataverse && recordId && dataverseVerify && dataverseVerify.source === "n8n" && <GhostButton onClick={refreshDataverse}
            disabled={dataverseVerify && dataverseVerify.status === "loading"}
            title={"Read Agreement, Quotation, ATQ Excel, and LIS from Dataverse for " + recordId}>
            <span className="inline-flex items-center gap-1.5"><Icon name="refresh" className="w-3.5 h-3.5" />
              {dataverseVerify && dataverseVerify.status === "loading" ? "Refreshing..." : "Refresh"}
            </span>
          </GhostButton>}
          <PrimaryButton onClick={handleContinueToSave} disabled={lisChecking}>
            <span className="inline-flex items-center gap-2"><Icon name="check" className="w-4 h-4" />
              {lisChecking ? "Checking..." : "Continue to save"}</span>
          </PrimaryButton>
        </React.Fragment>} />
      <div className="px-5 md:px-8 pb-8 verify-stage">
        <Card className="p-5 md:p-6 flex flex-col gap-5 overflow-hidden">
          {/* Why the ATQ value says what it says, in Dataverse mode. Every one
              of these states used to be a console.warn, so the only visible
              symptom of a failed read was a table that had quietly got worse. */}
          {notice && (
            <div className={`text-[19px] leading-6 px-4 py-3 rounded-xl border ${
              notice.tone === "warn" ? "bg-[#FBEEDB] border-[#E3C88F] text-[#8A5A12]"
              : notice.tone === "ok" ? "bg-[#EFF5EF] border-[#C4D9C4] text-[#3D8B5F]"
              : "bg-[#F3EBE2] border-[#C5BEB6] text-[#6B6B6B]"}`}>
              {notice.text}
            </div>
          )}
          {/* Replaces the console.error-only failure -- the button used to move
              the reviewer on to LIS & Remark regardless of whether the write
              succeeded, so a failed save had no visible symptom at all. */}
          {lisSaveError && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[19px] leading-6 text-[#3D3D3D]">
                <span className="font-bold text-[#B23B3B]">Could not save to LIS.</span>{" "}
                {lisSaveError} Nothing moved on -- press Continue to save again to retry.
              </div>
            </div>
          )}
          {/* The Back-to-Back gate. Shown only when Back-to-Back = "N" (btbGated)
              -- an "N" item shows this alone, never the Friendly reminder below
              (see friendlyReminderActive). Revealed by the first "Continue to
              save" click for this item (continueAttempts, btbPanelActive);
              Back-to-Back reading "N" alone does not pop this open, the
              reviewer's own click does. Ticking all three hides it and
              continues the save. There is no close button: unlike the old
              click-OPENED-and-independently-closeable modal, there is no
              separate "dismissed" state to close it into once revealed --
              same as the Friendly reminder's own "Noted"-only resolution
              below. */}
          {btbPanelActive && (
            // Fixed, covers the whole viewport regardless of where this panel
            // sits in the page's scroll -- a backdrop confined to the Card
            // would leave the sidebar and TopBar undimmed, which is the part
            // of the screen a reviewer's eye is most likely to still be on.
            <div className="fixed inset-0 z-40 bg-black/45" aria-hidden="true" />
          )}
          {btbPanelActive && (
            <div ref={btbPanelRef} role="group" aria-label="Back-to-Back confirmation"
              className="relative z-50 w-full flex flex-col gap-3 px-4 py-3.5 bg-[#FBEEDB] border-l-4 border-[#E3C88F] rounded-lg shadow-[0_16px_40px_rgba(0,0,0,0.25)]">
              <div className="flex items-start gap-3">
                <div className="flex-1 text-[19px] leading-6 text-[#3D3D3D]">
                  <span className="font-bold text-[#8A5A12]">Back-to-Back = N.</span>{" "}
                  Confirm all three before saving.
                </div>
              </div>
              <div className="flex flex-col gap-2.5">
                {[
                  "Confirm this case as NON-BTB.",
                  'Check "Non-Back-To-Back" order confirmation; please state the reason in the ATQ cost item remarks/email body',
                  "Check if the case involves ad hoc onsite support requested by the customer without a signed contract.",
                ].map((text, i) => (
                  <label key={i} className="flex items-start gap-2.5 text-[19px] leading-6 text-[#3D3D3D] cursor-pointer">
                    <input type="checkbox" checked={btbChecks[i]} onChange={() => toggleBtbCheck(i)}
                      className="mt-0.5 w-4 h-4 shrink-0 accent-[var(--orange-dark)]" />
                    <span>{text}</span>
                  </label>
                ))}
              </div>
              <div className="text-[19px] leading-6 text-[#3D3D3D] pt-1 border-t border-[#E3C88F]">
                If so, require written customer confirmation with a price quotation. Please refer to the
                ATQ approval grid and seek either AVP or SVP approval. Click 4: Check the
                "Agreement Chop &amp; Signed" status.
              </div>
            </div>
          )}
          {/* Contract period vs quotation period. Only raised when the
              Back-to-Back gate is NOT active (Back-to-Back = "Y") -- an "N"
              case already shows the Back-to-Back panel above instead and must
              not also show this one (see friendlyReminderActive) -- AND only
              once the reviewer has clicked "Continue to save" at least once
              for this item (continueAttempts), same reveal-on-first-click rule
              as the Back-to-Back panel, though the two are mutually exclusive
              per item rather than appearing together. Not shown mid-keystroke
              while a date is still being typed (also why periodMismatch itself
              is debounced -- see periodMismatchSettled).
              Both branches are shown because whether this is a renewal (接龍)
              is not something any document on this page states -- the
              reviewer picks the line that applies.
              No longer pure information -- "Continue to save" now refuses to
              proceed until "Noted" is clicked (see handleContinueToSave's
              friendlyPending check), so the panel itself stays up either way
              as the reviewer's own
              record of having read it. */}
          {friendlyReminderActive && !friendlyReminderConfirmed && (
            // Same fixed, whole-viewport backdrop as the Back-to-Back gate --
            // dims only while the reminder is still unread; lifted once Noted
            // is clicked, since the panel itself stays up after that (see
            // note above) and a permanent dim would lock the rest of the page.
            <div className="fixed inset-0 z-40 bg-black/45" aria-hidden="true" />
          )}
          {friendlyReminderActive && (
            <div ref={friendlyReminderRef} className={`w-full flex flex-col gap-2 px-4 py-3 bg-[#EAF2FB] border-l-4 border-[#8FB4E3] rounded-lg${
              friendlyReminderConfirmed ? "" : " relative z-50 shadow-[0_16px_40px_rgba(0,0,0,0.25)]"}`}>
              <div className="text-[19px] leading-6 text-[#3D3D3D]">
                <span className="font-bold text-[#1D4ED8]">Friendly reminder:</span>{" "}
                before submitting your LIS, please make sure you have the ready for following item.
              </div>
              <ul className="flex flex-col gap-1 text-[19px] leading-6 text-[#3D3D3D]">
                <li className="flex gap-2">
                  <span aria-hidden="true" className="text-[#8FB4E3]">•</span>
                  <span>(if as 接龍) Provide previous contract info</span>
                </li>
                <li className="flex gap-2">
                  <span aria-hidden="true" className="text-[#8FB4E3]">•</span>
                  <span>(if not as 接龍) Ready Supporting document.</span>
                </li>
              </ul>
              <div className="flex items-center justify-end pt-1 border-t border-[#C7DBF0]">
                {friendlyReminderConfirmed
                  ? <span className="inline-flex items-center gap-1.5 text-[19px] font-semibold text-[#1D4ED8]">
                      <Icon name="check" className="w-3.5 h-3.5" /> Noted
                    </span>
                  : <button type="button" onClick={noteFriendlyReminder}
                      className="rounded-md bg-[#1D4ED8] px-3 py-1.5 text-[19px] font-semibold text-white ui-transition pressable hover:bg-[#1E3FAE]">
                      Noted
                    </button>}
              </div>
            </div>
          )}
          {items.length > 1 && (
            <div className="text-[19px] text-[var(--muted)]">
              Showing Item {itemIndex + 1} of {items.length} -- the item selected in Upload &amp; Parse.
            </div>
          )}
          {/* The reference block: values that describe the item as a whole
              rather than any one field, so they sit above the table instead
              of inside it (UID #, Record ID -- neither is a thing a document
              "disagrees" about). Bigger and its own row, not squeezed into
              the field grid, because a reviewer looks for these first. */}
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 pb-1">
            {Object.keys(SPANNING_ROWS).filter(key => key !== "uid").map(key => {
              const span = SPANNING_ROWS[key];
              const value = spanValues[key];
              return (
                <div key={key} className="surface-panel rounded-xl border border-[var(--line)] bg-[var(--surface-soft)] px-4 py-3" title={span.from}>
                  <span className="text-[19px] uppercase tracking-wide font-bold text-[var(--muted)]">{span.label}</span>
                  {value
                    ? <span className="mt-1 block text-[19px] leading-6 font-bold text-[var(--ink)]">{value}</span>
                    : <span className="text-[19px] text-[#C5BEB6] italic">not extracted</span>}
                </div>
              );
            })}
            {/* Not a field value -- just whether a document actually landed
                in that role slot, for a reviewer to check at a glance before
                reading anything else. Same census.assigned test as
                agreementSource/quotationSource above, so this never disagrees
                with what the rest of the page resolved a document from. */}
            <div className="surface-panel rounded-xl border border-[var(--line)] bg-[var(--surface-soft)] px-4 py-3" title="Whether a document was found for this role">
              <span className="text-[19px] uppercase tracking-wide font-bold text-[var(--muted)]">Document Received</span>
              <div className="mt-2 flex flex-col gap-2">
                <ReceivedCheckbox label="Agreement" checked={!!agreementSource} />
                <ReceivedCheckbox label="Quotation" checked={!!quotationSource} />
              </div>
            </div>
          </div>
          {/* Legend. The only thing meant to catch the eye on this page is a
              real conflict or a missing must-compare value, so this names
              the five states once instead of spelling each one out beside
              every value. */}
          <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-[19px] text-[var(--muted)] pb-3 border-b border-[var(--line)]">
            <span className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-[#1A1A1A]" /> Agrees across documents
            </span>
            <span className="flex items-center gap-1.5">
              <Icon name="circleX" className="w-5 h-5 text-[var(--red)]" />
              <span className="text-[var(--red)] font-bold">Different</span> — documents disagree
            </span>
            <span className="flex items-center gap-1.5">
              <Icon name="alertTriangle" className="w-5 h-5 text-[#D97706]" />
              <span className="text-[#D97706] font-bold">Wording only</span>
            </span>
            <span className="flex items-center gap-1.5">
              <Icon name="squareOff" className="w-5 h-5 text-[#64748B]" />
              <span className="text-[#64748B] font-bold">No value to compare</span>
            </span>
            <span className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-[#C5BEB6]" /> Only one document reports it
            </span>
            <span className="flex items-center gap-1.5 ml-auto">
              <Icon name="checkCircleBig" className="w-5 h-5 text-[var(--green)]" />
              <span className="text-[var(--green)] font-semibold">Passed</span> — reviewed and resolved by hand
            </span>
          </div>
          <div className="overflow-x-auto rounded-2xl border border-[var(--line)] bg-[var(--surface-soft)] p-2">
            <table className="w-full min-w-[1240px] table-fixed text-[19px] leading-6 border-separate border-spacing-y-2" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>
            <colgroup>
              {n8nVerifyMode && <col style={{width: "44px"}} />}
              <col style={{width: n8nVerifyMode ? "20%" : "22%"}} />
              <col style={{width: n8nVerifyMode ? "23%" : "24%"}} />
              <col style={{width: n8nVerifyMode ? "30%" : "29%"}} />
              <col style={{width: n8nVerifyMode ? "27%" : "25%"}} />
            </colgroup>
            <thead>
              <tr>
                {n8nVerifyMode && <th className="w-10 px-1 py-2" aria-label="Status"></th>}
                <th className="text-left px-4 py-3 font-semibold text-[var(--muted)] uppercase tracking-[0.04em] text-[19px]">Field</th>
                <th className="text-right px-4 py-3 font-semibold text-[var(--muted)] uppercase tracking-[0.04em] text-[19px]">
                  <span className="inline-flex items-center justify-end gap-2">
                    Value ({valueColumn.label})
                    <DocOpenButton onClick={openValueDoc} title={openValueDocTitle} />
                  </span>
                </th>
                <th className="text-left px-4 py-3 font-semibold text-[var(--muted)] uppercase tracking-[0.04em] text-[19px]">Cross Check</th>
                <th className="text-right px-4 py-3 font-semibold text-[var(--muted)] uppercase tracking-[0.04em] text-[19px]">LIS Value</th>
              </tr>
            </thead>
            <tbody>
              {VERIFY_TABLE_ROWS.map(row => {
                const key = row.key;
                const config = Object.assign({}, FIELD_ROW_CONFIG[key] || { compare: ["agreement", "quotation"] }, row);
                const label = row.label || FIELD_LABELS[key] || COMPARE_ONLY_LABELS[key] || key;
                if (n8nVerifyMode) {
                  const value = valueForVerifyRow(row);
                  const crossValue = crossValueForVerifyRow(row);
                  const cc = crosschecks[key];
                  const statusIcon = statusIconForVerifyRow(row, value, crossValue, cc && cc.severity);
                  const csrc = crossCheckDocSource(row);
                  const openCDoc = openDocButton(csrc, row.sourceRole);
                  const statusCell = (
                    <td className="w-10 px-1 py-2 align-middle text-center">
                      <span className="inline-flex h-6 w-6 items-center justify-center" title="Row status">
                        {statusIcon}
                      </span>
                    </td>
                  );
                  if (row.special === "chopResult") {
                    return (
                      <tr key={row.id} className="border-b border-[#EEE7DE]">
                        {statusCell}
                        <td className="px-3 py-2 text-[#3D3D3D] font-medium">{label}</td>
                        <td className="px-3 py-2 text-right">
                          {chop
                            ? <span className="text-[19px] text-[#1A1A1A]">{chop}</span>
                            : <span className="text-[19px] text-[#C5BEB6] italic">not extracted</span>}
                        </td>
                        <td className="px-3 py-2 align-top">
                          <div className="inline-flex flex-col gap-1.5 text-left">
                            <span className="text-[19px] font-semibold text-[#6B6B6B]">{row.crossCheckLabel}</span>
                            {buttonValue(row, crossValue, "Use this Cross Check value as LIS Value", "cross-check")}
                          </div>
                        </td>
                        {lisValueCell(row, key)}
                      </tr>
                    );
                  }
                  if (row.special === "chopAttachment") {
                    return (
                      <tr key={row.id} className="border-b border-[#EEE7DE]">
                        {statusCell}
                        <td className="px-3 py-2 text-[#3D3D3D] font-medium align-top">{label}</td>
                        <td className="px-3 py-2 align-top text-right">
                          {chops.length
                            ? <span className="flex flex-col gap-1.5 items-end">
                                {chops.map(m => {
                                  const page = chopPageOverride || m.page;
                                  return (
                                  <span key={m.key} className="flex flex-col gap-0.5 items-end">
                                    {m.crop &&
                                      <button onClick={() => setChopZoom(m)}
                                        title="Enlarge this chop and the sign-off block above it"
                                        className="self-end mb-1 rounded-md border border-[#C5BEB6] overflow-hidden ui-transition pressable hover:border-[#D4916E]">
                                        <img src={m.crop} alt={`Company chop on page ${m.page}${m.name ? ", " + m.name : ""}`}
                                          className="block max-w-[190px] max-h-[76px] object-contain bg-white" />
                                      </button>}
                                    <span className={m.ours ? "text-[#6B6B6B]" : "text-[#3D3D3D] font-medium"}>
                                      {m.name || "Owner not identified"}
                                    </span>
                                    {viewChop &&
                                      <button onClick={() => viewChop(page)}
                                        title={`Open the agreement at page ${page}, where this chop was found`}
                                        className="text-[19px] text-[#D4916E] font-semibold underline underline-offset-2 ui-transition pressable hover:text-[#B87551]">
                                        View →
                                      </button>}
                                  </span>
                                  );
                                })}
                              </span>
                            // No local mark at all -- but admin_pagenumber on the
                            // Dataverse Agreement record still says which page n8n
                            // confirmed the chop/signature sits on. Local OCR missing
                            // it (a light ink pass, a faint stamp) must not read as
                            // "there is nothing here"; the reviewer still gets a page
                            // to check by hand, same as when a mark IS found.
                            : chopPageOverride
                              ? <span className="flex flex-col gap-0.5 items-end">
                                  <span className="text-[19px] text-[#8E8E93] italic">Not detected locally</span>
                                  {viewChop &&
                                    <button onClick={() => viewChop(chopPageOverride)}
                                      title={`Open the agreement at page ${chopPageOverride}, per Dataverse`}
                                      className="text-[19px] text-[#D4916E] font-semibold underline underline-offset-2 ui-transition pressable hover:text-[#B87551]">
                                      View page {chopPageOverride} →
                                    </button>}
                                </span>
                              : <span className="text-[#C5BEB6] italic">not extracted</span>}
                        </td>
                        <td className="px-3 py-2 align-top">
                          <div className="inline-flex flex-col gap-1.5 text-left">
                            <span className="text-[19px] font-semibold text-[#6B6B6B]">{row.crossCheckLabel}</span>
                            {buttonValue(row, crossValue, "Use this Cross Check value as LIS Value", "cross-check")}
                          </div>
                        </td>
                        {lisValueCell(row, key)}
                      </tr>
                    );
                  }
                  // Handled By / IPT Unit Mgr / UID: none of these is a thing
                  // any other document has an opinion about (see the ATQ-only
                  // `solo` note and the SPANNING_ROWS comment on UID above), so
                  // there is no Value/Cross Check breakdown and no status to
                  // show -- these three never "agree" or "differ" against
                  // anything, they are just read off the ATQ workbook. The
                  // extracted value goes straight into the LIS Value box as
                  // its starting value (same autoValue precedence as a Passed
                  // row: manual edit > Dataverse LIS reading > this value >
                  // empty), with a document button straight to the workbook.
                  if (row.special === "uid" || row.solo) {
                    const atqDocSrc = columnDocSource(census, { roleKey: "atq", kind: "excel" });
                    const openAtqDoc = openDocButton(atqDocSrc, "atq");
                    return (
                      <tr key={row.id} className="border-b border-[#EEE7DE]">
                        <td className="w-10 px-1 py-2 align-middle text-center"></td>
                        <td className="px-3 py-2 text-[#3D3D3D] font-medium">{label}</td>
                        <td className="px-3 py-2 align-top"></td>
                        <td className="px-3 py-2 align-top"></td>
                        <td className="px-3 py-2 text-right align-top">
                          <div className="inline-flex items-center gap-1.5 w-full justify-end">
                            <input type="text" value={lisValueForRow(row, key, value) == null ? "" : lisValueForRow(row, key, value)}
                              onChange={e => setLisText(row.id, e.target.value)}
                              placeholder="—"
                              aria-label={(row.label || FIELD_LABELS[key] || key) + " LIS value"}
                              className={`w-full min-w-[120px] rounded-lg border border-[var(--line)] bg-white px-3 py-1.5 text-right text-[19px] ui-transition focus:border-[var(--orange)] focus:outline-none focus:ring-2 focus:ring-[#FFE2B0] ${lisValueIsExisting(row, key) ? "text-[#8A8A8A]" : "text-[#1A1A1A]"}`} />
                            {lisClearButton(row.id, lisValueForRow(row, key, value))}
                            <DocOpenButton onClick={openAtqDoc} title={"Open " + sourceBaseName(atqDocSrc)} />
                          </div>
                        </td>
                      </tr>
                    );
                  }
                  return (
                    <tr key={row.id} className="border-b border-[#EEE7DE]">
                      {statusCell}
                      <td className="px-3 py-2 text-[#3D3D3D] font-medium">{label}</td>
                      <td className="px-3 py-2 text-right">
                        {NO_ATQ_VALUE_ROW_IDS.has(row.id)
                          ? null
                          : buttonValue(row, value, "Use this Value (ATQ Excel) as LIS Value", "atq-excel")}
                      </td>
                      <td className="px-3 py-2 align-top">
                        <div className="inline-flex flex-col gap-1.5 text-left">
                          <span className="inline-flex items-center gap-1.5 text-[19px] font-semibold text-[#6B6B6B]">
                            {crossCheckSourceLabel(row)}
                            <DocOpenButton onClick={openCDoc} title={"Open " + sourceBaseName(csrc)} />
                          </span>
                          {buttonValue(row, crossValue, "Use this Cross Check value as LIS Value", "cross-check")}
                        </div>
                      </td>
                      {lisValueCell(row, key, verifyRowPassed(row, value, crossValue, cc && cc.severity) ? value : undefined)}
                    </tr>
                  );
                }
                if (row.special === "uid") {
                  const value = spanValues.uid || atqExcelCellValue(dataverseVerify, key) || verifyCellValue(crosschecks, key, "atq", dataverseVerify, recordId, "excel");
                  return (
                    <tr key={row.id} className="border-b border-[#EEE7DE]">
                      <td className="px-3 py-2 text-[#3D3D3D] font-medium">{label}</td>
                      <td className="px-3 py-2 text-right">
                        {value
                          ? <span className="text-[19px] text-[#1A1A1A]">{value}</span>
                          : <span className="text-[19px] text-[#C5BEB6] italic">not extracted</span>}
                      </td>
                      <td className="px-3 py-2 align-top"></td>
                      {lisValueCell(row, key)}
                    </tr>
                  );
                }
                if (row.special === "chopResult") {
                  return (
                    <tr key={row.id} className="border-b border-[#EEE7DE]">
                      <td className="px-3 py-2 text-[#3D3D3D] font-medium">{label}</td>
                      <td className="px-3 py-2 text-right">
                        {chop
                          ? <span className="text-[19px] text-[#1A1A1A]">{chop}</span>
                          : <span className="text-[19px] text-[#C5BEB6] italic">not extracted</span>}
                      </td>
                      <td className="px-3 py-2 align-top"></td>
                      {lisValueCell(row, key)}
                    </tr>
                  );
                }
                if (row.special === "chopAttachment") {
                  return (
                    <tr key={row.id} className="border-b border-[#EEE7DE]">
                      <td className="px-3 py-2 text-[#3D3D3D] font-medium align-top">{label}</td>
                      <td className="px-3 py-2 align-top text-right">
                        {chops.length
                          ? <span className="flex flex-col gap-1.5 items-end">
                              {chops.map(m => (
                                <span key={m.key} className="flex flex-col gap-0.5 items-end">
                                  {m.crop &&
                                    <button onClick={() => setChopZoom(m)}
                                      title="Enlarge this chop and the sign-off block above it"
                                      className="self-end mb-1 rounded-md border border-[#C5BEB6] overflow-hidden ui-transition pressable hover:border-[#D4916E]">
                                      <img src={m.crop} alt={`Company chop on page ${m.page}${m.name ? ", " + m.name : ""}`}
                                        className="block max-w-[190px] max-h-[76px] object-contain bg-white" />
                                    </button>}
                                  <span className={m.ours ? "text-[#6B6B6B]" : "text-[#3D3D3D] font-medium"}>
                                    {m.name || "Owner not identified"}
                                  </span>
                                  {viewChop &&
                                    <button onClick={() => viewChop(m.page)}
                                      title={`Open the agreement at page ${m.page}, where this chop was found`}
                                      className="text-[19px] text-[#D4916E] font-semibold underline underline-offset-2 ui-transition pressable hover:text-[#B87551]">
                                      View →
                                    </button>}
                                </span>
                              ))}
                            </span>
                          : <span className="text-[#C5BEB6] italic">not extracted</span>}
                      </td>
                      <td className="px-3 py-2 align-top"></td>
                      <td className="px-3 py-2 text-right align-top text-[#C5BEB6] italic">â€”</td>
                    </tr>
                  );
                }
                const excelValue = verifyCellValue(crosschecks, key, "atq", dataverseVerify, recordId, "excel");

                // Solo rows (Product Type / Service Type / Back-to-Back): the
                // ATQ workbook is the only document that ever states these,
                // so there is nothing to cross-check -- flagging them against
                // documents that were never asked would manufacture a
                // disagreement out of silence. Plain value, no colour, no
                // breakdown.
                //
                // Quotation No. reaches the same plain treatment, but
                // conditionally: only when the ATQ workbook left this blank
                // (soloRole), so the row falls back to the Quotation
                // document's own reading instead of reporting "not
                // extracted" for a value one document plainly states.
                const solo = config.solo || (config.soloRole && !excelValue);
                if (solo) {
                  // Solo rows: prefer ATQ Excel Dataverse value, fall back to extracted
                  const atqExcelVal = atqExcelValueForRow(config) || atqExcelCellValue(dataverseVerify, key);
                  const value = atqExcelVal || (config.solo ? excelValue
                    : verifyCellValue(crosschecks, key, config.soloRole, dataverseVerify, recordId,
                        (EXTRACTED_FIELD_COLUMNS.find(c => c.roleKey === config.soloRole) || {}).kind));
                  const soloTitle = config.solo ? "" : "The ATQ workbook has no value here — shown from the Quotation document directly.";
                  return (
                    <tr key={row.id} className="border-b border-[#EEE7DE]">
                      <td className="px-3 py-2 text-[#3D3D3D] font-medium">{label}</td>
                      <td className="px-3 py-2 text-right" title={soloTitle}>
                        {value
                          ? <span className="text-[19px] text-[#1A1A1A]">{value}</span>
                          : <span className="text-[19px] text-[#C5BEB6] italic">not extracted</span>}
                      </td>
                      <td className="px-3 py-2 text-[#C5BEB6] italic align-top"></td>
                      {lisValueCell(row, key)}
                    </tr>
                  );
                }

                const cc = crosschecks[key];
                // The ATQ (Excel) column is blank on its own fairly often --
                // see the Quotation No. soloRole note above -- and that is
                // NOT, by itself, "no value to compare": if the Agreement or
                // the Quotation has one, there is plainly something to check
                // this field against, just not from the ATQ side. So every
                // OTHER compare role is read up front, and a blank ATQ falls
                // back to the first one that has an answer, exactly the same
                // move the Quotation No. row already makes on its own. Only
                // when EVERY source -- ATQ included -- comes back empty is
                // this genuinely "no data value to do the cross check".
                const breakdownCols = EXTRACTED_FIELD_COLUMNS.filter(c => config.compare.indexOf(c.roleKey) >= 0);
                const compareReadings = breakdownCols.map(c => ({
                  col: c, value: verifyCellValue(crosschecks, key, c.roleKey, dataverseVerify, recordId, c.kind),
                }));
                const fallback = !excelValue ? compareReadings.find(r => r.value) : null;
                // Value column: prefer the ATQ Excel Dataverse record (what was
                // actually saved), fall back to the extracted document value.
                const atqExcelVal = atqExcelCellValue(dataverseVerify, key);
                const value = atqExcelVal || excelValue || (fallback ? fallback.value : "");
                const tone = verifyValueTone(cc, value);
                const flagged = cc && (cc.severity === "different" || cc.severity === "similar");
                // True absence: reads the SAME values the breakdown panel
                // below is about to render (compareReadings), not the raw
                // document extraction underneath them. In Dataverse mode
                // that is deliberate -- the module comment above
                // (dataverseCellValue) says it outright: "the Agreement and
                // Quotation columns then answer for Dataverse and for
                // nothing else". A document's OCR having once found a
                // Customer Name is not "data to cross-check" once this page
                // has moved to asking Dataverse instead; the reviewer is
                // looking at a breakdown that says "not in Dataverse" for
                // both roles, and the row has to agree with what it is
                // showing rather than silently trusting a reading the panel
                // itself does not display. Outside Dataverse mode
                // compareReadings already falls back to the plain document
                // extraction (verifyCellValue's own non-Dataverse branch), so
                // this is still "nothing on the ATQ workbook and nothing on
                // any comparable document" there, same as before.
                const missing = cc && !compareReadings.some(r => r.value);
                // Both states need the reviewer's attention: a real
                // disagreement, or nothing to compare at all. `passed` is the
                // same dismissedDiffs/toggleDismissDiff state Verify's own
                // Automatic Checks panel already uses -- passing a row here
                // shows up as resolved there too, and the reverse.
                const passed = !!(cc && dismissedDiffs && dismissedDiffs.has(cc.dismissKey));
                const problem = cc && (flagged || missing) && !passed;
                const pass = cc && toggleDismissDiff ? () => toggleDismissDiff(cc.dismissKey) : null;
                // The row's status logo now lives at the end of the Field
                // Name cell instead of beside the value -- one glance down
                // the left column tells the reviewer which rows need
                // attention, same priority order the value column used to
                // encode: resolved beats missing beats a real conflict.
                const rowIcon = passed
                  ? { name: "checkCircleBig", color: "text-[#3D8B5F]" }
                  : missing
                  ? { name: "alertTriangle", color: "text-[#CA8A04]" }
                  : (flagged && tone.icon)
                  ? { name: tone.icon, color: tone.iconColor }
                  : null;
                // Every row with a comparison to run can be opened to see
                // what the OTHER document(s) for this field said -- not just
                // the ones currently in conflict, because comparing these
                // fields is the mandatory step, and a reviewer confirming an
                // agreeing row still needs to see (and Pass) what it agreed
                // against. Whichever source is already sitting in the row --
                // ordinarily ATQ (Excel), or the fallback source when ATQ has
                // none -- is left out of its own breakdown, since repeating a
                // value beside itself proves nothing. `config.compare` names
                // which roles this field is even comparable against
                // (Agreement Number only ever appears on the Agreement;
                // Customer Name genuinely appears on all three), so the panel
                // never offers a column that could not have produced the
                // disagreement. Still resolved the same way as before
                // (verifyCellValue / columnDocSource). A plain <details>
                // rather than React state for the open/closed part: the
                // breakdown is then part of the static markup (openable with
                // no JS, and directly assertable in a test) instead of a
                // click this harness cannot simulate. It opens by default
                // only when there IS a problem (`problem`, below) -- an
                // agreeing row starts collapsed, since nothing there needs
                // the reviewer's eye first.
                const shownBreakdownCols = fallback ? breakdownCols.filter(c => c !== fallback.col) : breakdownCols;
                const breakdown = (
                  <div className="mt-2 inline-block rounded-lg border border-[#EEE7DE] bg-[#FAF7F2] px-3 py-2 text-left min-w-[240px]">
                    <table className="w-full text-[19px] border-collapse">
                      <tbody>
                        {shownBreakdownCols.map(c => {
                          const v = verifyCellValue(crosschecks, key, c.roleKey, dataverseVerify, recordId, c.kind);
                          const fromDataverse = dataverseIsActive(dataverseVerify, c.roleKey);
                          const csrc = columnDocSource(census, c);
                          const openCDoc = openDocButton(csrc, c.roleKey);
                          return (
                            <tr key={c.key}>
                              <td className="pr-3 py-1 align-top text-[#6B6B6B] font-semibold whitespace-nowrap">{c.label}</td>
                              <td className="py-1 align-top">
                                {n8nVerifyMode && v && (c.roleKey === "agreement" || c.roleKey === "quotation")
                                  ? <button onClick={() => selectLisValue(row.id, v)}
                                      title={"Use this " + c.label + " value as LIS Value"}
                                      className="text-left text-[#1A1A1A] font-semibold underline underline-offset-2 decoration-[#D4916E] hover:text-[#B87551] ui-transition pressable">
                                      {v}
                                    </button>
                                  : <span className={v ? "text-[#1A1A1A]" : "text-[#C5BEB6] italic"}>
                                      {v || (fromDataverse ? "not in Dataverse" : "not extracted")}
                                    </span>}
                              </td>
                              <td className="pl-2 py-1 align-top text-right">
                                <DocOpenButton onClick={openCDoc} title={"Open " + sourceBaseName(csrc)} />
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                    {/* Every problem row gets the same resolution: a reviewer
                        who has actually looked at the documents and decided
                        the flag (or the blank) is fine says so here. Reuses
                        the app's existing per-field dismissal, so passing a
                        row is the same action as dismissing it in Verify's
                        Automatic Checks -- one state, not two that could
                        disagree. */}
                    {pass &&
                      <div className="mt-2 pt-2 border-t border-[#EEE7DE] flex justify-end">
                        <button onClick={pass}
                          className="inline-flex items-center gap-1 text-[19px] font-semibold text-[#3D8B5F] hover:text-[#2E6B47] ui-transition pressable">
                          <Icon name="checkCircleBig" className="w-4 h-4" /> Pass
                        </button>
                      </div>}
                  </div>
                );
                // Comparing is the mandatory step, not just flagging a
                // conflict -- so EVERY row with a comparison to run (cc
                // exists) gets the same expandable breakdown and the same
                // Pass button, not only the ones currently in trouble.
                // Agreeing and uncorroborated rows just start collapsed,
                // since nothing there needs the reviewer's eye first; a real
                // conflict or a missing value starts open, per `problem` above.
                return (
                  <tr key={row.id} className="border-b border-[#EEE7DE]">
                    <td className="px-3 py-2 text-[#3D3D3D] font-medium">
                      <span className="inline-flex items-center gap-2">
                        {label}
                      </span>
                    </td>
                    {/* 3. Value — ATQ Excel Dataverse value, plain */}
                    <td className="px-3 py-2 text-right">
                      {value
                        ? <span className="text-[19px] text-[#1A1A1A]">{value}</span>
                        : <span className="text-[19px] text-[#C5BEB6] italic">not extracted</span>}
                    </td>
                    {/* 4. Cross Check — breakdown with Pass/undo */}
                    <td className="px-3 py-2 align-top">
                      {cc
                        ? n8nVerifyMode
                          ? breakdown
                          : <details open={problem} className="inline-block">
                            <summary title={missing
                              ? "No document this field is compared against has a value"
                              : flagged ? tone.title : "Click to see what each document says"}
                              className="inline-flex items-baseline gap-1.5 cursor-pointer outline-none list-none [&::-webkit-details-marker]:hidden">
                              {missing
                                ? <span className="inline-flex items-center gap-1 text-[19px] font-bold text-[#B23B3B]">No value to compare</span>
                                : flagged
                                ? <span className={`inline-flex items-center gap-1 text-[19px] ${tone.text}`}>{tone.glyph} compared</span>
                                : <span className="text-[19px] text-[#3D8B5F] font-medium">Agrees</span>}
                              <Icon name="chevronDown" className="w-3.5 h-3.5 text-[#8E847A] shrink-0" />
                            </summary>
                            {breakdown}
                            {pass && !missing &&
                              <div className="mt-2 pt-2 border-t border-[#EEE7DE] flex justify-end">
                                <button onClick={pass}
                                  className="inline-flex items-center gap-1 text-[19px] font-semibold text-[#3D8B5F] hover:text-[#2E6B47] ui-transition pressable">
                                  <Icon name="checkCircleBig" className="w-4 h-4" /> Pass
                                </button>
                              </div>}
                          </details>
                        : <span className="text-[19px] text-[#C5BEB6] italic">—</span>}
                    </td>
                    {lisValueCell(row, key)}
                  </tr>
                );
              })}
              {/* The one-sentence detection summary, as its own LIS row --
                  ahead of Company Chop's own per-mark detail below it. Its
                  content sits in the LAST column, not Value -- these rows
                  carry wide content (reminder text, chop crops) that would
                  otherwise stretch the Value column and drag "Value (ATQ
                  Excel)" / "Cross Check" off-centre for every other row in
                  the table, since column widths are shared across the whole
                  table, not per-row. */}
              <tr className="border-b border-[#EEE7DE]">
                {n8nVerifyMode && <td className="w-8 px-1 py-2"></td>}
                <td className="px-3 py-2 text-[#3D3D3D] font-medium align-top">Chop / Sign Detection</td>
                <td className="px-3 py-2 align-top"></td>
                <td className="px-3 py-2 align-top"></td>
                <td className="px-3 py-2 align-top text-right">
                  {chop
                    ? <span className="text-[#3D3D3D] font-medium">{chop}</span>
                    : <span className="text-[#C5BEB6] italic">not extracted</span>}
                </td>
              </tr>
              {/* Company Chop is the agreement's own ink, not a cross-checked
                  field, so it draws as its own spanning row rather than
                  pretending to be the ATQ value. What it draws is the
                  detection itself -- one line per mark the ink pass found,
                  named, placed on a page, and openable -- rather than the
                  one-sentence "Signed & Chopped" summary it used to. The
                  summary survives only as the fallback for a result that knows
                  a chop was found but kept no marks (demo data, an older
                  parse); it is a weaker answer, not a different one. */}
              <tr className="border-b border-[#EEE7DE]">
                {n8nVerifyMode && <td className="w-8 px-1 py-2"></td>}
                <td className="px-3 py-2 text-[19px] text-[#3D3D3D] font-bold align-top">Company Chop</td>
                <td className="px-3 py-2 align-top"></td>
                <td className="px-3 py-2 align-top"></td>
                {/* The ink goes in the LAST column, not Value -- see the Chop
                    / Sign Detection row above for why: the crops and mark
                    detail here are wide enough to drag every other row's
                    Value/Cross Check columns off-centre if they shared a
                    column with them. This row used to carry two filler cells
                    and push its content one column right, which left it with
                    MORE cells than the header has -- and a table with one
                    row wider than its header grows a phantom last column
                    that eats the slack, so every cell above stopped short of
                    the card's right edge. */}
                <td className="px-3 py-2 align-top text-right">
                  {chop === "No Chop Position"
                    ? <span className="text-[#C5BEB6] italic">No chop found</span>
                    : chops.length
                    ? <span className="flex flex-col gap-1.5 items-end">
                        {chops.map(m => (
                          <span key={m.key} className="flex flex-col gap-0.5 items-end">
                            {/* The chop itself, cut out of the page. The
                                whole reason a reviewer opens the document
                                here is to see one 2cm ring, and the crop
                                carries the printed sign-off block with it
                                -- which is where the name beside it came
                                from, since the ink's own OCR is unreadable
                                (measured: "0", null, "One Center"). A mark
                                with no crop keeps every other part of its
                                line. */}
                            {m.crop &&
                              <button onClick={() => setChopZoom(m)}
                                title="Enlarge this chop and the sign-off block above it"
                                className="self-end mb-1 rounded-md border border-[#C5BEB6] overflow-hidden ui-transition pressable hover:border-[#D4916E]">
                                <img src={m.crop} alt={`Company chop on page ${m.page}${m.name ? ", " + m.name : ""}`}
                                  className="block max-w-[190px] max-h-[76px] object-contain bg-white" />
                              </button>}
                            <span className={m.ours ? "text-[#6B6B6B]" : "text-[#3D3D3D] font-medium"}
                              title={[m.cue && `Read under "${m.cue}"`, m.label && `Printed line: ${m.label}`]
                                .filter(Boolean).join(" — ")}>
                              {/* No name is a real answer: the ring was
                                  found, the sign-off block above it was
                                  not readable. Saying so beats both a
                                  blank cell and a guess off mark.text. */}
                              {m.name || "Owner not identified"}
                            </span>
                            <span className="text-[19px] text-[#6B6B6B] flex flex-wrap items-baseline gap-x-1.5 justify-end">
                              <span>
                                {[m.ours ? `${OUR_COMPANY.label}'s own chop` : "chop",
                                  m.color && `${m.color} ink`,
                                  `page ${m.page}`,
                                  m.confidence != null && `${Math.round(m.confidence * 100)}% confidence`]
                                  .filter(Boolean).join(" · ")}
                              </span>
                              {viewChop &&
                                <button onClick={() => viewChop(m.page)}
                                  title={`Open the agreement at page ${m.page}, where this chop was found`}
                                  className="text-[#D4916E] font-semibold underline underline-offset-2 ui-transition pressable hover:text-[#B87551]">
                                  View →
                                </button>}
                            </span>
                          </span>
                        ))}
                        {/* The other ink on the same page. A signed
                            agreement is the normal case and the row would
                            be quieter about it than the old summary was
                            if this were dropped. */}
                        {!!signatures.length &&
                          <span className="text-[19px] text-[#6B6B6B]">
                            Signature also found — {signatures.map(s =>
                              `${s.name || "owner not identified"} (page ${s.page})`).join(", ")}
                          </span>}
                      </span>
                    : chop
                      ? <span className="text-[#3D3D3D] font-medium">{chop}</span>
                      : <span className="text-[#C5BEB6] italic">not extracted</span>}
                </td>
              </tr>
            </tbody>
          </table>
          </div>
          {/* Static reminder, always shown beneath the table -- not
              conditional on a detected mismatch, per the reviewer's own
              manual-review process. Moved out of the table (it used to be a
              spanning row) because its content is wide enough that even
              confined to the LAST column it dragged every other row's
              Value / Cross Check columns off-centre -- the table's column
              widths are shared across the whole table, not per-row. As its
              own full-width block below the table it no longer constrains
              anything above it. */}
          <div className="rounded-lg border border-[#F3D9B1] bg-[#FFF8EC] px-4 py-3 text-[19px] leading-relaxed text-[#8A5A1E]">
            <p className="font-semibold text-[#3D3D3D] mb-1">Chop Reminder</p>
            <p>Please note that this case requires further manual review as the company chop does not match the company name on the signed contract/customer PO. Before submitting the LIS, please complete one of the following two actions:</p>
            <p>Option (1): Obtain AVP approval, together with customer email confirmation/letter indicating the relationship between the two entities.</p>
            <p>Option (2): Obtain AVP approval, together with an official website screen capture.</p>
          </div>
          {/* Same actions as the TopBar's Save & Return / Continue to save --
              a reviewer who just read the Chop Reminder above should not have
              to scroll back to the top of the page to act on it. */}
          <div className="flex justify-end gap-2">
            <PrimaryButton onClick={handleContinueToSave} disabled={lisChecking}>
              <span className="inline-flex items-center gap-2"><Icon name="check" className="w-4 h-4" />
                {lisChecking ? "Checking..." : "Continue to save"}</span>
            </PrimaryButton>
          </div>
        </Card>
      </div>
      {/* The enlarged chop. Deliberately NOT the document viewer: what a
          reviewer wants here is one seal and the two printed lines above it,
          and opening 22 pages of scanned contract to find them is the thing
          this replaces. The "View →" link beside each line still opens the
          page for anyone who does want the whole thing.
          Backdrop and button both close it; there is no Esc handler, because
          a keydown listener needs an effect and effects are the one thing the
          render harness cannot run. */}
      {chopZoom && (
        <div onClick={() => setChopZoom(null)} role="dialog" aria-modal="true"
          aria-label="Company chop, enlarged"
          className="modal-backdrop fixed inset-0 z-50 bg-[#F4F0E8]/85 backdrop-blur-sm flex items-center justify-center p-8">
          <div onClick={e => e.stopPropagation()}
            className="modal-pop bg-white rounded-xl p-4 flex flex-col gap-3 max-w-[92vw] max-h-[88vh]">
            <div className="flex items-baseline gap-3">
              <span className="text-[19px] font-bold text-[#1A1A1A]">
                {chopZoom.name || "Owner not identified"}
              </span>
              <span className="text-[19px] text-[#6B6B6B]">
                {[chopZoom.ours ? OUR_COMPANY.label + "'s own chop" : "chop",
                  "page " + chopZoom.page,
                  chopZoom.cue && "read under “" + chopZoom.cue + "”"]
                  .filter(Boolean).join(" · ")}
              </span>
              <button onClick={() => setChopZoom(null)}
                className="ml-auto text-[19px] text-[#6B6B6B] hover:text-[#1A1A1A] ui-transition pressable">
                Close ✕
              </button>
            </div>
            <img src={chopZoom.crop} alt={"Company chop on page " + chopZoom.page}
              className="block max-w-full max-h-[72vh] object-contain bg-white rounded-md border border-[#C5BEB6]" />
          </div>
        </div>
      )}
      {/* "Save & Return" step 1: the remark. Same backdrop/pop pattern as the
          chop zoom and Coming Soon modals above -- backdrop click cancels,
          same as those, since nothing has been written to Dataverse yet. */}
      {saveReturnModal && (
        <div onClick={() => !saveReturnSaving && setSaveReturnModal(false)} role="dialog" aria-modal="true"
          aria-label="Save & Return remark"
          className="modal-backdrop fixed inset-0 z-50 bg-[#F4F0E8]/85 backdrop-blur-sm flex items-center justify-center p-8">
          <div onClick={e => e.stopPropagation()}
            className="modal-pop bg-white rounded-2xl shadow-xl p-6 max-w-md w-full flex flex-col gap-3">
            <div className="text-[19px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Save & Return</div>
            <div className="text-[19px] text-[#6B6B6B]">Add a remark for this item's LIS row before it is written.</div>
            <textarea value={saveReturnRemark} onChange={e => setSaveReturnRemark(e.target.value)}
              rows={4} autoFocus placeholder="Remark"
              aria-label="Status remark"
              className="w-full px-3 py-2 text-[19px] text-[var(--ink)] rounded-xl border-[1.5px] border-[var(--line)] bg-white outline-none focus:border-[var(--orange)] resize-y" />
            {saveReturnError && <div className="text-[19px] text-[#B23B3B]">{saveReturnError}</div>}
            <div className="flex justify-end gap-2 mt-1">
              <GhostButton onClick={() => setSaveReturnModal(false)} disabled={saveReturnSaving}>Cancel</GhostButton>
              <PrimaryButton onClick={confirmSaveAndReturn} disabled={saveReturnSaving}>
                {saveReturnSaving ? "Saving..." : "Save"}
              </PrimaryButton>
            </div>
          </div>
        </div>
      )}
      {/* "Save & Return" step 2: the write already happened in
          confirmSaveAndReturn -- this notice's OK is what resets the record
          and starts the next one (finishSaveAndReturn), so unlike every other
          modal on this page, backdrop click does NOT dismiss it: that reset
          is exactly the one action here that must not fire by accident. */}
      {saveReturnDone && (
        <div role="dialog" aria-modal="true" aria-label="Data template Saved"
          className="modal-backdrop fixed inset-0 z-50 bg-[#F4F0E8]/85 backdrop-blur-sm flex items-center justify-center p-8">
          <div className="modal-pop bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full text-center flex flex-col items-center gap-3">
            <Icon name="checkCircleBig" className="w-8 h-8 text-[#3D8B5F]" />
            <div className="text-[19px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Data template Saved</div>
            <PrimaryButton onClick={finishSaveAndReturn}>OK</PrimaryButton>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

// The transition between Upload and Verify: goProcess finishes any deferred
// OCR before the crosscheck and the form see real content. Not a nav
// destination (absent from NAV_ITEMS) -- a reviewer never lands here except
// mid-flight through goProcess, and never leaves it except forward to Verify
// or, on failure, back to it explicitly.
//
// pct is a rough "which document of this attachment type" count from the
// engine, not a byte-accurate progress -- it resets to null when Process

function N8nLoader({ label }) {

// Verify Table's LIS_EXCEL_ROW_IDS ids -> the App-level `fields` key the same
// data lives under everywhere else (EXCEL_COLUMN_MAP, buildRecordPayload).
// Seven of the ten share a name; three don't (prAmount/contractStartDate/
// contractEndDate on Verify Table vs hkd/startDate/endDate here) -- without
// this map, looking lisRowValues up by the fields key finds nothing for
// those three, and the reviewer's Verify Table LIS Value for HKD/Start
// Date/End Date never reaches this page's table at all.
const LIS_ROW_TO_FIELD_KEY = {
  customerName: "customerName",
  vendor: "vendor",
  contractNo: "contractNo",
  prAmount: "hkd",
  contractStartDate: "startDate",
  contractEndDate: "endDate",
  quotationStartDate: "quotationStartDate",
  quotationEndDate: "quotationEndDate",
  handledBy: "handledBy",

// No `census` prop: every role this page names travels inside the crosscheck
// already, so taking the census too would be a second way to answer the same

function LisRemarkPage({ fields, lisRowValues, attachments, itemIndex, selectItem, goUpload, goSave, saving, savedRecordId, saveStatus, setField }) {

  const [adminName, setAdminName] = useState(BTB_ADMIN_NAMES[0]);

  // Fields page's own LIS Value column, snapshotted at "Continue to save")
  // stays as the seed effect's source below, and as a last-resort fallback
  // here for the one render before that effect runs.
  const valueOf = key => (fields[key] && fields[key].value) || (lisRowValues && lisRowValues[key]) || "";
  // Verify Table's LIS Value column (lisRowValues, snapshotted at "Continue
  // to save") is the reviewer's confirmed answer for every LIS_EXCEL_ROW_IDS
  // field, not just the two Quotation dates -- seed every mapped field the
  // same way, through LIS_ROW_TO_FIELD_KEY since three of the ten differ in
  // name from the fields key they land on. Same guard the rest of the app
  // uses for an auto-filled field (applyMatches, detectFromRoles): blank or

  // clobbered by this effect re-running (e.g. switching item tabs).
  useEffect(() => {
    if (!lisRowValues) return;

        <div className="text-[16px] text-[#6E6E73]">{columns[0][0]}–{columns[columns.length - 1][0]}</div>

              <input value={valueOf(key)} onChange={e => setField(key, e.target.value)}

                className="w-full px-3 py-2 bg-transparent text-[var(--ink)] placeholder:text-[#A6A6A6] placeholder:italic outline-none focus:bg-[#FFF8E8]" />
            </td>)}
          </tr></tbody>
        </table>
      </div>

  );

  return <React.Fragment>
    <TopBar title="LIS & Remark" desc="Review the LIS row and add remarks"

            {" "}The {saveStatus.savedCount} already saved {saveStatus.savedCount === 1 ? "is" : "are"} kept — fix the issue and press

        <div><div className="text-[17px] font-bold tracking-[1.2px] uppercase text-[var(--orange-dark)]">Excel row preview</div>

        <CopyIconButton text={EXCEL_COLUMN_MAP.map(([, , key]) => valueOf(key)).join("\t")} title="Copy for Excel"

      <div className="grid grid-cols-1 xl:grid-cols-2 gap-5 items-start">
