/* The table twin of a box plot: the five numbers the shape is drawn from.
   tableWithBars carries one value per row and cannot say "spread", so a
   distribution needs its own table or the table view quietly drops a chart. */
function boxTable(host,groups,opt){
  opt=opt||{};
  var F2=FMT[opt.fmt||"pct"];
  groups=groups.filter(function(g){return g.vals.length>=3;});
  if(!groups.length){ host.innerHTML='<p class="empty">Need at least 3 values per group to show a spread.</p>'; return; }
  function q(a,p){ var v=a.slice().sort(function(x,y){return x-y;}), i=(v.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
                   return lo===hi?v[lo]:v[lo]+(v[hi]-v[lo])*(i-lo); }
  var wrap=document.createElement("div"); wrap.className="tbl-wrap";
  var t=document.createElement("table"); t.className="dt";
  var th=document.createElement("thead"), tr=document.createElement("tr");
  [opt.dimLabel||"Group","Min","Q1","Median","Q3","Max","PR lines"].forEach(function(h,i){
    var c=document.createElement("th"); c.textContent=h; if(i)c.className="n"; tr.appendChild(c); });
  th.appendChild(tr); t.appendChild(th);
  var tb=document.createElement("tbody");
  groups.forEach(function(g){
    var v=g.vals, row=document.createElement("tr");
    var c0=document.createElement("td"); c0.textContent=g.name; row.appendChild(c0);
    [Math.min.apply(null,v),q(v,.25),q(v,.5),q(v,.75),Math.max.apply(null,v)].forEach(function(n,i){
      var c=document.createElement("td"); c.className="n"; c.textContent=F2(n);
      if(i===2) c.style.fontWeight="700";
      row.appendChild(c); });
    var cn=document.createElement("td"); cn.className="n"; cn.textContent=nf(v.length); row.appendChild(cn);
    if(opt.onPick){ row.style.cursor="pointer"; row.title="Filter by "+g.name;
      row.addEventListener("click",function(){opt.onPick(g.name);}); }
    tb.appendChild(row);
  });
  t.appendChild(tb); wrap.appendChild(t); host.appendChild(wrap);
}
/* Same contract as plotHost, for the distribution form. */

/* Small-denominator guard: a brand with 2 deals must never top a ranking.
   Without it, "strongest / weakest" is just a list of the smallest samples. */
var MIN_N=8;
function guarded(agg,minN){
  var m=minN||MIN_N;
  var keep=agg.rows.filter(function(r){return r.n>=m;});

/* ============================================================================
   INSIGHT CALLOUTS — each fires on a stated condition, or not at all. A
   dashboard that always has five insights is generating sentences, not finding
   them.
   ========================================================================== */
function insights(view,L){
  var out=[];
  var cur=periodSlice(L,"prIssued",0,3), prv=periodSlice(L,"prIssued",3,3);
  if(has("brand")&&has("revenue")){
    var cm={},pm={},cn={};
    cur.forEach(function(r){ if(r.brand&&r.marginPct!=null){ (cm[r.brand]=cm[r.brand]||[]).push(r.marginPct); cn[r.brand]=(cn[r.brand]||0)+1; } });
    prv.forEach(function(r){ if(r.brand&&r.marginPct!=null) (pm[r.brand]=pm[r.brand]||[]).push(r.marginPct); });
    Object.keys(cm).forEach(function(b){
      if(!pm[b]||cn[b]<MIN_N) return;
      var avg=function(a){return a.reduce(function(x,y){return x+y;},0)/a.length;};
      var dpt=avg(cm[b])-avg(pm[b]);
      if(Math.abs(dpt)>=3) out.push({kind:dpt<0?"neg":"pos",
        text:b+" margin "+(dpt<0?"fell":"rose")+" "+Math.abs(dpt).toFixed(1)+" pts versus last quarter, on "+cn[b]+" deals."});
    });
  }
  var exp0=L.filter(function(r){return r.daysToExpiry!=null&&r.daysToExpiry>=0&&r.daysToExpiry<=30;});
  if(exp0.length) out.push({kind:"cau",text:exp0.length+" contracts expire within 30 days"+
    (has("revenue")?", worth "+fmtHkdFull(sum(exp0,"revenue")):"")+"."});
  var cc=median(cur,"dPrPo"), roll=median(L.filter(function(r){return r.prIssued&&(NOW-r.prIssued)/864e5<=365;}),"dPrPo");
  if(cc!=null&&roll!=null&&cc>roll*1.25) out.push({kind:"cau",
    text:"PR to PO stretched to "+fmtDays(cc)+" this quarter, "+fmtDays(cc-roll)+" above the rolling 12-month median."});
  var canc=ROWSFILTERED_CANCELLED();
  if(canc.length) out.push({kind:"neg",text:canc.length+" PR lines were cancelled in this slice"+
    (has("revenue")?", worth "+fmtHkdFull(sum(canc,"revenue"))+" of pipeline":"")+". They are excluded from every figure above."});
  if(!out.length) return;
  var c=card("What stands out",null,{span:"c12"});
  out.slice(0,5).forEach(function(o){
    var d=document.createElement("div"); d.className="callout"; d.style.marginBottom="8px";
    var m=document.createElement("span"); m.className="mk";
    m.textContent=o.kind==="neg"?"▼":o.kind==="pos"?"▲":"⚠";
    m.style.color=o.kind==="neg"?"var(--neg)":o.kind==="pos"?"var(--pos)":"var(--caution)";
    d.appendChild(m);
    var t=document.createElement("span"); t.textContent=o.text; d.appendChild(t);
    c.appendChild(d);
  });
  view.appendChild(gridWrap([c]));
}

  sq.addEventListener("change",function(){

/* ============================================================================
   THE SLICE BAND - the page's focal point.
   It answers one question the old layout could not: WHICH slice of the book am
   I looking at? The filtered value is the largest type on the page; when
   nothing is filtered the band collapses to a single muted line so it never
   competes with the charts for attention.
   ========================================================================== */

/* A chart that PLOTS the dimension you just filtered on must not have its own
   categories filtered away: pick "Fortinet" and a brand chart built from the
   filtered slice contains exactly one bar, so there is nothing left to
   highlight and no way to switch to another brand without going back to the
   dropdown. So a chart keyed to a dimension is built from the slice with THAT
   dimension's own filter lifted - every other filter still applies. The
   selected bar then keeps full colour and the rest recede, which is what makes
   the pick legible in context. */
function sliceExcept(dim){
  if(!dim || !STATE.filters[dim]) return live(applyFilters(ROWS,STATE));
  var probe={}; for(var k in STATE) probe[k]=STATE[k];
  probe.filters={};
  Object.keys(STATE.filters).forEach(function(k){ if(k!==dim) probe.filters[k]=STATE.filters[k]; });
  return live(applyFilters(ROWS,probe));
}

function buildSliceBand(shown,total){
  var host=document.getElementById("sliceBand"); host.textContent="";
  var keys=Object.keys(STATE.filters);
  var dated=!!(STATE.from||STATE.to);
  var band=document.createElement("div"); band.className="slice"+((keys.length||dated)?" on":"");

  var main=document.createElement("div"); main.className="slice-main";
  if(!keys.length && !dated){
    var cap0=document.createElement("div"); cap0.className="slice-cap"; cap0.textContent="Showing everything";
    main.appendChild(cap0);
    var v0=document.createElement("div"); v0.className="slice-val";
    v0.textContent="All "+nf(total)+" PR lines"; main.appendChild(v0);
    var q=document.createElement("div"); q.className="slice-quiet";
    q.textContent="Click any bar, slice or row to filter \u2014 what you pick appears here.";
    main.appendChild(q);
    band.appendChild(main); host.appendChild(band); return;
  }

  var cap=document.createElement("div"); cap.className="slice-cap"; cap.textContent="Filtering on";
  main.appendChild(cap);

  // The VALUES lead, not the field names: a manager recognises "Fortinet"
  // faster than "Brand". The field name follows in the smaller meta line.
  var vals=[];
  keys.forEach(function(k){ STATE.filters[k].forEach(function(v){ vals.push(v); }); });
  if(dated) vals.push((STATE.from?fmtDate(STATE.from):"any")+" \u2013 "+(STATE.to?fmtDate(STATE.to):"any"));
  var val=document.createElement("div"); val.className="slice-val";
  vals.forEach(function(v,i){
    if(i){ var sp=document.createElement("span"); sp.className="sep"; sp.textContent="\u00b7"; val.appendChild(sp); }
    val.appendChild(document.createTextNode(v));
  });
  main.appendChild(val);

  var meta=document.createElement("div"); meta.className="slice-meta";
  var fields=keys.map(dimLabel); if(dated) fields.push(F[STATE.dateField].label);
  var m1=document.createElement("span");
  m1.appendChild(document.createTextNode("by "+fields.join(" + ")));
  meta.appendChild(m1);
  var m2=document.createElement("span");
  var b=document.createElement("b"); b.textContent=nf(shown); m2.appendChild(b);
  m2.appendChild(document.createTextNode(" of "+nf(total)+" lines"));
  meta.appendChild(m2);
  if(total){
    var m3=document.createElement("span");
    var b2=document.createElement("b"); b2.textContent=(shown/total*100).toFixed(1)+"%"; m3.appendChild(b2);
    m3.appendChild(document.createTextNode(" of the book"));
    meta.appendChild(m3);
  }
  main.appendChild(meta);
  band.appendChild(main);

  var side=document.createElement("div"); side.className="slice-side";
  var bar=document.createElement("div"); bar.className="slice-bar";
  var fill=document.createElement("i"); fill.style.width=Math.max(2,total?shown/total*100:0)+"%";
  bar.appendChild(fill); side.appendChild(bar);
  var cl=document.createElement("button"); cl.type="button"; cl.className="slice-clear";
  cl.textContent="Clear filter"; cl.addEventListener("click",clearFilters);
  side.appendChild(cl);
  band.appendChild(side);
  host.appendChild(band);
}

  var cols=FIELDS.filter(function(f){return has(f.k);});
  var head=cols.map(function(f){return '"'+f.label.replace(/"/g,'""')+'"';}).join(",");
  var body=rows.map(function(r){ return cols.map(function(f){
    var v=r[f.k]; if(v==null) return "";
    if(v instanceof Date) return v.toISOString().slice(0,10);
    return '"'+String(v).replace(/"/g,'""')+'"'; }).join(","); }).join("\n");
  var blob=new Blob([head+"\n"+body],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="btb-report-slice.csv"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1200);
}

/* ============================================================================
   RENDER
   ========================================================================== */
/* Coalesce renders on a timeout, NOT on requestAnimationFrame.
   rAF only runs while the page is actually being painted: minimise the window,
   occlude it, or park this iframe on a background tab in the Model-Driven App
   and the callback never fires, so a filter change silently does nothing and
   the page looks frozen. Nothing here needs frame alignment - it only needs
   several state changes in the same tick to produce one render. */
var _raf=null;
function render(){
  if(_raf) clearTimeout(_raf);
  _raf=setTimeout(function(){
    _raf=null;
    buildTabs();
    var rows=applyFilters(ROWS,STATE);
    buildChips(rows.length,ROWS.length);
    buildSliceBand(rows.length,ROWS.length);
    syncFilterToggle();
    // Replace the whole view node rather than clearing it. textContent="" unbinds
    // nothing: every mark's pointer/focus listener stays alive on the detached
    // subtree until GC, and the pointer sits over marks that are being swapped
    // under it mid-render. Swapping in a fresh empty node drops the old tree and
    // all its listeners in one operation, with nothing hoverable in between.
    tipHide();
    var oldView=document.getElementById("view");
    var view=oldView.cloneNode(false);
    oldView.parentNode.replaceChild(view,oldView);

    var tab=TABS.filter(function(t){return t.k===STATE.tab;})[0]||TABS[0];
    if(!rows.length){
      var e=document.createElement("p"); e.className="empty";
      e.textContent="No PR lines match the current filters. Remove a chip above to widen the slice.";
      view.appendChild(e); return;
    }
    try{ tab.render(view,rows); flushDraws(); }
    catch(err){
      console.warn("[dashboard] tab render failed:",err);
      var p=document.createElement("p"); p.className="empty";
      p.textContent="This tab could not be drawn for the current slice. The console has the detail.";
      view.appendChild(p);
    }
  });
}

/* ---- boot ---- */
document.getElementById("btnTheme").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next=cur==="dark"?"light":cur==="light"?"dark":
    (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
  render();
});
document.getElementById("btnTable").addEventListener("click",function(){
  STATE.tableView=!STATE.tableView;
  this.setAttribute("aria-pressed",String(STATE.tableView));
  this.classList.toggle("on",STATE.tableView);
  render();
});
document.getElementById("filterToggle").addEventListener("click",function(){
  var bar=document.getElementById("filterBar");
  var open=bar.classList.toggle("open");
  this.setAttribute("aria-expanded",String(open));
});
document.getElementById("btnReset").addEventListener("click",clearFilters);
document.getElementById("btnCsv").addEventListener("click",exportCsv);
/* Re-render on resize ONLY when the width actually changed.
   Charts are measured in pixels, so a re-render changes the page height, which
   can add or remove the vertical scrollbar, which changes the viewport WIDTH,
   which fires resize again — an oscillation that never settles and pegs the
   renderer. Height-only resizes (and the scrollbar's own width flicker once the
   width is stable) must not retrigger a draw. */
var _rz=null, _lastW=innerWidth;
addEventListener("resize",function(){
  if(Math.abs(innerWidth-_lastW)<24) return;   // hysteresis: ignore sub-scrollbar jitter
  clearTimeout(_rz);
  _rz=setTimeout(function(){
    if(Math.abs(innerWidth-_lastW)<24) return;
    _lastW=innerWidth; render();
  },240);
});

// Deep link: ?tab=<key> opens straight on that tab, so a manager can bookmark
// the view they actually use instead of clicking to it every time.
(function(){
  var m=/[?&]tab=([a-z]+)/.exec(location.search);
  if(m && TABS.some(function(t){return t.k===m[1];})) STATE.tab=m[1];
})();

loadData(function(){
  var badge=document.getElementById("srcBadge"), line=document.getElementById("srcLine");
  var missingCols=FIELDS.filter(function(f){return f.optional&&!PRESENT[f.k];});
  if(LOAD_NOTE==="live"){
    badge.textContent="LIVE DATAVERSE"; badge.className="srcbadge pill pos";
  } else {
    badge.textContent=LOAD_NOTE==="demo-fallback"?"DEMO (DATAVERSE READ FAILED)":"DEMO DATA";
    badge.className="srcbadge pill "+(LOAD_NOTE==="demo-fallback"?"cau":"neu");
  }
  line.textContent=" — V"+APP_VERSION+" · admin_btb_lis_excel_datas · "+nf(ROWS.length)+" PR line items"+
    (missingCols.length?" · "+missingCols.length+" planned columns not yet in the table":"");
  buildFilters();
  render();
});
</script>
