            <div className="text-[15px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Linked Record</div>
            <div className="text-sm font-semibold text-[#1A1A1A]">{record.customer}</div>
            <div className="text-xs text-[#6B6B6B]">{record.quotation} · {record.amount}</div>
          </Card>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------- App shell ---------- */

function App() {
  const [page, setPage] = useState("upload");
  const [demoMode, setDemoMode] = useState(false);
  const [adminMode, setAdminMode] = useState(() => {
    if (typeof location !== "undefined" && location.search) {
      const q = new URLSearchParams(location.search).get("admin");
      return q === "1" || q === "true" || q === "admin2026";
    }
    return false;
  });
  const [attachments, setAttachments] = useState(EMPTY_ATTACHMENTS);
  const [activeTab, setActiveTab] = useState("Vendor Quotation");
  const [fields, setFields] = useState(initialFormState(false));
  const [manualChecks, setManualChecks] = useState([false, false, false, false]);
  // The LIS Value column's own computed values (Quotation Start/End Date
  // among them), captured at "Continue to save" -- LisRemarkPage's Excel
  // preview has no crosschecks/dataverseVerify of its own to re-derive them
  // from, so it reads this snapshot instead of recomputing.
  const [lisRowValues, setLisRowValues] = useState({});
  const [records, setRecords] = useState(EMPTY_RECORDS);
  // Master Records' own two error surfaces. Separate because they fail at
  // different times and a reviewer can act on only one of them: a load error
  // means the table in front of them is not the table, a save error means one
  // row's edit did not land and their drafts are still on screen to retry.
  const [recordsLoadError, setRecordsLoadError] = useState(null);
  const [fieldSaveError, setFieldSaveError] = useState(null);
  const [replyFiles, setReplyFiles] = useState(EMPTY_REPLY_FILES);
  const [replyRecord, setReplyRecord] = useState(records[0] || EMPTY_REPLY_RECORD);
  // {typeKey, docIndex} -- docIndex -1 means the uploaded file itself, >= 0 is
  // an index into that entry's docs[]. null closes the viewer.
  const [viewer, setViewer] = useState(null);
  // The row that opened the viewer, so focus goes back where it came from.
  const lastFocusRef = useRef(null);
  // Dismissed differences, by dismissKey. Keyed on the values themselves, so
  // waving through one known-bad OCR read cannot hide a later, different one.
  const [dismissedDiffs, setDismissedDiffs] = useState(() => new Set());
  // Which purchased item (Cost-sheet row) of an ATQ workbook is currently
  // populating the form. It lives here rather than in UploadPage because the
  // comparison below has to see the same selection the Item tabs show -- the
  // unselected siblings are not documents to check against, they are the other
  // half of a multi-item request.
  const [itemIndex, setItemIndex] = useState(0);

  const promptAdminMode = useCallback(() => {
    if (adminMode) {
      setAdminMode(false);
      return;
    }
    const phrase = window.prompt("Security activation");
    if (phrase === ADMIN_ACTIVATION_PHRASE) setAdminMode(true);
    else if (phrase !== null) window.alert("Admin mode not activated.");
  }, [adminMode]);

  useEffect(() => {
    if (typeof window !== "undefined") {
      window.setAdminMode = setAdminMode;
      window.promptAdminMode = promptAdminMode;
    }
    const onKeyDown = event => {
      if (!event.ctrlKey || !event.altKey || String(event.key).toLowerCase() !== "a") return;
      event.preventDefault();
      promptAdminMode();
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [promptAdminMode]);
  // Once Process or Send to n8n has been clicked for this record, the item
  // selector locks -- the rest of the flow (OCR targets, the n8n payload, the
  // Verify Table) is already committed to whichever item was on screen at
  // that moment, so letting the reviewer switch afterwards would silently
  // point Save/Verify at a different item than what was actually processed
  // or sent. Only a reset of the record itself (resetRecordData / toggleDemo
  // / New Record) clears it -- see those for why.
  const [itemSelectionLocked, setItemSelectionLocked] = useState(false);
  // One-shot: "Process Another Item" has just put the reviewer back on the
  // Document Workbench, and the Item selector there is now the ONLY place the
  // item is chosen (the LIS card's own picker was removed). Without a cue the
  // page looks exactly like the one they started this upload on, so the
  // selector is ringed and scrolled to until they touch it.
  //
  // Cleared by selectItem itself rather than by a timer, so "the reviewer has
  // answered the cue" and "the cue is gone" cannot disagree; also cleared
  // wherever the record resets, since the hint points at an item list that no
  // longer exists.
  const [itemPickHint, setItemPickHint] = useState(false);
  // Enabled ONLY when the reviewer clicks "Process Another Item" on LIS & Remark
  // to return to Document Workbench. For a new record (initial upload / + New
  // Record), stays false so all items remain selectable.
  const [filterProcessedItems, setFilterProcessedItems] = useState(false);
  // Tracked processed items keyed by recordId and ATQ_Item (normRef(atqNo) + '_' + itemNo)
  const [processedItems, setProcessedItems] = useState({});
  // Record_IDs a BTB_ATQ_Excel row has already been written for -- same
  // shape and reasoning as savedRecordIds below: Send to n8n can be clicked
  // more than once (n8nState returns to idle after the sent pill fades), and
  // without this a resend would create a duplicate row every time. Keyed by
  // recordId, cleared only where savedRecordIds is.
  const [atqExcelWritten, setAtqExcelWritten] = useState({});
  // Record_IDs the Document Workbench's "Start" button has already created a
  // BTB_LIS_Excel_Datas stub row for -- same shape and reasoning as
  // atqExcelWritten above, so a resend/re-skip does not attempt a second
  // create against the row Verify Table's "Continue to save" now expects to
  // find and update.
  const [lisStartWritten, setLisStartWritten] = useState({});
  // The Process Status timeline's own view of a record's journey -- keyed by
  // recordId, one of PROCESS_STAGE_ORDER's four values. Deliberately built
  // from what THIS app has actually done (Start clicked, Verify Table opened,
  // Continue to save / Save & Return written, Save to master written), not
  // from a live read of the process status column: "Return to SB" and "PO
  // Waiting" are only ever set by the SB team/backend, and this app has no
  // page where it would learn that happened.
  const [processStage, setProcessStage] = useState({});
  // A no-op on the dev side: FEATURES.processStatus is false there, so the
  // timeline is not drawn and nothing reads this back. Checked here rather
  // than at each of the five call sites, so adding a sixth cannot forget it.
  const markProcessStage = (recordId, stage) => {
    if (!recordId || !FEATURES.processStatus) return;
    setProcessStage(prev => {
      const curIdx = PROCESS_STAGE_ORDER.indexOf(prev[recordId]);
      const nextIdx = PROCESS_STAGE_ORDER.indexOf(stage);
      if (nextIdx <= curIdx) return prev; // never regress a later stage back to an earlier one
      return { ...prev, [recordId]: stage };
    });
  };
  // Per-item field snapshots, keyed by item index, for a multi-item ATQ.
  // selectItem writes the outgoing item's `fields` here before loading the
  // next one, so switching Item tabs no longer throws away manual edits --
  // without this, both items' Save would write the same values under two
  // different Record_IDs.
  const [itemPlans, setItemPlans] = useState({});
  // Which document the reviewer has pinned to each role, keyed by item index
  // and then by role. Each ATQ line item gets its own four role slots -- Item
  // 1 might be backed by one quotation PDF and Item 2 by another even though
  // both live in the same email, so a single global pin would silently answer
  // for items nobody looked at. Lives here rather than in UploadPage because
  // the viewer's own copy of the field grid draws the same chips and must
  // agree about who said what. A role left on auto is simply absent from the
  // current item's entry.
  const [itemRoleOverrides, setItemRoleOverrides] = useState({});
  // The current item's slice, with a stable empty object when it has none --
  // stable so census/crosschecks below don't recompute every render just
  // because an item with no pins yet renders a fresh `{}` each time.
  const roleOverrides = useMemo(() => itemRoleOverrides[itemIndex] || EMPTY_ROLE_OVERRIDES,
    [itemRoleOverrides, itemIndex]);
  const setRoleOverrides = (next) =>
    setItemRoleOverrides(prev => ({ ...prev, [itemIndex]: next }));
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [dataverseVerify, setDataverseVerify] = useState({ recordId: "", status: "idle", agreement: null, quotation: null, lis: null });

  useEffect(() => {
    // Master Records reads admin_btb_lis_excel_datas directly, not
    // admin_purchaserequest -- every column name below is user-confirmed
    // against this entity, and matches buildRecordPayload's own field list
    // (see its comment on the "2"-suffix table recreation) so the Master
    // Records Columns picker can offer every column that table actually has.
    // admin_prstatus is a Choice column (raw integer Value from the Web API,
    // decoded via PR_STATUS_CHOICES same as CHOP_DETECTION_CHOICES);
    // admin_flagged is an independent Yes/No, not one of the Status choices.
    // admin_prx0020reference and admin_odatacolortag are deliberately not
    // fetched -- see MASTER_RECORDS_COLUMNS' own comment on why those two
    // are redundant with columns already here. No $orderby: this table is a
    // Virtual entity backed by an external connector (see
    // project_btb_lis_excel_datas_write_error memory), and not every
    // virtual-entity data provider supports server-side ordering.
    const fmtLisDate = (raw) => {
      const d = raw ? new Date(raw) : null;
      return d && !isNaN(d.getTime())
        ? d.toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' }) : "—";
    };
    const fetchRecordsFromDataverse = async () => {
      if (parent && parent.Xrm && parent.Xrm.WebApi) {
        try {
          // Built from SCHEMA.lis.records so the fetched columns and the read
          // columns below can never drift apart, and so this one query works
          // on either side's table. Deduped because two keys can legitimately
          // share a column (Record_ID is both `id` and `recordId`).
          const recordCols = SCHEMA.lis.records;
          const query = "?$select=" + Array.from(new Set(Object.values(recordCols))).join(",");
          const response = await parent.Xrm.WebApi.retrieveMultipleRecords(SCHEMA.lis.entity, query);

          // Every read goes through the same map the $select above was built
          // from, so the two can never drift apart. A key this side has no
          // column for reads as undefined and falls through to the "—"
          // placeholder, instead of reaching for the other side's column name.
          const col = (item, key) => (recordCols[key] ? item[recordCols[key]] : undefined);
          const txt = (item, key) => col(item, key) || "—";
          const num = (item, key) => { const raw = col(item, key); return raw != null ? String(raw) : "—"; };
          const mappedRecords = response.entities.map((item, i) => ({
            id: col(item, "recordId") || String(i),
            // Choice column: the Web API hands back the raw integer Value,
            // decoded through PR_STATUS_CHOICES. Flagged is an independent
            // Yes/No, not one of the Status choices.
            status: col(item, "status") != null ? (PR_STATUS_CHOICES[String(col(item, "status"))] || "") : "",
            flagged: col(item, "flagged") === true,
            statusRemark: txt(item, "statusRemark"),
            // Two columns on this table, and since the 2026-09-18 rebuild
            // the form's dev `write` map carries both as well.
            no: txt(item, "no"),
            prNo: txt(item, "prNo"),
            recdDate: fmtLisDate(col(item, "recdDate")),
            poNo: txt(item, "poNo"),
            customerName: txt(item, "customerName"),
            vendor: txt(item, "vendor"),
            prDescription: txt(item, "prDescription"),
            recordId: txt(item, "recordId"),
            uid: txt(item, "uid"),
            startDate: fmtLisDate(col(item, "startDate")),
            endDate: fmtLisDate(col(item, "endDate")),
            contractNo: txt(item, "contractNo"),
            hkd: num(item, "hkd"),
            usdOthers: txt(item, "usdOthers"),
            handledBy: txt(item, "handledBy"),
            iptUnitMgr: txt(item, "iptUnitMgr"),
            // Text columns, not Date -- can carry a stated period like "TBC"
            // instead of a parseable date (see buildRecordPayload's comment
            // on these same two columns), so fmtLisDate must not run here.
            quotationStartDate: txt(item, "quotationStartDate"),
            quotationEndDate: txt(item, "quotationEndDate"),
            poDate: fmtLisDate(col(item, "poDate")),
            receiptDate: fmtLisDate(col(item, "receiptDate")),
            poAmountHkd: num(item, "poAmountHkd"),
            umMgr: txt(item, "umMgr"),
            prIssuedMonth: txt(item, "prIssuedMonth"),
            prIssuedOn: txt(item, "prIssuedOn"),
            worksOrderCode: txt(item, "worksOrderCode"),
            yn: txt(item, "yn"),
            remarks: txt(item, "remarks"),
            invoiceDnNo: txt(item, "invoiceDnNo"),
            invoiceDnDate: fmtLisDate(col(item, "invoiceDnDate")),
            issueBy: txt(item, "issueBy"),
            chargeCcc: txt(item, "chargeCcc"),
            accountCode: txt(item, "accountCode"),
            // The Master Records page's own three. btbType and
            // quotationExpiryDate feed the approval matrix and the expiry
            // tabs; `reviewApprovalRaw` is the raw admin_reviewapproval text, parsed by
            // parseReviewApproval at the point of use rather than here, so
            // the row carries exactly what the column holds and a malformed
            // blob cannot break the whole fetch.
            btbType: col(item, "btbType") || "",
            quotationExpiryDate: col(item, "quotationExpiryDate") || "",
            reviewApprovalRaw: col(item, "review") || "",
            atqNo: txt(item, "atqNo"),
            itemNo: txt(item, "itemNo"),
          }));

          setRecords(mappedRecords);
          setRecordsLoadError(null);
        } catch (error) {
          console.error("Failed to load records from Dataverse:", error);
          // Said on screen as well as logged. An empty table and a table that
          // failed to load look identical, and only one of them is something
          // the reviewer can do anything about.
          setRecordsLoadError(error.message || String(error));
        }
      }
    };

    fetchRecordsFromDataverse();
  }, []);

  // Queries Dataverse BTB_LIS_Excel_Datas filtered by admin_atqno to discover
  // which line items have already been processed for this ATQ.
  const refreshDataverseAtqItems = useCallback(async (atqNo) => {
    if (!atqNo) return;
    const webApi = writeApi();
    if (!webApi) return;
    try {
      const atqClean = String(atqNo).trim();
      const colAtq = (SCHEMA.lis.records && SCHEMA.lis.records.atqNo) || "admin_atqno";
      const colItem = (SCHEMA.lis.records && SCHEMA.lis.records.itemNo) || "admin_itemno";
      const query = `?$select=admin_title,${colAtq},${colItem},admin_prstatus&$filter=${colAtq} eq '${atqClean}' or contains(admin_title,'${atqClean}')`;
      const res = await webApi.retrieveMultipleRecords(SCHEMA.lis.entity, query);
      if (res && res.entities && res.entities.length) {
        setProcessedItems(prev => {
          const next = { ...prev };
          res.entities.forEach(ent => {
            const rStatus = ent.admin_prstatus;
            if (rStatus === 100000004 || ent.status === "Cancelled") return;
            const rTitle = ent.admin_title || "";
            const rAtq = ent[colAtq] || atqClean;
            const rItem = ent[colItem];
            if (rTitle) next[rTitle] = true;
            if (rItem && rItem !== "—") next[normRef(rAtq) + "_" + String(rItem).trim()] = true;
            const match = rTitle.match(/[-_](\d+)(?:-[a-z])?$/i);
            if (match) next[normRef(rAtq) + "_" + match[1]] = true;
          });
          return next;
        });
      }
    } catch (err) {
      console.warn("Could not query Dataverse for ATQ " + atqNo, err);
    }
  }, []);

  // One source of truth, three surfaces: Verify's Automatic Checks, the Page 1
  // field marks, and the viewer's DIFFERENCES pane all read this. `fields` is
  // deliberately not a dependency, because the form is not an input to the
  // comparison; `itemIndex` is, because it selects which record speaks.
  const diffs = useMemo(() => computeFieldDiffs(attachments, itemIndex), [attachments, itemIndex]);

  // Three memos, three dependency sets, and keeping them apart is the point.
  // `diffs` walks every document, child and record and is the expensive one;
  // roles change whenever the reviewer touches a dropdown. Folding the roles
  // into `diffs` would re-read the whole upload on every role pin to recompute
  // something that is only a projection of what `diffs` already holds.
  //
  // Lifted here rather than left in UploadPage because Verify and the viewer now
  // read them too, and three surfaces computing their own census is three
  // chances to disagree about which document fills which slot.
  // Item-aware, same as `diffs`: on a multi-item ATQ the Quotation slot is one
  // document per item, and the engine already recorded which (see
  // offItemQuotationTest).
  const offItemQuotation = useMemo(() => offItemQuotationTest(attachments, itemIndex),
    [attachments, itemIndex]);
  const census = useMemo(() => roleCensus(attachments, roleOverrides, offItemQuotation),
    [attachments, roleOverrides, offItemQuotation]);
  // The same census with the reviewer's choices taken back out, so the editor
  // can show what each "Auto" option would actually resolve to.
  const autoCensus = useMemo(() => roleCensus(attachments, null, offItemQuotation),
    [attachments, offItemQuotation]);
  const crosschecks = useMemo(() => computeCrosschecks(diffs, census), [diffs, census]);

  // The email this upload came from. Memoised on `attachments` alone: reading
  // it means a regex over every attachment's whole plain text, which for an
  // email carrying a 22-page scanned PDF is a few hundred KB, and none of it
  // can change while the form is being edited.
  const emailSubject = useMemo(() => emailSubjectOf(attachments), [attachments]);

  // A stable, one-time fallback so the Verify-page Record_ID preview does not
  // change on every re-render before either recordNo or contractNo exists yet
  // -- the real Phase 7 payload build resolves its own fallback at save time.
  const sessionFallbackRef = useRef(null);
  if (!sessionFallbackRef.current) sessionFallbackRef.current = "PR-" + Date.now();

  // Record_IDs for a multi-item ATQ, for the Verify-page collision warning.
  // recordsBearingEntry finds the same attachment anchorRecordsOf does --
  // the first ATTACHMENT_TYPES entry with records -- not attachments[activeTab],
  // which is just whichever tab happens to be selected. A single item (or no
  // ATQ at all) returns [] so nothing new renders, matching today's behaviour.
  const itemRecordIds = useMemo(() => {
    const itemRecords = recordsBearingEntry(attachments);
    if (!itemRecords || itemRecords.length < 2) return [];
    return assignRecordIds(itemRecords, fallbackBaseFor(fields, sessionFallbackRef.current));
  }, [attachments, fields]);

  // What Save actually writes -- the rules, and why it is one plan and not one
  // per item, are on planSavesForItem. This is only the wiring.
  const savePlans = useMemo(() =>
    planSavesForItem(recordsBearingEntry(attachments),
      fallbackBaseFor(fields, sessionFallbackRef.current), itemIndex, fields, itemPlans),
    [attachments, fields, itemPlans, itemIndex]);

  const toggleDismissDiff = useCallback(key => setDismissedDiffs(prev => {
    const next = new Set(prev);
    if (next.has(key)) next.delete(key); else next.add(key);
    return next;
  }), []);

  // Stable identities: the viewer's keydown listener has onClose in its deps,
  // and a fresh closure per App render would rebind it on every keystroke the
  // form fields handle.
  // `page` is optional and every existing caller omits it -- a viewer opened
  // from a field row or a chip still lands on page 1. Extracted Fields' chop
  // link is the one caller that knows which page it means.
  // `only` opens the viewer on ONE document (pass `true`) or a specific SET
  // of documents (pass an array of doc indexes, e.g. a Quotation slot's
  // primary pick plus its extras) -- the picker lists just those and nothing
  // else. Optional and defaulting to today's behaviour, like `page` -- every
  // existing caller omits both, and a chip or a field row genuinely does want
  // the whole list, because the reviewer is browsing from there. The Verify
  // Table's column header is the opposite case: it names the file(s) the
  // column beneath it actually answers from, so offering every other document
  // in the tab invites checking a number against one that never reported it.
  const openViewer = useCallback((typeKey, docIndex, page, only) => {
    lastFocusRef.current = document.activeElement;
    setViewer({ typeKey, docIndex, page: page || 1,
      only: Array.isArray(only) ? only : !!only });
  }, []);
  const closeViewer = useCallback(() => {
    setViewer(null);
    const el = lastFocusRef.current;
    // After the modal unmounts, otherwise the panel still holds focus.
    if (el && el.focus) setTimeout(() => el.focus(), 0);
  }, []);

  const setField = (key, value, auto = false) => setFields(prev => ({ ...prev, [key]: { value, auto } }));
  // setField() marks any write as a manual edit (auto:false) so the user's
  // own typing isn't silently re-highlighted green later. Auto-extraction
  // needs the opposite: write the value AND keep it flagged auto:true so it
  // stays green until the user edits it themselves.
  const setFieldAuto = (key, value) => setField(key, value, true);

  // `unrestricted` skips the per-tab ATTACHMENT_FIELD_SCOPE allowlist. ATQ
  // workbook records carry their own unambiguous, fixed labels (exact ATQ
  // column names, not a generic OCR guess), so they should populate every
  // matching form field regardless of which of the 5 tabs the user happened
  // to have selected when they dropped the file.
  // `force` skips the "don't clobber a manual edit" guard. It exists for the
  // reset-then-reupload path in UploadPage: resetRecordData() just blanked
  // every field, but `fields` here is still the pre-reset closure (state
  // updates land on the next render, not this one), so the guard would read
  // the *old* field's auto flag and could wrongly refuse to fill the new value.
  const applyMatches = (rawFields, unrestricted, force) => {
    const matches = mapDetectedFields(rawFields, unrestricted ? null : activeTab);
    Object.entries(matches).forEach(([key, value]) => {
      const cur = fields[key];
      if (force || !cur.value || cur.auto) setFieldAuto(key, value);
    });
  };

  // Reads the BODY, not the whole plain text. The engine prints the `Subject:`
  // header first, so scanning the whole thing took the subject's UID by
  // position -- which is exactly what the 2026-09-25 request asked to stop.
  // emailBodyTextOf returns text carrying no Subject header whole, so a
  // document dropped on a tab is read exactly as it was; the subject tier lives
  // in uidFromEmail, not here.
  const applyUid = (text, force) => {
    const uid = extractUid(emailBodyTextOf(text));
    if (!uid) return;
    const cur = fields.uid;
    if (force || !cur.value || cur.auto) setFieldAuto("uid", uid);
  };

  // Re-running detection against the documents now holding the form-filling
  // roles is the whole point of reassigning one: a slot that has changed hands
  // has to be able to put its own values in the form.
  //
  // Asked in ROLE_DETECT_ORDER with first answer winning, then applied in one
  // pass. Applying per document instead would let the last one asked overwrite
  // the first, since an auto-filled value is not protected from the next write.
  // The manual-edit guard is untouched: what the user typed still survives.
  //
  // Only the document the bar names is asked, not every document sharing its
  // slot -- an ATQ's PDF print and the workbook behind it hold the same values,
  // and reading both would only decide a tie the bar has already decided.
  //
  // Anchored by Item No. via anchoredRecordOf, the same helper computeFieldDiffs
  // uses -- so on a workbook narrowed to a subset of a form's items, the form
  // fills from the same row the cross-check compares, not whichever row
  // happens to sit at position `itemIndex` in this document's own records.
  //
  // `attachmentsOverride` lets goProcess call this against the attachments it
  // just finished OCR-reading without waiting a render: setAttachments() is
  // async, so right after it the `attachments` closure here is still the
  // pre-resume copy -- reading from it would fill the form from content that
  // was about to be replaced.
  const detectFromRoles = (overrides, attachmentsOverride) => {
    const src = attachmentsOverride || attachments;
    const roles = roleCensus(src, overrides, offItemQuotationTest(src, itemIndex));
    const merged = {};
    ROLE_DETECT_ORDER.forEach(roleKey => {
      const slot = roles.assigned[roleKey];
      if (!slot) return;
      const d = slot.doc;
      const rec = d.records ? anchoredRecordOf(d.records, src, itemIndex) : null;
      const flds = rec ? rec.fields : d.fields;
      // Its own text as well as its labels: a quotation whose header is two
      // stacked blocks reports no quotation number as a field at all.
      const found = mapDetectedFields(flds, d.unrestricted ? null : d.typeKey,
        rec ? null : d.textBlock);
      Object.keys(found).forEach(k => { if (!(k in merged)) merged[k] = found[k]; });
    });
    // Vendor is item-specific in the Cost worksheet. It must override the
    // ATQ PDF's document-level vendor when the workbook has the selected row.
    const costVendor = atqCostFieldForItem(src, roles, itemIndex, "vendor");
    if (costVendor) merged.vendor = costVendor;
    Object.keys(merged).forEach(key => {
      const cur = fields[key];
      if (!cur.value || cur.auto) setFieldAuto(key, merged[key]);
    });
    // The email outranks any single role document's own printed text: the mail
    // names the specific item this request is for, while the ATQ itself only
    // ever prints the container-level "UID: UID-26-06-0151" -- reading the
    // document AFTER the email would silently downgrade an already-correct
    // auto-filled value back to the shorter one every time roles are
    // (re)assigned, e.g. right after Process.
    //
    // Within the email, BODY then subject, the same order uidFromEmail follows
    // (2026-09-25). Asking uidFromEmail itself is deliberate: its third tier is
    // the form field, which would make this overwrite the value with the value,
    // so the two tiers are read here rather than the whole chain.
    const uidFromBody = uidFromEmailBody(src);
    const subjectParsed = emailSubjectOf(src);
    const emailUid = uidFromBody || (subjectParsed && subjectParsed.uid) || "";
    if (emailUid) {
      const cur = fields.uid;
      if (!cur.value || cur.auto) setFieldAuto("uid", emailUid);
    } else {
      const att = src[activeTab];
      if (att && att.text) applyUid(att.text);
    }
  };

  // Switches which purchased item (Cost-sheet row) is populating the form.
  // Snapshots the outgoing item's `fields` into itemPlans first; a revisited
  // item restores its own snapshot verbatim, and a first-time visit fills
  // from its own record the same way this always worked -- it just no longer
  // wipes the item it came from. Moved here from UploadPage because fields,
  // setFields and itemPlans all live in App.
  const selectItem = (i) => {
    setItemPickHint(false);
    if (i === itemIndex) return;
    setItemPlans(prev => ({ ...prev, [itemIndex]: fields }));
    const existing = itemPlans[i];
    if (existing) {
      setFields(existing);
    } else {
      const att = attachments[activeTab];
      const rec = att && att.records && att.records[i];
      if (rec) applyMatches(rec.fields, true);
    }
    setItemIndex(i);
  };

  // "Process Another Item" (dev side, LIS & Remark -- FEATURES.processAnotherItem).
  // One procurement email carries the documents for EVERY item its ATQ covers,
  // so finishing one item does not finish the email: the reviewer picks the next
  // item there and is put back on the Document Workbench to choose that item's
  // role documents and press Start again.
  //
  // Three things are undone and nothing else. The item lock goes, because
  // changing the item after Start is the entire point. saveStatus goes, because
  // a partial-failure panel about the previous item would be read as being about
  // this one. And the page returns to Upload through goUpload, so there is one
  // definition of where that is.
  //
  // What deliberately SURVIVES: savedRecordIds, atqExcelWritten, lisStartWritten
  // and processStage. All four are keyed by Record_ID and the new item has its
  // own, so clearing them would both duplicate the finished item's Dataverse
  // rows on a revisit and lose the greying the picker draws from them.
  const processAnotherItem = (i) => {
    // Record the outgoing item being finished as processed so it is disabled on Document Workbench
    const currentAtq = currentAtqNoOf(fields, attachments);
    const itemRecords = recordsBearingEntry(attachments) || [];
    const currentRec = itemRecords[itemIndex];
    const currentItm = itemNoOf(currentRec) || String(itemIndex + 1);
    const currentRid = (itemRecordIds[itemIndex] || {}).recordId || recordIdForItem(savePlans, itemIndex);
    setProcessedItems(prev => {
      const next = { ...prev };
      if (currentRid) next[currentRid] = true;
      if (currentAtq && currentItm) next[normRef(currentAtq) + "_" + String(currentItm).trim()] = true;
      return next;
    });
    setFilterProcessedItems(true);
    selectItem(i);
    setItemSelectionLocked(false);
    setSaveStatus(null);
    // After selectItem, which clears it: the Workbench's Item selector is
    // where the item is chosen now, so the reviewer is pointed at it.
    setItemPickHint(true);
    if (currentAtq) refreshDataverseAtqItems(currentAtq);
    goUpload();
  };

  const toggleManualCheck = i => setManualChecks(prev => prev.map((v, idx) => idx === i ? !v : v));

  const toggleDemo = () => {
    const next = !demoMode;
    setDemoMode(next);
    setAttachments(next ? DEMO_ATTACHMENTS : EMPTY_ATTACHMENTS);
    setFields(initialFormState(next));
    setManualChecks([false, false, false, false]);
    setDismissedDiffs(new Set());
    setActiveTab("Vendor Quotation");
    setItemIndex(0);
    setItemSelectionLocked(false);
    setItemPickHint(false);
    setFilterProcessedItems(false);
    setProcessedItems({});
    setItemPlans({});
    setSavedRecordIds({});
    setAtqExcelWritten({});
    setLisStartWritten({});
    setSaveStatus(null);
    setDataverseVerify({ recordId: "", status: "idle", agreement: null, quotation: null, atqExcel: null, lis: null });
    const nextRecords = next ? DEMO_RECORDS : EMPTY_RECORDS;
    setRecords(nextRecords);
    // Both Master Records errors belong to the record list being replaced.
    setRecordsLoadError(null);
    setFieldSaveError(null);
    setReplyFiles(next ? DEMO_REPLY_FILES : EMPTY_REPLY_FILES);
    setReplyRecord(nextRecords[0] || EMPTY_REPLY_RECORD);
  };

  const progress = page === "upload" ? 25 : page === "processing" ? 50 : page === "n8nWaiting" ? 60 : page === "extracted" ? 65 : page === "verify" ? 75 : page === "lis" ? 85 : 100;
  const goExtracted = () => {
    markProcessStage(recordIdForItem(savePlans, itemIndex), "dataVerifying");
    setPage("extracted");
  };

  const openVerifyAfterN8n = async () => {
    // Before the page changes, exactly as goProcess does. On Upload the viewer
    // is rendered INLINE inside the workspace panel, but the same `viewer`
    // state drives the modal on every other page -- so leaving it set while
    // switching to "extracted" reopens it as an overlay laid over the Verify
    // Table the reviewer just asked for.
    closeViewer();
    const recordId = recordIdForItem(savePlans, itemIndex);
    setDataverseVerify({ source: "n8n", recordId, status: "loading", agreement: null, quotation: null, atqExcel: null, lis: null });
    setPage("extracted");
    if (!(parent && parent.Xrm && parent.Xrm.WebApi) || !recordId) {
      if (!recordId) console.warn("No Record_ID available for the Verify Table Dataverse lookup.");
      else console.warn("parent.Xrm.WebApi not detected. Verify Table is using local extracted values.");
      setDataverseVerify({ source: "n8n", recordId, status: "unavailable", agreement: null, quotation: null, atqExcel: null, lis: null });
      return;
    }
    try {
      const records = await fetchDataverseVerifyRecords(recordId);
      setDataverseVerify({ source: "n8n", recordId, status: "ready", ...records });
    } catch (error) {
      console.error("Failed to load Agreement, Quotation, or LIS from Dataverse:", error);
      setDataverseVerify({ source: "n8n", recordId, status: "error", agreement: null, quotation: null, atqExcel: null, lis: null, error: error.message || String(error) });
    }
  };

  // Runs only for a non-admin "Send to n8n" (see onSendToN8n below). n8n
  // accepts the webhook and writes Agreement/Quotation back to Dataverse in
  // the background, so a read right after the POST returns almost always
  // finds neither yet -- that used to show up as an empty Cross Check column
  // indistinguishable from "the document genuinely has nothing here" (see the
  // "blank is deliberate" comment on verifyCellValue above). Polling the same
  // reads openVerifyAfterN8n uses, capped at N8N_POLL_TIMEOUT_MS, means the
  // reviewer sees a loading page instead of that ambiguous blank table.
  const waitForN8nCrossCheck = async () => {
    closeViewer();
    const recordId = recordIdForItem(savePlans, itemIndex);
    setDataverseVerify({ source: "n8n", recordId, status: "loading", agreement: null, quotation: null, atqExcel: null, lis: null });

    if (!(parent && parent.Xrm && parent.Xrm.WebApi) || !recordId) {
      if (!recordId) console.warn("No Record_ID available for the Verify Table Dataverse lookup.");
      else console.warn("parent.Xrm.WebApi not detected. Verify Table is using local extracted values.");
      setDataverseVerify({ source: "n8n", recordId, status: "unavailable", agreement: null, quotation: null, atqExcel: null, lis: null });
      setPage("extracted");
      return;
    }

    setPage("n8nWaiting");
    setN8nWaitStatus("Waiting for n8n to write Agreement / Quotation to Dataverse…");
    const startedAt = Date.now();

    while (true) {
      try {
        const records = await fetchDataverseVerifyRecords(recordId);
        // Both Agreement AND Quotation must land before this stops waiting --
        // Cross Check compares the two of them, and a single side landing
        // still leaves the other column reading as "the document said
        // nothing" rather than "n8n hasn't written it yet". LIS and ATQ Excel
        // are read but not gating: LIS is documented elsewhere as optional,
        // and ATQ Excel is written by this App itself (writeAtqExcelRecord),
        // not by n8n, so it is not what this wait is for.
        if (records.agreement && records.quotation) {
          setDataverseVerify({ source: "n8n", recordId, status: "ready", ...records });
          setPage("extracted");
          return;
        }
      } catch (error) {
        // A hard Dataverse error (bad table name, no permission) will not
        // resolve by waiting, so this fails fast rather than retrying it for
        // the full N8N_POLL_TIMEOUT_MS.
        console.error("Failed to load Agreement, Quotation, or LIS from Dataverse:", error);
        setDataverseVerify({ source: "n8n", recordId, status: "error", agreement: null, quotation: null, atqExcel: null, lis: null, error: error.message || String(error) });
        setPage("extracted");
        return;
      }
      const elapsedMs = Date.now() - startedAt;
      if (elapsedMs >= N8N_POLL_TIMEOUT_MS) {
        setDataverseVerify({ source: "n8n", recordId, status: "timeout", agreement: null, quotation: null, atqExcel: null, lis: null });
        setPage("extracted");
        return;
      }
      setN8nWaitStatus("Still waiting for n8n… (" + Math.round((elapsedMs + N8N_POLL_INTERVAL_MS) / 1000) +
        "s / " + Math.round(N8N_POLL_TIMEOUT_MS / 1000) + "s)");
      await new Promise(resolve => setTimeout(resolve, N8N_POLL_INTERVAL_MS));
    }
  };

  // The one prop "Send to n8n" calls once it's done (see sendToN8n in the
  // Upload page). Admin mode never posts to n8n in the first place -- there is
  // nothing for Dataverse to have received yet, so waiting for it would only
  // ever time out. It keeps openVerifyAfterN8n's single-shot read unchanged.
  const onSendToN8n = () => (adminMode ? openVerifyAfterN8n() : waitForN8nCrossCheck());

  const goUpload = () => setPage("upload");
  // Used to open the retired Automatic Checks page ("verify"). ProcessingPage's
  // "Continue to Verify anyway" fallback still calls this prop by this name,
  // so it stays, but it now opens the real Verify Table instead.
  const goVerify = () => {
    markProcessStage(recordIdForItem(savePlans, itemIndex), "dataVerifying");
    setPage("extracted");
  };
  // `values` is the Verify Table's LIS Value column as it stood when "Continue
  // to save" was pressed. It is kept as `lisRowValues` (still the last-resort
  // fallback for a field that has no counterpart) AND pushed into `fields`,
  // which is what LisRemarkPage and buildRecordPayload actually read -- see
  // seedFieldsFromLisRows for why the fallback alone was not enough.
  //
  // Seeded HERE rather than in an effect on the page: the values exist at this
  // moment and nowhere else, so there is one deterministic point at which the
  // reviewer's column reaches the form, instead of a mount-ordering question.
  const goLis = (values) => {
    if (values) {
      setLisRowValues(values);
      setFields(prev => seedFieldsFromLisRows(prev, values));
    }
    setPage("lis");
  };

  // goProcess finishes every tab's deferred OCR before Verify sees it. Only
  // documents actually backing a role slot are worth the read -- an unused
  // "also" duplicate in the same email never reaches the form either way, so
  // spending its OCR budget here would be wasted.
  //
  // A tab's own upload is either a container (an email/.mht whose children
  // came back as its `docs[]`) or a single dropped file with no children at
  // all. resumeDeferredOcr only knows how to finish the first kind -- it reads
  // `raw.attachments`, which is empty for the second. A lone scanned PDF
  // dropped straight onto a tab is exactly that second kind, so it goes
  // through a plain, eager `parseFile` on the File object still held from
  // upload instead: slower (it repeats the ink pass resumeDeferredOcr would
  // have skipped via seedMarks) but correct, and needs no engine change.
  const [processStatus, setProcessStatus] = useState("");
  const [processPct, setProcessPct] = useState(null);
  const [processError, setProcessError] = useState(null);
  // Status line for N8nWaitingPage while waitForN8nCrossCheck polls.
  const [n8nWaitStatus, setN8nWaitStatus] = useState("");

  const goProcess = async () => {
    setItemSelectionLocked(true);
    // Every item's role slots need their documents OCR'd here, not just the
    // one on screen -- roles are pinned per item now, so a census keyed to
    // whichever item tab happens to be open would leave every other item's
    // pinned documents stuck pending until the reviewer visited each tab and
    // pressed Process again. Auto-resolved slots (the empty overrides set)
    // are the same for every item regardless of which tab is open, so they
    // only need asking once.
    // Crossed with every item, not just the one on screen, for the same reason:
    // the Quotation slot now resolves per item (offItemQuotationTest), so a
    // census taken for item 1 alone never names item 2's quotation and that
    // document would stay unread until the reviewer opened its tab and pressed
    // Process again. `census` is not reused here for exactly that reason.
    const overrideSets = [EMPTY_ROLE_OVERRIDES, ...Object.values(itemRoleOverrides)];
    const itemCount = Math.max(1, (recordsBearingEntry(attachments) || []).length);
    const targets = {};
    overrideSets.forEach(overrides => {
      for (let i = 0; i < itemCount; i++) {
        const itemCensus = roleCensus(attachments, overrides, offItemQuotationTest(attachments, i));
        DOC_ROLES.forEach(role => {
          const slot = itemCensus.assigned[role.key];
          const doc = slot && slot.doc;
          if (!doc || !doc.ocrPending) return;
          const t = targets[doc.typeKey] || (targets[doc.typeKey] = { docIndexes: [] });
          if (doc.docIndex >= 0 && t.docIndexes.indexOf(doc.docIndex) === -1) t.docIndexes.push(doc.docIndex);
        });
      }
    });
    const typeKeys = Object.keys(targets);
    // Whatever was open on Upload's inline panel shouldn't reappear as a
    // modal once we leave it -- see DocumentViewer's `page !== "upload"`
    // render condition.
    closeViewer();
    if (!typeKeys.length) { goExtracted(); return; }

    setProcessError(null);
    setPage("processing");
    const updated = {};
    try {
      for (const typeKey of typeKeys) {
        const entry = attachments[typeKey];
        const raw = entry.raw;
        setProcessStatus(`Reading ${typeKey}…`);
        setProcessPct(null);
        const onStatus = (msg, pct) => {
          setProcessStatus(msg || `Reading ${typeKey}...`);
          setProcessPct(typeof pct === "number" ? pct : null);
        };
        let result;
        if (raw && raw.attachments && raw.attachments.length) {
          const wanted = targets[typeKey].docIndexes;
          // markContext here, not only on upload: a scanned page has no text
          // to name its parties from until this read has OCR'd it, so this is
          // the first pass that can say whose chop is whose.
          result = await DocparseEngine.resumeDeferredOcr(raw, wanted.length ? wanted : null, onStatus,
            { markContext: true, markCrop: true, emailPreviewHtml: true, nestedEmails: true, textAttachments: true });
        } else if (entry.fileObj) {
          // Bounded, unlike a two-argument parseFile: this branch is the fallback
          // for a document with no retained raw result, so it OCRs every page
          // eagerly, and Process is waiting on up to four documents. Unbounded,
          // one 22-page scan spends eight minutes here and the other three slots
          // never get read at all -- measured at 500s on `L260390185MZ signed
          // contract.pdf`. The soft deadline hands back the pages it managed.
          result = await DocparseEngine.parseFile(entry.fileObj, onStatus,
            { markContext: true, markCrop: true, emailPreviewHtml: true, nestedEmails: true, textAttachments: true,
              ocrBudgetMs: DocparseEngine.OCR_BUDGET_MS });
        } else {
          throw new Error(`${typeKey}: original file is not available to finish reading it`);
        }
        const isAtqRecord = !!(result.records && result.records.length);
        const records = isAtqRecord ? result.records : null;
        const rawFields = isAtqRecord ? records[0].fields : result.fields;
        // resumeDeferredOcr/parseFile rebuild `docs`/`pages` from a fresh read
        // of the tab's original file, which knows nothing about documents
        // added by hand via "Add Document" -- carry those across (re-indexed,
        // pages re-appended) or they would silently vanish here.
        const manualDocs = (entry.docs || []).filter(d => d.manual);
        const docs = [...(result.attachments || [])];
        const pages = [...(result.pages || entry.pages || [])];
        manualDocs.forEach(d => {
          pages.push((entry.pages || [])[d.pagesIndex]);
          docs.push({ ...d, index: docs.length, pagesIndex: pages.length - 1 });
        });
        updated[typeKey] = { ...entry, text: result.plainText, rawFields, records, isAtqRecord,
          docs, self: result.self || entry.self, pages,
          signing: result.signing || entry.signing, previewHtml: result.previewHtml || entry.previewHtml,
          phase: "full", pendingDocs: result.pendingDocs || [], ocrError: null, raw: result };
      }
      const merged = { ...attachments, ...updated };
      setAttachments(merged);
      detectFromRoles(roleOverrides, merged);
      setPage("extracted");
    } catch (err) {
      console.error(err);
      setProcessError(err.message || "Could not finish reading these documents.");
    } finally {
      setProcessStatus("");
      setProcessPct(null);
    }
  };

  // Record_IDs that have already reached Dataverse, so a retry after a
  // partial failure skips them instead of creating duplicates. Keyed by
  // recordId; survives across goSave calls within the same record, cleared
  // only when the record itself is (resetRecordData / toggleDemo).
  const [savedRecordIds, setSavedRecordIds] = useState({});
  // null when idle; { savedCount, total, failedRecordId, message } after a
  // partial failure, for the Verify-page inline panel that replaced alert().
  const [saveStatus, setSaveStatus] = useState(null);
  const [saving, setSaving] = useState(false);

  // The rules are on savedRecordIdOf; this is only the wiring. Handed the
  // Record_ID of the item ON SCREEN, so the lock is per item rather than per
  // upload -- see processAnotherItem above for why one upload now legitimately
  // writes more than one record. savedRecordIds itself is unchanged, so a
  // finished item stays recorded as finished and its row is never written twice.
  const savedRecordId = savedRecordIdOf(savedRecordIds, recordIdForItem(savePlans, itemIndex));

  const goSave = async () => {
    if (saving) return;
    // Backstop for the disabled button: a stale closure or a double-click must
    // not be able to write a second record for this upload.
    if (savedRecordId) return;
    setSaving(true);
    setSaveStatus(null);
    // Build every payload before any write reaches Dataverse -- a plan bad
    // enough to throw here fails before it can leave any record half-written.
    let payloads;
    try {
      payloads = savePlans.map(p => ({ recordId: p.recordId, payload: buildRecordPayload(p.fieldsSnapshot, p.recordId, manualChecks) }));
    } catch (err) {
      setSaving(false);
      setSaveStatus({ savedCount: 0, total: savePlans.length, failedRecordId: null,
        message: err.message || "Could not build the record(s) to save." });
      return;
    }

    // Sequential, not Promise.all: Dataverse throttles, and only a sequential
    // loop leaves a describable partial state to report and retry from.
    const newRecords = [];
    let savedCount = payloads.filter(p => savedRecordIds[p.recordId]).length;
    for (const { recordId, payload } of payloads) {
      if (savedRecordIds[recordId]) continue; // already saved by a prior attempt -- idempotent retry
      try {
        let id = recordId;
        const saveApi = writeApi();
        if (saveApi) {
          const existing = await findExistingLisRecordId(id, saveApi);
          if (existing) {
            
            const result = await saveApi.updateRecord(SCHEMA.saveEntity, existing, payload);
            console.log(
              "Dataverse record successfully updated with ID:",
              result.id,
            );
            id = result.id;
          }
          else {
            const result = await saveApi.createRecord(SCHEMA.saveEntity, payload);
            console.log(
              "Dataverse record successfully created with ID:",
              result.id,
            );
            id = result.id;
          }
        } else {
          console.warn(
            "parent.Xrm.WebApi not detected. Saving locally (Demo / Standalone mode).",
          );
        }
        markProcessStage(recordId, "finished");
        // Same shape RecordsPage's admin_btb_lis_excel_datas columns read --
        // payload already carries these under SCHEMA.lis.write's columns, so
        // the row just written appears correctly instead of blank.
        // buildRecordPayload doesn't set the Status/Flagged columns yet (no
        // form field feeds them), so a freshly-saved row is optimistically
        // "Pending" / not flagged until the next real fetch corrects it.
        //
        // Looked up through SCHEMA.lis.write rather than written out as
        // column literals here: those names are per side AND they change --
        // the whole dev table was re-transcribed on 2026-09-18 -- and a
        // literal left behind would quietly blank this row rather than fail,
        // which is the same reason CLAUDE.md keeps every column name in
        // DATAVERSE_SCHEMAS and nowhere else.
        const lisWrite = SCHEMA.lis.write;
        const savedVal = key => (lisWrite[key] ? payload[lisWrite[key]] : undefined);
        const asDayMonth = d => new Date(d).toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' });
        const savedRecdDate = savedVal("recdDate");
        const savedAtqNo = savedVal("atqNo") || currentAtqNoOf(fields, attachments) || "—";
        const savedItemNo = savedVal("itemNo") || itemNoOf((recordsBearingEntry(attachments) || [])[itemIndex]) || String(itemIndex + 1);
        newRecords.push({ id,
          recordId: recordId,
          atqNo: savedAtqNo,
          itemNo: savedItemNo,
          status: "Pending",
          flagged: false,
          statusRemark: "",
          // "No." -- the write map's own recordNo key, whichever column this
          // side puts it in.
          no: savedVal("recordNo") || "—",
          recdDate: savedRecdDate ? asDayMonth(savedRecdDate) : asDayMonth(new Date()),
          poNo: savedVal("poNo") || "—",
          customerName: savedVal("customerName") || "—",
          vendor: savedVal("vendor") || "—",
          prDescription: savedVal("poPrDescription") || "—" });
        savedCount++;
        setSavedRecordIds(prev => ({ ...prev, [recordId]: true }));
        setProcessedItems(prev => {
          const next = { ...prev, [recordId]: true };
          if (savedAtqNo && savedAtqNo !== "—" && savedItemNo) {
            next[normRef(savedAtqNo) + "_" + String(savedItemNo).trim()] = true;
          }
          return next;
        });
      } catch (error) {
        // Fail-stop, no rollback: deleting the ones that did succeed could
        // itself be refused, and a half-rollback is worse than a recorded
        // partial completion. The ones already saved stay saved; savedCount
        // and savedRecordIds are what let a retry pick up from here.
        console.error("Failed to save record to Dataverse:", error);
        if (newRecords.length) setRecords(prev => [...newRecords, ...prev]);
        setSaving(false);
        setSaveStatus({ savedCount, total: payloads.length, failedRecordId: recordId,
          message: error.message || String(error) });
        return;
      }
    }
    if (newRecords.length) setRecords(prev => [...newRecords, ...prev]);
    setSaving(false);
    setSaveStatus(null);
    // Only move the reviewer onto Master Records if this side's rail offers
    // it. On the Admin side it does not (the user asked for it out on
    // 2026-09-07), and landing there would strand them on a page with no
    // rail entry highlighted and no way back. The write above still happens
    // either way, and savedRecordId still flips the button to "Saved" -- the
    // Admin reviewer simply stays where they are.
    if (navReachable("records")) setPage("records");
  };
  const markSent = id => setRecords(prev => prev.map(r => r.id === id ? { ...r, status: "Completed" } : r));

  // Shared by the "+ New Record" button and by dropping a replacement file
  // over an attachment tab that's already parsed -- both mean "this is a
  // different case now, don't let stale data survive into it." Leaves
  // activeTab/page alone so a mid-upload reset doesn't also yank the user
  // off the tab they were just dropping a file onto.
  const resetRecordData = () => {
    setAttachments(demoMode ? DEMO_ATTACHMENTS : EMPTY_ATTACHMENTS);
    setFields(initialFormState(demoMode));
    setManualChecks([false, false, false, false]);
    setDismissedDiffs(new Set());
    setItemIndex(0);
    setItemSelectionLocked(false);
    setItemPickHint(false);
    setFilterProcessedItems(false);
    setProcessedItems({});
    // Same reasoning as roleOverrides below: a snapshot points at an item in
    // the upload being thrown away, so it cannot survive it.
    setItemPlans({});
    // Record_IDs saved against the record being thrown away are meaningless
    // to whatever record comes next.
    setSavedRecordIds({});
    setAtqExcelWritten({});
    setLisStartWritten({});
    setSaveStatus(null);
    // A pin points at a document in the upload being thrown away, so it cannot
    // survive it -- "Contract#0" would silently re-attach to whatever lands in
    // that slot next.
    setItemRoleOverrides({});
  };

  // Optimistic update, revert on failure. `patch` is keyed by the app's own
  // FIELD KEYS -- writeMasterRecordFields resolves each one through
  // SCHEMA.lis.records and drops any this side has no column for -- and
  // `localPatch` is the matching app-shaped patch merged into the row
  // immediately, before the write resolves, so the table is current the
  // instant the Manage modal closes.
  //
  // Two different "no webApi" cases, and they must not share an answer. No
  // parent.Xrm.WebApi at all means standalone or demo: the local update IS
  // the whole write, so this reports success, which is the fallback this repo
  // uses everywhere else. An api that EXISTS while writeApi() still refuses
  // means the web resource was not recognised and the side is unknown -- the
  // one case where pretending the write landed is the worst possible answer,
  // since the reviewer would carry on editing a table nothing is reaching.
  const updateMasterRecordFields = async (recordId, patch, localPatch) => {
    const previous = records.find(r => r.recordId === recordId);
    if (!previous) return false;
    setFieldSaveError(null);
    setRecords(prev => prev.map(r => (r.recordId === recordId ? { ...r, ...localPatch } : r)));
    const embedded = (typeof parent !== "undefined") && parent && parent.Xrm && parent.Xrm.WebApi;
    if (!embedded) return true;
    const webApi = writeApi();
    if (!webApi) {
      setRecords(prev => prev.map(r => (r.recordId === recordId ? previous : r)));
      setFieldSaveError("This web resource is not recognised (" + SIDE_LABEL + "), so changes are not being written. " +
        "Add it to SIDE_BY_RESOURCE, or open the page with ?side=dev.");
      return false;
    }
    const result = await writeMasterRecordFields(recordId, patch, webApi);
    if (!result.ok) {
      setRecords(prev => prev.map(r => (r.recordId === recordId ? previous : r)));
      setFieldSaveError("Could not save changes for " + recordId + ": " + result.error);
      return false;
    }
    return true;
  };
  const updateMasterRecordField = (recordId, fieldKey, dvValue, localPatch) =>
    updateMasterRecordFields(recordId, { [fieldKey]: dvValue }, localPatch);

  const onNewRecord = () => {
    resetRecordData();
    setActiveTab("Vendor Quotation");
    setSidebarCollapsed(false);
    setPage("upload");
  };

  // The admin_MasterRecords.html web resource opens on this page and nothing
  // else -- no rail, no workflow steps, no document viewer, since none of the
  // five review steps is reachable from here anyway. Placed after every hook
  // above, not before them: an early return that skipped hooks would change
  // the hook order between the two modes.
  if (IS_RECORDS_ONLY) {
    return (
      <div className="app-shell min-h-screen">
        <div className="app-main min-h-screen flex flex-col">
          <RecordsPage records={records} demoMode={demoMode} toggleDemo={toggleDemo}
            recordsLoadError={recordsLoadError}
            updateMasterRecordField={updateMasterRecordField}
            updateMasterRecordFields={updateMasterRecordFields}
            fieldSaveError={fieldSaveError} dismissFieldSaveError={() => setFieldSaveError(null)} />
        </div>
      </div>
    );
  }

  return (
    <div className="app-shell min-h-screen">
      <Sidebar page={page} setPage={setPage} currentRecord={{ customerName: fields.customerName.value, uid: fields.uid.value, contractNo: fields.contractNo.value, hkd: fields.hkd.value }}
        progress={progress} onNewRecord={onNewRecord} collapsed={sidebarCollapsed} setCollapsed={setSidebarCollapsed}
        adminMode={adminMode} setAdminMode={setAdminMode} promptAdminMode={promptAdminMode}
        disabledKeys={records.length ? [] : ["reply"]} />
      <div className={(sidebarCollapsed ? "ml-[124px]" : "ml-[292px]") + " app-main min-h-screen flex flex-col ui-transition"}>
        {page === "upload" && <UploadPage attachments={attachments} setAttachments={setAttachments} activeTab={activeTab} setActiveTab={setActiveTab}
          fields={fields} setField={setField} setFieldAuto={setFieldAuto} applyMatches={applyMatches} applyUid={applyUid} detectFromRoles={detectFromRoles}
          goProcess={goProcess} goVerify={goVerify} demoMode={demoMode} adminMode={adminMode} toggleDemo={toggleDemo} openViewer={openViewer}
          onN8nSent={onSendToN8n}
          viewer={viewer} closeViewer={closeViewer}
          crosschecks={crosschecks} dismissedDiffs={dismissedDiffs} toggleDismissDiff={toggleDismissDiff}
          itemIndex={itemIndex} setItemIndex={setItemIndex} selectItem={selectItem} resetRecordData={resetRecordData}
          itemSelectionLocked={itemSelectionLocked} lockItemSelection={() => setItemSelectionLocked(true)}
          itemRecordIds={itemRecordIds} savedRecordIds={savedRecordIds} itemPickHint={itemPickHint}
          clearItemPickHint={() => setItemPickHint(false)}
          atqExcelRecordId={recordIdForItem(savePlans, itemIndex)}
          atqExcelAlreadyWritten={!!atqExcelWritten[recordIdForItem(savePlans, itemIndex)]}
          markAtqExcelWritten={() => setAtqExcelWritten(prev => ({ ...prev, [recordIdForItem(savePlans, itemIndex)]: true }))}
          lisStartUid={uidFromEmail(attachments, fields, emailSubject)}
          lisStartAlreadyWritten={!!lisStartWritten[recordIdForItem(savePlans, itemIndex)]}
          markLisStartWritten={(info) => {
            const rid = (info && info.recordId) || recordIdForItem(savePlans, itemIndex);
            const atq = (info && info.atqNo) || currentAtqNoOf(fields, attachments);
            const itemRecords = recordsBearingEntry(attachments) || [];
            const itm = (info && info.itemNo) || itemNoOf(itemRecords[itemIndex]) || String(itemIndex + 1);
            setLisStartWritten(prev => ({ ...prev, [rid]: true }));
            markProcessStage(rid, "newCreate");
            setProcessedItems(prev => {
              const next = { ...prev, [rid]: true };
              if (atq && itm) next[normRef(atq) + "_" + String(itm).trim()] = true;
              return next;
            });
          }}
          census={census} autoCensus={autoCensus} roleOverrides={roleOverrides} setRoleOverrides={setRoleOverrides}
          emailSubject={emailSubject} onUploadComplete={() => setSidebarCollapsed(true)}
          records={records} lisStartWritten={lisStartWritten}
          filterProcessedItems={filterProcessedItems}
          processedItems={processedItems} />}
        {page === "processing" && <ProcessingPage status={processStatus} pct={processPct} error={processError} retry={goProcess} goVerify={goVerify} />}
        {page === "n8nWaiting" && <N8nWaitingPage status={n8nWaitStatus} />}
        {page === "extracted" && <ExtractedFieldsPage attachments={attachments} crosschecks={crosschecks} census={census}
          itemIndex={itemIndex} goLis={goLis} openViewer={openViewer}
          uid={uidFromEmail(attachments, fields, emailSubject)} recordId={recordIdForItem(savePlans, itemIndex)}
          emailSubject={emailSubject} dataverseVerify={dataverseVerify} refreshDataverse={openVerifyAfterN8n}
          dismissedDiffs={dismissedDiffs} toggleDismissDiff={toggleDismissDiff} adminMode={adminMode} />}
        {page === "lis" && (
          <LisRemarkPage 
            fields={fields} 
            lisRowValues={lisRowValues} 
            attachments={attachments} 
            itemIndex={itemIndex} 
            selectItem={selectItem}
            itemRecordIds={itemRecordIds} 
            savedRecordIds={savedRecordIds} 
            processAnotherItem={processAnotherItem}
            goUpload={goUpload} 
            goSave={goSave} 
            saving={saving} 
            recordId={recordIdForItem(savePlans, itemIndex)} 
            savedRecordId={savedRecordId} 
            setField={setField} 
            adminMode={adminMode}
            records={records} 
            lisStartWritten={lisStartWritten}
            processedItems={processedItems} 
          />)}
        {page === "verify" && <VerifyPage attachments={attachments} fields={fields} manualChecks={manualChecks} toggleManualCheck={toggleManualCheck}
          goUpload={goUpload} goSave={goSave} demoMode={demoMode} adminMode={adminMode} itemRecordIds={itemRecordIds} saveStatus={saveStatus} saving={saving} savedRecordId={savedRecordId}
          crosschecks={crosschecks} dismissedDiffs={dismissedDiffs} toggleDismissDiff={toggleDismissDiff} openViewer={openViewer}
          itemIndex={itemIndex} selectItem={selectItem} />}
        {page === "records" && <RecordsPage records={records} demoMode={demoMode} toggleDemo={toggleDemo}
          recordsLoadError={recordsLoadError}
          updateMasterRecordField={updateMasterRecordField}
          updateMasterRecordFields={updateMasterRecordFields}
          fieldSaveError={fieldSaveError} dismissFieldSaveError={() => setFieldSaveError(null)} />}
        {page === "reply" && <ReplyPage record={replyRecord} goRecords={() => setPage("records")} markSent={markSent} replyFiles={replyFiles} demoMode={demoMode} adminMode={adminMode} />}
      </div>
      {/* Sibling of the sidebar-offset wrapper, not a child of it, so the modal
          covers the fixed sidebar too. Remounted per opened doc so every piece
          of preview state starts clean.
          Upload is the exception: there the same viewer is rendered inline at
          the foot of UploadPage instead, so the document sits beside the fields
          it is being checked against rather than on top of them. */}
      {viewer && page !== "upload" && <DocumentViewer key={viewer.typeKey + ":" + viewer.docIndex}
        viewer={viewer} attachments={attachments} onClose={closeViewer}
        crosschecks={crosschecks} dismissedDiffs={dismissedDiffs} toggleDismissDiff={toggleDismissDiff}
        setField={setField} fields={fields} openViewer={openViewer} census={census} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  var src = document.getElementById("app-src").textContent;
  var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
  var s = document.createElement("script");
  s.textContent = out;
  document.body.appendChild(s);
</script>
</body>
</html>
