<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTB Procurement Report Dashboard</title>
<style>
/* ============================================================================
   DESIGN TOKENS
   Palette validated with the dataviz six-checks validator:
     categorical light  -> PASS all 5 (adjacent CVD dE 9.2, normal dE 18.8)
     categorical dark   -> PASS all 5 (adjacent CVD dE 11.0, normal dE 23.8)
     sequential (ochre) -> PASS ordinal checks (monotone L, light end 2.07:1)
   Warm-earth on parchment. Deliberately NOT the stock indigo/emerald set.
   ============================================================================ */
:root{
  color-scheme: light;
  /* surfaces */
  --bg-canvas:#F2EDE4;
  --bg-surface:#FAF7F2;
  --bg-raised:#FFFFFF;
  --bg-sunken:#EDE6DA;
  --bg-inset:#E6DECF;
  /* ink */
  --ink-primary:#1F1C17;   /* 15.6:1 on --bg-surface */
  --ink-secondary:#554E43;
  --ink-muted:#857C6E;
  --ink-inverse:#FAF7F2;
  /* rules */
  --rule:#E0D7C7;
  --rule-strong:#C8BCA6;
  --rule-hair:#EAE3D6;
  /* accent (ochre family, shared with the sequential ramp) */
  --accent:#8E6A12;
  --accent-hover:#6B4D07;
  --accent-soft:#F3E6C9;
  --accent-ink:#5A3F06;
  --focus:#B8432A;
  /* status - reserved, never used as a series colour */
  --pos:#3F6B33;      --pos-soft:#E3EBDC;  --pos-ink:#2C4B22;
  --caution:#9A6B05;  --caution-soft:#F7E9C8; --caution-ink:#6B4A02;
  --neg:#A8351C;      --neg-soft:#F6E0D9;  --neg-ink:#7A2512;
  --neutral:#6B6257;  --neutral-soft:#EBE4D8; --neutral-ink:#443E36;
  --info:#2B4E8C;     --info-soft:#DEE5F2;  --info-ink:#1E3763;
  /* categorical series - FIXED ORDER, assigned in sequence, never cycled */
  --s1:#00806A; --s2:#B8432A; --s3:#2B4E8C; --s4:#7C6B00;
  --s5:#C2546B; --s6:#4C7A17; --s7:#8C2F63; --s8:#A8730B;
  /* sequential (magnitude) */
  --q1:#CFA95F; --q2:#B08833; --q3:#8E6A12; --q4:#6B4D07; --q5:#452F02;
  /* diverging (polarity: loss <-> profit), neutral warm-grey midpoint */
  --d-neg2:#8E2F18; --d-neg1:#C9714F; --d-mid:#D6D1C7; --d-pos1:#4E9E85; --d-pos2:#00604F;
  /* elevation - restrained by house rule, never neumorphic */
  --lift-1:0 1px 2px rgba(53,44,30,.06), 0 0 0 1px rgba(53,44,30,.05);
  --lift-2:0 4px 12px rgba(53,44,30,.09), 0 0 0 1px rgba(53,44,30,.06);
  /* geometry */
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-pill:999px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px; --sp7:48px;
  --font:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){}
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg-canvas:#121110; --bg-surface:#1C1A18; --bg-raised:#252220; --bg-sunken:#171513; --bg-inset:#2E2A26;
    --ink-primary:#F2ECE1; --ink-secondary:#BCB2A3; --ink-muted:#8A8175; --ink-inverse:#1C1A18;
    --rule:#332F2A; --rule-strong:#4A443C; --rule-hair:#2A2724;
    --accent:#C9A052; --accent-hover:#DFBC74; --accent-soft:#3A3021; --accent-ink:#E8D3A2;
    --focus:#E9754F;
    --pos:#7FA85E; --pos-soft:#26301C; --pos-ink:#B4CE97;
    --caution:#C79A2E; --caution-soft:#33290F; --caution-ink:#E3C471;
    --neg:#DC6A4C; --neg-soft:#37201A; --neg-ink:#F0A48B;
    --neutral:#9A9084; --neutral-soft:#2B2823; --neutral-ink:#C6BDB0;
    --info:#6D93D8; --info-soft:#1E2739; --info-ink:#A8C0EA;
    --s1:#009076; --s2:#C73B1C; --s3:#3A67B8; --s4:#826C00;
    --s5:#E95578; --s6:#4D7E0F; --s7:#B6307E; --s8:#C08723;
    --q1:#F0D9A8; --q2:#D8B265; --q3:#B08833; --q4:#8A6714; --q5:#5E4608;
    --d-neg2:#E9835F; --d-neg1:#B4553C; --d-mid:#4A443C; --d-pos1:#3E8770; --d-pos2:#6FC0A5;
    --lift-1:0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.05);
    --lift-2:0 4px 14px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg-canvas:#121110; --bg-surface:#1C1A18; --bg-raised:#252220; --bg-sunken:#171513; --bg-inset:#2E2A26;
  --ink-primary:#F2ECE1; --ink-secondary:#BCB2A3; --ink-muted:#8A8175; --ink-inverse:#1C1A18;
  --rule:#332F2A; --rule-strong:#4A443C; --rule-hair:#2A2724;
  --accent:#C9A052; --accent-hover:#DFBC74; --accent-soft:#3A3021; --accent-ink:#E8D3A2;
  --focus:#E9754F;
  --pos:#7FA85E; --pos-soft:#26301C; --pos-ink:#B4CE97;
  --caution:#C79A2E; --caution-soft:#33290F; --caution-ink:#E3C471;
  --neg:#DC6A4C; --neg-soft:#37201A; --neg-ink:#F0A48B;
  --neutral:#9A9084; --neutral-soft:#2B2823; --neutral-ink:#C6BDB0;
  --info:#6D93D8; --info-soft:#1E2739; --info-ink:#A8C0EA;
  --s1:#009076; --s2:#C73B1C; --s3:#3A67B8; --s4:#826C00;
  --s5:#E95578; --s6:#4D7E0F; --s7:#B6307E; --s8:#C08723;
  --q1:#F0D9A8; --q2:#D8B265; --q3:#B08833; --q4:#8A6714; --q5:#5E4608;
  --d-neg2:#E9835F; --d-neg1:#B4553C; --d-mid:#4A443C; --d-pos1:#3E8770; --d-pos2:#6FC0A5;
  --lift-1:0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.05);
  --lift-2:0 4px 14px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.07);
}

*{box-sizing:border-box}
/* Always reserve the vertical scrollbar. Charts are measured in pixels, so a
   re-render changes page height; if that toggles the scrollbar the viewport
   WIDTH changes, which fires resize, which re-renders — an oscillation between
   W and W-15 that never settles. Reserving the gutter removes the feedback
   loop at its source (and kills the horizontal jump when a tab is shorter). */
html{overflow-y:scroll}
html,body{margin:0;padding:0}
body{
  background:var(--bg-canvas); color:var(--ink-primary);
  font-family:var(--font); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
/* ---- type scale ---- */
.t-page{font-size:21px;font-weight:650;letter-spacing:-.018em;line-height:1.2}
.t-tab{font-size:13.5px;font-weight:600;letter-spacing:-.002em}
.t-card{font-size:13px;font-weight:650;letter-spacing:.005em}
.t-kpi{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:proportional-nums}
.t-body{font-size:14px;font-weight:400}
.t-micro{font-size:11px;font-weight:550;letter-spacing:.045em;text-transform:uppercase;color:var(--ink-muted)}
.num{font-variant-numeric:tabular-nums}

/* ---- app shell ---- */
.app{max-width:1560px;margin:0 auto;padding-block:var(--sp5);padding-left:var(--sp5);padding-right:var(--sp5)}
@media(max-width:640px){.app{padding-left:var(--sp4);padding-right:var(--sp4)}}

.topbar{display:flex;align-items:flex-start;gap:var(--sp4);flex-wrap:wrap;margin-bottom:var(--sp4)}
.topbar .grow{flex:1 1 260px;min-width:0}
.sub{color:var(--ink-secondary);font-size:13px;margin-top:3px}
.toolbtns{display:flex;gap:var(--sp2);flex-wrap:wrap}

.btn{
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-secondary);
  background:var(--bg-raised);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:7px 12px;cursor:pointer;transition:background .13s,border-color .13s,color .13s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:var(--bg-sunken);border-color:var(--rule-strong);color:var(--ink-primary)}
.btn[aria-pressed="true"],.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:var(--sp4);overflow-x:auto;scrollbar-width:thin}
.tab{
  font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-muted);background:none;border:0;
  border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;
  transition:color .13s,border-color .13s;
}
.tab:hover{color:var(--ink-primary)}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}

/* ---- filter bar ---- */
.filters{
  background:var(--bg-surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:var(--sp3) var(--sp4);margin-bottom:var(--sp4);box-shadow:var(--lift-1);
}
.filters .row{display:flex;gap:var(--sp3);align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
select,input[type=date],input[type=search]{
  font:inherit;font-size:13px;color:var(--ink-primary);background:var(--bg-raised);
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:6px 8px;min-width:120px;max-width:100%;
}
select[multiple]{padding:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp3);align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);
  border-radius:var(--r-pill);padding:3px 6px 3px 10px;
}
.chip button{background:none;border:0;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 3px;border-radius:var(--r-pill)}
.chip button:hover{background:rgba(0,0,0,.09)}
.chips .none{font-size:12px;color:var(--ink-muted);font-style:italic}

/* ---- grid + cards ---- */
.grid{display:grid;gap:var(--sp4);grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:var(--sp4)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media(max-width:1100px){.c3,.c4{grid-column:span 6}
  .c5,.c6,.c7,.c8,.c9{grid-column:span 12}}
@media(max-width:620px){.c3,.c4{grid-column:span 12}}

.card{
  background:var(--bg-surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:var(--sp4);box-shadow:var(--lift-1);min-width:0;display:flex;flex-direction:column;
}
.card>header{display:flex;align-items:baseline;gap:var(--sp2);margin-bottom:var(--sp1);flex-wrap:wrap}
.card>header .t-card{flex:1 1 auto;min-width:0}
.card .q{font-size:12px;color:var(--ink-muted);margin:0 0 var(--sp3);line-height:1.35}
.card .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--sp3)}
.card .ctl select{font-size:12px;padding:4px 6px;min-width:0}

/* ---- kpi tile ---- */
.kpi{background:var(--bg-surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--sp4);box-shadow:var(--lift-1)}
.kpi .lab{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.045em;text-transform:uppercase;color:var(--ink-muted)}
.kpi .val{margin:6px 0 4px}
.kpi .foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-secondary);flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:650;font-size:12px;border-radius:var(--r-sm);padding:1px 5px;font-variant-numeric:tabular-nums}
.delta.up{background:var(--pos-soft);color:var(--pos-ink)}
.delta.down{background:var(--neg-soft);color:var(--neg-ink)}
.delta.flat{background:var(--neutral-soft);color:var(--neutral-ink)}

/* ---- pill / badge ---- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;border-radius:var(--r-pill);padding:2px 8px;white-space:nowrap}
.pill.pos{background:var(--pos-soft);color:var(--pos-ink)}
.pill.cau{background:var(--caution-soft);color:var(--caution-ink)}
.pill.neg{background:var(--neg-soft);color:var(--neg-ink)}
.pill.neu{background:var(--neutral-soft);color:var(--neutral-ink)}
.pill.inf{background:var(--info-soft);color:var(--info-ink)}

/* ---- chart chrome ---- */
.plot{width:100%;display:block;overflow:visible}
.plot .grid-line{stroke:var(--rule-hair);stroke-width:1;shape-rendering:crispEdges}
.plot .axis-line{stroke:var(--rule-strong);stroke-width:1;shape-rendering:crispEdges}
.plot .zero-line{stroke:var(--ink-muted);stroke-width:1;shape-rendering:crispEdges}
.plot text{fill:var(--ink-muted);font-size:10.5px;font-family:var(--font);font-variant-numeric:tabular-nums}
.plot text.val-label{fill:var(--ink-secondary);font-size:10.5px;font-weight:600}
.plot .mark{transition:opacity .12s}
.plot .hit{fill:transparent;cursor:pointer}
.plot:hover .mark{opacity:.62}
.plot .mark.hot,.plot:hover .mark.hot{opacity:1}
.plot .sel-ring{fill:none;stroke:var(--ink-primary);stroke-width:2}

.legend{display:flex;gap:var(--sp3);flex-wrap:wrap;margin-top:var(--sp2);font-size:11.5px;color:var(--ink-secondary)}
.legend button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:2px 4px;border-radius:var(--r-sm)}
.legend button:hover{background:var(--bg-sunken)}
.legend button[aria-pressed="false"]{opacity:.42}
.legend .sw{width:11px;height:11px;border-radius:2px;flex:none}
.legend .sw.line{height:3px;width:15px;border-radius:2px}

/* ---- tooltip ---- */
#tip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;transform:translateY(-3px);
  transition:opacity .1s;background:var(--bg-raised);color:var(--ink-primary);
  border:1px solid var(--rule-strong);border-radius:var(--r-md);box-shadow:var(--lift-2);
  padding:9px 11px;min-width:150px;max-width:300px;font-size:12px;
}
#tip.on{opacity:1;transform:none}
#tip .tt-h{font-weight:650;font-size:12.5px;margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
#tip .tt-r{display:flex;align-items:baseline;gap:8px;margin-top:3px}
#tip .tt-k{width:13px;height:3px;border-radius:2px;flex:none;position:relative;top:-3px}
#tip .tt-n{color:var(--ink-secondary);flex:1 1 auto;min-width:0}
#tip .tt-v{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
#tip .tt-f{margin-top:6px;padding-top:5px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink-muted)}

/* ---- table ---- */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{
  text-align:left;font-size:10.5px;font-weight:650;letter-spacing:.045em;text-transform:uppercase;
  color:var(--ink-muted);padding:6px 8px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;
}
table.dt th.n,table.dt td.n{text-align:right;font-variant-numeric:tabular-nums}
table.dt td{padding:6px 8px;border-bottom:1px solid var(--rule-hair);vertical-align:middle}
table.dt tbody tr:hover{background:var(--bg-sunken)}
.inbar{position:relative;display:block;height:14px;border-radius:2px;background:var(--bg-inset);min-width:34px}
.inbar i{position:absolute;inset:0 auto 0 0;border-radius:2px;display:block}



/* ---- SLICE BAND: the page's single focal point.
   The failure it fixes: every card had the same visual weight, so a reader
   could not tell at a glance WHICH slice of the book the numbers described.
   The filtered value is therefore set at display size - it is the largest
   type on the page, larger than any KPI - and everything else stays quiet.
   Unfiltered it collapses to one muted line, so it only shouts when there is
   actually something to shout about. ---- */
.slice{display:flex;align-items:center;gap:var(--sp5);flex-wrap:wrap;
  background:var(--bg-surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:var(--sp3) var(--sp5);margin-bottom:var(--sp4);box-shadow:var(--lift-1)}
.slice.on{border-left:5px solid var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.slice-main{flex:1 1 300px;min-width:0}
.slice-cap{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted)}
.slice.on .slice-cap{color:var(--accent-ink);opacity:.8}
.slice-val{font-size:27px;font-weight:650;letter-spacing:-.022em;line-height:1.15;margin-top:2px;
  color:var(--ink-primary);overflow-wrap:anywhere}
.slice.on .slice-val{color:var(--accent-ink)}
.slice-val .sep{color:var(--ink-muted);font-weight:400;padding:0 6px}
.slice.on .slice-val .sep{color:var(--accent-ink);opacity:.45}
.slice-meta{display:flex;align-items:baseline;gap:var(--sp2);flex-wrap:wrap;margin-top:5px;
  font-size:13px;color:var(--ink-secondary)}
.slice.on .slice-meta{color:var(--accent-ink);opacity:.9}
.slice-meta b{font-weight:700;font-variant-numeric:tabular-nums}
.slice-side{display:flex;align-items:center;gap:var(--sp3);flex:0 0 auto}
.slice-bar{width:132px;height:7px;border-radius:var(--r-pill);background:var(--bg-inset);overflow:hidden}
.slice.on .slice-bar{background:rgba(0,0,0,.12)}
.slice-bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent)}
.slice.on .slice-bar i{background:var(--accent-ink)}
.slice-clear{font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;white-space:nowrap;
  border-radius:var(--r-sm);padding:6px 12px;border:1px solid var(--accent-ink);
  background:transparent;color:var(--accent-ink)}
.slice-clear:hover{background:var(--accent-ink);color:var(--accent-soft)}
.slice-quiet{font-size:13px;color:var(--ink-muted);font-style:italic}
@media(max-width:620px){.slice-val{font-size:22px}.slice-bar{display:none}}

/* A mark the current filter did NOT select recedes; the selected one keeps its
   full weight and gains a ring. Same idea as the band above, applied inside
   every chart, so the eye lands on the filtered value there too. */
.plot .mark.faded{opacity:.2}
.plot:hover .mark.faded{opacity:.16}
.plot .mark.picked{opacity:1}
.plot:hover .mark.picked{opacity:1}


/* ---- narrow screens: the filter bar collapses behind one button.
   At 390px the expanded bar is ten stacked dropdowns, so the first screen
   contains no data at all. The slice band already says what is filtered, so
   the controls can hide until they are wanted. ---- */
.filter-toggle{display:none;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;
  align-items:center;gap:7px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);
  background:var(--bg-raised);color:var(--ink-secondary);padding:7px 12px;width:100%}
.filter-toggle:hover{background:var(--bg-sunken);color:var(--ink-primary)}
.filter-toggle .fc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-pill);padding:1px 8px}
.filter-toggle .fc.zero{background:var(--bg-inset);color:var(--ink-muted)}
@media(max-width:760px){
  .filter-toggle{display:flex}
  .filters:not(.open) .row{display:none}
  .filters.open .row{margin-top:var(--sp3)}
  .filters .field{width:100%}
  .filters select,.filters input{width:100%;min-width:0}
}

/* ---- misc ---- */
.note{
  border-left:3px solid var(--caution);background:var(--caution-soft);color:var(--caution-ink);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:9px 12px;font-size:12.5px;margin-bottom:var(--sp3);
}
.note.inf{border-left-color:var(--info);background:var(--info-soft);color:var(--info-ink)}
.callout{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);
  background:var(--bg-sunken);border:1px solid var(--rule);font-size:12.5px;line-height:1.45}
.callout .mk{font-size:14px;line-height:1.2;flex:none}
.empty{color:var(--ink-muted);font-size:12.5px;font-style:italic;padding:var(--sp5) 0;text-align:center}
.srcbadge{font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-pill)}
.hr{height:1px;background:var(--rule);border:0;margin:var(--sp5) 0}
.readonly-hint{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-muted)}
.clickable-hint{color:var(--accent-ink);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="tip" role="status" aria-live="polite"></div>
<div class="app">

  <div class="topbar">
    <div class="grow">
      <div class="t-page">BTB Procurement Report Dashboard</div>
      <div class="sub">
        <span id="srcBadge" class="srcbadge pill neu">DEMO DATA</span>
        <span id="srcLine">loading…</span>
      </div>
    </div>
    <div class="toolbtns">
      <button class="btn" id="btnTheme" type="button" title="Switch light / dark">◐ Theme</button>
      <button class="btn" id="btnTable" type="button" aria-pressed="false" title="Show the numbers behind every chart">▦ Table view</button>
      <button class="btn" id="btnReset" type="button" title="Clear every filter">↺ Reset filters</button>
      <button class="btn" id="btnCsv" type="button" title="Download the current slice">↓ CSV</button>
    </div>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="filters" id="filterBar">
    <button class="filter-toggle" id="filterToggle" type="button"
            aria-expanded="false" aria-controls="filterRow">
      <span>Filters</span><span class="fc zero" id="filterCount">0</span>
    </button>
    <div class="row" id="filterRow"></div>
    <div class="chips" id="chipRow"></div>
  </div>

  <div id="sliceBand"></div>

  <main id="view"></main>

  <p class="readonly-hint" style="margin-top:var(--sp5)">
    ⓘ This is a read-only report. Every figure comes from <code>admin_btb_lis_excel_datas</code>.
    Dropdowns re-pivot the view; clicking a bar filters everything below and the band above names what you picked. Nothing here writes back to Dataverse.
  </p>
</div>
<script>
/* ============================================================================
   1. SCHEMA REGISTRY — the ONE place this dashboard learns the table.
   `optional:true` = a planned column that may not exist in Dataverse yet.
   A widget whose measure/dimension is optional-and-absent hides itself and
   says why, rather than rendering a chart full of zeroes.
   ========================================================================== */
var FIELDS = [
  // identity
  {k:"recordId", l:"admin_title",                         label:"Record ID",        type:"id"},
  {k:"prNo",     l:"admin_prx0020nox002e2",               label:"PR No.",           type:"id"},
  {k:"poNo",     l:"admin_pox0020nox002e2",               label:"PO No.",           type:"id"},
  {k:"uid",      l:"admin_uidx0020x00232",                label:"UID #",            type:"id"},
  {k:"contractNo",l:"admin_contractx0020nox002e2",        label:"Contract No.",     type:"id"},
  {k:"desc",     l:"admin_prx0020description2",           label:"PR Description",   type:"id"},
  // dimensions
  {k:"customer", l:"admin_customerx0020name2",            label:"Customer",         type:"dim"},
  {k:"vendor",   l:"admin_vendor2",                       label:"Vendor",           type:"dim"},
  {k:"chargeCcc",l:"admin_chargex0020ccc2",               label:"Charge CCC",       type:"dim"},
  {k:"acctCode", l:"admin_accountx0020code2",             label:"Account Code",     type:"dim"},
  {k:"woCode",   l:"admin_worksx0020orderx0020code2",     label:"Works Order",      type:"dim"},
  {k:"handledBy",l:"admin_handledx0020byx00202",          label:"Handled By",       type:"dim"},
  {k:"issueBy",  l:"admin_issuex0020by2",                 label:"Issued By",        type:"dim"},
  {k:"iptMgr",   l:"admin_iptx0020unitx0020mgr2",         label:"IPT Unit Mgr",     type:"dim"},
  {k:"urgency",  l:"admin_yx0020x002fx0020n2",            label:"Urgency",          type:"dim"},
  {k:"btbType",  l:"new_btb_type",                        label:"BTB / NON-BTB",    type:"dim"},
  {k:"procStatus",l:"new_process_status",                 label:"Process Status",   type:"dim", choice:"PROC"},
  {k:"prStatus", l:"new_prstatus",                        label:"PR Status",        type:"dim", choice:"PRST"},
  {k:"brand",    l:"new_brand",                           label:"Brand",            type:"dim", optional:true},
  {k:"endCustomer",l:"new_end_customer",                  label:"End Customer",     type:"dim", optional:true},
  {k:"sourceBook",l:"new_source_book",                    label:"Source Book",      type:"dim", optional:true},
  {k:"buyer",    l:"new_buyer",                           label:"Buyer",            type:"dim", optional:true},
  {k:"ao",       l:"new_ao",                              label:"AO",               type:"dim", optional:true},
  {k:"sbContact",l:"new_sb_contact",                      label:"SB / SO Contact",  type:"dim", optional:true},
  {k:"model",    l:"new_model",                           label:"Model",            type:"dim", optional:true},
  {k:"itemNo",   l:"new_item_no",                         label:"Item #",           type:"dim", optional:true},
  // measures
  {k:"prHkd",    l:"admin_hkd2",                          label:"PR Amount (HKD)",  type:"measure", fmt:"hkd"},
  {k:"poHkd",    l:"admin_pox0020amountx0020hkx00242",    label:"PO Amount (HKD)",  type:"measure", fmt:"hkd"},
  {k:"prUsd",    l:"admin_usdx0020x002fx0020others2",     label:"PR Amount (USD)",  type:"measure", fmt:"usd"},
  {k:"revenue",  l:"new_revenue_hkd",                     label:"Revenue (HKD)",    type:"measure", fmt:"hkd", optional:true},
  {k:"cost",     l:"new_direct_cost_hkd",                 label:"Direct Cost (HKD)",type:"measure", fmt:"hkd", optional:true},
  {k:"poUsd",    l:"new_po_amount_usd",                   label:"PO Amount (USD)",  type:"measure", fmt:"usd", optional:true},
  // dates
  {k:"recdDate", l:"admin_recx0027dx0020datex00202",      label:"Rec'd Date",       type:"date"},
  {k:"prIssued", l:"admin_prx0020issuedx0020on2",         label:"PR Issued On",     type:"date"},
  {k:"poDate",   l:"admin_pox0020date2",                  label:"PO Date",          type:"date"},
  {k:"receiptDate",l:"admin_receiptx0020date2",           label:"Receipt Date",     type:"date"},
  {k:"invDate",  l:"admin_invoicex0020x002fx0020dnx2",    label:"Invoice / DN Date",type:"date"},
  {k:"ctrStart", l:"admin_startx0020date",                label:"Contract Start",   type:"date"},
  {k:"ctrEnd",   l:"admin_odatax0020endx0020date2",       label:"Contract End",     type:"date"},
  {k:"dnDate",   l:"new_dn_date",                         label:"DN Date",          type:"date", optional:true},
  {k:"licDate",  l:"new_licence_receive_date",            label:"Licence Rec'd",    type:"date", optional:true},
  // flags
  {k:"flagged",  l:"new_flagged",                         label:"Flagged",          type:"flag"},
  {k:"cancelled",l:"new_cancelled",                       label:"Cancelled",        type:"flag", optional:true}
];
var F = {}; FIELDS.forEach(function(f){ F[f.k] = f; });
var CHOICES = {
  PROC:{1:"PR No. Ready",2:"UM Verified",3:"LIS system Approved",4:"PO No. Ready",5:"Completed",
        6:"Waiting approval",7:"Waiting book-in",8:"Waiting licence delivery"},
  PRST:{1:"Pending",2:"In Progress",3:"Approved",4:"Rejected",5:"Closed"}
};
/* Ordered because the funnel and the cycle-time chart read position, not identity. */
var STAGE_ORDER = ["PR No. Ready","UM Verified","LIS system Approved","PO No. Ready","Completed"];

/* Which optional columns actually came back. Everything reads this, never a
   hard-coded assumption. Absent -> the widget explains itself instead of lying. */
var PRESENT = {};
FIELDS.forEach(function(f){ PRESENT[f.k] = !f.optional; });
function has(k){ return PRESENT[k] === true; }

/* ============================================================================
   2. FORMATTERS
   ========================================================================== */
function nf(n,d){ return (n==null||isNaN(n))?"—":n.toLocaleString("en-HK",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function fmtHkd(n){
  if(n==null||isNaN(n)) return "—";
  var a=Math.abs(n);
  if(a>=1e9) return (n<0?"-":"")+"HK$"+(a/1e9).toFixed(2)+"B";
  if(a>=1e6) return (n<0?"-":"")+"HK$"+(a/1e6).toFixed(2)+"M";
  if(a>=1e3) return (n<0?"-":"")+"HK$"+(a/1e3).toFixed(0)+"K";
  return (n<0?"-":"")+"HK$"+a.toFixed(0);
}
function fmtHkdFull(n){ return (n==null||isNaN(n))?"—":"HK$"+nf(Math.round(n)); }
function fmtUsd(n){ if(n==null||isNaN(n))return "—"; var a=Math.abs(n);
  return (n<0?"-":"")+"US$"+(a>=1e6?(a/1e6).toFixed(2)+"M":a>=1e3?(a/1e3).toFixed(0)+"K":a.toFixed(0)); }
function fmtPct(n,d){ return (n==null||isNaN(n))?"—":(n>=0?"":"")+n.toFixed(d==null?1:d)+"%"; }
function fmtDays(n){ return (n==null||isNaN(n))?"—":nf(n,1)+"d"; }
function fmtInt(n){ return (n==null||isNaN(n))?"—":nf(n); }
var FMT = {hkd:fmtHkd, usd:fmtUsd, pct:fmtPct, days:fmtDays, int:fmtInt, count:fmtInt};
function fmtOf(key){ var m=MEASURES_BY_KEY[key]; return (m&&FMT[m.fmt])||fmtInt; }
function fmtDate(d){ return d?d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—"; }

/* ============================================================================
   3. NORMALISE — raw Dataverse entity -> flat analysis row.
   null stays null. NEVER an em dash: a placeholder string poisons every
   sum, every average and every distinct count downstream.
   ========================================================================== */
function num(v){ if(v==null||v==="")return null; var n=typeof v==="number"?v:parseFloat(String(v).replace(/[, ]/g,"")); return isNaN(n)?null:n; }
function dte(v){ if(!v)return null; var d=new Date(v); return isNaN(d.getTime())?null:d; }
function txt(v){ if(v==null)return null; var s=String(v).trim(); return s===""?null:s; }

function normalizeRow(it){
  var r={};
  FIELDS.forEach(function(f){
    if(f.optional && !PRESENT[f.k]){ r[f.k]=null; return; }
    var raw=it[f.l];
    if(f.choice)            r[f.k]= raw==null?null:(CHOICES[f.choice][String(raw)]||null);
    else if(f.type==="measure") r[f.k]=num(raw);
    else if(f.type==="date")    r[f.k]=dte(raw);
    else if(f.type==="flag")    r[f.k]= raw===true;
    else                        r[f.k]=txt(raw);
  });
  return r;
}

/* ============================================================================
   4. DERIVED MEASURES — pure. Null propagates: a margin needs BOTH sides, and
   a row missing one of them must drop out of the average rather than count
   as zero (that is the difference between "we made nothing" and "we don't know").
   ========================================================================== */
function dayspan(a,b){ return (a&&b)?Math.round((b-a)/864e5):null; }
var DERIVED = [
  {k:"margin",    label:"Margin (HKD)",      fmt:"hkd", needs:["revenue","cost"],
   fn:function(r){ return (r.revenue==null||r.cost==null)?null:r.revenue-r.cost; }},
  {k:"marginPct", label:"Margin %",          fmt:"pct", needs:["revenue","cost"],
   fn:function(r){ return (r.revenue==null||r.cost==null||!r.revenue)?null:(r.revenue-r.cost)/r.revenue*100; }},
  {k:"costRatio", label:"Cost / Revenue %",  fmt:"pct", needs:["revenue","cost"],
   fn:function(r){ return (r.revenue==null||r.cost==null||!r.revenue)?null:r.cost/r.revenue*100; }},
  {k:"dPrPo",     label:"PR → PO (days)",    fmt:"days", needs:["prIssued","poDate"],
   fn:function(r){ return dayspan(r.prIssued,r.poDate); }},
  {k:"dPoRcpt",   label:"PO → Receipt (days)",fmt:"days", needs:["poDate","receiptDate"],
   fn:function(r){ return dayspan(r.poDate,r.receiptDate); }},
  {k:"dRcptDn",   label:"Receipt → DN (days)",fmt:"days", needs:["receiptDate","dnDate"],
   fn:function(r){ return dayspan(r.receiptDate,r.dnDate); }},
  {k:"dDnInv",    label:"DN → Invoice (days)",fmt:"days", needs:["dnDate","invDate"],
   fn:function(r){ return dayspan(r.dnDate,r.invDate); }},
  {k:"dTotal",    label:"PR → Invoice (days)",fmt:"days", needs:["prIssued","invDate"],
   fn:function(r){ return dayspan(r.prIssued,r.invDate); }},
  {k:"daysToExpiry",label:"Days to Expiry",  fmt:"days", needs:["ctrEnd"],
   fn:function(r){ return r.ctrEnd?Math.round((r.ctrEnd-NOW)/864e5):null; }}
];
function decorate(rows){
  for(var i=0;i<rows.length;i++){ var r=rows[i];
    for(var j=0;j<DERIVED.length;j++){ r[DERIVED[j].k]=DERIVED[j].fn(r); } }
  return rows;
}

/* Measure catalogue the UI offers. A measure whose source column is absent is
   filtered out of every dropdown, so a manager is never offered an empty angle. */
var MEASURES = [
  {k:"prHkd",    label:"PR Amount (HKD)",   fmt:"hkd",  needs:["prHkd"]},
  {k:"poHkd",    label:"PO Amount (HKD)",   fmt:"hkd",  needs:["poHkd"]},
  {k:"revenue",  label:"Revenue (HKD)",     fmt:"hkd",  needs:["revenue"]},
  {k:"cost",     label:"Direct Cost (HKD)", fmt:"hkd",  needs:["cost"]},
  {k:"margin",   label:"Margin (HKD)",      fmt:"hkd",  needs:["revenue","cost"]},
  {k:"marginPct",label:"Margin %",          fmt:"pct",  needs:["revenue","cost"]},
  {k:"dTotal",   label:"PR → Invoice (days)",fmt:"days", needs:["prIssued","invDate"]},
  {k:"dPrPo",    label:"PR → PO (days)",    fmt:"days", needs:["prIssued","poDate"]},
  {k:"__count",  label:"Deal count",        fmt:"count",needs:[]}
];
var MEASURES_BY_KEY={}; MEASURES.forEach(function(m){MEASURES_BY_KEY[m.k]=m;});
DERIVED.forEach(function(d){ if(!MEASURES_BY_KEY[d.k]) MEASURES_BY_KEY[d.k]={k:d.k,label:d.label,fmt:d.fmt}; });
FIELDS.forEach(function(f){ if(f.type==="measure"&&!MEASURES_BY_KEY[f.k]) MEASURES_BY_KEY[f.k]={k:f.k,label:f.label,fmt:f.fmt}; });
function availMeasures(){ return MEASURES.filter(function(m){ return m.needs.every(has); }); }

var DIMS = ["brand","vendor","customer","endCustomer","sourceBook","btbType","chargeCcc",
            "procStatus","urgency","handledBy","buyer","ao","sbContact","iptMgr","acctCode"];
function availDims(){ return DIMS.filter(has); }
function dimLabel(k){ return (F[k]&&F[k].label)||k; }

/* ============================================================================
   5. FILTER MODEL
   "No filter" is the ABSENCE of the key — never an empty array, never "All".
   One representation means one code path, and a chip row that can't lie.
   ========================================================================== */
var STATE = {
  tab:"overview",
  filters:{},            // {dimKey:[v1,v2], __date:{field,from,to}, __flag:{cancelled:false}}
  dateField:"prIssued",
  from:null, to:null,
  pivot:{},              // per-card {groupBy, measure, agg, grain}
  tableView:false,
  showCancelled:false,
  hiddenSeries:{}
};
function applyFilters(rows, st){
  var dimKeys = Object.keys(st.filters);
  // Cancelled lines are out of the slice by DEFAULT, not filtered out later by
  // each widget. A cancelled PR left in a total is how a dashboard quietly
  // overstates the book, and "some charts exclude it, some don't" is worse
  // than either rule applied consistently.
  var df = st.dateField, from = st.from, to = st.to;
  return rows.filter(function(r){
    if(!st.showCancelled && r.cancelled) return false;
    for(var i=0;i<dimKeys.length;i++){
      var k=dimKeys[i], want=st.filters[k];
      if(!want||!want.length) continue;
      if(want.indexOf(r[k]==null?"(blank)":r[k])<0) return false;
    }
    if(from||to){ var d=r[df]; if(!d) return false;
      if(from&&d<from) return false; if(to&&d>to) return false; }
    return true;
  });
}
function toggleFilter(dim,val){
  var cur=STATE.filters[dim]||[], i=cur.indexOf(val);
  if(i<0) cur=cur.concat([val]); else cur=cur.slice(0,i).concat(cur.slice(i+1));
  if(cur.length) STATE.filters[dim]=cur; else delete STATE.filters[dim];
  render();
}
function clearFilters(){ STATE.filters={}; STATE.from=null; STATE.to=null; render(); }

/* ============================================================================
   6. AGGREGATE — the pivot engine. Everything "flexible" funnels through here.
   Pure; returns a stable, sorted, chart-ready shape.
   ========================================================================== */
function bucketDate(d,grain){
  if(!d) return null;
  var y=d.getFullYear(), m=d.getMonth();
  if(grain==="year")    return y+"";
  if(grain==="quarter") return y+" Q"+(Math.floor(m/3)+1);
  return y+"-"+String(m+1).padStart(2,"0");
}
function reduceVals(vals,agg){
  if(agg==="count")         return vals.length;
  var nn=vals.filter(function(v){return v!=null&&!isNaN(v);});
  if(!nn.length)            return null;
  if(agg==="sum")           return nn.reduce(function(a,b){return a+b;},0);
  if(agg==="avg")           return nn.reduce(function(a,b){return a+b;},0)/nn.length;
  if(agg==="median"){ var s=nn.slice().sort(function(a,b){return a-b;}); var h=s.length>>1;
                      return s.length%2?s[h]:(s[h-1]+s[h])/2; }
  if(agg==="min")           return Math.min.apply(null,nn);
  if(agg==="max")           return Math.max.apply(null,nn);
  return null;
}
/* opts: {groupBy, series, measure, agg, dateGrain, dateField, topN, sort} */
function aggregate(rows, o){
  o=o||{};
  var agg=o.agg||"sum", measure=o.measure||"__count";
  var byG={}, order=[], seriesSet={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i], g;
    if(o.dateGrain) g=bucketDate(r[o.dateField||STATE.dateField],o.dateGrain);
    else            g = r[o.groupBy]==null ? "(blank)" : r[o.groupBy];
    if(g==null) continue;
    var s = o.series ? (r[o.series]==null?"(blank)":r[o.series]) : "__all";
    seriesSet[s]=1;
    if(!byG[g]){ byG[g]={key:g, cells:{}, n:0}; order.push(g); }
    var cell = byG[g].cells[s] || (byG[g].cells[s]={vals:[],n:0});
    cell.vals.push(measure==="__count"?1:r[measure]);
    cell.n++; byG[g].n++;
  }
  var series=Object.keys(seriesSet);
  var out=order.map(function(g){
    var b=byG[g], row={key:g, n:b.n, values:{}, counts:{}};
    series.forEach(function(s){
      var c=b.cells[s];
      row.values[s]= c ? reduceVals(c.vals, measure==="__count"?"count":agg) : null;
      row.counts[s]= c ? c.n : 0;
    });
    row.total = series.reduce(function(a,s){ var v=row.values[s]; return a+(v==null?0:v); },0);
    return row;
  });
  if(o.dateGrain) out.sort(function(a,b){ return a.key<b.key?-1:a.key>b.key?1:0; });
  else if(o.sort!=="none") out.sort(function(a,b){ return (b.total||0)-(a.total||0); });
  if(o.topN && out.length>o.topN && !o.dateGrain){
    var head=out.slice(0,o.topN), tail=out.slice(o.topN);
    var other={key:"Other ("+tail.length+")", n:0, values:{}, counts:{}, isOther:true};
    series.forEach(function(s){
      var vals=tail.map(function(t){return t.values[s];});
      other.values[s]= (agg==="sum"||measure==="__count") ? reduceVals(vals,"sum") : reduceVals(vals,"avg");
      other.counts[s]= tail.reduce(function(a,t){return a+(t.counts[s]||0);},0);
    });
    other.n=tail.reduce(function(a,t){return a+t.n;},0);
    other.total=series.reduce(function(a,s){var v=other.values[s];return a+(v==null?0:v);},0);
    out=head.concat([other]);
  }
  return {rows:out, series:series, measure:measure, agg:agg};
}
</script>
<script>
/* ============================================================================
   CHART PRIMITIVES — hand-rolled inline SVG.
   Deliberately NOT a CDN chart library. Three reasons, in order of weight:
     1. Every mark rule below (2px surface gap between stacked segments, 4px
        rounded data-end only at the bar's free end, hairline horizontal-only
        grid, selective direct labels, one tooltip listing every series) is a
        fight against a chart library's defaults. Re-skinning is more work
        than drawing.
     2. Heatmap, funnel, waterfall and box-plot need plugins, and only
        cdnjs/jsdelivr are reachable from here — a plugin that isn't there
        fails silently inside an iframe.
     3. Zero network dependency: this page renders identically offline and
        inside the Model-Driven App frame, where a blocked CDN would leave
        empty cards with no error.
   ========================================================================== */
var SVGNS="http://www.w3.org/2000/svg";
function el(n,a){var e=document.createElementNS(SVGNS,n);if(a)for(var k in a)e.setAttribute(k,a[k]);return e;}
function SERIES(i){ return "var(--s"+((i%8)+1)+")"; }      // fixed order, never cycled past 8 — 9th folds to "Other"
function SEQ(i){ return "var(--q"+Math.min(5,Math.max(1,i+1))+")"; }
/* A label drawn on top of a filled mark must pick its ink from that fill's
   actual luminance, not from the mark's index. The sequential ramp inverts
   between light and dark themes, so an index rule puts light text on the light
   end in one theme and dark text on the dark end in the other — which is how
   two funnel labels came out invisible. */
var _probe=null;
function resolveColor(c){
  if(!_probe){ _probe=document.createElement("span"); _probe.style.display="none"; document.body.appendChild(_probe); }
  _probe.style.color=""; _probe.style.color=c;
  var v=getComputedStyle(_probe).color, m=/rgba?\(([^)]+)\)/.exec(v);
  return m?m[1].split(",").slice(0,3).map(function(x){return parseFloat(x);}):[128,128,128];
}
function inkOn(fill){
  var rgb=resolveColor(fill);
  var lin=rgb.map(function(v){ v/=255; return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
  var L=0.2126*lin[0]+0.7152*lin[1]+0.0722*lin[2];
  return L>0.42 ? "#1F1C17" : "#FAF7F2";
}
function txtEl(x,y,s,cls,anchor){var t=el("text",{x:x,y:y,"text-anchor":anchor||"middle"});if(cls)t.setAttribute("class",cls);t.textContent=s;return t;}

/* ---- tooltip: ONE instance, textContent only (labels are untrusted data) ---- */
var TIP=document.getElementById("tip");
function tipShow(ev,head,rows,foot){
  TIP.textContent="";
  var h=document.createElement("div");h.className="tt-h";h.textContent=head;TIP.appendChild(h);
  rows.forEach(function(r){
    var d=document.createElement("div");d.className="tt-r";
    if(r.color){var k=document.createElement("span");k.className="tt-k";k.style.background=r.color;d.appendChild(k);}
    var n=document.createElement("span");n.className="tt-n";n.textContent=r.name;d.appendChild(n);
    var v=document.createElement("span");v.className="tt-v";v.textContent=r.value;d.appendChild(v);
    TIP.appendChild(d);
  });
  if(foot){var f=document.createElement("div");f.className="tt-f";f.textContent=foot;TIP.appendChild(f);}
  TIP.classList.add("on");
  var w=TIP.offsetWidth,ht=TIP.offsetHeight;
  var x=ev.clientX+14, y=ev.clientY-10;
  if(x+w>innerWidth-8) x=ev.clientX-w-14;
  if(y+ht>innerHeight-8) y=innerHeight-ht-8;
  if(y<8) y=8;
  TIP.style.left=x+"px"; TIP.style.top=y+"px";
}
function tipHide(){ TIP.classList.remove("on"); }
document.addEventListener("scroll",tipHide,true);

/* Every tooltip obeys one rule (UX spec §6): dimension value, the measure
   formatted WITH its unit, and the record count behind it. A bare number with
   no label and no count is never shown. */
function bindTip(node,head,rows,foot,onClick){
  node.addEventListener("pointermove",function(e){ tipShow(e,head,rows,foot); });
  node.addEventListener("pointerleave",tipHide);
  node.addEventListener("focus",function(e){
    var r=node.getBoundingClientRect();
    tipShow({clientX:r.left+r.width/2,clientY:r.top},head,rows,foot);
  });
  node.addEventListener("blur",tipHide);
  if(onClick){
    node.setAttribute("tabindex","0"); node.style.cursor="pointer";
    node.addEventListener("click",function(){tipHide();onClick();});
    node.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();tipHide();onClick();} });
  }
}


/* Which state a mark is in with respect to the CURRENT filter on its own
   dimension. A chart that does not represent a dimension passes no `dim` and
   every mark stays neutral - the emphasis only appears where it means
   something. */
function selClass(dim,key){
  if(!dim) return "";
  var f=STATE.filters[dim];
  if(!f||!f.length) return "";
  return f.indexOf(key)>=0 ? " picked" : " faded";
}

/* ---- scales / ticks ---- */
function niceTicks(min,max,n){
  if(!isFinite(min)||!isFinite(max)) return [0,1];
  if(min===max){ if(min===0) return [0,1]; min=Math.min(0,min); max=Math.max(0,max); }
  var span=max-min||1, raw=span/(n||5), mag=Math.pow(10,Math.floor(Math.log10(raw)));
  var norm=raw/mag, step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  // A step of 0 (or a non-finite one) turns the loop below into an infinite
  // one that freezes the whole renderer, not just this chart. It happens when
  // the span underflows — two values that differ only in the last few bits.
  if(!isFinite(step)||step<=0){ console.warn("[dashboard] degenerate tick step",{min:min,max:max,step:step}); return [min,max]; }
  var lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, out=[];
  for(var v=lo;v<=hi+step/2 && out.length<200;v+=step) out.push(+v.toFixed(10));
  return out;
}
function axisFmt(v,fmtKey){
  var f=FMT[fmtKey];
  if(fmtKey==="hkd"||fmtKey==="usd") return f(v);
  if(fmtKey==="pct") return v.toFixed(0)+"%";
  return nf(v, Math.abs(v)<10&&v%1!==0?1:0);
}

/* ---- shared frame: returns {svg,g,W,H,iw,ih,pad} ---- */
function frame(host,h,pad){
  host.textContent="";
  var W=Math.max(260,host.clientWidth||host.parentNode.clientWidth||600), H=h;
  var p=Object.assign({t:14,r:16,b:30,l:54},pad||{});
  var svg=el("svg",{class:"plot",viewBox:"0 0 "+W+" "+H,width:"100%",height:H,role:"img"});
  host.appendChild(svg);
  return {svg:svg,W:W,H:H,p:p,iw:W-p.l-p.r,ih:H-p.t-p.b};
}
function yAxis(f,ticks,fmtKey,y){
  ticks.forEach(function(t){
    var yy=y(t);
    f.svg.appendChild(el("line",{class:t===0?"zero-line":"grid-line",x1:f.p.l,x2:f.p.l+f.iw,y1:yy,y2:yy}));
    f.svg.appendChild(txtEl(f.p.l-8,yy+3.5,axisFmt(t,fmtKey),null,"end"));
  });
}

/* Rounded only at the data end (4px), square at the baseline. */
function barPath(x,y,w,h,r,dir){
  r=Math.min(r,w/2,h);
  if(h<=0.6) return "M"+x+","+y+"h"+w;
  if(dir==="up")   return "M"+x+","+(y+h)+"V"+(y+r)+"a"+r+","+r+" 0 0 1 "+r+",-"+r+"h"+(w-2*r)+"a"+r+","+r+" 0 0 1 "+r+","+r+"V"+(y+h)+"Z";
  if(dir==="down") return "M"+x+","+y+"V"+(y+h-r)+"a"+r+","+r+" 0 0 0 "+r+","+r+"h"+(w-2*r)+"a"+r+","+r+" 0 0 0 "+r+",-"+r+"V"+y+"Z";
  if(dir==="right")return "M"+x+","+y+"H"+(x+w-r)+"a"+r+","+r+" 0 0 1 "+r+","+r+"v"+(h-2*r)+"a"+r+","+r+" 0 0 1 -"+r+","+r+"H"+x+"Z";
  return "M"+(x+w)+","+y+"H"+(x+r)+"a"+r+","+r+" 0 0 0 -"+r+","+r+"v"+(h-2*r)+"a"+r+","+r+" 0 0 0 "+r+","+r+"H"+(x+w)+"Z";
}

/* ---- legend (always present for >=2 series) ---- */
function legend(host,items,shape,onToggle){
  var w=document.createElement("div"); w.className="legend";
  items.forEach(function(it){
    var b=document.createElement("button");
    b.type="button";
    b.setAttribute("aria-pressed", it.on===false?"false":"true");
    var s=document.createElement("span"); s.className="sw"+(shape==="line"?" line":""); s.style.background=it.color;
    b.appendChild(s);
    var t=document.createElement("span"); t.textContent=it.name; b.appendChild(t);
    if(onToggle) b.addEventListener("click",function(){ onToggle(it.name); });
    else b.style.cursor="default";
    w.appendChild(b);
  });
  host.appendChild(w);
}

/* ============================================================================
   BAR — vertical. mode: "stack" | "group" | "single"
   ========================================================================== */
function chartBar(host,data,opt){
  opt=opt||{};
  var rows=data.rows, series=data.series, fmtKey=opt.fmt||"int";
  if(!rows.length){ host.innerHTML='<p class="empty">No rows in this slice.</p>'; return; }
  var stack=opt.mode!=="group"&&series.length>1;
  var tops=rows.map(function(r){
    if(series.length===1) return r.values[series[0]]||0;
    return stack ? series.reduce(function(a,s){return a+(r.values[s]||0);},0)
                 : Math.max.apply(null,series.map(function(s){return r.values[s]||0;}));
  });
  var bots=rows.map(function(r){ return Math.min(0, series.reduce(function(a,s){var v=r.values[s]||0;return Math.min(a,v);},0)); });
  var ticks=niceTicks(Math.min(0,Math.min.apply(null,bots)),Math.max.apply(null,tops),5);
  var f=frame(host,opt.h||230,{b:opt.rotate?58:30});
  var y0=ticks[0], y1=ticks[ticks.length-1];
  var y=function(v){ return f.p.t+f.ih-(v-y0)/(y1-y0||1)*f.ih; };
  yAxis(f,ticks,fmtKey,y);
  var bw=f.iw/rows.length, GAP=2;                       // 2px surface gap, not a stroke
  var inner=Math.min(opt.maxBar||46, bw-8);
  rows.forEach(function(r,i){
    var cx=f.p.l+bw*i+bw/2;
    if(stack||series.length===1){
      var acc=0;
      series.forEach(function(s,si){
        var v=r.values[s]; if(v==null||v===0) return;
        var yTop=y(acc+v), yBot=y(acc), h=Math.abs(yBot-yTop)-(si?GAP:0);
        if(h<0.6) h=0.6;
        var isTop = si===series.length-1;
        var col = opt.colorBySign ? (v<0?"var(--neg)":"var(--pos)") : (opt.color||SERIES(si));
        var pth=el("path",{class:"mark"+selClass(opt.dim,r.key),d:barPath(cx-inner/2,Math.min(yTop,yBot),inner,h,isTop?4:0,"up"),fill:col});
        f.svg.appendChild(pth);
        bindTip(pth, String(r.key),
          series.map(function(ss,sj){ return {color:opt.colorBySign?null:(opt.color||SERIES(sj)), name:ss==="__all"?(opt.measureLabel||"Value"):ss,
            value:FMT[fmtKey](r.values[ss])}; }),
          r.n+" PR line"+(r.n===1?"":"s"),
          opt.onPick&&function(){opt.onPick(r.key);});
        acc+=v;
      });
    } else {
      var sw=(inner-GAP*(series.length-1))/series.length;
      series.forEach(function(s,si){
        var v=r.values[s]; if(v==null) return;
        var yy=y(v), zy=y(0), h=Math.abs(zy-yy); if(h<0.6)h=0.6;
        var x=cx-inner/2+si*(sw+GAP);
        var pth=el("path",{class:"mark"+selClass(opt.dim,r.key),d:barPath(x,Math.min(yy,zy),sw,h,4,v<0?"down":"up"),fill:SERIES(si)});
        f.svg.appendChild(pth);
        bindTip(pth,String(r.key),
          series.map(function(ss,sj){return {color:SERIES(sj),name:ss,value:FMT[fmtKey](r.values[ss])};}),
          r.n+" PR line"+(r.n===1?"":"s"), opt.onPick&&function(){opt.onPick(r.key);});
      });
    }
    // x label: every bar when they fit, otherwise every Nth
    var step=Math.ceil(rows.length/Math.floor(f.iw/54));
    if(i%step===0){
      var lbl=String(r.key), short=lbl.length>14&&!opt.rotate?lbl.slice(0,13)+"…":lbl;
      if(opt.rotate){
        var t=txtEl(0,0,short,null,"end");
        t.setAttribute("transform","translate("+cx+","+(f.p.t+f.ih+12)+") rotate(-38)");
        f.svg.appendChild(t);
      } else f.svg.appendChild(txtEl(cx,f.p.t+f.ih+15,short));
    }
  });
  f.svg.appendChild(el("line",{class:"axis-line",x1:f.p.l,x2:f.p.l+f.iw,y1:y(Math.max(y0,Math.min(0,y1))),y2:y(Math.max(y0,Math.min(0,y1)))}));
  if(series.length>1&&series[0]!=="__all")
    legend(host,series.map(function(s,i){return {name:s,color:SERIES(i)};}),"rect");
}

/* ============================================================================
   BAR — horizontal ranked. The management question is "who is best / worst",
   so this form appears often on purpose: it carries ranking semantics a plain
   column chart does not.
   ========================================================================== */
function chartBarH(host,data,opt){
  opt=opt||{};
  var rows=data.rows.slice(0,opt.topN||12), fmtKey=opt.fmt||"int", s0=data.series[0];
  if(!rows.length){ host.innerHTML='<p class="empty">No rows in this slice.</p>'; return; }
  var vals=rows.map(function(r){return r.values[s0]||0;});
  var lo=Math.min(0,Math.min.apply(null,vals)), hi=Math.max.apply(null,vals);
  var rowH=opt.rowH||26, f=frame(host,rows.length*rowH+30,{l:opt.labW||144,b:22,t:6,r:58});
  var x=function(v){ return f.p.l+(v-lo)/((hi-lo)||1)*f.iw; }, zx=x(0);
  f.svg.appendChild(el("line",{class:"zero-line",x1:zx,x2:zx,y1:f.p.t,y2:f.p.t+rows.length*rowH}));
  rows.forEach(function(r,i){
    var v=r.values[s0]||0, yy=f.p.t+i*rowH+3, h=rowH-8;
    var xv=x(v), bx=Math.min(zx,xv), bw=Math.abs(xv-zx);
    var col = opt.colorBySign ? (v<0?"var(--neg)":"var(--pos)") : (opt.color||SERIES(0));
    var sc=selClass(opt.dim,r.key);
    var pth=el("path",{class:"mark"+sc,d:barPath(bx,yy,Math.max(bw,1.2),h,4,v<0?"left":"right"),fill:col});
    f.svg.appendChild(pth);
    var lbl=String(r.key), short=lbl.length>20?lbl.slice(0,19)+"…":lbl;
    f.svg.appendChild(txtEl(f.p.l-8,yy+h/2+3.5,short,null,"end"));
    // direct-label the value at the bar end — the reader never needs the tooltip
    var vt=txtEl(v<0?bx-5:bx+bw+5, yy+h/2+3.5, FMT[fmtKey](v), "val-label", v<0?"end":"start");
    if(sc===" faded") vt.style.opacity=".35";
    f.svg.appendChild(vt);
    var hit=el("rect",{class:"hit",x:f.p.l-f.p.l,y:yy-3,width:f.W,height:rowH});
    f.svg.appendChild(hit);
    bindTip(hit,String(r.key),
      [{color:col,name:opt.measureLabel||"Value",value:FMT[fmtKey](v)}],
      r.n+" PR line"+(r.n===1?"":"s"), opt.onPick&&function(){opt.onPick(r.key);});
  });
}

/* ============================================================================
   LINE / AREA — multi-series with a snapping crosshair.
   NEVER dual-axis: two measures of different scale get two charts or an
   index-to-100. That is the single most common way a dashboard invents a
   correlation that isn't in the data.
   ========================================================================== */
function chartLine(host,data,opt){
  opt=opt||{};
  var rows=data.rows, series=data.series.filter(function(s){return !STATE.hiddenSeries[s];});
  var fmtKey=opt.fmt||"int";
  if(rows.length<2){ host.innerHTML='<p class="empty">Not enough periods to draw a trend (need 3+).</p>'; return; }
  var all=[]; rows.forEach(function(r){series.forEach(function(s){var v=r.values[s];if(v!=null)all.push(opt.area?0:v);});});
  var tops=rows.map(function(r){ return opt.area? series.reduce(function(a,s){return a+(r.values[s]||0);},0)
                                                : Math.max.apply(null,series.map(function(s){return r.values[s]==null?-Infinity:r.values[s];})); });
  var bots=rows.map(function(r){ return opt.area?0:Math.min.apply(null,series.map(function(s){return r.values[s]==null?Infinity:r.values[s];})); });
  var mx=Math.max.apply(null,tops.filter(isFinite)), mn=Math.min.apply(null,bots.filter(isFinite));
  var ticks=niceTicks(Math.min(0,mn),mx,5);
  var f=frame(host,opt.h||250,{b:32});
  var y0=ticks[0],y1=ticks[ticks.length-1];
  var y=function(v){return f.p.t+f.ih-(v-y0)/(y1-y0||1)*f.ih;};
  var x=function(i){return f.p.l+(rows.length===1?f.iw/2:i/(rows.length-1)*f.iw);};
  yAxis(f,ticks,fmtKey,y);
  if(opt.area){
    var acc=rows.map(function(){return 0;});
    series.forEach(function(s,si){
      var up=[],dn=[];
      rows.forEach(function(r,i){ var v=r.values[s]||0; dn.push([x(i),y(acc[i])]); acc[i]+=v; up.push([x(i),y(acc[i])]); });
      var d="M"+up.map(function(p){return p[0]+","+p[1];}).join("L")+"L"+dn.reverse().map(function(p){return p[0]+","+p[1];}).join("L")+"Z";
      f.svg.appendChild(el("path",{class:"mark",d:d,fill:SERIES(si),"fill-opacity":.82,stroke:"var(--bg-surface)","stroke-width":2}));
    });
  } else {
    series.forEach(function(s,si){
      var pts=[],partial=null;
      rows.forEach(function(r,i){ var v=r.values[s]; if(v!=null) pts.push([x(i),y(v),i]); });
      if(pts.length<2) return;
      // the current period is incomplete — draw it dashed so nobody reads a
      // half-finished month as a collapse
      if(opt.partialLast&&pts.length>1) partial=pts.slice(-2);
      var solid=opt.partialLast?pts.slice(0,-1):pts;
      if(solid.length>1)
        f.svg.appendChild(el("path",{class:"mark",d:"M"+solid.map(function(p){return p[0]+","+p[1];}).join("L"),
          fill:"none",stroke:SERIES(si),"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
      if(partial)
        f.svg.appendChild(el("path",{class:"mark",d:"M"+partial.map(function(p){return p[0]+","+p[1];}).join("L"),
          fill:"none",stroke:SERIES(si),"stroke-width":2,"stroke-dasharray":"4 3","stroke-linecap":"round"}));
      pts.forEach(function(p,pi){
        if(pts.length<=14||pi===pts.length-1)
          f.svg.appendChild(el("circle",{class:"mark",cx:p[0],cy:p[1],r:pi===pts.length-1?3.6:2.6,
            fill:SERIES(si),stroke:"var(--bg-surface)","stroke-width":2}));
      });
    });
  }
  // crosshair band per period: the reader aims at a date, never at a 2px line
  var cw=f.iw/rows.length;
  rows.forEach(function(r,i){
    var hit=el("rect",{class:"hit",x:f.p.l+(x(i)-f.p.l)-cw/2,y:f.p.t,width:cw,height:f.ih});
    f.svg.appendChild(hit);
    var line=el("line",{x1:x(i),x2:x(i),y1:f.p.t,y2:f.p.t+f.ih,stroke:"var(--ink-muted)","stroke-width":1,opacity:0});
    f.svg.appendChild(line);
    hit.addEventListener("pointerenter",function(){line.setAttribute("opacity",".55");});
    hit.addEventListener("pointerleave",function(){line.setAttribute("opacity","0");});
    bindTip(hit, String(r.key)+(opt.partialLast&&i===rows.length-1?"  (partial)":""),
      series.map(function(s,si){return {color:SERIES(si),name:s==="__all"?(opt.measureLabel||"Value"):s,value:FMT[fmtKey](r.values[s])};}),
      r.n+" PR line"+(r.n===1?"":"s"), opt.onPick&&function(){opt.onPick(r.key);});
    var step=Math.ceil(rows.length/Math.floor(f.iw/62));
    if(i%step===0||i===rows.length-1) f.svg.appendChild(txtEl(x(i),f.p.t+f.ih+16,String(r.key)));
  });
  if(series.length>1&&series[0]!=="__all")
    legend(host,data.series.map(function(s,i){return {name:s,color:SERIES(i),on:!STATE.hiddenSeries[s]};}),
      opt.area?"rect":"line",function(name){ STATE.hiddenSeries[name]=!STATE.hiddenSeries[name]; render(); });
}

/* ============================================================================
   SCATTER — every pair of marks can be neighbours, so it uses the 3-slot
   subset that clears the ALL-PAIRS CVD gate, not all 8.
   ========================================================================== */
function chartScatter(host,pts,opt){
  opt=opt||{};
  if(!pts.length){ host.innerHTML='<p class="empty">No rows in this slice.</p>'; return; }
  var xs=pts.map(function(p){return p.x;}), ys=pts.map(function(p){return p.y;});
  var xt=niceTicks(0,Math.max.apply(null,xs),4), yt=niceTicks(0,Math.max.apply(null,ys),5);
  var f=frame(host,opt.h||280,{b:40,l:58});
  var x0=xt[0],x1=xt[xt.length-1],y0=yt[0],y1=yt[yt.length-1];
  var X=function(v){return f.p.l+(v-x0)/((x1-x0)||1)*f.iw;}, Y=function(v){return f.p.t+f.ih-(v-y0)/((y1-y0)||1)*f.ih;};
  yAxis(f,yt,opt.fmtY||"hkd",Y);
  xt.forEach(function(t){ f.svg.appendChild(txtEl(X(t),f.p.t+f.ih+16,axisFmt(t,opt.fmtX||"hkd"))); });
  // break-even diagonal: below it the deal lost money
  var lim=Math.min(x1,y1);
  f.svg.appendChild(el("line",{x1:X(0),y1:Y(0),x2:X(lim),y2:Y(lim),stroke:"var(--ink-muted)","stroke-width":1,"stroke-dasharray":"5 4"}));
  f.svg.appendChild(txtEl(X(lim)-4,Y(lim)-7,"break-even","val-label","end"));
  var cats=[]; pts.forEach(function(p){ if(cats.indexOf(p.cat)<0) cats.push(p.cat); });
  pts.forEach(function(p){
    var ci=cats.indexOf(p.cat), col=SERIES(Math.min(ci,2));   // slots 1-3 only: all-pairs safe
    var c=el("circle",{class:"mark",cx:X(p.x),cy:Y(p.y),r:4.6,fill:col,"fill-opacity":.8,stroke:"var(--bg-surface)","stroke-width":2});
    f.svg.appendChild(c);
    var hit=el("circle",{class:"hit",cx:X(p.x),cy:Y(p.y),r:12});  // 24px hit target
    f.svg.appendChild(hit);
    bindTip(hit,p.label,[
      {color:col,name:opt.labY||"Revenue",value:FMT[opt.fmtY||"hkd"](p.y)},
      {color:null,name:opt.labX||"Cost",value:FMT[opt.fmtX||"hkd"](p.x)},
      {color:null,name:"Margin",value:fmtPct((p.y-p.x)/(p.y||1)*100)}
    ],p.cat);
  });
  f.svg.appendChild(txtEl(f.p.l+f.iw/2,f.H-4,opt.labX||"Direct cost (HKD)"));
  if(cats.length>1) legend(host,cats.slice(0,3).map(function(c,i){return {name:c,color:SERIES(i)};}),"rect");
}

/* ============================================================================
   HEATMAP — magnitude, so ONE hue light->dark (never a rainbow), plus a
   scale legend and a table-view twin because colour alone is not a value.
   ========================================================================== */
function chartHeat(host,matrix,opt){
  opt=opt||{};
  var rowsK=matrix.rowKeys, colsK=matrix.colKeys;
  if(!rowsK.length||!colsK.length){ host.innerHTML='<p class="empty">No rows in this slice.</p>'; return; }
  var mx=0; rowsK.forEach(function(r){colsK.forEach(function(c){var v=matrix.get(r,c);if(v!=null&&v>mx)mx=v;});});
  var cellH=24, labW=opt.labW||128;
  var f=frame(host,rowsK.length*cellH+46,{l:labW,t:24,b:8,r:10});
  var cw=f.iw/colsK.length;
  colsK.forEach(function(c,ci){
    var s=String(c), sh=s.length>11?s.slice(0,10)+"…":s;
    f.svg.appendChild(txtEl(f.p.l+cw*ci+cw/2,f.p.t-8,sh));
  });
  rowsK.forEach(function(rk,ri){
    var s=String(rk), sh=s.length>18?s.slice(0,17)+"…":s;
    f.svg.appendChild(txtEl(f.p.l-8,f.p.t+cellH*ri+cellH/2+3.5,sh,null,"end"));
    colsK.forEach(function(ck,ci){
      var v=matrix.get(rk,ck);
      var step = v==null?null:Math.min(4,Math.floor((v/(mx||1))*4.999));
      var rect=el("rect",{class:"mark",x:f.p.l+cw*ci+1,y:f.p.t+cellH*ri+1,width:Math.max(1,cw-2),height:cellH-2,rx:2,
        fill: v==null?"var(--bg-inset)":SEQ(step)});
      f.svg.appendChild(rect);
      bindTip(rect,String(rk)+" x "+String(ck),
        [{color:v==null?"var(--bg-inset)":SEQ(step),name:opt.measureLabel||"Value",value:v==null?"no data":FMT[opt.fmt||"int"](v)}],
        (matrix.count(rk,ck)||0)+" PR lines");
    });
  });
  // scale legend
  var sl=document.createElement("div"); sl.className="legend";
  var lab=document.createElement("span"); lab.textContent="Low"; sl.appendChild(lab);
  for(var i=0;i<5;i++){ var sw=document.createElement("span"); sw.className="sw"; sw.style.background=SEQ(i); sl.appendChild(sw); }
  var lab2=document.createElement("span"); lab2.textContent="High · "+FMT[opt.fmt||"int"](mx); sl.appendChild(lab2);
  host.appendChild(sl);
}

/* ============================================================================
   FUNNEL — stages are ORDINAL (order carries meaning), so one hue stepped
   light->dark, never eight categorical hues.
   ========================================================================== */
function chartFunnel(host,stages,opt){
  opt=opt||{};
  if(!stages.length){ host.innerHTML='<p class="empty">No rows in this slice.</p>'; return; }
  var mx=Math.max.apply(null,stages.map(function(s){return s.n;}))||1;
  var rowH=38, f=frame(host,stages.length*rowH+12,{l:4,r:4,t:6,b:6});
  stages.forEach(function(s,i){
    var w=Math.max(3,(s.n/mx)*f.iw), y=f.p.t+i*rowH, x=f.p.l+(f.iw-w)/2;
    var pth=el("path",{class:"mark"+selClass(opt.dim,s.name),d:barPath(x,y,w,rowH-6,4,"right"),fill:SEQ(Math.min(4,i))});
    f.svg.appendChild(pth);
    var fill=SEQ(Math.min(4,i));
    var t=txtEl(f.p.l+f.iw/2,y+(rowH-6)/2+4,s.name+"  ·  "+nf(s.n),"val-label");
    t.style.fill=inkOn(fill);          // inline: .val-label's CSS fill would otherwise win
    t.style.fontWeight="650";
    f.svg.appendChild(t);
    var conv = i===0?100:(s.n/(stages[0].n||1)*100);
    var drop = i===0?null:(stages[i-1].n?(1-s.n/stages[i-1].n)*100:null);
    var trows=[{color:SEQ(Math.min(4,i)),name:"Reached this stage",value:nf(s.n)},
               {color:null,name:"Share of stage 1",value:fmtPct(conv)}];
    if(s.here!=null) trows.push({color:null,name:"Sitting here now",value:nf(s.here)});
    bindTip(pth,s.name,trows,
      drop==null?"First stage":("Drop-off from previous stage: "+fmtPct(drop)),
      opt.onPick&&function(){opt.onPick(s.name);});
  });
}

/* ============================================================================
   WATERFALL — contribution to a change; status colours because the series
   genuinely MEANS up/down, not "series 4".
   ========================================================================== */
function chartWaterfall(host,items,opt){
  opt=opt||{};
  if(!items.length){ host.innerHTML='<p class="empty">Not enough history for a bridge.</p>'; return; }
  var run=0, pts=items.map(function(it){
    if(it.total){ return {name:it.name,from:0,to:it.value,total:true,value:it.value}; }
    var from=run; run+=it.value; return {name:it.name,from:from,to:run,value:it.value};
  });
  var lo=Math.min(0,Math.min.apply(null,pts.map(function(p){return Math.min(p.from,p.to);})));
  var hi=Math.max.apply(null,pts.map(function(p){return Math.max(p.from,p.to);}));
  var ticks=niceTicks(lo,hi,5);
  var f=frame(host,opt.h||240,{b:48});
  var y0=ticks[0],y1=ticks[ticks.length-1];
  var y=function(v){return f.p.t+f.ih-(v-y0)/((y1-y0)||1)*f.ih;};
  yAxis(f,ticks,opt.fmt||"hkd",y);
  var bw=f.iw/pts.length, inner=Math.min(48,bw-12);
  pts.forEach(function(p,i){
    var cx=f.p.l+bw*i+bw/2, a=y(p.from), b=y(p.to), h=Math.max(1.2,Math.abs(b-a));
    var col=p.total?"var(--neutral)":(p.value<0?"var(--neg)":"var(--pos)");
    var pth=el("path",{class:"mark",d:barPath(cx-inner/2,Math.min(a,b),inner,h,4,p.value<0?"down":"up"),fill:col});
    f.svg.appendChild(pth);
    if(i<pts.length-1) f.svg.appendChild(el("line",{x1:cx+inner/2,x2:cx+bw-inner/2,y1:b,y2:b,stroke:"var(--rule-strong)","stroke-width":1}));
    var t=txtEl(0,0,p.name,null,"end"); t.setAttribute("transform","translate("+cx+","+(f.p.t+f.ih+12)+") rotate(-30)");
    f.svg.appendChild(t);
    bindTip(pth,p.name,[
      {color:col,name:p.total?"Level":"Contribution",value:(p.value>0&&!p.total?"+":"")+FMT[opt.fmt||"hkd"](p.value)},
      {color:null,name:"Running total",value:FMT[opt.fmt||"hkd"](p.to)}
    ], p.total?"Opening / closing level":(p.value<0?"Pulled margin down":"Pushed margin up"));
  });
}

/* ============================================================================
   DISTRIBUTION — a real box plot (min / Q1 / median / Q3 / max).
   The PM ruled "three bars instead" because a chart library has no box; that
   constraint disappears when the marks are drawn by hand, and three bars
   cannot show a spread.
   ========================================================================== */
function chartBox(host,groups,opt){
  opt=opt||{};
  groups=groups.filter(function(g){return g.vals.length>=3;});
  if(!groups.length){ host.innerHTML='<p class="empty">Need at least 3 values per group to show a spread.</p>'; return; }
  function q(a,p){ var s=a.slice().sort(function(x,y){return x-y;}), i=(s.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
                   return lo===hi?s[lo]:s[lo]+(s[hi]-s[lo])*(i-lo); }
  var stats=groups.map(function(g){ var v=g.vals;
    return {name:g.name,n:v.length,min:Math.min.apply(null,v),q1:q(v,.25),med:q(v,.5),q3:q(v,.75),max:Math.max.apply(null,v)}; });
  var lo=Math.min.apply(null,stats.map(function(s){return s.min;})), hi=Math.max.apply(null,stats.map(function(s){return s.max;}));
  var ticks=niceTicks(lo,hi,5);
  var f=frame(host,opt.h||250,{b:46});
  var y0=ticks[0],y1=ticks[ticks.length-1];
  var y=function(v){return f.p.t+f.ih-(v-y0)/((y1-y0)||1)*f.ih;};
  yAxis(f,ticks,opt.fmt||"pct",y);
  var bw=f.iw/stats.length, inner=Math.min(40,bw-18);
  stats.forEach(function(s,i){
    var cx=f.p.l+bw*i+bw/2;
    f.svg.appendChild(el("line",{class:"mark",x1:cx,x2:cx,y1:y(s.min),y2:y(s.max),stroke:"var(--ink-muted)","stroke-width":1}));
    f.svg.appendChild(el("line",{class:"mark",x1:cx-7,x2:cx+7,y1:y(s.min),y2:y(s.min),stroke:"var(--ink-muted)","stroke-width":1}));
    f.svg.appendChild(el("line",{class:"mark",x1:cx-7,x2:cx+7,y1:y(s.max),y2:y(s.max),stroke:"var(--ink-muted)","stroke-width":1}));
    var box=el("rect",{class:"mark"+selClass(opt.dim,s.name),x:cx-inner/2,y:y(s.q3),width:inner,height:Math.max(2,y(s.q1)-y(s.q3)),rx:3,
      fill:SERIES(0),"fill-opacity":.28,stroke:SERIES(0),"stroke-width":1.5});
    f.svg.appendChild(box);
    f.svg.appendChild(el("line",{class:"mark",x1:cx-inner/2,x2:cx+inner/2,y1:y(s.med),y2:y(s.med),stroke:SERIES(0),"stroke-width":2.5}));
    var t=txtEl(0,0,s.name,null,"end"); t.setAttribute("transform","translate("+cx+","+(f.p.t+f.ih+12)+") rotate(-30)");
    f.svg.appendChild(t);
    var hit=el("rect",{class:"hit",x:cx-bw/2,y:f.p.t,width:bw,height:f.ih}); f.svg.appendChild(hit);
    var F=FMT[opt.fmt||"pct"];
    bindTip(hit,s.name,[
      {color:SERIES(0),name:"Median",value:F(s.med)},
      {color:null,name:"Q1 – Q3",value:F(s.q1)+" – "+F(s.q3)},
      {color:null,name:"Min – Max",value:F(s.min)+" – "+F(s.max)}
    ], s.n+" PR lines", opt.onPick&&function(){opt.onPick(s.name);});
  });
}

/* ============================================================================
   DONUT — part-to-whole at a glance only, hard-capped at 4 slices + Other.
   Past that it is a bar chart, every time.
   ========================================================================== */
function chartDonut(host,data,opt){
  opt=opt||{};
  var rows=data.rows.slice(0,5), s0=data.series[0];
  if(!rows.length){ host.innerHTML='<p class="empty">No rows in this slice.</p>'; return; }
  var tot=rows.reduce(function(a,r){return a+(r.values[s0]||0);},0)||1;
  var size=Math.min(host.clientWidth||220,200), R=size/2-6, r0=R*.58, cx=size/2, cy=size/2;
  host.textContent="";
  var svg=el("svg",{class:"plot",viewBox:"0 0 "+size+" "+size,width:size,height:size});
  host.appendChild(svg);
  var a0=-Math.PI/2;
  rows.forEach(function(r,i){
    var v=r.values[s0]||0, a1=a0+v/tot*Math.PI*2, gap=0.012;
    var sa=a0+gap/2, ea=Math.max(sa,a1-gap/2), big=(ea-sa)>Math.PI?1:0;
    var d="M"+(cx+R*Math.cos(sa))+","+(cy+R*Math.sin(sa))+
          "A"+R+","+R+" 0 "+big+" 1 "+(cx+R*Math.cos(ea))+","+(cy+R*Math.sin(ea))+
          "L"+(cx+r0*Math.cos(ea))+","+(cy+r0*Math.sin(ea))+
          "A"+r0+","+r0+" 0 "+big+" 0 "+(cx+r0*Math.cos(sa))+","+(cy+r0*Math.sin(sa))+"Z";
    var p=el("path",{class:"mark"+selClass(opt.dim,r.key),d:d,fill:SERIES(i)});
    svg.appendChild(p);
    bindTip(p,String(r.key),[
      {color:SERIES(i),name:opt.measureLabel||"Value",value:FMT[opt.fmt||"int"](v)},
      {color:null,name:"Share",value:fmtPct(v/tot*100)}
    ], r.n+" PR lines", opt.onPick&&function(){opt.onPick(r.key);});
    a0=a1;
  });
  var c=txtEl(cx,cy-1,FMT[opt.fmt||"int"](tot),"val-label"); c.setAttribute("font-size","14"); c.setAttribute("font-weight","650");
  c.setAttribute("fill","var(--ink-primary)"); svg.appendChild(c);
  svg.appendChild(txtEl(cx,cy+14,"total"));
  legend(host,rows.map(function(r,i){return {name:String(r.key),color:SERIES(i)};}),"rect");
}

/* ---- sparkline for KPI tiles ---- */
function sparkline(vals,w,h){
  if(!vals||vals.length<2) return null;
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), sp=(mx-mn)||1;
  var svg=el("svg",{width:w,height:h,viewBox:"0 0 "+w+" "+h,class:"plot","aria-hidden":"true"});
  var d=vals.map(function(v,i){ return (i/(vals.length-1)*w).toFixed(1)+","+((1-(v-mn)/sp)*(h-4)+2).toFixed(1); }).join("L");
  svg.appendChild(el("path",{d:"M"+d,fill:"none",stroke:"var(--accent)","stroke-width":1.6,"stroke-linejoin":"round","stroke-linecap":"round"}));
  var last=(1-(vals[vals.length-1]-mn)/sp)*(h-4)+2;
  svg.appendChild(el("circle",{cx:w,cy:last,r:2.2,fill:"var(--accent)"}));
  return svg;
}

/* A chart cannot measure a card that is not in the document yet — clientWidth
   is 0 and parentNode is null on a detached node, which is how every plot came
   back empty the first time. Rather than reorder every tab builder, the
   measuring renderers queue themselves and render() flushes the queue once the
   view is attached. */
var PENDING=[];
function flushDraws(){
  var q=PENDING; PENDING=[];
  q.forEach(function(f){ try{ f(); }catch(e){ console.warn("[dashboard] chart draw failed:",e); } });
}
function deferred(fn){
  return function(host){
    var args=arguments;
    if(host && host.nodeType===1 && !host.isConnected){ PENDING.push(function(){ fn.apply(null,args); }); return; }
    return fn.apply(null,args);
  };
}
chartBar=deferred(chartBar); chartBarH=deferred(chartBarH); chartLine=deferred(chartLine);
chartScatter=deferred(chartScatter); chartHeat=deferred(chartHeat); chartFunnel=deferred(chartFunnel);
chartWaterfall=deferred(chartWaterfall); chartBox=deferred(chartBox); chartDonut=deferred(chartDonut);

/* ---- table with inline bars (also the table-view twin of every chart) ---- */
function tableWithBars(host,data,opt){
  opt=opt||{};
  var rows=data.rows.slice(0,opt.topN||40), series=data.series, fmtKey=opt.fmt||"int";
  var multi=series.length>1, s0=series[0];
  var mx=Math.max.apply(null,rows.map(function(r){return Math.abs(r.values[s0]||0);}))||1;
  var wrap=document.createElement("div"); wrap.className="tbl-wrap";
  var t=document.createElement("table"); t.className="dt";
  var th=document.createElement("thead"), tr=document.createElement("tr");
  var head=[opt.dimLabel||"Group"];
  if(!multi) head.push("");
  head=head.concat(multi?series:[opt.measureLabel||"Value"]).concat(["PR lines"]);
  head.forEach(function(h,i){
    var c=document.createElement("th"); c.textContent=h;
    if(i>=(multi?1:2)) c.className="n";
    tr.appendChild(c); });
  th.appendChild(tr); t.appendChild(th);
  var tb=document.createElement("tbody");
  rows.forEach(function(r){
    var row=document.createElement("tr");
    var c1=document.createElement("td"); c1.textContent=String(r.key); row.appendChild(c1);
    if(!multi){
      var c2=document.createElement("td"); c2.style.width="28%";
      var bar=document.createElement("span"); bar.className="inbar";
      var fill=document.createElement("i");
      fill.style.width=Math.max(2,Math.abs(r.values[s0]||0)/mx*100)+"%";
      fill.style.background=(r.values[s0]||0)<0?"var(--neg)":(opt.color||"var(--s1)");
      bar.appendChild(fill); c2.appendChild(bar); row.appendChild(c2);
    }
    series.forEach(function(sk){
      var c=document.createElement("td"); c.className="n";
      c.textContent=FMT[fmtKey](r.values[sk]); row.appendChild(c); });
    var c4=document.createElement("td"); c4.className="n"; c4.textContent=nf(r.n); row.appendChild(c4);
    if(opt.onPick){ row.style.cursor="pointer"; row.title="Filter by "+String(r.key);
      row.addEventListener("click",function(){opt.onPick(r.key);}); }
    tb.appendChild(row);
  });
  t.appendChild(tb); wrap.appendChild(t); host.appendChild(wrap);
}

/* ============================================================================
   DATAVERSE — degrade, never throw. One probe decides whether the planned
   columns exist; a 400 on the optional set must not take the whole page down.
   ========================================================================== */
var ROWS=[], LOAD_NOTE="";
function dvSelect(withOptional){
  return FIELDS.filter(function(f){ return withOptional||!f.optional; })
               .map(function(f){ return f.l; }).join(",");
}
function loadData(done){
  var api = (typeof parent!=="undefined" && parent.Xrm && parent.Xrm.WebApi) ? parent.Xrm.WebApi : null;
  if(!api){
    console.warn("[dashboard] parent.Xrm.WebApi not available — running on seeded demo data. "+
                 "This is the standalone/dev path, not an error.");
    FIELDS.forEach(function(f){ PRESENT[f.k]=true; });   // demo data carries every planned column
    ROWS=decorate(makeDemoRows(1400));
    LOAD_NOTE="demo"; return done();
  }
  var opt=FIELDS.filter(function(f){return f.optional;}).map(function(f){return f.l;});
  // Probe ONCE for the whole optional set. Dataverse's 400 body does not name
  // the offending column reliably, so per-column bisection costs many round
  // trips to learn nothing; fail the set closed and say so on screen.
  api.retrieveMultipleRecords("admin_btb_lis_excel_data","?$select="+opt.join(",")+"&$top=1")
    .then(function(){ FIELDS.forEach(function(f){PRESENT[f.k]=true;}); return fetchAll(api,true); })
    .catch(function(e){
      console.warn("[dashboard] planned columns not present yet; loading confirmed columns only.",e&&e.message);
      FIELDS.forEach(function(f){ PRESENT[f.k]=!f.optional; });
      return fetchAll(api,false);
    })
    .then(function(rows){ ROWS=decorate(rows); LOAD_NOTE="live"; done(); })
    .catch(function(e){
      console.warn("[dashboard] Dataverse read failed entirely; falling back to demo data.",e&&e.message);
      FIELDS.forEach(function(f){ PRESENT[f.k]=true; });
      ROWS=decorate(makeDemoRows(1400)); LOAD_NOTE="demo-fallback"; done();
    });
}
function fetchAll(api,withOpt){
  // Sequential paging, never Promise.all — Dataverse throttles, and a burst
  // costs more wall-clock than it saves.
  var acc=[];
  function page(q){

      res.entities.forEach(function(e){ acc.push(normalizeRow(e)); });

/* ============================================================================
   KPIs — every one excludes cancelled rows. A cancelled PR still sits in the
   table; counting it in a total is how a dashboard quietly overstates the book.
   ========================================================================== */
// The slice handed in here has already had cancelled lines removed by
// applyFilters unless the reviewer explicitly switched them on, so this is a
// belt-and-braces guard for any caller that bypasses the filter path.
function live(rows){ return STATE.showCancelled ? rows : rows.filter(function(r){ return !r.cancelled; }); }
function sum(rows,k){ var t=null; rows.forEach(function(r){ if(r[k]!=null){ t=(t||0)+r[k]; } }); return t; }
function median(rows,k){ var v=rows.map(function(r){return r[k];}).filter(function(x){return x!=null;}).sort(function(a,b){return a-b;});
  if(!v.length) return null; var h=v.length>>1; return v.length%2?v[h]:(v[h-1]+v[h])/2; }

function periodSlice(rows,field,monthsBack,span){
  var end=new Date(NOW.getFullYear(),NOW.getMonth()-monthsBack,1);
  var start=new Date(end.getFullYear(),end.getMonth()-span,1);
  return rows.filter(function(r){ var d=r[field]; return d&&d>=start&&d<end; });
}
function deltaEl(cur,prev,invert,fmt){
  var w=document.createElement("span");
  if(cur==null||prev==null||!prev){ w.className="delta flat"; w.textContent="— no basis"; return w; }
  var pct=(cur-prev)/Math.abs(prev)*100;
  var good = invert ? pct<0 : pct>0;
  var flat = Math.abs(pct)<0.5;
  w.className="delta "+(flat?"flat":good?"up":"down");
  // glyph always present: colour is never the only signal
  w.textContent=(flat?"→ ":(pct>0?"▲ ":"▼ "))+Math.abs(pct).toFixed(1)+"% vs prior quarter";
  return w;
}
function kpiTile(o){
  var d=document.createElement("div"); d.className="kpi";

  var v=document.createElement("div"); v.className="val t-kpi"; v.textContent=o.value; d.appendChild(v);
  var f=document.createElement("div"); f.className="foot";
  if(o.delta) f.appendChild(o.delta);
  if(o.note){ var s=document.createElement("span"); s.textContent=o.note; f.appendChild(s); }
  d.appendChild(f);
  if(o.spark){ var sp=sparkline(o.spark,120,26); if(sp){ sp.style.marginTop="8px"; d.appendChild(sp); } }
  return d;
}

/* Every chart gets a table-view twin. The toggle is global so a reviewer who
