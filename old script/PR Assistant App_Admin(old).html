/* ---------- Upload & Parse page ---------- */

/* ---------- Dropping a mail straight out of Outlook ----------
   A mail dragged out of Outlook is not a file on disk -- it lives in the
   .ost/.pst or on Exchange, and Outlook offers it as a *virtual* file
   (CFSTR_FILEDESCRIPTORW). `dataTransfer.files` is therefore EMPTY for it,
   which is why dropping a mail here used to do nothing at all, silently.
   Chrome 76+ and Edge do carry the mail, but only through
   `DataTransferItem.webkitGetAsEntry()`, whose `.file()` materialises the .msg
   bytes the engine can already parse.

   Order matters: `files` first, so an ordinary drop from Explorer takes the
   exact path it always did and this cannot regress it; entries only when
   `files` came back empty.

   Everything that touches the DataTransfer here MUST run synchronously. The
   object is neutered the moment the drop handler yields, so one `await` before
   this loop loses the drop entirely -- hence the split return: the synchronous
   half reads the DataTransfer, the promise half resolves later.

   Twin of the same three functions in Docparse/index.html. The two apps share
   docparse-engine.js but nothing else, and Docparse takes no new required
   files, so a fix here has to be made there too. */
function collectDroppedFiles(dataTransfer) {
  const direct = dataTransfer.files ? Array.from(dataTransfer.files) : [];
  if (direct.length) return { files: Promise.resolve(direct), emptyMessage: "" };

  const items = dataTransfer.items ? Array.from(dataTransfer.items) : [];
  const entries = [];
  for (const item of items) {
    if (item.kind !== "file") continue;
    const entry = typeof item.webkitGetAsEntry === "function" ? item.webkitGetAsEntry() : null;
    // Directories are skipped rather than walked: dropping a folder was never
    // supported here and this change is not the place to start.
    if (entry && entry.isFile) entries.push(entry);
  }

  // One message, not two. This used to branch on whether the drag also carried
  // text/html or text/plain, and put the Outlook guidance only on the branch
  // that did -- on the assumption that a mail always brings its body along.
  // A real drag out of the new Outlook proved that wrong: it took the other
  // branch, and the user got a dead end that told them nothing. The useful
  // thing to say does not depend on what else was on the clipboard.
  return {
    files: Promise.all(entries.map(readEntryAsFile)).then(list => list.filter(Boolean)),
    emptyMessage:
      "That drop carried no file. Classic Outlook hands a mail to Chrome and " +
      "Edge; the new Outlook for Windows does not pass mails to a browser at " +
      "all. Drag the mail onto your desktop, or open it and use More actions → " +
      "Save as — new Outlook saves .eml, classic saves .msg — then drop that " +
      "file here. Both are read the same way.",
  };
}

function readEntryAsFile(entry) {
  return new Promise(resolve => {
    // Callback-style on purpose: FileSystemFileEntry.file() has no promise form,
    // and one rejected entry must not sink its siblings in Promise.all.
    entry.file(file => resolve(nameForParsing(file, entry.name)), () => resolve(null));
  });
}

// Everything the engine has a parser for, and the same list the file picker
// above accepts.
const DROP_PARSABLE_EXTS = ["pdf", "png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp",
  "xlsx", "xls", "csv", "msg", "eml", "mht", "mhtml"];

// The engine routes on file extension alone. Outlook usually hands over
// "<subject>.msg", but an item with no extension would be turned away as
// unsupported when it is in fact a mail we can read.
//
// Tested against the real list rather than against anything extension-shaped,
// because an Outlook item is named after its subject: "Quote for site A.1"
// ends in something that looks like an extension, and guessing would send the
// engine a ".1" it has no parser for instead of the mail it can read.
function nameForParsing(file, entryName) {
  const name = (file && file.name) || entryName || "Outlook mail";
  const ext = String(name.split(".").pop() || "").toLowerCase();
  const named = DROP_PARSABLE_EXTS.indexOf(ext) !== -1 ? name : name + ".msg";
  if (file && named === file.name) return file;
  // Renaming needs a new File. Where the constructor is unavailable (the node
  // test harness), the original is still better than nothing.
  if (typeof File !== "function") return file;
  return new File([file], named, { type: (file && file.type) || "application/vnd.ms-outlook" });
}

/* ---------- Handing the role-assigned documents to n8n ----------
   The Send button on this page posts whatever the Role Slot Bar currently
   holds -- the same slots goProcess picks its OCR targets from -- so what n8n
   receives is what a reviewer has already agreed each document IS, not a guess
   off a filename. Nothing here reads or writes a form field; this is a read of
   the role slots and a POST, and that is the whole of it.

   The URL can move (tunnel/CDN endpoint changes), so it lives here as one
   constant to edit rather than buried at the call site. */
const N8N_WEBHOOK_URL = "https://d1llt8wozqg8ml.cloudfront.net/webhook/f87bd4e8-3715-43f7-8f80-76d5d13389cf";
// How long waitForN8nCrossCheck polls Dataverse for Agreement/Quotation
// before giving up and showing the Verify Table with a timeout notice.
const N8N_POLL_INTERVAL_MS = 5000;
const N8N_POLL_TIMEOUT_MS = 180000;

// The role slots resolved down to actual file bytes, ready for a FormData.
//
// `census.assigned[role].doc` is a *source* -- a reference (typeKey + docIndex)
// carrying the document's metadata but never its blob -- so every slot has to go
// back through docAt to reach the file itself. `docIndex < 0` is the tab's own
// dropped file, which selfDocFor describes; where the engine handed back no
// `self`, `entry.fileObj` is the file the user picked and is the same bytes.
//
// One entry per ROLE, not per file. A document handed two role slots by hand (a
// signed quotation that is also the agreement) is posted under both field names,
// with the same bytes twice -- because the field name IS how the flow reads the
// role, and a single `agreement` part with a `roles: ["agreement","quotation"]`
// note beside it asks every downstream node to re-derive what the reviewer
// already said. `roles` is still carried on each entry, so a flow that would
// rather see the sharing than the repetition can.
//
// A slot whose document has no blob goes to `skipped` rather than being dropped:
// "three of four sent" is a fact the reviewer has to be told, and a silently
// short upload looks exactly like a complete one.
function roleDocumentsForSend(attachments, census) {
  const files = [];
  const skipped = [];
  // Which OTHER roles each document also fills, so every entry can name the
  // whole set rather than only its own role.
  const rolesByKey = {};
  DOC_ROLES.forEach(role => {
    const slot = census && census.assigned && census.assigned[role.key];
    if (!slot || !slot.doc) return;
    const k = docKeyOf(slot.doc);
    (rolesByKey[k] = rolesByKey[k] || []).push(role.key);
  });
  DOC_ROLES.forEach(role => {
    const slot = census && census.assigned && census.assigned[role.key];
    if (!slot || !slot.doc) return;
    const key = docKeyOf(slot.doc);
    const entry = attachments && attachments[slot.doc.typeKey];
    const doc = docAt(attachments, slot.doc);
    const blob = (doc && doc.blob) || (slot.doc.docIndex < 0 && entry ? entry.fileObj : null) || null;
    const fileName = sourceBaseName(slot.doc) || (doc && doc.fileName) || role.key;
    if (!blob) { skipped.push({ roleKey: role.key, label: role.label, fileName }); return; }
    files.push({ roleKey: role.key, label: role.label, fileName, blob,
      typeKey: slot.doc.typeKey, docIndex: slot.doc.docIndex,
      roles: (rolesByKey[key] || [role.key]).slice() });
  });
  // Extra Quotation documents (see extraQuotationDocs) posted under the same
  // "quotation" field name as the primary slot -- FormData allows repeated
  // field names, and it is the "meta" JSON's files list, not the field name,
  // that actually tells n8n the entries apart. This is the one place the
  // "one entry per ROLE" rule above does not hold, on purpose: Quotation is
  // the one role that can carry more than a reviewer's single pick.
  extraQuotationDocs(census).forEach((d, i) => {
    const entry = attachments && attachments[d.typeKey];
    const doc = docAt(attachments, d);
    const blob = (doc && doc.blob) || (d.docIndex < 0 && entry ? entry.fileObj : null) || null;
    const fileName = sourceBaseName(d) || (doc && doc.fileName) || "quotation";
    const label = "Quotation (extra " + (i + 1) + ")";
    if (!blob) { skipped.push({ roleKey: "quotation", label, fileName }); return; }
    files.push({ roleKey: "quotation", label, fileName, blob,
      typeKey: d.typeKey, docIndex: d.docIndex, roles: ["quotation"] });
  });
  return { files, skipped };
}

function isWorkbookDocument(doc, source) {
  const fileName = doc && doc.fileName || source && source.fileName || "";
  return !!(doc && (doc.previewKind === "sheet" || /\.(xlsx?|xlsm|csv)$/i.test(fileName)));
}

// The Cost worksheet is the authority for values that vary by ATQ item. The
// workbook may be the assigned ATQ document, the legacy Excel entry, or an ATQ
// workbook classified under another upload tab, so resolve those shapes here.
function atqCostRecordsForItem(attachments, census) {
  const assignedAtq = census && census.assigned && census.assigned.atq && census.assigned.atq.doc;
  const assignedDoc = assignedAtq ? docAt(attachments, assignedAtq) : null;
  if (isWorkbookDocument(assignedDoc, assignedAtq) && Array.isArray(assignedDoc.records) && assignedDoc.records.length) {
    return assignedDoc.records;
  }

  const preferredEntries = [attachments && attachments.Excel, attachments && attachments.ATQ];
  for (const entry of preferredEntries) {
    if (entry && Array.isArray(entry.records) && entry.records.length) return entry.records;
  }

  const workbookDocs = [];
  ATTACHMENT_TYPES.forEach(typeKey => {
    const entry = attachments && attachments[typeKey];
    (entry && entry.docs || []).forEach(doc => {
      if (isWorkbookDocument(doc) && Array.isArray(doc.records) && doc.records.length) {
        workbookDocs.push(doc);
      }
    });
  });
  return workbookDocs.length ? workbookDocs[0].records : [];
}

function atqCostRecordForItem(attachments, census, itemIndex, anchorByItem) {
  const records = atqCostRecordsForItem(attachments, census);
  if (!records.length) return null;
  if (anchorByItem === false) {
    const selectedIndex = Math.min(Math.max(Math.floor(itemIndex) || 0, 0), records.length - 1);
    return records[selectedIndex];
  }
  return anchoredRecordOf(records, attachments, itemIndex);
}

function atqCostFieldForItem(attachments, census, itemIndex, key) {
  const record = atqCostRecordForItem(attachments, census, itemIndex);
  if (!record) return "";
  const fields = mapDetectedFields(record.fields, null);
  return fields[key] || "";
}

// The four scalar values sent beside the role-assigned files. UID comes from
// uidFromEmail, the one reader the Extracted Fields table also uses -- two
// copies of "where does the UID come from" drifting apart is exactly how the
// preview ends up showing a different UID from the one that was sent. The item
// number is deliberately read from the selected Excel Cost-sheet record. The
// selected Item tab supplies the row index; no ATQ PDF or other attachment may
// re-anchor that selection to a different row order. The optional census lets
// this resolve a workbook stored inside the role-assigned document list.
function n8nMetadataForSend(fields, attachments, itemIndex, census) {
  const valueOf = key => {
    const value = fields && fields[key] && fields[key].value;
    return value == null ? "" : String(value).trim();
  };
  const uid = uidFromEmail(attachments, fields);

  const costRecord = atqCostRecordForItem(attachments, census, itemIndex, false);
  return {
    uid,
    atqRefNo: valueOf("atqRefNo"),
    customerName: valueOf("customerName"),
    itemNo: costRecord ? (itemNoOf(costRecord) || "") : "",
  };
}

function UploadPage({ attachments, setAttachments, activeTab, setActiveTab, fields, setField, setFieldAuto, applyMatches, applyUid, detectFromRoles, goProcess, goVerify, onN8nSent, demoMode, adminMode, toggleDemo, openViewer, viewer, closeViewer, crosschecks, dismissedDiffs, toggleDismissDiff, itemIndex, setItemIndex, selectItem, resetRecordData, itemSelectionLocked, lockItemSelection, atqExcelRecordId, atqExcelAlreadyWritten, markAtqExcelWritten, lisStartUid, lisStartAlreadyWritten, markLisStartWritten, census, autoCensus, roleOverrides, setRoleOverrides, emailSubject, onUploadComplete }) {
  const parsedCount = Object.values(attachments).filter(a => a.parsed).length;
  const [parsingTab, setParsingTab] = useState(null);
  const [statusMsg, setStatusMsg] = useState("");
  // Set alongside statusMsg when the engine reports a numeric progress
  // (currently only email-attachment parsing does) — null falls back to the
  // indeterminate look, a number renders a determinate bar.
  const [statusPct, setStatusPct] = useState(null);
  const [uploadError, setUploadError] = useState("");
  // Adding a document to an already-uploaded tab is a separate action from
  // handleUpload above: handleUpload replaces the whole tab (confirm + wipe),
  // this appends one more document to entry.docs without touching anything
  // already there. Still parsed eagerly (no deferOcr) because it is always
  // exactly one file, which sidesteps having to teach resumeDeferredOcr about
  // manually-added documents -- but the OCR itself now runs in the background
  // (see handleAddDocument) instead of disabling this button for however long
  // a scanned file takes.
  const addDocInputRef = React.useRef(null);
  const addDocSeqRef = React.useRef(0);
  const [addDocError, setAddDocError] = useState("");
  // Per in-flight add: {fileName, status}, keyed by a pendingId stamped on the
  // placeholder doc handleAddDocument inserts immediately. More than one can
  // be in flight at once since adding no longer blocks on the previous one.
  const [pendingDocStatuses, setPendingDocStatuses] = useState({});
  const [dragOver, setDragOver] = useState(false);
  // "Send to n8n" (see roleDocumentsForSend). Kept apart from everything else on
  // this page on purpose: the button reads the role slots and posts, and no path
  // out of it can reach a form field or the parse state.
  const [n8nState, setN8nState] = useState("idle");
  const [n8nError, setN8nError] = useState("");
  const [copied, setCopied] = useState(false);
  const [viewerExpanded, setViewerExpanded] = useState(false);
  const [hideFieldsPane, setHideFieldsPane] = useState(false);
  const [salesContactKey, setSalesContactKey] = useState("");
  const [btbRemarkText, setBtbRemarkText] = useState("");
  const [btbCopied, setBtbCopied] = useState(false);
  const [supplierOption, setSupplierOption] = useState("");
  const [supplierRemarkText, setSupplierRemarkText] = useState("");
  const [supplierCopied, setSupplierCopied] = useState(false);
  const fileInputRef = React.useRef(null);
  // The inline viewer sits below the fold, so opening a document from higher up
  // the page has to bring it into view or the click looks inert. Keyed off
  // `viewer` and not the resolved target below: the default target changes with
  // the active tab, and scrolling the page down because someone picked a tab
  // they have not scrolled to yet is the opposite of helpful.
  const viewerRef = React.useRef(null);
  const viewerKey = viewer ? viewer.typeKey + ":" + viewer.docIndex : "";
  useEffect(() => {
    if (!viewerKey || !viewerRef.current) return;
    viewerRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
  }, [viewerKey]);
  // What the panel at the foot of the page shows. An explicit open wins;
  // otherwise it falls back to the active tab's first real document, so the
  // panel is useful before anything has been clicked. Inline images are skipped
  // for the same reason the document list hides them behind a toggle: a signature
  // graphic is not what someone means by "the attachment".
  const defaultDoc = ((attachments[activeTab] || {}).docs || []).find(d => !d.inline);
  const documentPaneExpanded = viewerExpanded || !!viewer;
  // Only meaningful while the viewer pane is expanded -- if the viewer closes
  // through some path other than the Collapse button (e.g. switching tabs),
  // this must not leave the fields pane permanently hidden with no toggle left
  // to bring it back.
  const fieldsPaneHidden = hideFieldsPane && documentPaneExpanded;
  const viewerTarget = viewer
    || (viewerExpanded && defaultDoc ? { typeKey: activeTab, docIndex: defaultDoc.index } : null);
  // itemIndex / setItemIndex arrive as props. They say which purchased item
  // (Cost-sheet row) of the active tab's ATQ workbook is currently populating
  // the form -- an ATQ email can cover several items (e.g. "Item 2 & 3"), so
  // the user switches between them via the Item tabs below instead of always
  // seeing only the first one. App owns the value because computeFieldDiffs and
  // VerifyPage have to agree with these tabs about which item is the live one;
  // everything this page does with it is unchanged.

  const handleUpload = async (file) => {
    if (!file) return;
    // Dropping a file onto a tab that already has one means "this is a
    // different case now" -- confirm, then wipe the whole record (every tab,
    // every field) before the new file's own extraction repopulates it.
    // A first-time upload into an empty tab is not a replacement, so it
    // skips this and just fills in as before.
    let didReset = false;
    if (attachments[activeTab].parsed) {
      const proceed = window.confirm(
        `Uploading a new ${activeTab} file will clear all current data and start a new record. Continue?`
      );
      if (!proceed) return;
      resetRecordData();
      setSalesContactKey("");
      setBtbRemarkText("");
      setSupplierOption("");
      setSupplierRemarkText("");
      didReset = true;
    }
    setUploadError("");
    setParsingTab(activeTab);
    setStatusMsg("Reading " + file.name + "…");
    setStatusPct(null);
    try {
      const result = await DocparseEngine.parseFile(file, (msg, pct) => {
        setStatusMsg(msg);
        setStatusPct(typeof pct === "number" ? pct : null);
      }, { deferOcr: true, retainForResume: true, markContext: true, markCrop: true });
      // ATQ workbooks (filename starting "ATQ", .xlsx) come back with an empty
      // top-level `fields` -- the per-item data lives in `records[].fields`
      // instead (one record per Cost-sheet row, i.e. one purchased item).
      // Keep every record so the Item tabs below can switch between them;
      // the form starts out populated from the first one.
      const isAtqRecord = !!(result.records && result.records.length);
      const records = isAtqRecord ? result.records : null;
      const rawFields = isAtqRecord ? records[0].fields : result.fields;
      setAttachments(prev => ({
        ...prev,
        // docs/self/pages are the viewer's source material: `docs` is the
        // engine's per-attachment view (renamed because this state's own
        // `attachments` already means the 5 PR types), `self` describes the
        // file the user picked, `pages` is the render tree docs join back into.
        // `previewHtml` is only ever set for a top-level .mht; it is the
        // engine's own string held by reference, never re-serialised here.
        // `signing` is the engine's reading of the dropped file's own ink. Only
        // meaningful when the drop is a single document rather than a container
        // -- an email's ink lives on its attachments, each of which carries its
        // own. Kept because a signed quotation is filed as the agreement, and
        // because without it the viewer's Signed/Chopped pill had nothing to
        // read for a file dropped on its own.
        // `phase`/`pendingDocs` are the light-pass upload's bookkeeping: which
        // pages/documents this tab still owes a real OCR read, and `raw` is the
        // engine's own result object, kept so a later Process step can hand it
        // straight to resumeDeferredOcr without reconstructing it.
        [activeTab]: { parsed: true, file: file.name, fileObj: file, text: result.plainText, rawFields, records, isAtqRecord, error: null,
          docs: result.attachments || [], self: result.self || null, pages: result.pages || [],
          signing: result.signing || null, previewHtml: result.previewHtml || null,
          phase: "light", pendingDocs: result.pendingDocs || [], ocrError: null, raw: result },
      }));
      // The email names its own item, and procurement sends one email per item,
      // so the tab that opens is that one rather than always the first.
      // Unresolvable -> 0, which is what this line used to be unconditionally.
      setItemIndex(itemIndexForSubject(records, parseEmailSubject(subjectLineOf(result.plainText))));
      applyMatches(rawFields, isAtqRecord, didReset);
      applyUid(result.plainText, didReset);
      if (onUploadComplete) onUploadComplete();
    } catch (err) {
      console.error(err);
      setUploadError(err.message || "Could not parse this file.");
      setAttachments(prev => ({
        ...prev,
        [activeTab]: { ...prev[activeTab], parsed: false, error: err.message },
      }));
    } finally {
      setParsingTab(null);
      setStatusMsg("");
      setStatusPct(null);
    }
  };

  // Appends one more document to the active tab's document list without
  // touching anything already parsed there -- e.g. a vendor sends an updated
  // quotation after the email was already uploaded, and it needs to join the
  // cross-check as its own document rather than replacing the whole tab.
  // `manual: true` marks it so goProcess (which otherwise rebuilds `docs`/
  // `pages` from a fresh engine read of the tab's original file) knows to
  // carry it across rather than silently dropping it.
  const handleAddDocument = async (file) => {
    if (!file) return;
    setAddDocError("");
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const pendingId = `pending-${++addDocSeqRef.current}`;
    // Insert a placeholder immediately (light, synchronous) so the document
    // shows up in the list right away and its `pagesIndex` slot is reserved --
    // the eager parseFile below still OCRs every scanned page, but it now runs
    // in the background instead of disabling this button for however long
    // that takes. A second document can be added while the first is still
    // parsing.
    let pagesIndex = -1;
    setAttachments(prev => {
      const entry = prev[activeTab];
      const docs = entry.docs || [];
      const pages = entry.pages || [];
      pagesIndex = pages.length;
      const placeholder = {
        pendingId,
        index: docs.length,
        fileName: file.name,
        ext,
        mimeType: file.type || "",
        size: file.size,
        blob: file,
        previewKind: previewKindForExt(ext),
        status: "parsing",
        note: "",
        hadOcr: false,
        truncated: false,
        signing: null,
        pageCount: 0,
        inline: false,
        fields: [],
        records: [],
        pagesIndex,
        children: [],
        previewHtml: "",
        ocrPending: true,
        resumable: false,
        manual: true,
      };
      return {
        ...prev,
        [activeTab]: { ...entry, docs: [...docs, placeholder], pages: [...pages, { pages: [] }] },
      };
    });
    setPendingDocStatuses(prev => ({ ...prev, [pendingId]: { fileName: file.name, status: "Reading document…" } }));
    try {
      // Bounded and reporting progress. This path has no `deferOcr`, so a
      // scanned PDF dropped here OCRs every page right now; with an unbounded
      // parseFile and a no-op status callback, a 22-page scan left no way to
      // tell it was still working at all.
      const result = await DocparseEngine.parseFile(file,
        msg => setPendingDocStatuses(prev => (prev[pendingId]
          ? { ...prev, [pendingId]: { fileName: file.name, status: msg || "" } } : prev)),
        { markContext: true, markCrop: true, ocrBudgetMs: DocparseEngine.OCR_BUDGET_MS });
      const isAtqRecord = !!(result.records && result.records.length);
      setAttachments(prev => {
        const entry = prev[activeTab];
        const docs = (entry.docs || []).map(d => d.pendingId !== pendingId ? d : {
          ...d,
          status: "parsed",
          hadOcr: !!result.hadOcr,
          signing: result.signing || null,
          pageCount: (result.pages || []).length,
          fields: isAtqRecord ? result.records[0].fields : (result.fields || []),
          records: isAtqRecord ? result.records : [],
          previewHtml: result.previewHtml || "",
          ocrPending: false,
        });
        const pages = (entry.pages || []).map((p, i) => i !== pagesIndex ? p : { pages: result.pages || [] });
        return { ...prev, [activeTab]: { ...entry, docs, pages } };
      });
    } catch (err) {
      console.error(err);
      setAddDocError(err.message || "Could not parse this file.");
      // Left in place rather than spliced out: removing it would shift every
      // later placeholder's `pagesIndex` out from under it. Marked as failed
      // instead, same as any other doc row.
      setAttachments(prev => {
        const entry = prev[activeTab];
        const docs = (entry.docs || []).map(d => d.pendingId !== pendingId ? d : {
          ...d, status: "error", note: err.message || "Could not parse this file.", ocrPending: false,
        });
        return { ...prev, [activeTab]: { ...entry, docs } };
      });
    } finally {
      setPendingDocStatuses(prev => {
        if (!(pendingId in prev)) return prev;
        const next = { ...prev };
        delete next[pendingId];
        return next;
      });
    }
  };

  // What the button would send if it were pressed right now -- recomputed each
  // render because the role slots move under it (a re-upload, an Edit-roles
  // save), and a stale count would grey out a button that has work to do.
  const n8nReady = roleDocumentsForSend(attachments, census);

  const sendToN8n = async () => {
    if (adminMode) {
      if (lockItemSelection) lockItemSelection();
      setN8nError("");
      // Admin mode skips n8n entirely, but the LIS stub still needs to exist
      // by the time Verify Table is reached -- same reasoning as the
      // non-admin branch below.
      const lisStartError = await writeLisStartRecord(fields, atqExcelRecordId, lisStartUid,
        lisStartAlreadyWritten, markLisStartWritten, parent && parent.Xrm && parent.Xrm.WebApi);
      setN8nState("sent");
      setTimeout(() => setN8nState("idle"), 1500);
      if (onN8nSent) onN8nSent();
      if (lisStartError) setN8nError(lisStartError);
      return;
    }
    const { files, skipped } = roleDocumentsForSend(attachments, census);
    if (!files.length) {
      setN8nError("No document is assigned to a role slot yet, so there is nothing to send.");
      return;
    }
    if (lockItemSelection) lockItemSelection();
    setN8nError("");
    setN8nState("sending");
    try {
      const form = new FormData();
      files.forEach(f => form.append(f.roleKey, f.blob, f.fileName));
      // One JSON field beside the binaries, so the flow can tell which file
      // stands for which role without re-deriving it from the filename -- which
      // is exactly the guess the role slots exist to replace.
      form.append("meta", JSON.stringify({
        activeTab,
        ...n8nMetadataForSend(fields, attachments, itemIndex, census),
        files: files.map(f => ({ role: f.roleKey, roles: f.roles, label: f.label,
          fileName: f.fileName, typeKey: f.typeKey, docIndex: f.docIndex })),
        skipped: skipped.map(s => ({ role: s.roleKey, fileName: s.fileName })),
      }));
      // No Content-Type header on purpose. The browser writes it with the
      // multipart boundary, AND multipart/form-data is CORS-safelisted, so the
      // request stays a simple one. Setting it by hand would both break the
      // boundary and add an OPTIONS preflight for the tunnel to answer.
      const res = await fetch(N8N_WEBHOOK_URL, { method: "POST", body: form });
      if (!res.ok) throw new Error("n8n replied " + res.status + " " + (res.statusText || ""));
      setN8nState("sent");
      setTimeout(() => setN8nState("idle"), 1500);
      // Send to n8n is what commits this item, so the BTB_ATQ_Excel4 row is
      // written right alongside it -- once per recordId (atqExcelAlreadyWritten),
      // so a resend after the pill fades back to idle does not duplicate the
      // row. A failure here does not undo the n8n send above: the send already
      // succeeded and there is nothing to roll back, so it is reported as its
      // own error rather than thrown into the catch below.
      const atqExcelError = await writeAtqExcelRecord(fields, atqExcelRecordId, atqExcelAlreadyWritten,
        markAtqExcelWritten, parent && parent.Xrm && parent.Xrm.WebApi);
      // The BTB_LIS_Excel_Datas4 stub (Record_ID, Handled By, IPT Unit Mgr, UID
      // only) so Verify Table's "Continue to save" has a row to find and
      // update rather than deciding whether to create one.
      const lisStartError = await writeLisStartRecord(fields, atqExcelRecordId, lisStartUid,
        lisStartAlreadyWritten, markLisStartWritten, parent && parent.Xrm && parent.Xrm.WebApi);
      if (onN8nSent) onN8nSent();
      if (atqExcelError || lisStartError) {
        setN8nError([atqExcelError, lisStartError].filter(Boolean).join(" "));
      } else if (skipped.length) {
        setN8nError("Sent " + files.length + " of " + (files.length + skipped.length) +
          " — " + skipped.map(s => s.label).join(", ") + " had no file to send.");
      }
    } catch (err) {
      console.error(err);
      setN8nState("idle");
      // A cross-origin block reaches JS as a bare TypeError with no status: the
      // browser will not say why, on purpose. Spell the likely cause out here or
      // the reviewer gets "Failed to fetch" and nothing to act on.
      setN8nError(err instanceof TypeError
        ? "Could not reach n8n. A cross-origin POST is blocked unless the n8n Webhook node returns an Access-Control-Allow-Origin header. (" + err.message + ")"
        : (err.message || "Could not send to n8n."));
    }
  };

  const reDetectFields = () => {
    const att = attachments[activeTab];
    if (!att || !att.rawFields) return;
    const flds = att.records ? att.records[Math.min(itemIndex, att.records.length - 1)].fields : att.rawFields;
    applyMatches(flds, att.isAtqRecord);
    applyUid(att.text);
  };

  // Page 1 is data entry, so the difference treatment here is deliberately the
  // lightest of the three: a small mark, no colour change to the box itself.
  // Clicking it opens the dissenting document, which is the thing the user
  // would otherwise have to go hunting for.
  const openWorkspaceViewer = (typeKey, docIndex) => {
    setViewerExpanded(true);
    openViewer(typeKey, docIndex);
  };

  const openDissenting = (cc) => {
    const s = crosscheckDissent(cc);
    if (s) openWorkspaceViewer(s.typeKey, s.docIndex);
  };

  // The role chips under each field: the same jump, but to the document the chip
  // names rather than to whichever one happened to dissent.
  const openSource = (s) => { if (s) openWorkspaceViewer(s.typeKey, s.docIndex); };
  // Which field currently has its comparison panel open. Single-open, so the
  // grid can only ever grow by one row and the page cannot silently double in
  // height as the reviewer works down it.
  const [compareKey, setCompareKey] = useState(null);
  const [editingRoles, setEditingRoles] = useState(false);

  const saveRoles = (draft) => {
    // Only the roles carrying a value are stored. Since RoleAssignmentEditor
    // prefills each select with the auto-detected document, that is normally
    // every role -- a Save from the editor pins all of them. A role with
    // nothing detected still saves as "" and keeps following the documents.
    const next = {};
    DOC_ROLES.forEach(r => { if (draft[r.key]) next[r.key] = draft[r.key]; });
    const extraQuotation = (draft.quotationExtra || []).filter(Boolean);
    if (extraQuotation.length) next.quotationExtra = extraQuotation;
    setRoleOverrides(next);
    setEditingRoles(false);
    detectFromRoles(next);
  };

  // Tab-separated so pasting into the destination sheet at Column A of the
  // target row lands every value in its matching column in one paste.
  const copyForExcel = async () => {
    const row = EXCEL_COLUMN_MAP.map(([, , key]) => (fields[key] && fields[key].value) || "").join("\t");
    await navigator.clipboard.writeText(row);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  // Suggests a BTB sales contact from the Handled By field, but only while the
  // dropdown is still untouched -- once the user has picked (or cleared) one
  // themselves, their choice wins and this stops overwriting it.
  useEffect(() => {
    if (salesContactKey) return;
    const match = findSalesContact(fields.handledBy.value);
    if (match) {
      setSalesContactKey(match.key);
      setBtbRemarkText(buildBtbRemark(match));
    }
  }, [fields.handledBy.value]);

  const selectSalesContact = (key) => {
    setSalesContactKey(key);
    const contact = BTB_SALES_CONTACTS.find(c => c.key === key);
    setBtbRemarkText(contact ? buildBtbRemark(contact) : "");
  };

  const copyBtbRemark = async () => {
    await navigator.clipboard.writeText(btbRemarkText);
    setBtbCopied(true);
    setTimeout(() => setBtbCopied(false), 1500);
  };

  const selectSupplierOption = (option) => {
    setSupplierOption(option);
    setSupplierRemarkText(buildToSupplierRemark(option, fields));
  };

  const copySupplierRemark = async () => {
    await navigator.clipboard.writeText(supplierRemarkText);
    setSupplierCopied(true);
    setTimeout(() => setSupplierCopied(false), 1500);
  };

  const renderField = (def, widthClass) =>
    renderFieldInput(def, { fields, crosschecks, dismissedDiffs, setField, onDissent: openDissenting,
      onSource: openSource, expandedKey: compareKey, onToggleExpand: setCompareKey,
      onDismiss: toggleDismissDiff }, widthClass);

  return (
    <React.Fragment>
      <TopBar title="Document Workbench" desc="Upload and Select the files to process"
        right={<React.Fragment>
          {/* Process is the admin-only path: it runs the deferred OCR here in
              the browser instead of handing the documents to n8n. A reviewer
              without admin has exactly one way forward (the Start button below
              the role selector), so the button is withheld rather than
              disabled -- a greyed Process with no explanation reads as
              "something is broken", not as "not yours". */}
          {adminMode && <PrimaryButton onClick={goProcess}>
            <span className="inline-flex items-center gap-2"><Icon name="play" className="w-4 h-4" />Process</span>
          </PrimaryButton>}
        </React.Fragment>} />

      <div className="flex flex-col gap-6 px-5 md:px-8 pb-8 items-stretch">
        <main className="order-1 w-full min-w-0 flex flex-col gap-5">
          <input ref={fileInputRef} type="file" className="hidden"
            accept=".pdf,.png,.jpg,.jpeg,.gif,.bmp,.tiff,.webp,.xlsx,.xls,.csv,.msg,.eml,.mht,.mhtml"
            onChange={e => { handleUpload(e.target.files[0]); e.target.value = ""; }} />
          {/* While handleUpload's light pass is running, the drop box itself
              is not rendered at all -- there is nothing to disable, only the
              scan loader below to show in its place. Reverts to the box the
              moment parsingTab clears (success or failure both do). */}
          {parsedCount === 0 && (parsingTab === activeTab ? (
            <div className="w-full min-h-[60vh] flex items-center justify-center px-5">
              <div style={{ transform: "scale(1.7)" }}>
                <DocumentScanLoader label={statusMsg} pct={statusPct} />
              </div>
            </div>
          ) : (
            <button type="button"
              aria-label={`Upload ${activeTab}`}
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              onDragOver={e => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={e => {
                e.preventDefault();
                setDragOver(false);
                // Synchronous read first (see collectDroppedFiles): the
                // DataTransfer does not survive the handler returning.
                const drop = collectDroppedFiles(e.dataTransfer);
                drop.files.then(files => {
                  if (files.length) { setUploadError(""); handleUpload(files[0]); return; }
                  setUploadError(drop.emptyMessage);
                });
              }}
              className={`w-full flex flex-col gap-4 py-14 px-6 items-center text-center bg-[#FFF8EA] border-2 rounded-2xl cursor-pointer hover:bg-[#FFF3D6] hover:text-[var(--ink)] hover:border-[var(--orange-dark)] ui-transition pressable-surface clickable-cue group
                ${dragOver ? "border-[var(--orange)] bg-[#FFF4DE]" : "border-[var(--orange)]"}`}>
              <div className="w-16 h-16 rounded-2xl bg-[#F4F0E8] border border-[#D8D3C9] text-[var(--orange-dark)] group-hover:bg-[var(--orange)] group-hover:text-[var(--ink)] flex items-center justify-center ui-transition">
                <Icon name="upload" className="w-8 h-8" />
              </div>
              <div className="text-[clamp(20px,2vw,28px)] leading-tight font-bold text-[var(--ink)] group-hover:text-[var(--ink)] ui-transition">
                {attachments[activeTab].parsed
                  ? `${activeTab} uploaded — click to re-upload`
                  : "Drop Email / Documents here"}
              </div>
              <div className="text-[16px] leading-6 text-[var(--muted)] group-hover:text-[var(--muted)] ui-transition" style={{fontFamily:"Newsreader, serif"}}>PDF · XLSX / XLS / CSV · PNG / JPG · MSG / EML · MHT</div>
              <div className="text-[16px] leading-6 text-[var(--muted)] group-hover:text-[var(--muted)] ui-transition" style={{fontFamily:"Newsreader, serif"}}>Classic Outlook: drag a mail straight in. New Outlook: save it as .eml first.</div>
            </button>
          ))}

          {uploadError && (
            <div className="w-full flex gap-2.5 p-4 bg-[#FDECEB] border-l-[3px] border-[#C0392B] rounded-lg">
              <div className="text-[15px] leading-[23px] text-[#C0392B]" style={{fontFamily:"Newsreader, serif"}}>{uploadError}</div>
            </div>
          )}

          {n8nError && (
            <div className="w-full flex gap-2.5 p-4 bg-[#FDECEB] border-l-[3px] border-[#C0392B] rounded-lg">
              <div className="text-[15px] leading-[23px] text-[#C0392B]" style={{fontFamily:"Newsreader, serif"}}>{n8nError}</div>
            </div>
          )}

          {parsedCount > 0 && <div ref={viewerRef} className="w-full min-w-0 scroll-mt-4">
            <PrpoExtractedFieldsCard attachments={attachments} fields={fields}
              addDocInputRef={addDocInputRef} pendingDocStatuses={pendingDocStatuses}

              closeViewer={closeViewer} viewerTarget={viewerTarget} activeTab={activeTab}
              defaultDoc={defaultDoc} openWorkspaceViewer={openWorkspaceViewer}
              crosschecks={crosschecks} dismissedDiffs={dismissedDiffs}

              n8nState={n8nState} sendToN8n={sendToN8n} n8nReady={n8nReady} adminMode={adminMode} />

        </main>

        <aside className="hidden order-2 w-full grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 items-start" aria-hidden="true">
          <AttachmentStatusCard attachments={attachments} onOpen={openViewer} />

          <Card className="w-full p-5 flex flex-col gap-3">
            <div className="text-[14px] font-bold tracking-[1px] text-[#3D3D3D]">RAW EXTRACTED TEXT</div>
            <div className="w-full h-[120px] px-3 py-2.5 bg-[#F3EBE2] border border-[#C5BEB6] rounded-md overflow-y-auto">
              <div className="text-[14px] leading-[22px] text-[#6B6B6B] whitespace-pre-wrap" style={{fontFamily:"Newsreader, serif"}}>
                {attachments[activeTab].text || "(no file parsed yet)"}
              </div>
            </div>
            <div className="flex gap-2 flex-wrap">
              <button onClick={reDetectFields} disabled={!attachments[activeTab].rawFields}
                className="w-fit px-3.5 py-2 rounded-full border-[1.5px] border-[#C5BEB6] bg-[#F3EBE2] text-[14px] font-semibold text-[#6B6B6B] hover:bg-[#e9ddd0] disabled:opacity-50 disabled:cursor-not-allowed">
                Re-detect fields
              </button>
            </div>
          </Card>

          <div className="w-full flex gap-2.5 p-4 bg-[#FDF6E0] border-l-[3px] border-[#B78312] rounded-lg">
            <div className="text-[15px] leading-[23px] text-[#3D3D3D]" style={{fontFamily:"Newsreader, serif"}}>
              Fields turn white once edited. Green = auto-extracted — always verify before proceeding.
            </div>
          </div>
        </aside>
      </div>
    </React.Fragment>
  );
}

/* ---------- Verify page ---------- */

// One Automatic Checks row per family of comparable fields. These rows used to
// count files and echo the form back at the user ("customerOk = parsedCount >=
// 2"); every one of them now reports a real document-versus-document result.
const AUTO_CHECK_GROUPS = [
  { label: "Customer identity:", keys: ["customerName"] },
  { label: "Vendor identity:", keys: ["vendor"] },
  { label: "Amount consistency:", keys: ["hkd"] },
  { label: "Contract period:", keys: ["startDate", "endDate"] },
  { label: "Reference numbers:", keys: ["contractNo", "quotation", "atqRefNo", "uid"] },
];

function joinLabels(list) {
  return list.map(d => d.label).join(", ");
}

// The four documents ExtractedFieldsPage lays out as columns, keyed by
// DOC_ROLES role rather than ATTACHMENT_TYPES tab -- a whole email dropped
// into one tab (the normal case now) puts its Agreement/ATQ/Quotation
// documents all under that one tab's typeKey, so a typeKey-keyed column only
// ever finds the tab it was literally dropped into and reads "not extracted"
// for the other three. roleOfSource resolves by filename/heading first and
// the tab last, so reading off the role the Role Slot Bar already resolved is
// the one lookup that works regardless of how many documents shared a drop.
// ATQ's PDF print and the workbook behind it are still
// shown side by side on purpose -- `kind` picks the one of the "atq" role's
// documents whose own filename is a PDF vs a workbook, so a reviewer sees the
// two even when they agree (worth confirming) or disagree (otherwise reported
// under one merged role).
const EXTRACTED_FIELD_COLUMNS = [
  { key: "agreement", roleKey: "agreement", label: "Agreement" },
  { key: "quotation", roleKey: "quotation", label: "Quotation" },
  { key: "atq-excel", roleKey: "atq", kind: "excel", label: "ATQ (Excel)" },
];

// A fifth column, and the only one that is not a document. The email subject
// states four of these rows itself, and being able to hold it against what the
// files said is the whole reason it is read at all.
//
// It is deliberately NOT wired into computeFieldDiffs as a fifth source.
// That machine is role-based end to end -- roleOfSource, roleCensus, the Role
// Slot Bar, and the viewer's "open the dissenting document" link all resolve a
// source down to one of DOC_ROLES and then to a file and a page. A subject line
// is not a document anyone can open, so making it a role would mean teaching
// every one of those what to do with a source that has no file, for a column
// whose entire job is to say "the subject agrees" or "the subject does not".
//
// Kept out of EXTRACTED_FIELD_COLUMNS rather than appended to it, so that
// anything iterating "the documents" keeps meaning the documents.
const EXTRACTED_EMAIL_COLUMN = { key: "email", label: "Email subject" };

// What the subject says for one row. The four it actually states; everything
// else is silence. A witness, never a filler -- nothing here reaches
// detectFromRoles or the form, and the Cost worksheet stays the record.
const SUBJECT_ROW_READERS = {
  customerName: s => s.customerName,
  vendor: s => s.vendor,
  productType: s => s.productType,
  backToBack: s => s.backToBack,
};

// Whether the subject's reading of one row matches what the documents said,
// judged by the SAME rules the cross-check beside it uses: that key's own
// normaliser, plus the fuzzy-name allowance for FUZZY_DIFF_KEYS and listParts
// for a document that collapsed a whole column into one cell ("HKT,NEXUS2S,
// Xtreme Lighting Limited"). A column with its own idea of agreement would
// light up amber on "HKT Ltd" vs "HKT Limited" while the row beside it called
// them the same thing.
//
// Agreement with ANY document is agreement: the useful signal is "at least one
// file corroborates the email", and which files disagree among themselves is
// already the row's own job. "" -- silence -- when the subject does not state
// the row or no document reported it, because silence is not disagreement.
function subjectVerdict(crosschecks, key, value) {
  const norm = DIFF_KEYS[key];
  const cc = crosschecks && crosschecks[key];
  if (!value || !norm || !cc || !cc.roles) return "";
  const said = [];
  DOC_ROLES.forEach(r => {
    const entry = cc.roles[r.key];
    if (entry && entry.state === "speaks") entry.values.forEach(v => said.push(String(v.value)));
  });
  const mine = norm(value);
  if (!said.length || !mine) return "";
  const fuzzy = FUZZY_DIFF_KEYS.indexOf(key) >= 0;
  const alike = other => other === mine || (fuzzy && tokenJaccard(other, mine) >= DIFF_JACCARD_MIN);
  const agrees = said.some(v =>
    alike(norm(v)) || (listParts(key, v) || []).some(alike));
  return agrees ? "agrees" : "differs";
}

// Two of these rows are not per-document and cannot be. The UID is stated by
// the EMAIL, and the Record_ID is derived from the ATQ's reference and the item
// number; neither is a thing any of the four columns has an opinion about. They
// keep their place in the reference block because that is where a reviewer
// looks for a reference, but each draws ONE value across all four columns
// rather than four.
//
// `uid` used to be an ordinary cross-check row, and it printed "not extracted"
// four times on every upload ever made: no document reports a UID as a labelled
// field, as the note on DIFF_KEYS says in as many words. Four blanks read as
// "all four were asked and none of them knew" -- nothing was ever asked. If
// FIELD_LABEL_MAP ever does learn a UID label, this is the row to reconsider.
const SPANNING_ROWS = {
  uid: { label: "UID #", from: "read from the email subject" },
  recordId: { label: "Record ID", from: "ATQ Ref. No. + Item No. -- the ID this item will be saved under" },
};

// The rows: every key computeFieldDiffs cross-checks (DIFF_KEYS plus the
// compare-only fields), in the order a reviewer would naturally read a
// requisition -- who and how much, then references, then item classification.
// atqRefNo/uid/recordId are drawn separately, in the reference strip above the
// table (SPANNING_ROWS) -- they are single, table-level values, not a
// per-field comparison, so they never belonged in this list.
const EXTRACTED_FIELD_ROWS = [
  "customerName", "vendor", "hkd",
  "contractNo", "quotation",
  "startDate", "endDate",
  "productType", "serviceType", "backToBack",
];

// How each row compares, decided once here instead of inline per row so the
// table body is one shape of branch instead of three.
//
// `compare`: the roleKeys (a subset of EXTRACTED_FIELD_COLUMNS, excluding
// "atq") this row is actually cross-checked against and whose breakdown is
// worth showing. Customer/Vendor/Amount/Dates genuinely appear on all three
// documents; Agreement Number only ever appears on the Agreement; Quotation
// No. only ever appears on the Quotation. Naming the subset explicitly (rather
// than showing every column and letting empty ones read as "not extracted")
// is what makes points 5/6 below true instead of merely usually true.
//
// `solo`: no cross-check at all -- these three only ever come from the ATQ
// workbook (Product Type, Service Type, Back-to-Back), so flagging them
// against documents that were never asked would manufacture disagreements out
// of silence.
//
// `soloRole`: Quotation No. is a comparison ONLY when the ATQ workbook has its
// own reading to compare against. An ATQ that leaves this blank (common --
// see CLAUDE.md's note on ATQ-202603-00386-V23) has nothing to compare, so the
// row falls back to showing the Quotation document's own value plainly, with
// no flag and no breakdown, rather than reporting "not extracted" for a value
// that is sitting right there in the one document that states it.
const FIELD_ROW_CONFIG = {
  customerName: { compare: ["agreement", "quotation"] },
  vendor:       { compare: ["agreement", "quotation"] },
  hkd:          { compare: ["agreement", "quotation"] },
  startDate:    { compare: ["agreement", "quotation"] },
  endDate:      { compare: ["agreement", "quotation"] },
  contractNo:   { compare: ["agreement"] },
  quotation:    { compare: ["quotation"], soloRole: "quotation" },
  productType:  { solo: true },
  serviceType:  { solo: true },
  backToBack:   { solo: true },
};

// The Company Chop row is not one of VERIFY_TABLE_ROWS (it spans the document
// columns rather than answering from one), but its LIS cell needs the same row
// identity every other cell keys its edits by.
// Which document a Cross Check cell is answering from, said twice over: the name
// AND a colour, one per document, so a reviewer scanning the column can see at a
// glance that three different documents are being quoted rather than one.
//
// The colour is deliberately NOT the only carrier -- the label text stays, same
// rule as the glyph vocabulary on the field rows. Quotation is purple rather
// than green on purpose: green already means "these two agree" in the status
// column beside it, and a green badge next to a red status icon would report
// agreement and conflict on the same line.
const CROSS_CHECK_SOURCES = {
  agreement: { label: "Agreement",   className: "border-[#1D4ED8] bg-[#DBEAFE] text-[#1D4ED8]" },
  quotation: { label: "Quotation",   className: "border-[#7C3AED] bg-[#EDE9FE] text-[#7C3AED]" },
  atq:       { label: "ATQ (Excel)", className: "border-[var(--orange-dark)] bg-[#FFF3D6] text-[var(--orange-dark)]" },
};
function crossCheckSourceOf(row) {
  const key = row && row.sourceRole === "agreement" ? "agreement"
    : row && row.sourceRole === "quotation" ? "quotation"
    : "atq";
  return Object.assign({ key }, CROSS_CHECK_SOURCES[key]);
}

  { id: "quotationStartDate", key: "startDate", lisSourceKey: "quotationStartDate", label: "Quotation Start Date", compare: ["quotation"], crossCheckLabel: "Extract from Quotation (Start)", sourceRole: "quotation" },

// Rows the "New" badge (see LisNewBadge) is allowed to judge against the
// existing admin_btb_lis_excel_datas4 row for this Record_ID. Not every row
// with a LIS Value box qualifies: contractStartDate/quotationStartDate share
// `key: "startDate"` and contractEndDate/quotationEndDate share `key:
// "endDate"` (both pairs read the same crosscheck value on purpose) -- the
// two Quotation rows now carry their own `lisSourceKey` pointing at their
// own admin_btb_lis_excel_datas4 column (admin_startx0020date24 /
// admin_odatax0020endx0020date3), so they are no longer excluded for that
// reason. Quotation No. and UID have no column on this table at all, so
// there is still nothing to compare against for either: no answer here is
// safer than one that looks right and compares against the wrong field.
const LIS_NEW_VALUE_ROW_IDS = new Set([
  "customerName", "vendor", "contractNo", "prAmount",
  "contractStartDate", "contractEndDate", "quotationStartDate", "quotationEndDate",
  "handledBy", "iptUnitMgr",
]);

// quotationStartDate/quotationEndDate have no ATQ Excel counterpart -- the
// workbook never carries a quotation start/end date, only the quotation
// document does (see their sourceRole: "quotation" in VERIFY_TABLE_ROWS).
// Their Value (ATQ (Excel)) cell always renders nothing for these two ids,
// even if some fallback reading did produce a value -- that value belongs to
// Cross Check, not to a column this row was never going to answer. Cross
// Check and LIS Value are unaffected.
const NO_ATQ_VALUE_ROW_IDS = new Set(["quotationStartDate", "quotationEndDate"]);

// Signature_Detection reads a document's own ink-pass result, the same field
// the viewer's Signed/Chopped pills already read (see signingPills). Takes the
// resolved doc's `.signing` directly now rather than an attachment-tab's --
// see docAt.
function signatureDetectionLabel(signing) {
  if (!signing || !(signing.hasSignature || signing.hasChop)) return "";
  if (signing.hasSignature && signing.hasChop) return "Signed & Chopped";
  return signing.hasSignature ? "Signed" : "Chopped";
}

// Every mark of one kind the ink pass actually found on a document, one entry
// per mark rather than one summary sentence. "Chopped" is the least useful half
// of the answer: whose chop, and on which page, is what a reviewer checks
// against the counterparty -- and the page is also what the row's View link
// needs, since a chop on page 7 of a 30-page agreement is not findable by
// opening the document at page 1.
//
// Nothing is filtered out here, for the two reasons markIsOurs already gives:
// our own chop keeps its entry (the caller greys it) because a silently dropped
// finding is indistinguishable from one that was never made, and a mark whose
// sign-off block the engine could not read keeps its entry too -- an unnamed
// chop is still a chop, and `name: ""` is the honest report of it.
//
// `confidence` and `color` are the detector's own numbers, passed through
// rather than interpreted: they are what "detected" means here, and a reviewer
// looking at a 0.38 ring deserves to know it was a 0.38 ring.
function markDetections(signing, kind) {
  return ((signing && signing.marks) || [])
    .filter(m => m.kind === kind)
    .map((m, i) => ({
      key: kind + "#" + i,
      page: m.page || 1,
      name: markOwnerName(m),
      ours: markIsOurs(m),
      // The printed block the name was read out of. Not drawn as its own line
      // -- it is provenance for the name above it, so it rides in the title.
      cue: (m.context && m.context.cue) || "",
      label: (m.context && m.context.label) || "",
      // The picture of this mark and the printed block it was named from, cut
      // from the page by the engine's markCropRect. "" for a parse that ran
      // without `markCrop`, for demo data, and for a mark whose rect came out
      // too small to draw -- every one of which still has a line here.
      crop: m.crop || "",
      color: m.color || "",
      confidence: typeof m.confidence === "number" ? m.confidence : null,
    }));
}

// The actual document a census source points at -- same resolution
// DocumentViewer does for docIndex (`docIndex < 0` is the tab's own dropped
// file, not one of its sub-documents). Needed here because roleCensus' docs
// carry only a `signed` boolean, not the full `.signing` object Company Chop
// wants to describe.
function docAt(attachments, source) {
  if (!source) return null;
  const entry = attachments[source.typeKey];
  if (!entry) return null;
  if (source.docIndex < 0) return selfDocFor(entry);
  return (entry.docs || []).find(d => d.index === source.docIndex) || null;
}

// The value one column (role, optionally narrowed to its PDF or its workbook)
// reported for one row (field), read off crosscheckField's own per-role
// grouping -- the same resolution the Role Slot Bar and Verify's Automatic
// Checks already use, so this table can never name a different document than
// either of them. "" when the role has nothing to say (or, narrowed, when
// its PDF/workbook side specifically has nothing to say), rendered as an
// explicit "not extracted" placeholder rather than guessed.
function roleCellValue(crosschecks, key, roleKey, kind) {
  const cc = crosschecks[key];
  const roleEntry = cc && cc.roles[roleKey];
  if (!roleEntry || roleEntry.state !== "speaks") return "";
  if (!kind) return String(roleEntry.values[0].value);
  const isPdf = s => /\.pdf$/i.test(sourceBaseName(s));
  const match = roleEntry.values.find(v => v.sources.some(s => isPdf(s) === (kind === "pdf")));
  return match ? String(match.value) : "";
}

// The ONE document a Verify Table column is answering from -- what its header's
// document button opens. Deliberately the same resolution roleCellValue uses
// rather than a second one: a header that opens a different file from the one
// the cells under it were read from is worse than no button, because it invites
// the reviewer to check a value against a document that never reported it.
//
// `assigned[roleKey].doc` is the selected document for a role, and for
// Agreement and Quotation that is the whole answer. The ATQ role is the
// exception and the reason this is not a one-liner: it holds TWO documents (the
// PDF print and the workbook behind it), `assigned.atq` picks the workbook (see
// docRankFor), and one of the columns is "ATQ (PDF)". So a column that states a
// `kind` re-picks within the role by the same pdf/not-pdf test roleCellValue
// splits its values on -- it cannot lean on `assigned` alone for either side.
//
// null when the role has nothing selected -- the caller draws no button rather
// than a dead one.
function columnDocSource(census, column) {
  if (!census || !column) return null;
  const role = column.roleKey;
  if (!column.kind) {
    const assigned = census.assigned && census.assigned[role];
    return (assigned && assigned.doc) || null;
  }
  const isPdf = d => /\.pdf$/i.test(sourceBaseName(d));
  return ((census.docs || []).filter(d => d.role === role)
    .find(d => isPdf(d) === (column.kind === "pdf"))) || null;
}

// BTB ATQ Excel source — the record written by "Send to n8n".
// The Verify Table's Value column reads from this instead of the extracted
// document fields, so a reviewer sees what was actually saved to Dataverse.
const DATAVERSE_ATQ_EXCEL_SOURCE = {
  entity: "admin_btb_atq_excels4",
  titleField: "admin_title4",
  select: ["admin_title4", "admin_customername4", "admin_vendorname4",
    "admin_agreementnumber4", "admin_contractstartdatenew4",
    "admin_contractenddatenew4", "admin_totalvalueofquotationhkd",

    startDate: "admin_contractstartdatenew4",
    endDate: "admin_contractenddatenew4",
    hkd: "admin_totalvalueofquotationhkd",
    handledBy: "admin_handleby",
    iptUnitMgr: "admin_iptunitmanager",
  },
