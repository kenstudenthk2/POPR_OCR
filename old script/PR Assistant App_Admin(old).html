function VerifyPage({ attachments, fields, manualChecks, toggleManualCheck, goUpload, goSave, demoMode, adminMode, itemRecordIds, saveStatus, saving, savedRecordId, crosschecks, dismissedDiffs, toggleDismissDiff, openViewer, itemIndex, selectItem }) {
  const items = recordsBearingEntry(attachments) || [];
  const collidedItems = (itemRecordIds || []).filter(x => x.collided);
  // itemRecordIds is [] for a single-item ATQ, so this is 0 or >= 2, never 1 --
  // there is nothing to warn about when the email's ATQ holds one item.
  const itemsSharingThisAtq = (itemRecordIds || []).length;
  const plannedRecordId = ((itemRecordIds || [])[itemIndex] || {}).recordId || "";
  // "Item N" for the panel's failure line -- 1-based position in itemRecordIds,
  // the same order savePlans built its payloads in. Falls back to just the
  // Record_ID when there is no multi-item list to place it in (a single-record
  // save failing has no "Item N" to name).
  const failedItemLabel = saveStatus && saveStatus.failedRecordId != null
    ? (() => {
        const idx = (itemRecordIds || []).findIndex(x => x.recordId === saveStatus.failedRecordId);
        return idx >= 0 ? `Item ${idx + 1} (${saveStatus.failedRecordId})` : saveStatus.failedRecordId;
      })()
    : null;
  const parsedCount = Object.values(attachments).filter(a => a.parsed).length;
  const attachmentsOk = ATTACHMENT_TYPES.every(t => attachments[t] && attachments[t].parsed);

  // Three outcomes, not two. `ok` means genuinely cross-checked and agreeing;
  // amber means documents disagree; `weak` means there was nothing to compare,
  // which must not wear the same green as a check that actually ran.
  const autoChecks = AUTO_CHECK_GROUPS.map(({ label, keys }) => {
    const present = keys.map(k => crosschecks[k]).filter(Boolean);
    // A pair is what "cross-checked" means: two different roles that both spoke.
    // The old test was diff.sourceCount > 1, which counted an ATQ's PDF print
    // and the workbook behind it as two documents corroborating each other and
    // turned a slot agreeing with itself into a green cross-document check.
    const compared = present.filter(cc => cc.pairs.length > 0 || cc.intra.length > 0);
    const live = compared.filter(cc => !dismissedDiffs.has(cc.dismissKey));
    const waved = compared.filter(cc => dismissedDiffs.has(cc.dismissKey));
    const bad = live.filter(cc => cc.severity === "different");
    const soft = live.filter(cc => cc.severity === "similar");
    if (bad.length) {
      return { label, ok: false, rows: bad.concat(soft),
        desc: bad.map(cc => cc.label + " — " + crosscheckSentence(cc)).join(" ") };
    }
    if (!compared.length) {
      return { label, ok: false, weak: true, rows: [],
        // Not lowercased: FIELD_LABELS holds "HKD" and "ATQ Ref. No.", which
        // become "hkd" and "atq ref. no." the moment you try to make the
        // sentence flow.
        desc: present.length
          ? "Only one document reports " + joinLabels(present) + " — nothing to cross-check"
          : "No document reported this field" };
    }
    // A dismissed conflict is resolved, not unexamined, so the row passes --
    // otherwise one known-bad OCR read jams the page forever. It says so out
    // loud rather than quietly turning green.
    const parts = [];
    // A group is several fields, and they are not all cross-checked just
    // because one of them was. "Reference numbers" holds four keys; if three
    // agree across documents and the fourth is reported by one slot only, the
    // row is green and the fourth field is sitting inside it uncorroborated.
    // Name it, or the green covers for it.
    const uncompared = present.filter(cc => compared.indexOf(cc) < 0);
    // Counted in documents that actually took part, not in sources: a source is
    // a record or a sub-document too, so sourceCount says four where two files
    // were read.
    if (live.length) parts.push("Agrees across " +
      Math.max.apply(null, live.map(cc => crosscheckDocKeys(cc).length)) + " documents");
    // Each soft row says why it is soft: "wording" is right for CENTRE vs CTR
    // and wrong for a cell that lists every vendor on the workbook.
    if (soft.length) parts.push(soft.map(cc =>
      cc.label + " " + ((cc.pairs.filter(p => p.severity === "similar")[0] || {}).softReason || "differs only in wording")).join("; "));
    if (waved.length) parts.push(joinLabels(waved) + " conflict dismissed by reviewer");
    if (uncompared.length) parts.push(joinLabels(uncompared) +
      (uncompared.length > 1 ? " were" : " was") + " not cross-checked — only one document reports " +
      (uncompared.length > 1 ? "them" : "it"));
    return { label, ok: true, rows: soft, desc: parts.join(" — ") };
  }).concat([
    { label: "Attachments:", ok: attachmentsOk, rows: [],
      desc: `${parsedCount}/${ATTACHMENT_TYPES.length} types parsed` +
        (attachmentsOk ? "" : " — some still missing") },
  ]);

  const passCount = autoChecks.filter(c => c.ok).length;
  const dismissedList = dismissedCrosscheckList(crosschecks, dismissedDiffs);
  const allManualChecked = manualChecks.every(Boolean);

  const viewDiff = (cc) => {
    const s = crosscheckDissent(cc);
    if (s) openViewer(s.typeKey, s.docIndex);
  };

  return (
    <React.Fragment>
      <TopBar title="Save Check" desc="Confirm the checks and save the record"
        right={<React.Fragment>
          {adminMode && <Pill className="bg-[#FFF4DE] text-[var(--orange-dark)]">Admin bypass</Pill>}
          <Pill className={passCount === autoChecks.length ? "bg-[#DCFCE7] text-[var(--green)]" : "bg-[#FEF3C7] text-[var(--amber)]"}>{passCount}/{autoChecks.length} checks pass</Pill>
          <GhostButton onClick={goUpload}>← Upload</GhostButton>
          {/* No title= here: PrimaryButton does not forward one, so a tooltip
              would silently do nothing. The panel below says which record was
              saved and why the button is closed. */}
          <PrimaryButton disabled={saving || !!savedRecordId || (!adminMode && !allManualChecked)} onClick={goSave}>
            {saving ? "Saving..." : savedRecordId ? "Saved" : "Save to master"}</PrimaryButton>
        </React.Fragment>} />

      <div className="flex flex-col md:flex-row gap-6 px-5 md:px-8 pb-8 items-stretch md:items-start">
        <div className="flex-1 flex flex-col gap-5">
          <Card className="w-full p-6 flex flex-col gap-3.5">
            {items.length > 1 && (
              <div className="flex gap-2 flex-wrap">
                {items.map((rec, i) => {
                  const active = i === itemIndex;
                  return (
                    <button key={i} onClick={() => selectItem(i)}
                      className={`flex items-center gap-[7px] px-3.5 py-2 rounded-full border-[1.5px] ui-transition pressable
                        ${active ? "bg-[#FBF0E8] border-[#D4916E]" : "bg-[#F3EBE2] border-[#C5BEB6]"}`}>
                      <span className={`text-xs font-semibold ${active ? "text-[#D4916E]" : "text-[#6B6B6B]"}`}>Item {i + 1}</span>
                    </button>
                  );
                })}
              </div>
            )}
            <div className="flex justify-between items-center">
              <div className="text-lg font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Automatic Checks</div>
              <Pill className={passCount === autoChecks.length ? "bg-[#E8F5EC] text-[#3D8B5F]" : "bg-[#FDF6E0] text-[#B78312]"}>{passCount}/{autoChecks.length} pass</Pill>
            </div>
            {autoChecks.map((c, i) => {
              const tone = c.ok ? "text-[#3D8B5F]" : c.weak ? "text-[#6B6B6B]" : "text-[#B78312]";
              return (
                <div key={i} className={`flex items-start gap-2.5 px-3.5 py-3 rounded-lg
                  ${c.ok ? "bg-[#E8F5EC]" : c.weak ? "bg-[#F3EBE2]" : "bg-[#FDF6E0]"}` }>
                  <div className={`shrink-0 leading-5 ${tone}`}>{c.ok ? "✓" : c.weak ? "–" : "!"}</div>
                  <div className="flex-1 min-w-0 flex flex-col gap-1.5">
                    <div className="flex flex-wrap gap-x-1.5 items-baseline">
                      <span className={`text-[13px] font-bold ${tone}`}>{c.label}</span>
                      <span className="text-[13px] text-[#3D3D3D]">{c.desc}</span>
                    </div>
                    {/* One line per pair of documents that was actually
                        compared, naming the two roles before the two values.
                        Pairs a reviewer can act on: each names a document to
                        open or to cite in the reply. */}
                    {c.rows.map(cc => (
                      <div key={cc.key} className="flex items-start gap-3">
                        <div className="flex-1 min-w-0 flex flex-col gap-1">
                          <div className="text-[11px] font-bold text-[#3D3D3D]">{cc.label}</div>
                          {cc.pairs.map(p => (
                            <div key={p.key} className="flex items-baseline gap-1.5 flex-wrap">
                              <span className={`shrink-0 w-3 text-[12px] font-bold leading-[19px]
                                ${p.agrees ? "text-[#3D8B5F]" : p.severity === "similar" ? "text-[#A39B92]" : "text-[#B78312]"}`}>
                                {p.agrees ? "=" : p.severity === "similar" ? "≈" : "≠"}
                              </span>
                              <span className="shrink-0 text-[11px] font-semibold leading-[19px] text-[#3D3D3D]">
                                {p.a.label} vs {p.b.label}
                              </span>
                              <span className="text-[12px] leading-[19px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>
                                {p.agrees
                                  ? <React.Fragment>both say <span className="font-semibold text-[#1A1A1A]">{p.aValue}</span></React.Fragment>
                                  : <React.Fragment>
                                      <span className="font-semibold text-[#1A1A1A]">{p.aValue}</span>
                                      {" vs "}
                                      <span className="font-semibold text-[#1A1A1A]">{p.bValue}</span>
                                      {p.softReason ? " — " + p.softReason : ""}
                                    </React.Fragment>}
                              </span>
                            </div>
                          ))}
                          {/* Two documents sharing one slot that contradict each
                              other. Not a pair, and not something to hide. */}
                          {cc.intra.map(x => (
                            <div key={x.role.key} className="flex items-baseline gap-1.5 flex-wrap">
                              <span className="shrink-0 w-3 text-[12px] font-bold leading-[19px] text-[#B78312]">!</span>
                              <span className="shrink-0 text-[11px] font-semibold leading-[19px] text-[#3D3D3D]">
                                {x.role.label} disagrees with itself
                              </span>
                              <span className="text-[12px] leading-[19px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>
                                {x.values.join(" vs ")}
                              </span>
                            </div>
                          ))}
                          {/* The roles that could not take part, said out loud
                              rather than left as a line that silently is not
                              there. */}
                          {DOC_ROLES.filter(r => cc.roles[r.key].state !== "speaks").length > 0 && (
                            <div className="text-[11px] leading-[16px] text-[#A39B92]" style={{fontFamily:"Newsreader, serif"}}>
                              Not cross-checked: {DOC_ROLES.filter(r => cc.roles[r.key].state !== "speaks")
                                .map(r => r.label + " (" + (cc.roles[r.key].state === "silent" ? "does not mention it"
                                  : cc.roles[r.key].state === "promoted" ? "signed, listed under Agreement"
                                  : "not in this upload") + ")").join("; ")}
                            </div>
                          )}
                        </div>
                        <button onClick={() => viewDiff(cc)}
                          className="shrink-0 text-[12px] font-semibold text-[#B78312] hover:underline whitespace-nowrap">
                          View documents →
                        </button>
                        {/* An OCR misread must not be able to block the gate
                            forever; dismissing is per-value, so a later, real
                            conflict comes back on its own. */}
                        <button onClick={() => toggleDismissDiff(cc.dismissKey)}
                          className="shrink-0 text-[12px] text-[#6B6B6B] hover:text-[#3D3D3D] whitespace-nowrap">
                          Dismiss
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
            {dismissedList.length > 0 && (
              <div className="flex flex-wrap items-center gap-2 pt-0.5">
                <span className="text-[11px] text-[#6B6B6B]" style={{fontFamily:"Newsreader, serif"}}>Dismissed:</span>
                {dismissedList.map(d => (
                  <button key={d.dismissKey} onClick={() => toggleDismissDiff(d.dismissKey)}
                    className="px-2.5 py-[3px] rounded-full text-[11px] bg-[#F3EBE2] text-[#6B6B6B] hover:text-[#B78312]">
                    {d.label} ↺ restore
                  </button>
                ))}
              </div>
            )}
          </Card>

          {/* TEMPORARY, paired with savePlans' narrowing: one upload writes one
              record. Said on screen rather than left to the disabled button,
              because "Save is greyed out" and "this ATQ has another item that
              still needs saving" are the same pixel otherwise, and only one of
              them is a problem the reviewer can act on. */}
          {(savedRecordId || itemsSharingThisAtq > 1) && (
            <div className={"w-full flex gap-2 px-4 py-3 border-l-4 rounded-lg " +
              (savedRecordId ? "bg-[#E8F5EC] border-[#3D8B5F]" : "bg-[#FDF6E0] border-[#B78312]")}>
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                {savedRecordId ? (
                  <React.Fragment>
                    <span className="font-bold text-[#3D8B5F]">✓ Saved {savedRecordId}.</span>{" "}
                    This upload writes one record. Switching Item tab will not save again —
                    press <span className="font-semibold">+ New Record</span> and drop that item's own email.
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <span className="font-bold">This ATQ covers {itemsSharingThisAtq} items.</span>{" "}
                    Save writes one record{plannedRecordId ? " — " + plannedRecordId : ""}, for the item selected above.
                    The other {itemsSharingThisAtq - 1 > 1 ? "items each need their own email" : "item needs its own email"}.
                  </React.Fragment>
                )}
              </div>
            </div>
          )}

          {/* A collision means two items would silently overwrite each
              other's primary name column in Dataverse. Named here, not just
              disambiguated behind the scenes -- a reviewer who sees "-a"/"-b"
              land on the record without knowing why has no way to tell
              whether that was intended. */}
          {collidedItems.length > 0 && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FDF6E0] border-l-4 border-[#B78312] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                <span className="font-bold">Record_ID collision:</span> {collidedItems.length} item{collidedItems.length > 1 ? "s" : ""} would
                have shared the same Record_ID and {collidedItems.length > 1 ? "were" : "was"} given a suffix to keep them distinct —
                {" "}{collidedItems.map(x => x.recordId).join(", ")}.
              </div>
            </div>
          )}

          {/* Replaces the old alert() on a partial Save failure. Sequential
              writes mean everything before the failure already reached
              Dataverse and stays there -- no rollback -- so this says what
              is safe (already saved, will be skipped on retry) and what
              still needs fixing. */}
          {saveStatus && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[#B23B3B]">Save failed partway through.</span>{" "}
                Saved {saveStatus.savedCount}/{saveStatus.total}.
                {failedItemLabel ? ` ${failedItemLabel} failed: ${saveStatus.message}` : ` ${saveStatus.message}`}
                {" "}The {saveStatus.savedCount} already saved {saveStatus.savedCount === 1 ? "is" : "are"} kept — fix the issue and press
                Save again; what already saved will be skipped automatically.
              </div>
            </div>
          )}

          <Card className="w-full p-6 flex flex-col gap-3.5">
            <div className="text-lg font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Manual Confirmation</div>
            {MANUAL_CHECK_LABELS.map((label, i) => (
              <label key={i} className="flex items-center gap-3 py-2.5 border-b border-[#C5BEB6] last:border-b-0 cursor-pointer">
                <input type="checkbox" checked={manualChecks[i]} onChange={() => toggleManualCheck(i)}
                  className="w-[19px] h-[19px] accent-[#3D8B5F] rounded-md border-[1.5px] border-[#C5BEB6]" />
                <span className="flex-1 text-[13.5px] text-[#1A1A1A]">{label}</span>
              </label>
            ))}
          </Card>

          <div className="w-full flex gap-2 px-4 py-3 bg-[#FDF6E0] border-l-4 border-[#B78312] rounded-lg">
            <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
              If any document is wrong → reply the original RPA email to clear the alert. Do not save the record.
            </div>
          </div>
        </div>

        <div className="w-full md:w-[280px] md:shrink-0 flex flex-col gap-4">
          <Card className="p-5 flex flex-col gap-3">
            <div className="text-[15px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Attachment Status</div>
            {ATTACHMENT_STATUS_ROWS.map(([label, key]) => {
              const ok = attachments[key].parsed;
              return (
                <div key={key} className="flex justify-between items-center py-2 border-b border-[#C5BEB6] last:border-b-0">
                  <span className="text-[13px] text-[#3D3D3D]">{label}</span>
                  <Pill className={ok ? "bg-[#E8F5EC] text-[#3D8B5F]" : "bg-[#FDECEB] text-[#C0392B]"}>{ok ? "Parsed" : "Missing"}</Pill>
                </div>
              );
            })}
          </Card>

          <Card className="p-5 flex flex-col gap-3">
            <div className="text-[15px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Record Snapshot</div>
            {[["Customer", fields.customerName.value], ["Amount", "HKD " + fields.hkd.value], ["Contract No.", fields.contractNo.value],
              ["Vendor", fields.vendor.value], ["Period", demoMode ? DEMO_PERIOD : EMPTY_PERIOD], ["SB Entity", demoMode ? DEMO_SB_ENTITY : EMPTY_SB_ENTITY]].map(([k,v]) => (
              <div key={k} className="flex flex-col gap-0.5 py-1.5 border-b border-[#C5BEB6] last:border-b-0">
                <span className="text-[11px] text-[#6B6B6B]">{k}</span>
                <span className="text-[13px] font-semibold text-[#1A1A1A]">{v}</span>
              </div>
            ))}
          </Card>

          <div className="w-full flex gap-2 p-3.5 bg-[#F4F0E8] border border-[#D8D3C9] rounded-lg">
            <div className="text-[#D4916E]">💡</div>
            <div className="flex-1 text-xs leading-[19px] text-[var(--muted)]">Tick all manual items before saving the record.</div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

];
const MASTER_RECORDS_COLUMN_KEYS = MASTER_RECORDS_COLUMNS.map(c => c.key);
const MASTER_RECORDS_DEFAULT_COLUMN_KEYS = MASTER_RECORDS_COLUMNS.filter(c => c.defaultVisible).map(c => c.key);
// Browser-local only (per CLAUDE.md's degrade-don't-throw pattern for
// anything that isn't parent.Xrm.WebApi) -- a reviewer's column picks stay on
// their own machine/browser, not synced through Dataverse.
const MASTER_RECORDS_COLUMNS_STORAGE_KEY = "prAssistant.masterRecords.visibleColumns";

function loadMasterRecordsVisibleColumns() {
  try {
    const raw = window.localStorage.getItem(MASTER_RECORDS_COLUMNS_STORAGE_KEY);
    if (!raw) return MASTER_RECORDS_DEFAULT_COLUMN_KEYS;
    const parsed = JSON.parse(raw);
    const kept = Array.isArray(parsed) ? parsed.filter(k => MASTER_RECORDS_COLUMN_KEYS.includes(k)) : [];
    return kept.length ? kept : MASTER_RECORDS_DEFAULT_COLUMN_KEYS;
  } catch (e) {
    return MASTER_RECORDS_DEFAULT_COLUMN_KEYS;
  }
}

function RecordsPage({ records, goUpload, openReply, demoMode, recordsLoadError }) {
  const [filter, setFilter] = useState("All Records");
  const [search, setSearch] = useState("");
  const [visibleColumnKeys, setVisibleColumnKeys] = useState(loadMasterRecordsVisibleColumns);
  const [columnsOpen, setColumnsOpen] = useState(false);
  const columnsRef = useRef(null);
  // Row detail is not built yet -- clicking a row says so instead of opening
  // Reply on a table that no longer supplies quotation/amount for it.
  const [comingSoon, setComingSoon] = useState(false);
  // Tabs follow new_pr_status4' own 5 choices -- Flagged is a separate Yes/No
  // column now, not one of them, so it is not a tab (see the 🚩 on each row
  // instead).
  const tabs = ["All Records", "Completed", "Pending", "Cancel", "Return", "Duplicate"];
  const pagination = demoMode ? DEMO_PAGINATION : EMPTY_PAGINATION;
  const recentActivity = demoMode ? DEMO_RECENT_ACTIVITY : EMPTY_RECENT_ACTIVITY;

  const filtered = useMemo(() => records.filter(r => {
    const matchesTab = filter === "All Records" || r.status === filter;
    const q = search.toLowerCase();
    const matchesSearch = !q || [r.customerName, r.vendor, r.poNo, r.no, r.prDescription]
      .some(v => (v || "").toLowerCase().includes(q));
    return matchesTab && matchesSearch;
  }), [records, filter, search]);

  useEffect(() => {
    try { window.localStorage.setItem(MASTER_RECORDS_COLUMNS_STORAGE_KEY, JSON.stringify(visibleColumnKeys)); } catch (e) {}
  }, [visibleColumnKeys]);

  useEffect(() => {
    if (!columnsOpen) return;
    const onOutside = (e) => { if (columnsRef.current && !columnsRef.current.contains(e.target)) setColumnsOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setColumnsOpen(false); };
    window.addEventListener("mousedown", onOutside);
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("mousedown", onOutside);
      window.removeEventListener("keydown", onKey);
    };
  }, [columnsOpen]);

  const toggleColumn = (key) => setVisibleColumnKeys(prev => {
    if (prev.includes(key)) return prev.length > 1 ? prev.filter(k => k !== key) : prev;
    return MASTER_RECORDS_COLUMN_KEYS.filter(k => prev.includes(k) || k === key);
  });

  // The last VISIBLE column always stretches to fill the row -- PR
  // Description does this by default, but if it gets hidden, whichever
  // column is now last needs to take over so the table doesn't leave a gap.
  const activeColumns = useMemo(() => {
    const cols = MASTER_RECORDS_COLUMNS.filter(c => visibleColumnKeys.includes(c.key));
    return cols.map((c, i) => (i === cols.length - 1 ? { ...c, width: "flex-1 min-w-0" } : c));
  }, [visibleColumnKeys]);

  const exportExcel = () => {
    if (typeof XLSX === "undefined") {
      window.alert("Excel export isn't available right now.");
      return;
    }
    const rows = filtered.map(r => {
      const row = {};
      activeColumns.forEach(c => { row[c.label] = c.exportValue(r); });
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(rows, { header: activeColumns.map(c => c.label) });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Master Records");
    XLSX.writeFile(wb, `MasterRecords_${new Date().toISOString().slice(0, 10)}.xlsx`);
  };

  const counts = {
    total: records.length,
    completed: records.filter(r => r.status === "Completed").length,
    pending: records.filter(r => r.status === "Pending").length,
    cancel: records.filter(r => r.status === "Cancel").length,
    return: records.filter(r => r.status === "Return").length,
    duplicate: records.filter(r => r.status === "Duplicate").length,
    flagged: records.filter(r => r.flagged).length,
  };

  return (
    <React.Fragment>
      <TopBar title="Master Records" desc="Search and browse the saved records"
        right={<React.Fragment>
          <div className="flex items-center gap-2 px-3.5 py-2 bg-white border-[1.5px] border-[#C5BEB6] rounded-full w-[240px]">
            <span className="text-[#6B6B6B] text-[13px]">🔍</span>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search customer, vendor, PO No…"
              aria-label="Search records"
              className="flex-1 text-[14px] outline-none bg-transparent placeholder:text-[#6B6B6B]" />
          </div>
          <div ref={columnsRef} className="relative inline-block">
            <GhostButton onClick={() => setColumnsOpen(o => !o)} className="flex items-center gap-1.5">
              Columns
              <Icon name="chevronDown" className={"w-3.5 h-3.5 ui-transition" + (columnsOpen ? " rotate-180" : "")} />
            </GhostButton>
            {columnsOpen && (
              <div className="absolute z-20 right-0 mt-1.5 w-56 dropdown-pop rounded-lg border-[1.5px] border-[var(--line)] bg-white shadow-[0_12px_28px_rgba(29,29,31,0.14)] p-2"
                style={{ transformOrigin: "top" }}>
                {MASTER_RECORDS_COLUMNS.map(c => (
                  <label key={c.key} className="flex items-center gap-2.5 px-2 py-1.5 rounded-md cursor-pointer hover:bg-[#FFF4DE]">
                    <input type="checkbox" checked={visibleColumnKeys.includes(c.key)} onChange={() => toggleColumn(c.key)}
                      className="w-[16px] h-[16px] accent-[#D4916E] rounded border-[1.5px] border-[#C5BEB6] shrink-0" />
                    <span className="flex-1 text-[13px] text-[#3D3D3D]">{c.label}</span>
                  </label>
                ))}
              </div>
            )}
          </div>
          <GhostButton onClick={exportExcel} className="flex items-center gap-1.5">
            <Icon name="sheet" className="w-4 h-4" />
            Export Excel
          </GhostButton>
          <PrimaryButton onClick={goUpload}>+ New Record</PrimaryButton>
        </React.Fragment>} />

      <div className="flex flex-col md:flex-row gap-6 px-5 md:px-8 pb-8 items-stretch md:items-start">
        <div className="flex-1 flex flex-col">
          {/* The mount-time read from admin_btb_lis_excel_datas4 used to fail
              into console.error only -- a broken query and a genuinely empty
              table both rendered as "No records match.", so a reviewer had no
              way to tell "nothing saved yet" from "the read is broken" without
              opening DevTools. */}
          {recordsLoadError && (
            <div className="mb-4 w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 text-[13px] leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[#B23B3B]">Could not load records from Dataverse.</span>{" "}
                {recordsLoadError} The list below may be empty or out of date because of this, not because there is nothing saved.
              </div>
            </div>
          )}
          <div className="flex border-b border-[#C5BEB6] relative">
            {tabs.map(t => (
              <button key={t} type="button" onClick={() => setFilter(t)} aria-pressed={filter === t}
                className={`px-5 py-3 border-b-2 -mb-px ui-transition pressable ${filter === t ? "border-[#D4916E]" : "border-transparent"}`}>
                <span className={`text-[13px] ${filter === t ? "text-[#D4916E] font-semibold" : "text-[#6B6B6B]"}`}>{t}</span>
              </button>
            ))}
            <div className="absolute left-[100px] top-[6px] px-2.5 py-1 bg-[#F4F0E8] border border-[#D8D3C9] rounded-full">
              <span className="text-[11px] font-semibold text-[#D4916E]">{counts.total}</span>
            </div>
          </div>

          <Card className="w-full rounded-t-none">
            <div className="flex px-4 py-3 bg-[#F3EBE2] rounded-t-none">
              {activeColumns.map(c => (
                <div key={c.key} className={`text-[12px] font-semibold text-[#6B6B6B] ${c.width.startsWith("flex-1") ? "" : "shrink-0"} ${c.width}`}>{c.label}</div>
              ))}
            </div>
            {filtered.map(r => (
              // Row detail isn't built yet -- see comingSoon above.
              <button key={r.id} type="button" onClick={() => setComingSoon(true)}
                className="w-full flex px-4 py-3.5 border-b border-[#C5BEB6] hover:bg-[#FBF6EF] ui-transition pressable-surface items-center text-left">
                {activeColumns.map(c => (
                  <span key={c.key} className={`${c.width} ${c.width.startsWith("flex-1") ? "" : "shrink-0"} ${c.cellClassName || ""}`}>{c.render(r)}</span>
                ))}
              </button>
            ))}
            {filtered.length === 0 && <div className="px-4 py-8 text-center text-[13px] text-[#6B6B6B]">No records match.</div>}
            <div className="flex justify-between items-center px-4 py-3">
              <div className="text-xs text-[#6B6B6B]">Showing 1–{filtered.length} of {records.length} records</div>
              <div className="flex gap-1">
                {pagination.map((p,i) => (
                  <div key={i} className={`px-3 py-1.5 rounded-md border text-xs ${p==="1" ? "bg-[#D4916E] text-white border-transparent font-semibold" : "bg-white border-[#C5BEB6] text-[#3D3D3D]"}`}>{p}</div>
                ))}
              </div>
            </div>
          </Card>
        </div>

        <div className="w-full md:w-[280px] md:shrink-0 flex flex-col gap-4">
          <Card className="p-5 flex flex-col gap-3.5">
            <div className="text-[15px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Overview</div>
            {[["Total Records", counts.total, "text-[#1A1A1A]"], ["Completed", counts.completed, "text-[#3D8B5F]"],
              ["Pending", counts.pending, "text-[#B78312]"], ["Cancel", counts.cancel, "text-[#C0392B]"],
              ["Return", counts.return, "text-[#1D4ED8]"], ["Duplicate", counts.duplicate, "text-[#6D28D9]"],
              ["🚩 Flagged", counts.flagged, "text-[#C0392B]"]].map(([k,v,c]) => (
              <div key={k} className="flex justify-between items-center py-1.5">
                <span className="text-[13px] text-[#3D3D3D]">{k}</span>
                <span className={`text-base font-bold ${c}`}>{v}</span>
              </div>
            ))}
          </Card>

          <Card className="p-5 flex flex-col gap-3">
            <div className="text-[15px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Recent Activity</div>
            {recentActivity.map(([a,t]) => (
              <div key={a} className="flex flex-col gap-0.5 py-2 border-b border-[#C5BEB6] last:border-b-0">
                <span className="text-[13px] text-[#1A1A1A]">{a}</span>
                <span className="text-[11px] text-[#6B6B6B]">{t}</span>
              </div>
            ))}
            {recentActivity.length === 0 && <div className="py-2 text-[13px] text-[#6B6B6B]">No recent activity.</div>}
          </Card>

          <Card className="p-5 flex flex-col gap-2.5">
            <div className="text-[15px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Quick Filters</div>
            {["This week","This month","My records","Needs review"].map(f => (
              <div key={f} onClick={() => setSearch(f === "Needs review" ? "" : search)}
                className="px-3 py-2 bg-[#F3EBE2] rounded-md text-[13px] text-[#3D3D3D] cursor-pointer hover:bg-[#e9ddd0]">{f}</div>
            ))}
          </Card>
        </div>
      </div>

      {comingSoon && (
        <div onClick={() => setComingSoon(false)} role="dialog" aria-modal="true" aria-label="Coming soon"
          className="modal-backdrop fixed inset-0 z-50 bg-[#F4F0E8]/85 backdrop-blur-sm flex items-center justify-center p-8">
          <div onClick={e => e.stopPropagation()} className="modal-pop bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full text-center flex flex-col items-center gap-3">
            <div className="text-[19px] font-bold text-[#1A1A1A]" style={{fontFamily:"'Funnel Sans', system-ui, sans-serif"}}>Coming Soon</div>
            <div className="text-[13px] text-[#6B6B6B]">Record detail view isn't available yet.</div>
            <GhostButton onClick={() => setComingSoon(false)}>Close</GhostButton>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}
