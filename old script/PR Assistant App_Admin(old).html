    "PR Issued by Mandy Lee@28833100",
    "For case details, please contact",
    `Enduser: ${fields.customerName.value}`,
    `SI: ${fields.vendor.value}`,
    `Period:  ${fields.poStartDate.value} to ${fields.poEndDate.value} (${periodMths})`,
    `Purchase of ${fields.poPrDescription.value}`,
    "Remarks: Pls refer att'd quotation & document for details information.",
  ];
  if (option === "Others") lines.push(...TO_SUPPLIER_OTHERS_INSERT);
  lines.push("Attached quote for your reference only.");
  return lines.join("\n");
}

// Maps a Docparse-detected {label, value} onto one of the PR form fields.
// Best-effort keyword matching -- same "always verify" spirit as Docparse's
// own field-detection heuristic. Patterns are tried in order per field.
const FIELD_LABEL_MAP = [
  // We are the middle party on every one of these emails: a vendor quotes to
  // HKT, and HKT contracts to the end customer, so a quotation carries three
  // company names -- DCSS's prints "Company Name: HKT Limited" for the buyer and
  // "End user: OCBC" for the customer.
  //
  // Our own name is NOT rejected here, and that is deliberate. It is genuinely
  // the answer to the label a vendor printed: Xtreme Lighting's quotation says
  // "Client: HKT" because HKT is Xtreme's client. Refusing it would delete the
  // evidence; instead the value stays and `ourCompanyOnlyDissent` softens the
  // disagreement it raises against the ATQ's end customer, the same way
  // `markIsOurs` softens rather than filters our own chop. What keeps the END
  // customer reachable is the "End user" fallback below, not a filter up here.
  { key: "customerName", patterns: [/customer(\s*name)?$/i, /bill\s*to/i, /\bclient\b/i] },
  // A period can arrive as ONE label holding a range or as two labels holding a
  // date each, and both spellings are in use on the same corpus:
  //
  //     Maintenance Period          1 Apr 2026 - 31 Mar 2027
  //     Maintenance Period (Start)  1 Apr 2026
  //     Maintenance Period (End)    31 Mar 2027
  //
  // The first is PERIOD_LABEL_PATTERN's job further down -- it splits the range.
  // These two are the split form, which never reached that pass at all: its
  // value is a single date, so splitPeriodRange returns null and the label was
  // simply dropped. The three period words are deliberately the same three
  // PERIOD_LABEL_PATTERN knows, so the vocabulary grows in one place.
  //
  // Anchored on start/end AFTER the word "period", which is what keeps the bare
  // "Maintenance Period" out of here and in the range pass where it belongs.
  { key: "startDate", patterns: [/contract\s*start\s*date/i, /^start\s*date/i,
    /(?:maintenance|service|contract)\s*period\s*[\(\[\-]?\s*start/i] },
  { key: "endDate", patterns: [/contract\s*end\s*date/i, /^end\s*date/i,
    /(?:maintenance|service|contract)\s*period\s*[\(\[\-]?\s*end/i] },
  // "Contract Reference No" is a third spelling, and the word in the middle is
  // what used to lose it: `contract\s*no` needs the two words adjacent, so the
  // one line on `L260390185MZ signed contract.pdf` that carries the number --
  // "OCBC Contract Reference No: L260390185MZ", printed on all 22 pages and read
  // cleanly by OCR on every one of them -- matched nothing, and the Agreement
  // column reported no contract number for a document named after it.
  //
  // Unanchored at the start on purpose: the customer's name is printed in front
  // of it. Anchored at the end, so "Contract Reference Date" cannot borrow it.
  // A "Previous Contract Reference No" would match too, but first-match-wins
  // reads in document order and a contract states its own reference first.
  //
  // "Agreement No." is the same number under the ATQ's other spelling, and
  // `agreement\s*number` did not reach it. The lookahead is what separates it
  // from "Agreement Notes": `no\.?` alone matches the first two letters of that
  // word, and a notes field is not a contract number.
  { key: "contractNo", patterns: [/agreement\s*(?:number|no\.?(?![a-z]))/i, /contract\s*(no\.?|number)/i,
    /contract\s*ref(?:erence)?\.?\s*(?:no\.?|number)?$/i] },
  // A vendor's own quotation totals itself under its own vocabulary -- "Total
  // Amount (HK$)", "Sub-Total", "Project Total" -- none of which is the ATQ's
  // "Total Value of Quotation (HKD)". The added pattern is anchored at both
  // ends and allows only a currency marker after the word, so it takes those
  // three and leaves "Total Qty" and "Total Hours" alone.
  // An award letter states the figure as a "Contract Sum" -- a third dialect on
  // top of the ATQ's "Total Value of Quotation (HKD)" and a vendor's "Total
  // Amount (HK$)", and the one that matters most to compare, since the sum in
  // the award letter IS the number being agreed to. Anchored like the rest:
  // only a currency marker may follow, so "Contract Summary" and "Sum Insured"
  // stay out.
  // Three more spellings of the same row, from the document-to-document mapping
  // the reviewer works to: an Agreement's "Total Charge" pairs with the ATQ's
  // "Contract Revenue", and a Quotation's bare "Total Value" pairs with the
  // ATQ's "Total Value of Quotation (HKD)".
  //
  // ⚠ These are not all the same MONEY. "Total Value of Quotation" is what the
  // vendor charges us; "Contract Revenue" is what we charge the customer, and
  // the gap between them is the margin -- the ATQ's own P&L block prints
  // Contract Revenue, Direct Variable Cost and Gross Profit one under the
  // other. Filing them under one key was a deliberate call (they are the
  // amount, the currency is what the row is about), so expect the HKD row to
  // read differently in the Agreement and Quotation columns on an ATQ that
  // states both, and expect that to be a real difference rather than a misread.
  //
  // Anchored at both ends and allowing only a currency marker, like every other
  // amount pattern here: "Total Charge (USD)" and "Total Value (USD)" have to
  // stay out, because the two totals ARE separate Dataverse columns
  // (admin_totalcharge / admin_totalchargeusd) and a USD figure in the HKD
  // row is a wrong value, which is worse here than a missing one.
  //
  // `_new` on the revenue one is measured, not defensive: a real ATQ sheet
  // prints "Contract Revenue_New" at row 19 and "Contract Revenue_Previous" at
  // row 32, and the anchored pattern took neither. The suffix is allowed on
  // exactly the one that means this contract; _Previous is the last contract's
  // revenue and must go on matching nothing. (Note the surrounding rows --
  // "Monthly Revenue_New", "Gross Profit_New", "Retention (MA)_Previous
  // Contract Revenue" -- which the ^contract anchor is what keeps out.)
  { key: "hkd", patterns: [/total\s*value.*hkd/i, /value\s*of\s*quotation/i, /^amount/i, /^total$/i,
    /^contract\s*sum\s*(?:\(?\s*(?:hk\$|hkd|hk\s*\$)\s*\)?)?$/i,
    /^total\s*value\s*(?:\(?\s*(?:hk\$|hkd|hk\s*\$)\s*\)?)?$/i,
    /^total\s*charges?\s*(?:\(?\s*(?:hk\$|hkd|hk\s*\$)\s*\)?)?$/i,
    /^contract\s*revenue(?:_new)?\s*(?:\(?\s*(?:hk\$|hkd|hk\s*\$)\s*\)?)?$/i,
    /^(?:grand\s+|sub[-\s]?|project\s+)?total(?:\s+amount)?\s*(?:\(?\s*(?:hk\$|hkd|hk\s*\$)\s*\)?)?$/i] },
  { key: "vendor", patterns: [/vendor\s*\/\s*distributor/i, /\bvendor\b/i, /\bdistributor\b/i] },
  { key: "handledBy", patterns: [/\bcreater\b/i, /created\s*by/i] },
  { key: "iptUnitMgr", patterns: [/product\s*type/i] },
  { key: "atqRefNo", patterns: [/atq\s*ref\.?\s*no/i] },
  // The ATQ prints a bare "Quotation"; the quotation itself never does -- it
  // says "Quotation No." or "Quote No.", which is why the vendor's own copy
  // used to report no quotation number at all. Anchored so "Quotation
  // Document" still reaches quotationDoc further down this list.
  { key: "quotation", patterns: [/^quotation$/i,
    /^quotation\s*(?:no\.?|number|ref(?:erence)?\.?(?:\s*no\.?)?)$/i,
    /^quote\s*(?:no\.?|number|ref(?:erence)?\.?(?:\s*no\.?)?)$/i] },
  { key: "projectDescription", patterns: [/project\s*description/i] },
  { key: "quotationDoc", patterns: [/quotation\s*document/i] },
];

// Fallback patterns, tried only for keys FIELD_LABEL_MAP above found nothing
// for. Kept separate rather than folded into FIELD_LABEL_MAP above because
// these labels are ambiguous on their own (e.g. "To" could be many things) --
// a document that also carries a more specific label should always win.
// Added for quotation-style Agreement scans (e.g. HKT maintenance quotations)
// that never label "Customer Name" or "Contract No." as such -- they use "To"
// for the recipient and "Quotation No" as the only reference number present.
// `reject` refuses a value the pattern matched but the key cannot hold. "To" is
// also an email header, and a .mht of a forwarded vendor mail is classified by
// its filename like any other document -- without this, the Quotation column's
// Customer Name read out the recipient's mail address.
//
// The contractNo fallback stays for the quotation-style Agreement it was added
// for, but it no longer sees a label FIELD_LABEL_MAP already spent: now that
// `quotation` matches "Quotation No.", that label is a quotation number and
// belongs in one row, not two (it used to raise a Contract No. conflict against
// the ATQ's real agreement number).
const EMAIL_ADDRESS_PATTERN = /\S+@\S+\.\S/;

// A name fragment left behind by a parsed email thread. The comment on
// computeFieldDiffs below already records the shape -- a .eml pushes header junk
// like From = "Cheng," / Sent = "Wednesday," into its container's field list --
// and "To" is a mail header as often as it is a recipient, so the fallback that
// reads it has to refuse the header form. Measured: an upload whose Quotation
// column read Customer Name = "Cheung," got it from `To` on a forwarded thread,
// where the surname's own comma is all that survived of "Cheung, Marcus TH".
//
// A company name never ends in a comma, so the shape alone is enough.
const NAME_FRAGMENT_PATTERN = /,\s*$/;

// A value that is itself a column header, which is what a two-column table's
// HEADER ROW pairs into when a label:value reader walks it. Measured on
// `L260390185MZ signed contract.pdf`: the parties table is headed
// "Customer | Project" and the term table "Start Date | End Date", so
// customerName read "Project" and startDate read "End Date" -- each a wrong
// value rather than a missing one, which is the worse failure: the row looks
// answered and raises no conflict.
//
// The vocabulary is the app's own label words. That is the point: a word this
// file uses to RECOGNISE a label cannot simultaneously be a value, and keeping
// the two lists in step means the guard grows with FIELD_LABEL_MAP instead of
// drifting into an arbitrary denylist.
//
// Anchored whole, so a company called "Total Sports Limited" or a product type
// containing "Description" is untouched -- only a value that is nothing BUT a
// header word is refused. "Service" and "Product" are deliberately absent: they
// are plausible whole values for Service Type and Product Type.
const HEADER_CELL_VALUE = /^(?:customers?|clients?|projects?|vendors?|distributors?|suppliers?|quotations?|quotes?|contracts?|agreements?|amounts?|totals?|dates?|start\s*dates?|end\s*dates?|items?|descriptions?|remarks?|currency|prices?|qty|quantity)$/i;

const FIELD_LABEL_FALLBACKS = [
  { key: "customerName", patterns: [/^to$/i],
    reject: v => EMAIL_ADDRESS_PATTERN.test(v) || /&nbsp;|&#\d+;/i.test(v)
      || NAME_FRAGMENT_PATTERN.test(v) },
  // A maintenance-quotation letter names both companies, and the one it labels
  // most plainly is the wrong one:
  //
  //     Company Name:  HKT Limited     <- the buyer. On these emails, us.
  //     End user:      OCBC            <- the customer the ATQ names.
  //
  // So "End user" is read and "Company Name" deliberately is not -- taking the
  // buyer would print our own name in the Quotation column's Customer Name and
  // contradict the ATQ on every upload.
  //
  // A fallback rather than a FIELD_LABEL_MAP pattern, because "first match wins"
  // up there means the *document's* order decides, not the pattern's: a document
  // carrying both labels would hand the row to whichever came first on the page.
  // Down here, any document that says "Customer Name" has already answered.
  // Anchored at both ends, or "End user address" would put an address in it.
  { key: "customerName", patterns: [/^end[\s-]?users?(\s*name)?$/i] },
  // What a quotation calls its own issuer: "For and on behalf of / NEXUS2S Asia
  // Limited". A fallback, not a rule -- any document that labels a vendor
  // properly has already answered above.
  { key: "vendor", patterns: [/^(?:for\s+and\s+)?on\s+behalf\s+of$/i] },
];

// Same reasoning as FIELD_LABEL_FALLBACKS: some quotation-style Agreements
// never label "Start Date"/"End Date" separately -- they state one combined
// "Maintenance Period: 01-Jul-2026 to 30-Jun-2027" field instead. Split
// rather than copied verbatim, since startDate/endDate are elsewhere assumed
// to each hold one date (parseIsoDate for Save, normDate for cross-document
// comparison).
const PERIOD_LABEL_PATTERN = /maintenance\s*period|service\s*period|contract\s*period/i;

// A range's two sides, and the separator between them. The dash spellings are
// what `L260390185MZ signed contract.pdf` uses -- "Maintenance Period:
// 1 Apr 2026 - 31 Mar 2027" -- and they have to be surrounded by whitespace, or
// the hyphens INSIDE "1-Apr-2026" and "2026-04-01" would split a single date
// into a range of two halves of itself.
const PERIOD_RANGE_PATTERN = /(.+?)\s+(?:to|-|–|—|~)\s+(.+?)\s*(?:\(|$)/i;
// Each side has to look like a date: a digit, and short enough to be one. Both
// checks earn their place on one corpus value -- e0.eml states its Maintenance
// Period as "Please refer to Appendix", which the separator alone happily split
// into start "Please refer" / end "Appendix".
const PERIOD_SIDE_MAX_CHARS = 24;

function looksLikeDate(value) {
  const s = String(value == null ? "" : value).trim();
  return !!s && s.length <= PERIOD_SIDE_MAX_CHARS && /\d/.test(s)
    && s.split(/\s+/).length <= 4;
}

function splitPeriodRange(value) {
  const m = String(value).match(PERIOD_RANGE_PATTERN);
  if (!m) return null;
  const start = m[1].trim(), end = m[2].trim();
  if (!looksLikeDate(start) || !looksLikeDate(end)) return null;
  return { start, end };
}

// Only try mapping keys that plausibly appear on a given attachment type, to
// avoid e.g. picking up a stray "PO" mention inside a Vendor Quotation.
const ATTACHMENT_FIELD_SCOPE = {
  // `quotation` is in scope here now that FIELD_LABEL_MAP knows a quotation's
  // own spelling of it: the document whose number it is should be able to fill
  // the form's Quotation field when it is the file the reviewer dropped.
  "Vendor Quotation": ["customerName", "vendor", "hkd", "quotation"],
  "Contract": ["customerName", "startDate", "endDate", "contractNo"],
  "ATQ": ["customerName", "startDate", "endDate", "contractNo", "hkd", "vendor", "handledBy", "iptUnitMgr", "atqRefNo", "quotation", "projectDescription", "quotationDoc"],
  "Excel": ["customerName", "startDate", "endDate", "contractNo", "hkd", "vendor", "handledBy", "iptUnitMgr", "atqRefNo", "quotation", "projectDescription", "quotationDoc"],
};

// The UID (e.g. "UID-26-07-0126-2-3") isn't a labeled field anywhere in the
// source documents -- it only shows up embedded in free text such as the
// email subject line ("...HONG KONG DESIGN CENTRE LIMITED - (UID-26-07-0126-2-3)...").
// So it can't go through FIELD_LABEL_MAP's label matching; it's pulled out of
// the parsed plain text directly with a regex instead.
// A group may end in LETTERS: a real subject carries "(UID-26-06-0037A)", and a
// digits-only pattern read it as "UID-26-06-0037" -- a UID that is not the one
// printed, silently, which is worse than none at all (nothing on screen says the
// last character was dropped).
//
// The `i` flag is gone and the literal is spelled [Uu][Ii][Dd] instead, so the
// suffix class stays case-SENSITIVE. With `i` in force, "[A-Z]" also matches
// lowercase, and free text that glues a word onto the number -- "UID-26-07-0126and
// approved" in a forwarded body -- would have been swallowed into the UID. Real
// UIDs are printed uppercase, so requiring uppercase costs nothing and closes
// that door. Three characters is the cap for the same reason: a suffix, not a word.
//
// **But a suffix is not always uppercase.** A real subject carries
// "G260690247TS_WIFI_(UID-26-06-0151-1b)" -- lowercase b -- and the uppercase-only
// class read it as "UID-26-06-0151", dropping the character that distinguishes
// this request from "-1a". That is the same silent-truncation failure the
// uppercase rule was written to prevent, arriving from the other side.
//
// So the suffix is TWO alternatives, not one widened class:
//   [A-Z]{1,3}          -- an uppercase suffix, unchanged
//   [a-z](?![A-Za-z])   -- ONE lowercase letter, and only if no letter follows
// The pair is what keeps "UID-26-07-0126and approved" out. The lookahead alone
// would not: "and" ends at a space, so a three-character lowercase class would
// still swallow it. The one-character cap alone would not either: it would take
// the "a" of "and" and report "UID-26-07-0126A", a wrong UID rather than a short
// one. Together, "a" is rejected for being followed by "n" and the number stands
// on its own, while "-1b)" is accepted because ")" is not a letter.
const UID_PATTERN =
  /[Uu][Ii][Dd][-\s]?\d+(?:[A-Z]{1,3}|[a-z](?![A-Za-z]))?(?:[-\s]\d+(?:[A-Z]{1,3}|[a-z](?![A-Za-z]))?)*/;

// The printed case is kept. `toUpperCase()` used to run over the whole match,
// which was harmless while every suffix the pattern could match was already
// uppercase -- now that "-1b" matches, uppercasing it would hand back
// "UID-26-06-0151-1B", every character present but not the value the email
// prints. Only the "UID" prefix is normalised, so a body writing "uid-26-..."
// still reports one spelling. Cross-checks are unaffected either way: `uid`
// compares through normRef, which strips to [A-Z0-9] before comparing.
function normaliseUid(raw) {
  return String(raw).replace(/\s+/g, "-").replace(/^[Uu][Ii][Dd]/, "UID");
}

function extractUid(text) {
  if (!text) return null;
  const m = text.match(UID_PATTERN);
  return m ? normaliseUid(m[0]) : null;
}

/* ---------- The email subject as a record of its own ----------

   A PR request's subject line states, in one string, several things no single
   attachment does:

     2_NON-BTB PR REQUEST (Item 10) - NEW CHARM MANAGEMENT LTD - (UID-26-04-0143-10)Type-Logger - HP - Chu Patrick WK(10-Nice Systems BV)
     ^^^^^^^                          ^^^^^^^^^^^^^^^^^^^^^^^     ^^^^^^^^^^^^^^^^^ ^^^^^^                                ^^ ^^^^^^^^^^^^^^
     back-to-back                     customer                    uid               product type                         item  vendor

   None of it fills the form. Procurement sends ONE email per item, so what the
   subject has authority over is *which item this email is about*; the values
   themselves still come from the Cost worksheet, which is the document of
   record. What this buys is a second, independent witness to compare that
   worksheet against -- and on the one email measured end to end it contradicts
   the ATQ sheet's container-level Vendor ("Ingram,Tech Data,AEM") in favour of
   the Cost sheet's per-item one ("Nice Systems BV"), and the workbook's
   Back-to-Back "N" over the PDF print's "Y". Both are the answer the Cost
   worksheet already gave. */

// The Subject header the engine writes at the top of a parsed .msg/.eml
// (processMsg / processEml both push "Subject: " + subject before the body).
//
// Read as its OWN LINE rather than by scanning the whole plain text: a
// forwarded or replied thread quotes an older UID further down, and matching
// the first occurrence anywhere in the text only lands on the right one
// because the header happens to be printed first. That is luck, not a rule.
const SUBJECT_HEADER_LINE = /^[ \t]*Subject[ \t]*:[ \t]*(.*)$/im;

function subjectLineOf(text) {
  const m = String(text == null ? "" : text).match(SUBJECT_HEADER_LINE);
  return m ? m[1].trim() : "";
}

// "(10-Nice Systems BV)" at the tail -- the item number and the vendor stated
// together, and the one item marker present on every real subject measured.
// It is deliberately preferred over both of the alternatives:
//
//   - "(Item 10)" is printed on only some subjects.
//   - The UID's own trailing group is NOT the item number. One real subject
//     carries UID-26-04-0045-2 and (3-DCSS Technology (Hong Kong) Limited) at
//     the same time, and another carries UID-26-06-0037 with (1-Cisco). It
//     agrees often enough to look like a rule and is not one.
//
// Two things make this harder than a regex anchored at the end. A vendor's name
// nests its own brackets -- "(3-DCSS Technology (Hong Kong) Limited)" -- so the
// closer is found by walking the nesting rather than by taking the first ")".
// And a customer's name carries brackets too -- "FUBON BANK (HONG KONG)
// LIMITED" -- so the opener has to be more than "(": the digits-then-dash is
// what tells the two apart, since a customer name does not start with a number.
function trailingItemVendor(subject) {
  const s = String(subject == null ? "" : subject);
  // Built per call rather than hoisted: /g carries lastIndex between calls.
  const opener = /\((\d{1,3})\s*[-\u2013]\s*/g;
  let at = -1, itemNo = "", width = 0, m;
  while ((m = opener.exec(s))) { at = m.index; itemNo = m[1]; width = m[0].length; }
  if (at < 0) return null;
  let depth = 1, vendor = "";
  for (const ch of s.slice(at + width)) {
    if (ch === "(") depth++;
    else if (ch === ")") { depth--; if (!depth) break; }
    vendor += ch;
  }
  // An unterminated tail is still read: this runs over a saved .msg's FILE NAME
  // as well as its subject, and Windows truncates a long one at the path limit.
  // `at` is reported so subjectTypeBlock knows where the type block stops; it
  // is the opener's own index, i.e. the "(" of "(2-NEXUS2S)".
  return { itemNo, vendor: vendor.trim(), at };
}

// "Type-Logger", printed against the UID's closing bracket and running to the
// next " - ". Anchored on the literal word rather than on position, so a
// subject that spaces it differently still reads.
//
// The opener is a BARE dash and the terminator a SPACED one, which is not a
// typo: the subject writes "Type-Logger" glued and " - " spaced, and a class
// that stopped at any dash would cut a type that contains one -- "Type-Wi-Fi"
// would report "Wi". Same rule as subjectCustomer, for the same reason.
const SUBJECT_TYPE = /Type\s*[-\u2013:]\s*(.+?)\s*(?:\s[-\u2013]\s|$)/i;

// \b is the wrong tool here. "2_NON-BTB" glues the token to an underscore,
// which IS a word character, so \bNON never matches while \bBTB does -- reading
// a NON-BTB request as back-to-back, the exact opposite of what it says. NON is
// tested first for the same reason: every NON-BTB subject also contains BTB.
const SUBJECT_NON_BTB = /(?:^|[^A-Za-z])NON[\s_-]*BTB(?![A-Za-z])/i;
const SUBJECT_BTB = /(?:^|[^A-Za-z])BTB(?![A-Za-z])/i;

// "(Item 10)" or "(Item 2 & 3)", when it is printed. Kept beside the trailing
// bracket's answer rather than merged into it: two markers that disagree is a
// fact worth being able to report, and merging them throws it away.
//
// This marker and the trailing "(N-Vendor)" one answer DIFFERENT questions. The
// printed list says which items of the Cost worksheet this whole PR request
// covers; the trailing bracket says which single one THIS email is about.
// Procurement sends one email per item, so "(Item 2 & 3)" appears on both of
// item 2's and item 3's mail -- identical there, differing in the tail.
const SUBJECT_ITEMS_PRINTED =
  /\(\s*items?\s*(?:nos?\.?)?\s*(\d{1,3}(?:\s*(?:[,&+]|and)\s*\d{1,3})*)\s*\)/i;
const SUBJECT_ITEM_SEP = /\s*(?:[,&+]|and)\s*/i;

// The capture is digits-and-separators only, so no filtering is needed after
// the split and none is done -- a guard nothing can reach reads as a rule and
// is not one.
function printedItemList(subject) {
  const m = String(subject == null ? "" : subject).match(SUBJECT_ITEMS_PRINTED);
  return m ? m[1].split(SUBJECT_ITEM_SEP) : [];
}

// The square bracket's whole content -- "Type-UCBV AV Equipment - Chang, Kelvin
// KW; Lam, Kelvin CK" -- kept verbatim beside the narrow productType rather
// than replacing it. The narrow one is what the cross-check compares against a
// document's Product Type; this one carries the requestors' names glued on, so
// it would never agree with any document and would report a standing conflict
// where there is none. Display uses this, comparison uses the other.
//
// It starts at the literal "Type" and stops at the trailing "(N-Vendor)"
// opener, so the vendor bracket is never swallowed.
function subjectTypeBlock(s, from, tailAt) {
  const seg = String(s).slice(from, tailAt >= 0 ? tailAt : undefined);
  const i = seg.search(/Type\s*[-\u2013:]/i);
  if (i < 0) return "";
  return seg.slice(i).replace(/[\s\]\)]+$/, "").trim();
}

// Everything before the UID bracket is request-type furniture followed by the
// customer -- "1.2 PO1591822 po closed BTB PR REQUEST (Item 4) - FUBON BANK
// (HONG KONG) LIMITED - (UID..." -- so the customer is read BACKWARDS from the
// UID, not forwards from the start, where the furniture has no fixed shape.
//
// Split on a SPACED dash, never on a bare one: "PCCW-HKT" and "NON-BTB" are one
// token each, and a character class that excluded dashes would cut both.
function subjectCustomer(before) {
  const trimmed = String(before == null ? "" : before).replace(/[\s(\u2013-]+$/, "");
  const parts = trimmed.split(/\s+[-\u2013]\s+/).map(x => x.trim()).filter(Boolean);
  return parts.length > 1 ? parts[parts.length - 1] : "";
}

// null for anything that is not a subject at all. Every field is independently
// optional -- a subject that states only some of them reports the rest as ""
// rather than failing, because a partial witness is still a witness.
function parseEmailSubject(subject) {
  const s = String(subject == null ? "" : subject).replace(/\.(msg|eml)\s*$/i, "").trim();
  if (!s) return null;
  const uidM = s.match(UID_PATTERN);
  const from = uidM ? uidM.index + uidM[0].length : 0;
  const typeM = s.slice(from).match(SUBJECT_TYPE);
  const covered = printedItemList(s);
  const tail = trailingItemVendor(s) || {};
  // A printed list of MORE than one item names no single item, so it is not
  // allowed to stand in for the trailing bracket. "(Item 2 & 3)" falling back
  // to 2 would be a near miss, and landing on the wrong item is worse than
  // landing on none -- every value on the page would then belong to something
  // nobody asked about, with nothing on screen saying so.
  const printedOne = covered.length === 1 ? covered[0] : "";
  return {
    subject: s,
    uid: uidM ? normaliseUid(uidM[0]) : "",
    productType: typeM ? typeM[1].trim() : "",
    productTypeRaw: subjectTypeBlock(s, from, tail.at == null ? -1 : tail.at),
    // The trailing bracket decides; a single printed "(Item N)" is the fallback
    // for a subject that prints one and not the other.
    itemNo: tail.itemNo || printedOne,
    itemNoPrinted: printedOne,
    // Which items of the Cost worksheet this PR request covers, in the order
    // printed. [] when the subject does not print the marker at all -- silence,
    // not a guess assembled from the one item the tail happens to name.
    itemsCovered: covered,
    vendor: tail.vendor || "",
    customerName: uidM ? subjectCustomer(s.slice(0, uidM.index)) : "",
    backToBack: SUBJECT_NON_BTB.test(s) ? "N" : (SUBJECT_BTB.test(s) ? "Y" : ""),
  };
}

// The email this upload came from, read once for every surface that wants it.
// Every attachment tab is scanned because a mail can be dropped on any of them,
// and only a container that really was one carries a Subject header.
//
// The FILE NAME is the second place to look. A .msg saved to disk is named
// after its subject -- exactly that, on all five real ones measured -- so a mail
// whose bytes MsgReader could not open, or one saved and re-dropped by hand,
// still has its subject printed on the outside.
//
// The two tiers are not symmetrical, and the asymmetry is the point: a real
// Subject header is taken even when it carries no UID, but a file name is taken
// only when it does. Otherwise every loose "quotation.pdf" dropped on a tab
// would present itself as this email's subject line.
function emailSubjectOf(attachments) {
  const entries = ATTACHMENT_TYPES.map(k => attachments && attachments[k]).filter(Boolean);
  const fromHeader = entries.map(e => parseEmailSubject(subjectLineOf(e.text))).filter(Boolean);
  const fromName = entries.map(e => parseEmailSubject(e.file)).filter(Boolean).filter(p => p.uid);
  return fromHeader.find(p => p.uid) || fromName[0] || fromHeader[0] || null;
}

// The UID for this upload. The email states it; the form field is the fallback
// for a manually-created or non-email upload, and applyUid has already filled
// that from the whole plain text -- so a UID printed in a mail's BODY rather
// than its subject still arrives here, one tier down.
//
// `subject` is an optional pre-parsed emailSubjectOf result. It exists because
// this reads every attachment's WHOLE plain text, and an email carrying a
// 22-page scanned PDF is a few hundred KB of it -- App memoises the parse on
// `attachments` and hands it in, rather than paying for it on every render of a
// form the parse cannot possibly depend on. Optional, and omitting it does
// exactly what it used to.
function uidFromEmail(attachments, fields, subject) {
  const parsed = subject === undefined ? emailSubjectOf(attachments) : subject;
  if (parsed && parsed.uid) return parsed.uid;
  const v = fields && fields.uid && fields.uid.value;
  return v == null ? "" : String(v).trim();
}

// Some vendor quotations print their header as two stacked blocks -- every
// label in one, every value in the next:
//
//     Quote No.        QT-2600008
//     Quote Date  -->  15-Jul-26
//     Expiry Date      14-Oct-26
//
// so the engine's label:value pairing has nothing on the label's own line to
// pair with and reports "Quote Date => Expiry Date". The quotation number is
// still plainly in the text, so it is read back out of the text here rather
// than fixed in the engine: `Docparse/index.html` calls the same parser with
// two arguments and its output has to stay byte-identical (Docparse/CLAUDE.md).
//
// Deliberately narrow. The candidate must start with letters and contain
// digits, which a reference like QT-2600008 or Q2026050009R does and a date
// like 15-Jul-26 does not.
const QUOTATION_LABEL_LINE = /^(?:quotation|quote)\s*(?:no\.?|number|ref(?:erence)?\.?(?:\s*no\.?)?)\s*[:\uFF1A]?\s*(.*)$/i;
const QUOTATION_REF_TOKEN = /^[A-Za-z]{1,6}[-_ ]?\d[A-Za-z0-9\-_/]{3,}$/;
const QUOTATION_REF_SCAN_LINES = 8;

function quotationRefFromText(text) {
  if (!text) return null;
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(QUOTATION_LABEL_LINE);
    if (!m) continue;
    // Same line, when the document does pair them ("Quotation No.: Q2026...").
    const inline = (m[1] || "").trim();
    if (QUOTATION_REF_TOKEN.test(inline)) return inline;
    // Otherwise the value column, a few lines down past the sibling labels.
    for (let j = i + 1; j < Math.min(lines.length, i + 1 + QUOTATION_REF_SCAN_LINES); j++) {
      if (QUOTATION_LABEL_LINE.test(lines[j])) continue;
      if (QUOTATION_REF_TOKEN.test(lines[j])) return lines[j];
    }
  }
  return null;
}

// The company under a quotation's sign-off, when nothing labelled the vendor.
// Xtreme Lighting's quotation prints
//
//     For and on behalf of   Accepted By: Sign/Stamp/Date
//     Xtreme Lighting Limited
//     Authorized Signature(s)   Signature & Company Chop
//
// -- the two sign-off columns collapsed into one line, so "For and on behalf
// of" pairs with the *other* column's text and the vendor's own name is left
// standing on a line of its own.
//
// This is a guess and is built to know it. Three things hold it back:
//
//   1. **Exactly one sign-off block, or nothing.** A contract is signed by both
//      parties and prints the phrase twice; there is then no way to tell the
//      vendor's block from the customer's, so this stays silent rather than
//      naming whichever came first. A vendor quotation carries one.
//   2. The candidate has to look like a company -- a legal-form word at the end
//      (Limited, Ltd, Inc...) or at least two capitalised words -- and must not
//      be one of the boilerplate lines that live in the same block.
//   3. It runs only when no label answered (it is reached from the fallback
//      pass), and the value is a `vendor` reading like any other: the
//      cross-check still has to agree with the ATQ before anyone trusts it.
// A quotation laid out as a letter closes with "Yours Sincerely" instead, and
// DCSS's does it in the same collapsed-columns shape:
//
//     Yours Sincerely ,   Confirmed & Accepted By :
//     for DCSS Technology (Hong Kong) Ltd
//     Name: Philip Chan   Authorised Signature & Company Stamp
//
// so the cue's own line pairs with the customer's column and the vendor is left
// standing under it, exactly as above. The "exactly one cue" guard covers this
// spelling too: a letter closes once, and a bilateral contract still trips the
// guard on its two "on behalf of" blocks.
const VENDOR_SIGNOFF_CUE = /(?:^|\s)(?:(?:for\s+and\s+)?on\s+behalf\s+of|yours\s+(?:sincerely|faithfully|truly))\b\s*[,:：]?\s*/i;
// The letter prints "for <Company>". The "for" is part of the sign-off, not of
// the name, and a name left with it glued on never matches the ATQ's spelling.
// Requiring the space keeps a real "Fortress ..." out of this.
const VENDOR_SIGNOFF_FOR_PREFIX = /^for\s+/i;
const VENDOR_SIGNOFF_SCAN_LINES = 4;
// The furniture printed inside a signature block, none of which is a company.
const VENDOR_SIGNOFF_SKIP = /^(?:accepted|authoriz|authoris|signature|signed|sign\b|sign\/|stamp|date\b|name\b|title\b|position|per\b|witness|client|customer|company\s*chop|for\s+and\s+on\s+behalf)/i;
const COMPANY_FORM = /\b(?:limited|ltd|llc|llp|inc|incorporated|corp|corporation|company|co|holdings?|group|international|enterprises?|technolog(?:y|ies)|systems?|solutions?|services?)\b\.?$/i;
const TWO_CAPITALISED_WORDS = /^[A-Z0-9][\w&.'()-]*(?:\s+[A-Za-z0-9][\w&.'()-]*){1,6}$/;

function looksLikeCompanyName(line) {
  const s = String(line || "").replace(/\s+/g, " ").trim();
  if (s.length < 3 || s.length > 60) return false;
  if (!/[A-Za-z]/.test(s)) return false;
  if (/@|https?:/i.test(s)) return false;
  if (VENDOR_SIGNOFF_SKIP.test(s)) return false;
  return COMPANY_FORM.test(s) || TWO_CAPITALISED_WORDS.test(s);
}

function vendorFromText(text) {
  if (!text) return null;
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const cues = [];
  lines.forEach((l, i) => { if (VENDOR_SIGNOFF_CUE.test(l)) cues.push(i); });
  // Two parties signing, or none: not something a guess should answer.
  if (cues.length !== 1) return null;
  const i = cues[0];
  // The remainder of the cue's own line first ("On behalf of: ACME Ltd"), then
  // the lines under it.
  const candidate = line => String(line).replace(VENDOR_SIGNOFF_FOR_PREFIX, "").trim();
  const rest = candidate(lines[i].split(VENDOR_SIGNOFF_CUE).pop());
  if (looksLikeCompanyName(rest)) return rest.replace(/\s+/g, " ");
  for (let j = i + 1; j < Math.min(lines.length, i + 1 + VENDOR_SIGNOFF_SCAN_LINES); j++) {
    const c = candidate(lines[j]);
    if (looksLikeCompanyName(c)) return c.replace(/\s+/g, " ");
  }
  return null;
}

// The same idea as quotationRefFromText, for the amount. DCSS's quotation puts
// "Grand Total" and its figure at opposite ends of a table row, so the engine
// pairs neither with the other and reports the amount as its own label:
//
//     "HKD 1,755"  =>  "HKD 1,755"
//
// while "Grand Total" never becomes a label at all. The figure is plainly in the
// text, though -- page 2 prints "Grand Total HKD 1,755" on one line -- so it is
// read back out of it here, App-side, for the same reason as the two readers
// above: the fix must not move `Docparse/index.html`'s two-argument output.
//
// The currency has to be STATED. That is what makes this safe enough to guess
// from free text at all: the row it fills is HKD, so a line has to say HKD (or
// HK$) before its number is taken, and the same document's "Price (HKD) HKD
// 2,340" unit price cannot slip in because the line must begin with a Total.
const HKD_TOTAL_LINE = /^(?:grand\s+|net\s+|sub[-\s]?|project\s+)?total\b[^\d]{0,40}?(?:HK\$|HKD)\s*([\d,]+(?:\.\d{1,2})?)\s*$/i;

function hkdTotalFromText(text) {
  if (!text) return null;
  const lines = String(text).split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  for (const line of lines) {
    const m = line.match(HKD_TOTAL_LINE);
    if (m && m[1]) return m[1];
  }
  return null;
}

// The ATQ's own agreement number, which its layout hides in plain sight. The
// engine's line pass reads the row correctly --
//
//     "Agreement Number   L260390185MZ   Previous Agreement Number   L250300109KW"
//
// -- but it is a `para` block holding FOUR columns, label/value/label/value, and
// the paragraph field reader pairs a line's label with one value, not two. So the
// The printed ATQ source reported no contract number at all and only the workbook had
// one; a reviewer comparing the two documents saw one side blank rather than the
// two sides agreeing.
//
// Read from the line's own column structure rather than by regex over the whole
// line: runs of two or more spaces ARE the column boundaries here, and splitting
// on them is what keeps the two labels apart. Anchored whole per cell, so
// "Previous Agreement Number" is a different cell and cannot answer -- which
// matters more than it looks, since its value (`L250300109KW`) is a valid-looking
// reference sitting two cells away from the right one.
const FORM_ROW_COLUMN_GAP = /\s{2,}/;
const CONTRACT_LABEL_CELL = /^(?!.*\b(?:previous|prior|old|expir\w*)\b)(?:.*\s)?(?:agreement\s*(?:no\.?|number)|contract\s*(?:no\.?|number)|contract\s*ref(?:erence)?\.?\s*(?:no\.?|number)?)$/i;
// Same shape as a quotation reference: starts with letters, contains digits, long
// enough not to be a stray word. "L260390185MZ" qualifies; "N/A" does not.
const CONTRACT_REF_TOKEN = QUOTATION_REF_TOKEN;
const CONTRACT_VALUE_TOKEN = /^([A-Za-z0-9][A-Za-z0-9_\/-]*)(?:\s|$)/;

function contractNoValue(value) {
  const text = String(value == null ? "" : value).trim();
  const match = text.match(CONTRACT_VALUE_TOKEN);
  if (!match || !/[A-Za-z]/.test(match[1]) || !/\d/.test(match[1])) return text;
  return match[1];
}

function contractNoFromText(text) {
  if (!text) return null;
  for (const line of String(text).split(/\r?\n/)) {
    const cells = line.split(FORM_ROW_COLUMN_GAP).map(c => c.replace(/\s+/g, " ").trim());
    for (let i = 0; i < cells.length - 1; i++) {
      const label = cells[i].replace(/[:：]\s*$/, "").trim();
      if (!CONTRACT_LABEL_CELL.test(label)) continue;
      if (CONTRACT_REF_TOKEN.test(cells[i + 1])) return cells[i + 1];
    }
  }
  return null;
}

// `docText` is the document's own text (`doc.textBlock`), used only to recover
// a value no label reported. Optional: every caller that has no single
// document's text in hand -- and every existing two-argument call -- keeps the
// label-only behaviour.
function mapDetectedFields(rawFields, attachmentType, docText) {
  const allowedKeys = ATTACHMENT_FIELD_SCOPE[attachmentType] || FIELD_LABEL_MAP.map(m => m.key);
  const matches = {};
  // Labels FIELD_LABEL_MAP has already read. A fallback pattern is the looser
  // reading of an ambiguous label, so it must never re-read one the specific
  // pass has already understood.
  const claimed = new Set();
  const cleanOf = label => (label || "").replace(/[:\uFF1A]\s*$/, "").trim();
  // A header row dropped BEFORE either pass, and before the period pass below,
  // so no layer can read one -- a pair whose value is a bare column header is
  // not a label:value pair at all, whichever key would have claimed it.
  // Indexes stay consistent with `claimed` because both passes walk this array.
  const fields = (rawFields || []).filter(f =>
    f && f.value && !HEADER_CELL_VALUE.test(String(f.value).trim()));
  fields.forEach((f, i) => {
    if (!f || !f.value) return;
    const cleanLabel = cleanOf(f.label);
    for (const { key, patterns, reject } of FIELD_LABEL_MAP) {
      if (!allowedKeys.includes(key)) continue;
      if (!patterns.some(re => re.test(cleanLabel))) continue;
      claimed.add(i);
      // A rejected value still counts as claimed: the label WAS understood, and
      // letting a fallback re-read it would only find the same bad value by a
      // looser route.
      if (reject && reject(String(f.value).trim())) break;
      if (!matches[key]) matches[key] = key === "contractNo"
        ? contractNoValue(f.value) : String(f.value).trim(); // first match wins
      break;
    }
  });
  fields.forEach((f, i) => {
    if (!f || !f.value || claimed.has(i)) return;
    const cleanLabel = cleanOf(f.label);
    const value = String(f.value).trim();
    for (const { key, patterns, reject } of FIELD_LABEL_FALLBACKS) {
      if (!allowedKeys.includes(key)) continue;
      if (matches[key]) continue;
      if (!patterns.some(re => re.test(cleanLabel))) continue;
      if (reject && reject(value)) break;
      matches[key] = key === "contractNo" ? contractNoValue(value) : value;
      break;
    }
  });
  if (docText) {
    if (allowedKeys.includes("quotation") && !matches.quotation) {
      const ref = quotationRefFromText(docText);
      if (ref) matches.quotation = ref;
    }
    if (allowedKeys.includes("vendor") && !matches.vendor) {
      const who = vendorFromText(docText);
      if (who) matches.vendor = who;
    }
    if (allowedKeys.includes("hkd") && !matches.hkd) {
      const total = hkdTotalFromText(docText);
      if (total) matches.hkd = total;
    }
    if (allowedKeys.includes("contractNo") && !matches.contractNo) {
      const ref = contractNoFromText(docText);
      if (ref) matches.contractNo = ref;
    }
  }
  if ((allowedKeys.includes("startDate") && !matches.startDate) ||
      (allowedKeys.includes("endDate") && !matches.endDate)) {
    for (const { label, value } of fields) {
      if (!value) continue;
      const cleanLabel = (label || "").replace(/[:\uFF1A]\s*$/, "").trim();
      if (!PERIOD_LABEL_PATTERN.test(cleanLabel)) continue;
      const split = splitPeriodRange(value);
      if (!split) continue;
      if (allowedKeys.includes("startDate") && !matches.startDate) matches.startDate = split.start;
      if (allowedKeys.includes("endDate") && !matches.endDate) matches.endDate = split.end;
      break;
    }
  }
  return matches;
}

/* ---------- Cross-document field differences ---------- */

// The engine flattens every attachment's fields into one list, which cannot
// answer "which document said this?". attachments[i].fields carries the same
// values with provenance attached, and everything below reads only that. It
// matters: a saved email thread parsed out of an .eml pushes header junk like
// From = "Cheng," / Sent = "Wednesday," into its container's flattened list, so
// the flat list would invent conflicts that no document actually has.
//
// The comparison is document-versus-document, always. The PR form is never an
// input to it, so a user's own typing can never raise an alert.

// "HKD 128,400.00" / "$128,400" / "128400.-" are one amount written three ways.
const CURRENCY_WORDS = /\b(?:HKD|HK|USD|RMB|CNY|MOP|SGD|EUR|GBP|JPY|DOLLARS?)\b/gi;

function normAmount(v) {
  let s = String(v == null ? "" : v).replace(CURRENCY_WORDS, " ");
  s = s.replace(/[$\u20AC\u00A3\u00A5\uFFE5,\s]/g, "");
  s = s.replace(/\.-+$/, "");            // ".-" is the local shorthand for ".00"
  const m = s.match(/-?\d+(?:\.\d+)?/);
  if (!m) return null;
  const n = parseFloat(m[0]);
  if (!isFinite(n)) return null;
  return String(Math.round(n * 100) / 100);
}

const MONTH_NAMES = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };

// A quotation dated "26" means 2026, never 1926 — these are live contracts.
function pivotYear(y) { return y < 70 ? 2000 + y : 1900 + y; }

function isoDate(y, m, d) {
  if (!(m >= 1 && m <= 12) || !(d >= 1 && d <= 31)) return null;
  return String(y).padStart(4, "0") + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

function normDate(v) {
  const s = String(v == null ? "" : v).trim();
  if (!s) return null;
  let m;
  if ((m = s.match(/(\d{4})\s*\u5E74\s*(\d{1,2})\s*\u6708\s*(\d{1,2})\s*\u65E5?/))) return isoDate(+m[1], +m[2], +m[3]);
  // Year-first is never ambiguous, so it goes before everything else.
  if ((m = s.match(/\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/))) return isoDate(+m[1], +m[2], +m[3]);
  if ((m = s.match(/\b(\d{1,2})[\s\-\/.]*([A-Za-z]{3,9})[\s\-\/.,]*(\d{2,4})\b/))) {
    const mo = MONTH_NAMES[m[2].slice(0, 3).toLowerCase()];
    if (mo) return isoDate(m[3].length <= 2 ? pivotYear(+m[3]) : +m[3], mo, +m[1]);
  }
  if ((m = s.match(/\b([A-Za-z]{3,9})[\s\-\/.]*(\d{1,2})[\s\-\/.,]*(\d{2,4})\b/))) {
    const mo = MONTH_NAMES[m[1].slice(0, 3).toLowerCase()];
    if (mo) return isoDate(m[3].length <= 2 ? pivotYear(+m[3]) : +m[3], mo, +m[2]);
  }
  // All-numeric and genuinely ambiguous. Read it as DD/MM (the HK convention);
  // a first part over 12 settles it as DD/MM regardless, and a second part over
  // 12 settles it the other way just as firmly.
  if ((m = s.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/))) {
    let d = +m[1], mo = +m[2];
    if (d <= 12 && mo > 12) { const t = d; d = mo; mo = t; }
    return isoDate(m[3].length <= 2 ? pivotYear(+m[3]) : +m[3], mo, d);
  }
  return null;
}

// Company-form suffixes and locale tags carry no identity: "ABC Company
// Limited", "ABC COMPANY LTD." and "ABC Co (HK) Ltd" are one customer.
const NAME_SUFFIXES = /\b(?:LIMITED|LTD|INCORPORATED|INC|CORPORATION|CORP|COMPANY|CO|HOLDINGS?|GROUP|PLC|LLC|LLP|PTE|SDN|BHD|GMBH)\b/g;

function normName(v) {
  let s = String(v == null ? "" : v).toUpperCase();
  s = s.replace(/\([^)]*\)/g, " ");      // "(HK)", "(Asia)" — a locale, not a company
  s = s.replace(/[.,;:'"&\/\\_+-]/g, " ");
  s = s.replace(NAME_SUFFIXES, " ");
  s = s.replace(/\s+/g, " ").trim();
  // "A B C", left behind by "A.B.C." above and produced constantly by OCR
  // spacing out an initialism, is one word.
  s = s.replace(/\b[A-Z0-9](?: [A-Z0-9])+\b/g, run => run.replace(/ /g, ""));
  return s || null;
}

function normRef(v) {
  const s = String(v == null ? "" : v).toUpperCase().replace(/[^A-Z0-9]/g, "");
  return s || null;
}

// For values that are neither a name, an amount, a date nor a reference — a
// product or service classification, a yes/no flag. Punctuation and spacing
// vary between a workbook cell and the same cell printed to PDF and read back
// by column clustering; the words do not.
function normText(v) {
  const s = String(v == null ? "" : v).toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();
  return s || null;
}

// Two tokens count as the same word when one abbreviates the other — "CTR" for
// "CENTRE", "INTL" for "INTERNATIONAL": same initial, the shorter is a
// subsequence of the longer, and the shorter is at least 3 characters so "CO"
// cannot swallow half the dictionary.
function tokenAlike(a, b) {
  if (a === b) return true;
  const short = a.length <= b.length ? a : b;
  const long = a.length <= b.length ? b : a;
  if (short.length < 3 || short[0] !== long[0]) return false;
  let i = 0;
  for (let j = 0; j < long.length && i < short.length; j++) if (long[j] === short[i]) i++;
  return i === short.length;
}

// Jaccard over token sets with tokenAlike standing in for equality: the shared
// count is how many A-tokens find an unused partner in B, and the union is
// |A| + |B| - shared.
function tokenJaccard(a, b) {
  const A = String(a || "").split(" ").filter(Boolean);
  const B = String(b || "").split(" ").filter(Boolean);
  if (!A.length || !B.length) return 0;
  const used = B.map(() => false);
  let shared = 0;
  for (const t of A) {
    for (let j = 0; j < B.length; j++) {
      if (!used[j] && tokenAlike(t, B[j])) { used[j] = true; shared++; break; }
    }
  }
  return shared / (A.length + B.length - shared);
}

// The fields with legal weight that genuinely appear on more than one document.
// Deliberately excluded: projectDescription (free text — never identical, so it
// would cry wolf on every upload), handledBy and iptUnitMgr (routing, not
// contract terms), and quotationDoc (a filename; the engine already matches
// those itself). `uid` is listed because it belongs in the comparison, but note
// it is pulled out of free text by extractUid rather than by FIELD_LABEL_MAP,
// so no document currently reports it as a labelled field.
const DIFF_KEYS = {
  customerName: normName,
  hkd:          normAmount,
  contractNo:   normRef,
  startDate:    normDate,
  endDate:      normDate,
  vendor:       normName,
  quotation:    normRef,
  atqRefNo:     normRef,
  uid:          normRef,
  // Item-level classifications. They belong to a purchased item rather than to
  // the requisition, so they only ever arrive on a record.
  productType:  normText,
  serviceType:  normText,
  backToBack:   normText,
};

// Read straight off a document's own labels instead of through
// FIELD_LABEL_MAP, because that map also drives the form's auto-fill and
// applyMatches dereferences fields[key] for every key it returns — a key with
// no form field of its own would crash it. Nothing here belongs on the form;
// these values exist only to be agreed or disagreed about.
//
// Product Type is listed even though FIELD_LABEL_MAP already matches it: there
// it feeds iptUnitMgr, which is routing and deliberately not compared, and one
// raw field can only feed one key there.
const COMPARE_ONLY_FIELDS = [
  { key: "productType", label: "Product Type", patterns: [/^product\s*type$/i] },
  { key: "serviceType", label: "Service Type", patterns: [/^service\s*type/i] },
  { key: "backToBack", label: "Back-to-Back", patterns: [/back\s*-?\s*to\s*-?\s*back/i] },
];

const COMPARE_ONLY_LABELS = COMPARE_ONLY_FIELDS.reduce((m, f) => { m[f.key] = f.label; return m; }, {});

// Back-to-Back's whole vocabulary is one character. The noise floor below
// exists to throw away OCR smudges, not answers.
const DIFF_MIN_CHARS_BY_KEY = { backToBack: 1 };

// Only name-shaped fields get a second chance. An amount that normalises
// differently is a different amount, full stop.
const FUZZY_DIFF_KEYS = ["customerName", "vendor"];
const DIFF_JACCARD_MIN = 0.8;
// A name cell that lists several parties. The ATQ workbook's Vendor column is
// per-item, but its PDF rendering prints the whole column into one cell --
// "HKT,NEXUS2S,Xtreme Lighting Limited" -- so the PDF and any single item of
// the same workbook look like two documents disagreeing when they are one
// document summarising the other. Splitting on the separators a cell actually
// uses (never on a bare "/" -- "Vendor / Distributor" values contain those).
const LIST_SEPARATORS = /[,;、，]|\s\/\s/;
// OCR noise floor. A two-character "value" off a scanned page is a smudge.
const DIFF_MIN_CHARS = 3;

const FIELD_LABELS = FIELD_DEFS.reduce((m, d) => { m[d[0]] = d[1]; return m; }, {});

// No. / Rec'd Date sit in their own narrow lead row above the rest of the
// grid, so they're pulled out of the normal 3-per-row chunking below.
const LEAD_FIELD_KEYS = ["recordNo", "recdDate"];
const LEAD_FIELD_DEFS = FIELD_DEFS.filter(([key]) => LEAD_FIELD_KEYS.includes(key));
const GRID_FIELD_DEFS = FIELD_DEFS.filter(([key]) => !LEAD_FIELD_KEYS.includes(key));

// Shared by Page 1's grid and the document viewer's "Extracted Field" tab, so
// editing a value looks and behaves identically in both places. widthClass
// overrides the default flex-1 stretch -- used by Page 1's No. / Rec'd Date
// lead row, which should size to its own content instead of sharing the full
// row width like the rest of the grid.
function renderFieldInput([key, label, , required], ctx, widthClass) {
  const { fields, crosschecks, dismissedDiffs, setField, onDissent, onSource,
    expandedKey, onToggleExpand, onDismiss } = ctx;
  const f = fields[key];
  const cc = crosschecks && crosschecks[key];
  const dismissed = !!(cc && dismissedDiffs.has(cc.dismissKey));
  // Only a hard disagreement between documents earns the mark -- "similar" is
  // informational and stays on Verify, and "unchecked" is not a failure at all.
  // The green auto-extracted background is untouched so the legend above still
  // reads true; the ring is an extra layer, not a replacement.
  const flagged = !!(cc && cc.severity === "different" && !dismissed);
  const capsules = cc ? fieldCrossCheck(cc) : null;
  const expanded = expandedKey === key;

  // The form box has stopped being the yardstick: every coloured state above is
  // document-against-document. A typed value no document backs up is still worth
  // saying — quietly, in grey, so it can never be mistaken for the documents
  // disagreeing with each other.
  const norm = DIFF_KEYS[key];
  const typed = String(f.value == null ? "" : f.value).trim();
  const unbacked = !!(cc && norm && typed && cc.clusters.length &&
    !cc.clusters.some(c => c.norm === String(norm(typed) || "")));

  return (
    <div key={key} className={`${widthClass || "flex-1"} flex flex-col gap-1.5`}>
      <div className="flex gap-1 items-center">
        <label htmlFor={`field-${key}`} className="text-[12px] leading-4 font-semibold text-[#3D3D3D]">
          {label}{required && <span className="ml-0.5 text-[#C0392B]" aria-hidden="true">*</span>}
        </label>
        {flagged && (
          <button onClick={() => onDissent(cc)} title={crosscheckSentence(cc) + " Click to open the odd one out."}
            className="ml-0.5 leading-none text-[#B78312] hover:text-[#8f6710]">⚠</button>
        )}
      </div>
      <input
        id={`field-${key}`}
        value={f.value}
        onChange={e => setField(key, e.target.value)}
        className={`field-control w-full min-h-10 px-3 py-2.5 text-[14px] leading-5 text-[#1A1A1A] rounded-lg border-[1.5px] outline-none
          ${f.auto ? "bg-[#EAF5EC] border-[#9FD9B8]" : "bg-white border-[#C5BEB6]"}
          ${flagged ? "ring-1 ring-[#B78312]" : ""}`}
      />
      {/* Which documents agree with each other, and which one is the odd one
          out. Absent entirely when no crosscheck was supplied, so a caller with
          no attachments to speak for is unchanged. */}
      {capsules && (
        <FieldCrossCheck capsules={capsules} onOpen={onSource} expanded={expanded}
          onExpand={onToggleExpand ? () => onToggleExpand(expanded ? null : key) : null} />
      )}
      {unbacked && (
        <div className="text-[9px] leading-[13px] text-[#A39B92]" style={{ fontFamily: "Newsreader, serif" }}>
          Typed value is not what any document says.
        </div>
      )}
      {expanded && cc && (
        <FieldComparePanel cc={cc} currentValue={f.value} canAdopt={true}
          onOpen={onSource} onUse={v => setField(key, v, true)}
          onDismiss={onDismiss ? () => onDismiss(cc.dismissKey) : null} dismissed={dismissed} />
      )}
    </div>
  );
}

// The normalised members of a list-valued name cell, or null when the value is
// a single party. Only name keys are ever read this way; an amount or a
// reference number containing a comma is a thousands separator or a typo, not
// a list.
function listParts(key, value) {
  if (FUZZY_DIFF_KEYS.indexOf(key) < 0) return null;
  const raw = String(value == null ? "" : value).split(LIST_SEPARATORS);
  if (raw.length < 2) return null;
  const parts = raw.map(s => (s.trim().length >= DIFF_MIN_CHARS ? DIFF_KEYS[key](s) : null)).filter(Boolean);
  return parts.length > 1 ? parts : null;
}

// True when the only thing the documents disagree about is whether the party is
// us. One copy read the letterhead instead of the counterparty, which is the
// commonest way one of these extractions goes wrong: every document in the pile
// is on HKT paper, so HKT is sitting at the top of all of them waiting to be
// mistaken for a party.
//
// Deliberately not a correction. Both values stay, both chips stay clickable,
// and the severity only softens — because HKT genuinely is the customer on an
// internal PCCW requisition, and genuinely is one of the vendors on some ATQ
// items. This can lower a warning; it must never resolve one.
function ourCompanyOnlyDissent(groups) {
  const ours = groups.filter(g => isOurCompanyName(g.norm));
  // Nobody named us, or everybody did — either way the disagreement, if there
  // is one, is about something else.
  if (!ours.length || ours.length === groups.length) return false;
  const rest = groups.filter(g => !isOurCompanyName(g.norm));
  // The documents that name somebody else must all name the SAME somebody.
  // Two real counterparties in disagreement stays a conflict, whatever else is
  // in the pile.
  return new Set(rest.map(g => g.norm)).size === 1;
}

// True when exactly one group lists several parties and every other group names
// one of them. That is one document summarising the others, not a conflict.
function listCoversRest(key, groups) {
  const listed = groups.filter(g => listParts(key, g.value));
  if (listed.length !== 1) return false;
  const parts = listParts(key, listed[0].value);
  return groups.every(g => g === listed[0] ||
    parts.some(p => p === g.norm || tokenJaccard(p, g.norm) >= DIFF_JACCARD_MIN));
}

// Which item a record belongs to, named rather than numbered. A workbook
// narrowed to the items one requisition covers keeps the form's own item
// numbers while its positions differ, so pairing by position compares item 2
// of one document against item 1 of another. Both record producers emit
// "Item No.", so there is a real key to pair on. Module scope because both
// computeFieldDiffs (cross-check) and detectFromRoles (form fill) have to
// agree on which item is live -- two copies of this drifting apart is exactly
// how they end up anchoring on different rows.
function itemNoOf(rec) {
  const f = ((rec && rec.fields) || []).find(x => /^item\s*no\.?$/i.test((x.label || "").trim()));
  const v = f && String(f.value == null ? "" : f.value).trim();
  return v || null;
}

// Which revision the offered items were read from, and which newer one the
// email also carries. The engine stamps `supersededBy` on a kept record when
// its group held a HIGHER revision that was not a workbook -- the measured
// case is a V01 workbook beside a V02 print, where the items are the
// workbook's Cost worksheet (correct: that is the list this requisition
// covers) but the VALUES on them are the ones V02 was issued to change.
//
// Read off the records the selector is actually offering, so a notice can
// never appear for an item nobody can select. Returns "" for `newer` when
// there is nothing to say, which is the overwhelmingly common case.
function supersededRevisionOf(itemRecords) {
  const withNotice = (itemRecords || []).filter(r => r && r.supersededBy);
  if (!withNotice.length) return { current: "", newer: "" };
  const refField = ((withNotice[0].fields) || [])
    .find(x => /^atq\s*ref\.?\s*no\.?$/i.test((x.label || "").trim()));
  return {
    current: (refField && String(refField.value || "").trim()) || "",
    newer: String(withNotice[0].supersededBy || "").trim(),
  };
}

// Record_ID for one item. parseCostItems reads "ATQ Ref. No." as a per-row
// cost-sheet column, so items on the same ATQ can legitimately carry different
// ones -- the record's own value wins when it has one. The PDF-print path
// (atqRecordsFromTables) deliberately does not read that column onto its
// records, so `fallbackBase` exists for that case: the caller has already
// resolved doc-level atqRefNo -> recordNo || contractNo || a session fallback,
// in that order. Kept out of this function so it stays pure and table-driven --
// recordid.test.js calls it directly with fixed inputs, no Date.now() involved.
function recordIdFor(rec, fallbackBase) {
  const refField = ((rec && rec.fields) || []).find(x => /^atq\s*ref\.?\s*no\.?$/i.test((x.label || "").trim()));
  const ownRef = refField && String(refField.value == null ? "" : refField.value).trim();
  const base = (ownRef || String(fallbackBase == null ? "" : fallbackBase).trim());
  const n = itemNoOf(rec);
  return n ? `${base}-${String(n).trim()}` : base;
}

// Disambiguates Record_IDs that would otherwise collide. The ID becomes each
// table's primary name column (admin_title on admin_purchaserequest and on
// BTB_Agreements4; admin_title4 on BTB_LIS_Excel_Datas4, BTB_ATQ_Excels4 and
// BTB_Vendor_Quotations4) -- two items silently sharing one would have the
// second overwrite the first's meaning, not just its label.
// -a/-b/... in first-seen order; a record_id that nothing else shares is
// untouched, matching today's single-item behaviour exactly.
function assignRecordIds(records, fallbackBase) {
  const list = records || [];
  const ids = list.map(rec => recordIdFor(rec, fallbackBase));
  const counts = {};
  ids.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
  const seen = {};
  return list.map((rec, i) => {
    const id = ids[i];
    if (counts[id] <= 1) return { rec, recordId: id, collided: false };
    seen[id] = (seen[id] || 0) + 1;
    const suffix = String.fromCharCode(96 + seen[id]); // a, b, c...
    return { rec, recordId: `${id}-${suffix}`, collided: true };
  });
}

// Which of an ATQ's items an email is about. Procurement sends ONE email per
// item, so this is the subject's real authority: it does not fill a value --
// the Cost worksheet stays the document of record for every one of those -- it
// decides which record's values are the ones under review.
//
// 0 for anything it cannot resolve, which is exactly the old behaviour: a
// subject with no item marker, an upload that is not an email, or an item
// number no record carries. An unmatched number is deliberately NOT treated as
// a near miss to fall back from -- landing on the wrong item is worse than
// landing on the first, because every value on the page then belongs to
// something the reviewer did not ask about and nothing says so.
//
// Compared numerically when both sides look like numbers: a workbook can hand
// back "10" or "10.0" for the same cell, and a string compare would call the
// email a stranger to its own item.
function itemIndexForSubject(records, subject) {
  const wanted = subject && subject.itemNo;
  const list = records || [];
  if (!wanted || !list.length) return 0;
  const same = (a, b) => {
    if (a == null || b == null) return false;
    const na = Number(a), nb = Number(b);
    if (isFinite(na) && isFinite(nb) && String(a).trim() !== "" && String(b).trim() !== "") return na === nb;
    return String(a).trim() === String(b).trim();
  };
  const i = list.findIndex(r => same(itemNoOf(r), wanted));
  return i < 0 ? 0 : i;
}

// The Record_ID one item will actually be saved under, read off the same
// savePlans list goSave writes from rather than recomputed from the records.
// A preview that did its own arithmetic would be free to disagree with what is
// saved, and being trusted about that is the entire job of the row that shows
// it -- including the -a/-b suffix assignRecordIds adds on a collision, which a
// recomputation from recordIdFor alone would silently drop.
//
// Clamped rather than indexed blind: a single-item upload has exactly one plan
// whatever the item tab says, and an item tab can outlive the records behind it
// for a render.
function recordIdForItem(savePlans, itemIndex) {
  const list = savePlans || [];
  if (!list.length) return "";
  const i = Math.min(Math.max(Math.floor(itemIndex) || 0, 0), list.length - 1);
  return (list[i] && list[i].recordId) || "";
}

// What Save will write, as a list of plans. Pure for the same reason
// buildRecordPayload is: goSave's create loop cannot be exercised under the
// harness, so the arithmetic it writes from has to be testable without one.
//
// TEMPORARY, and deliberately narrower than the end state: an ATQ covering
// "Item 2 & 3" really is TWO Dataverse records, and procurement sends one email
// per item to produce them. Until that per-item flow is finished the list is
// always length 1 -- the item on screen. goSave still loops over whatever it is
// given, so restoring per-item saves is this function and the savedRecordId
// lock in App, nothing else.
//
// assignRecordIds still runs over EVERY item before the pick. Its -a/-b
// collision suffix is only correct against the whole set, so narrowing the
// input rather than the output would hand item 2 an id that silently overwrites
// item 3's in Dataverse.
function planSavesForItem(itemRecords, fallbackBase, itemIndex, fields, itemPlans) {
  const list = itemRecords || [];
  if (list.length < 2) {
    const rec = list[0];
    return [{ fieldsSnapshot: fields, recordId: rec ? recordIdFor(rec, fallbackBase) : fallbackBase }];
  }
  const all = assignRecordIds(list, fallbackBase);
  // Clamped, not indexed blind: an item tab can outlive the records behind it
  // for a render, and an out-of-range index would otherwise read undefined and
  // save a record with no id at all.
  const i = Math.min(Math.max(Math.floor(itemIndex) || 0, 0), all.length - 1);
  return [{ fieldsSnapshot: (itemPlans || {})[i] || fields, recordId: all[i].recordId }];
}

// The one Record_ID this upload has already written, or "" if it has written
// none. TEMPORARY, the other half of planSavesForItem's narrowing: one upload
// writes one record, and switching to another Item tab does not earn a second
// write.
//
// Derived from savedRecordIds rather than kept as its own flag, so there is a
// single answer to "has this upload written anything" and no way for the two to
// disagree. resetRecordData / toggleDemo already clear that map, which is
// exactly when a new record legitimately starts. A FAILED save never reaches
// the map, so the lock stays open and the retry still works.
function savedRecordIdOf(savedRecordIds) {
  return Object.keys(savedRecordIds || {})[0] || "";
}

// The first ATTACHMENT_TYPES entry carrying multi-item ATQ records -- the same
// scan anchorRecordsOf does below, factored out because Record_ID assignment
// needs it too and the two must never disagree about which attachment holds
// "the items."
function recordsBearingEntry(attachments) {
  for (const typeKey of ATTACHMENT_TYPES) {
    const recs = attachments && attachments[typeKey] && attachments[typeKey].records;
    if (recs && recs.length) return recs;
  }
  return null;
}

// doc-level atqRefNo -> recordNo || contractNo || sessionFallback, the second
// and third tiers of the Record_ID fallback chain (the first, a record's own
// ATQ Ref. No., is recordIdFor's job). `fieldsSrc` is whatever fields object
// is live for the item in question -- the shared form state, or one item's
// own itemPlans snapshot.
function fallbackBaseFor(fieldsSrc, sessionFallback) {
  const v = key => (fieldsSrc[key] && fieldsSrc[key].value) ? String(fieldsSrc[key].value).trim() : "";
  return v("atqRefNo") || v("recordNo") || v("contractNo") || sessionFallback;
}

function parseDecimal(v) {
  if (!v) return null;
  const num = parseFloat(String(v).replace(/[^0-9.-]/g, ""));
  return isNaN(num) ? null : num;
}

function parseIsoDate(v) {
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d.toISOString().split("T")[0]; // YYYY-MM-DD
}

// The Dataverse payload for one Record_ID, built from one item's own fields
// snapshot -- module scope and pure so save.test.js can call it directly; the
// harness has no parent.Xrm.WebApi to build the payload against otherwise.
// admin_* column names carry the "4" suffix from the BTB_LIS_Excel_Datas4
// table recreation (see CLAUDE.md); Record_ID (admin_title4) and
// admin_prx0020reference4 both now take the resolved Record_ID rather than
// one shared prReferenceValue.
function buildRecordPayload(fieldsSnapshot, recordId, manualChecks) {
  const getVal = (key) => (fieldsSnapshot[key] && fieldsSnapshot[key].value) ? String(fieldsSnapshot[key].value).trim() : "";
  const recordPayload = {
    // Primary Name Column (Record_ID) -- Dataverse requires every record to carry a primary name value
    "admin_title4": recordId,

    // Exact lowercased column mappings verified from the recreated Dataverse
    // schema (BTB_LIS_Excel_Datas4) -- most columns carry a "4" suffix from
    // this table recreation; End Date3 / a handful of others kept their
    // schema name unchanged across the recreation (see the "NO suffix"
    // callouts in the individual comments below and in CLAUDE.md).
    "admin_prx0020reference4":            recordId,
    // "No." (column A, recordNo) and "PR No." (column I, prNo) are two
    // different values on two different Dataverse columns -- confirmed
    // against the live schema on 2026-09-03. admin_prx0020nox002e4 is "PR
    // No.", NOT "No."; writing recordNo there (as this used to) silently
    // dropped whatever the reviewer typed into "PR No." and mislabelled "No."
    // under the wrong column.
    "admin_nox002e4":                     getVal("recordNo"),
    "admin_prx0020nox002e4":              getVal("prNo"),
    "admin_recx0027dx0020datex00204":     parseIsoDate(getVal("recdDate")),
    "admin_customerx0020name4":           getVal("customerName"),
    "admin_uidx0020x0023":               getVal("uid"),
    "admin_startx0020date4":               parseIsoDate(getVal("startDate")),
    "admin_odatax0020endx0020date4":      parseIsoDate(getVal("endDate")),
    "admin_contractx0020nox002e4":        getVal("contractNo"),
    "admin_hkd4":                         parseDecimal(getVal("hkd")),
    "admin_usdx0020x002fx0020others4":    getVal("usdOthers"),
    "admin_vendor":                      getVal("vendor"),
    "admin_handledx0020byx0020":         getVal("handledBy"),
    "admin_iptx0020unitx0020mgr":        getVal("iptUnitMgr"),
    // Text columns, not Date -- same admin_ fields buildLisExcelPayload writes
    // for the quotation's own Start/End Date, which can carry a non-ISO
    // string ("TBC", a stated period). parseIsoDate must not run here, same
    // reasoning as buildLisExcelPayload's own comment on these two columns.
    "admin_startx0020date24":              getVal("quotationStartDate"),
    "admin_odatax0020endx0020date3":      getVal("quotationEndDate"),
    "admin_prx0020description":          getVal("poPrDescription"),
    "admin_pox0020date":                 parseIsoDate(getVal("poDate")),
    "admin_pox0020nox002e":              getVal("poNo"),
    "admin_receiptx0020date":            parseIsoDate(getVal("receiptDate")),
    "admin_pox0020amountx0020hkx0024":   parseDecimal(getVal("poAmountHkd")),
    "admin_umx002fmgr":                  getVal("umMgr"),
    "admin_prx0020issuedx0020month":     getVal("prIssuedMonth"),
    "admin_prx0020issuedx0020on4":        getVal("prIssuedOn"),
    "admin_worksx0020orderx0020code4":    getVal("worksOrderCode"),
    // Same three schema names DATAVERSE_LIS_SOURCE already reads back for the
    // Verify Table's own cross-check (:6769-6773) -- this write side never had
    // them, so "Issue By" / "Charge CCC" / "Account Code" typed on LIS &
    // Remark's Excel row (columns C/E/G) were silently dropped on save.
    "admin_issuex0020by":                getVal("issueBy"),
    "admin_chargex0020ccc4":              getVal("chargeCcc"),
    "admin_accountx0020code4":            getVal("accountCode"),
    "admin_yx0020x002fx0020n":           getVal("yn"),
    "admin_remarks":                     getVal("remarks"),
    // Logical names confirmed against the live Dataverse columns (Edit column
    // panel) on 2026-09-03 -- neither carries the "2" recreation suffix every
    // other column here does. Both stop mid-encoding, and both stop at
    // EXACTLY 32 characters including the "admin_" prefix -- "Invoice # / DN #"
    // and "Invoice / DN Date" each have enough spaces/symbols (each a 5-char
    // x00XX escape) that Dataverse's own auto-generated logical name hit a
    // 32-char cap before reaching the real ending. Any other column name here
    // that is close to 32 chars is worth re-checking against Dataverse for the
    // same reason -- see CLAUDE.md.
    "admin_invoicex0020x0023x0020x00": getVal("invoiceDnNo"),
    "admin_invoicex0020x002fx0020dnx": parseIsoDate(getVal("invoiceDnDate")),

    // Text column standing in for Status until the table has a real Status column: "Completed" / "Pending"
    "admin_odatacolortag":                manualChecks.every(Boolean) ? "Completed" : "Pending",
    "admin_processstatus4":                 PROCESS_STATUS.finished,
  };

  // Strips any key that is null, undefined, or empty so an optional blank
  // field never reaches Dataverse as an explicit empty write.
  return Object.fromEntries(
    Object.entries(recordPayload).filter(([_, v]) => v !== null && v !== undefined && v !== "")
  );
}

// The BTB_ATQ_Excel4 payload for one item, built the same way as
// buildRecordPayload -- module scope and pure so it can be tested without
// parent.Xrm.WebApi. Only the columns with an actual App-side data source are
// filled; ATQ_Excel_LIS, BTB_Verify, Contract_Revenue and the Dataverse
// system columns (Created, Modified, Compliance Asset Id, Color Tag, and the
// table's own primary key) are left for Dataverse/n8n to fill, same as the
// "no form input wired up yet" columns in buildRecordPayload.
function buildAtqExcelPayload(fieldsSnapshot, recordId) {
  const getVal = (key) => (fieldsSnapshot[key] && fieldsSnapshot[key].value) ? String(fieldsSnapshot[key].value).trim() : "";
  const payload = {
    "admin_title4":                    recordId,
    "admin_externalprimarykey":        recordId,
    "admin_agreementnumber4":          getVal("contractNo"),
    "admin_customername4":             getVal("customerName"),
    "admin_contractstartdatenew4":     parseIsoDate(getVal("startDate")),
    "admin_contractenddatenew4":       parseIsoDate(getVal("endDate")),
    "admin_totalvalueofquotationhkd": parseDecimal(getVal("hkd")),
    "admin_vendorname4":               getVal("vendor"),
    "admin_handleby":                 getVal("handledBy"),
    "admin_iptunitmanager":           getVal("iptUnitMgr"),
  };
  return Object.fromEntries(
    Object.entries(payload).filter(([_, v]) => v !== null && v !== undefined && v !== "")
  );
}
