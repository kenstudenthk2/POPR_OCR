// The one side this copy is running as. An unrecognised web resource (SIDE
// null) still resolves to a schema so every read path keeps working against
// demo data -- it is the WRITE paths that refuse, via SIDE_READY, rather than
// this falling through to a table it was never meant to touch.
const SCHEMA = DATAVERSE_SCHEMAS[SIDE] || DATAVERSE_SCHEMAS.dev;

const DATAVERSE_VERIFY_SOURCES = { agreement: SCHEMA.agreement, quotation: SCHEMA.quotation };
const DATAVERSE_LIS_SOURCE = SCHEMA.lis;
const DATAVERSE_ATQ_EXCEL_SOURCE = SCHEMA.atqExcel;

// Builds a Dataverse payload from a {fieldKey: value} map through one side's
// `write` column map. A field key the current side has no column for is
// dropped here rather than reaching Xrm as an undefined key: Dataverse
// rejects the WHOLE create on an unknown column, so one absent column would
// otherwise lose the entire record, not just that one value.
//
// null / undefined / "" are dropped as well, same as the hand-written
// sanitizers this replaces -- an optional blank field must never reach
// Dataverse as an explicit empty write.
// The Web API, but only when this copy knows which side it is. An
// unrecognised web resource has no business writing anywhere: the two sides
// are separate tables, so guessing would put the Admin app's rows into the
// dev tables, which is unrecoverable and looks on screen exactly like a
// correct save. Reads are left alone -- a read against the wrong table shows
// nothing and corrects itself, and blocking them would leave a reviewer
// staring at an empty app with no idea why.
function writeApi() {
  const api = (typeof parent !== "undefined") && parent && parent.Xrm && parent.Xrm.WebApi;
  if (!api) return null;
  if (!SIDE_READY) {
    console.warn("Web resource not recognised (" + (typeof location !== "undefined" ? location.pathname : "no location") +
      ") -- refusing to write to Dataverse. Add it to SIDE_BY_RESOURCE, or open the page with ?side=dev / ?side=admin.");
    return null;
  }
  return api;
}


// Stamps one Record_ID's process status on its LIS row. Admin-side only --
// on the dev side SCHEMA.lis.write has no processStatus column, which is
// what markProcessStage checks before ever calling this.
async function writeLisProcessStatus(recordId, statusValue, webApi) {
  const column = SCHEMA.lis.write.processStatus;
  // No column on this side means this side has no process status at all --
  // return rather than writing to a name that does not exist there, which
  // Dataverse answers by rejecting the whole request.
  if (!webApi || !recordId || !column) return;
  try {
    const existingId = await findExistingLisRecordId(recordId, webApi);
    if (!existingId) {
      console.warn("No " + SCHEMA.lis.entity + " row yet for Record_ID " + recordId + " -- skipping " + column + " update.");
      return;
    }
    const patch = {};
    patch[column] = statusValue;
    await webApi.updateRecord(SCHEMA.lis.entity, existingId, patch);
  } catch (err) {
    console.error("Could not update " + column + " for Record_ID " + recordId + ":", err);
  }
}

function mapPayload(columns, values) {
  const out = {};
  Object.keys(values || {}).forEach(key => {
    const column = columns && columns[key];
    if (!column) return;
    const value = values[key];
    if (value === null || value === undefined || value === "") return;
    out[column] = value;
  });
  return out;
}

function dataverseVerifyQuery(recordId, source) {
  const escaped = String(recordId || "").replace(/'/g, "''");
  return "?$select=" + source.select.join(",") + "&$filter=" + source.titleField + " eq '" + escaped + "'";
}

// ---- The Product Type -> coding lookup behind the Verify Table's "Pair" ----

// How a Product Type is matched against the lookup table's own spelling:
// case-insensitive, and blind to surrounding AND internal runs of whitespace.
//
// It has to be this forgiving because the two sides of the comparison are
// typed by different people for different purposes. The left-hand value is
// read off the ATQ Cost sheet by OCR or by the sheet reader ("UCBV AV
// Equipment"), and the right-hand one is procurement maintaining a reference
// table by hand. A trailing space nobody can see, or a double space between
// two words, is not a different product type -- but it IS a different string,
// and an exact match would report "not found" while the reviewer stares at two
// lines that read identically.
//
// Deliberately NOT done in the OData $filter. `tolower()` exists there;
// trimming does not, so a stored value with a trailing space would still miss
// and the failure would look exactly like a Product Type nobody has coded yet.
// The whole table is small (one row per valid coding combination) and is read
// whole instead -- see SCHEMA.cccLookup's note on having no titleField.
function normCodeKey(value) {
  return String(value == null ? "" : value).trim().replace(/\s+/g, " ").toLowerCase();
}

// Pure, so the harness can pin it without a Dataverse. Takes the rows exactly
// as retrieveMultipleRecords hands them back plus the side's own `fields` map,
// and answers the three questions the Pair button asks.
//
// Returns null for "this Product Type is not in the table" -- distinct from a
// row that matched but codes nothing, which comes back as a result with empty
// strings. The button says something different for each, because "procurement
// has not coded this product type" and "procurement coded it blank" are not
// the same message to put in front of a reviewer.
function pairCodesFromLookup(rows, productType, fields) {
  const wanted = normCodeKey(productType);
  if (!wanted || !fields) return null;
  const cell = (row, key) => {
    const column = fields[key];
    if (!column) return "";
    const v = row && row[column];
    return v == null ? "" : String(v).trim();
  };
  const matched = (rows || []).filter(r => normCodeKey(cell(r, "productType")) === wanted);
  if (!matched.length) return null;
  // Every matching row carries the same Charge CCC and Account Code -- that is
  // procurement's own rule for the table, confirmed 2026-09-24, and it is what
  // makes filling those two straight away correct while Works Order Code has
  // to be asked about. The rule is checked rather than trusted: a table that
  // stopped holding to it would otherwise have this button silently pick the
  // first row's codes and pair them with another row's works order, which is a
  // combination that exists nowhere in the table. `conflict` puts that on
  // screen instead.
  const distinct = key => {
    const seen = [];
    matched.forEach(r => {
      const v = cell(r, key);
      if (v && seen.indexOf(v) === -1) seen.push(v);
    });
    return seen;
  };
  const cccs = distinct("chargeCcc");
  const accounts = distinct("accountCode");
  // Issue By (admin_admin2) is treated like Charge CCC and Account Code, NOT
  // like Works Order Code: one Admin per Product Type, filled straight away,
  // and a table that disagrees with itself reports a conflict instead of
  // having this button pick the first row silently. That is the same "checked
  // rather than trusted" call as the two above, and it is the one assumption
  // here worth re-reading if procurement's table ever lists several Admins for
  // one Product Type -- the fix would be to move it to `worksOrderCodes`'
  // picker shape, not to widen the conflict message.
  const admins = distinct("issueBy");
  const woDescMap = {};
  matched.forEach(r => {
    const code = cell(r, "worksOrderCode");
    const desc = cell(r, "description");
    if (code && !woDescMap[code] && desc) {
      woDescMap[code] = desc;
    }
  });
  const woCodes = distinct("worksOrderCode");
  const woOptions = woCodes.map(code => ({
    code: code,
    description: woDescMap[code] || "",
  }));
  return {
    chargeCcc: cccs[0] || "",
    accountCode: accounts[0] || "",
    issueBy: admins[0] || "",
    worksOrderCodes: woCodes,
    worksOrderOptions: woOptions,
    conflict: cccs.length > 1 || accounts.length > 1 || admins.length > 1,
    matchedCount: matched.length,
  };
}

// The read half of FEATURES.verifyCodePair's guard pair. Returns null -- never
// throws and never queries -- when this side has no cccLookup (the Admin side
// today) or when there is no Dataverse to ask (standalone/demo, the same
// degradation every other read path here follows).
async function fetchCccLookupRows() {
  const source = SCHEMA.cccLookup;
  if (!source) return null;
  const webApi = parent && parent.Xrm && parent.Xrm.WebApi;
  if (!webApi) {
    console.warn("[PR Assistant] No Xrm.WebApi -- Pair cannot read " + source.entity);
    return null;
  }
  const response = await webApi.retrieveMultipleRecords(
    source.entity, "?$select=" + source.select.join(","));
  return (response && response.entities) || [];
}

// Whether "Continue to save" is about to duplicate an already-saved
// BTB_LIS_Excel_Datas row -- checked before every write so a Record_ID that
// was saved before (in an earlier session, or after a reload reset
// lisExcelWritten) gets an update prompt instead of a second create hitting
// whatever the connector's own uniqueness handling does with that.
//   null   -- no existing row for this Record_ID; safe to create
//   ""     -- an existing row was found but its id column, expected under
//             Dataverse's own <entity logical name>id convention, was not on
//             the response -- caller must not attempt to update with this
//   <guid> -- an existing row's id; safe to update
async function findExistingLisRecordId(recordId, webApi) {
  if (!webApi || !recordId) return null;
  const response = await webApi.retrieveMultipleRecords(
    DATAVERSE_LIS_SOURCE.entity, dataverseVerifyQuery(recordId, DATAVERSE_LIS_SOURCE));
  const entity = response.entities && response.entities[0];
  if (!entity) return null;
  return entity[DATAVERSE_LIS_SOURCE.entity + "id"] || "";
}

// One id lookup, one updateRecord call, however many columns are in `patch`
// -- the Master Records Manage modal batches every dirty field of a record
// into a single write through this rather than one round trip per field.
//
// `patch` is keyed by the app's OWN field keys, not by column names, and each
// one is resolved through SCHEMA.lis.records here. A key this side has no
// column for is DROPPED rather than sent: Dataverse rejects the whole update
// on one unknown column, so an absent column would otherwise cost the
// reviewer every other field they typed in the same Save. Same rule, same
// reason, as mapPayload on the create path.
//
// Returns { ok, error } rather than throwing, because every caller is a UI
// handler that has to keep the reviewer's drafts on screen to retry with.
async function writeMasterRecordFields(recordId, patch, webApi) {
  if (!webApi || !recordId) return { ok: false, error: "Not connected to Dataverse." };
  const columns = SCHEMA.lis.records;
  const fields = {};
  const skipped = [];
  Object.keys(patch).forEach(key => {
    if (columns[key]) fields[columns[key]] = patch[key];
    else skipped.push(key);
  });
  if (skipped.length) {
    console.warn("No " + SIDE_LABEL + " column for " + skipped.join(", ") + " -- not written.");
  }
  if (Object.keys(fields).length === 0) {
    return { ok: false, error: "Nothing on this side's table to write." };
  }
  try {
    const existingId = await findExistingLisRecordId(recordId, webApi);
    if (!existingId) {
      return { ok: false, error: "No " + SCHEMA.lis.entity + " row found for Record_ID " + recordId + "." };
    }
    await webApi.updateRecord(SCHEMA.lis.entity, existingId, fields);
    return { ok: true };
  } catch (err) {
    console.error("Could not update " + Object.keys(fields).join(", ") + " for Record_ID " + recordId + ":", err);
    return { ok: false, error: err.message || String(err) };
  }
}

// admin_signaturedetection2's own choice values, mirroring the Dataverse
// column's Label/Value pairs exactly -- the Web API hands back the raw
// integer Value, not the Label a reviewer reads on screen.
const CHOP_DETECTION_CHOICES = {
  "0": "Both Chop Found",
  "1": "HKT Chop Found",
  "2": "Chop issue",
  "3": "No Chop Position",
};

function dataverseVerifyValue(value, key) {
  if (value === null || value === undefined || value === "") return "";
  if (key === "chop") return CHOP_DETECTION_CHOICES[String(value)] || String(value);
  if ((key === "startDate" || key === "endDate" || key === "quotationExpireDate") && /^\d{4}-\d{2}-\d{2}/.test(String(value))) {
    return String(value).slice(0, 10);
  }
  return String(value);
}

function dataverseVerifyRecord(kind, entity) {
  const source = DATAVERSE_VERIFY_SOURCES[kind] || (kind === "lis" ? DATAVERSE_LIS_SOURCE : null) || (kind === "atqExcel" ? DATAVERSE_ATQ_EXCEL_SOURCE : null);
  if (!source || !entity) return null;
  const result = {};
  Object.keys(source.fields).forEach(key => {
    result[key] = dataverseVerifyValue(entity[source.fields[key]], key);
  });
  return result;
}

// Shared by the manual Refresh button (one read, openVerifyAfterN8n) and the
// post-"Send to n8n" poll (repeated reads, waitForN8nCrossCheck) -- both need
// the same four Dataverse lookups, and duplicating them would drift the
// moment one gained a field the other didn't.
async function fetchDataverseVerifyRecords(recordId) {
  const read = async kind => {
    const source = DATAVERSE_VERIFY_SOURCES[kind];
    const response = await parent.Xrm.WebApi.retrieveMultipleRecords(source.entity,
      dataverseVerifyQuery(recordId, source));
    return dataverseVerifyRecord(kind, response.entities && response.entities[0]);
  };
  const agreement = await read("agreement");
  const quotation = await read("quotation");
  // ATQ Excel: the record "Send to n8n" itself writes (writeAtqExcelRecord),
  // not something n8n produces -- may briefly not exist yet either.
  let atqExcel = null;
  try {
    const atqResponse = await parent.Xrm.WebApi.retrieveMultipleRecords(
      DATAVERSE_ATQ_EXCEL_SOURCE.entity, dataverseVerifyQuery(recordId, DATAVERSE_ATQ_EXCEL_SOURCE));
    atqExcel = dataverseVerifyRecord("atqExcel", atqResponse.entities && atqResponse.entities[0]);
  } catch (_atqErr) { /* ATQ Excel record may not exist yet */ }
  // LIS query: optional — never let a missing LIS table prevent Agreement
  // and Quotation from loading.
  let lis = null;
  try {
    const lisResponse = await parent.Xrm.WebApi.retrieveMultipleRecords(
      DATAVERSE_LIS_SOURCE.entity, dataverseVerifyQuery(recordId, DATAVERSE_LIS_SOURCE));
    lis = dataverseVerifyRecord("lis", lisResponse.entities && lisResponse.entities[0]);
  } catch (_lisErr) { /* LIS table may not exist yet — lis stays null */ }
  return { agreement, quotation, atqExcel, lis };
}

function dataverseCellValue(dataverseVerify, key, roleKey) {
  const record = dataverseVerify && dataverseVerify[roleKey];
  return record && record[key] ? String(record[key]) : "";
}

// LIS value for a field key, read off the dataverseVerify state's `lis` record.
function lisCellValue(dataverseVerify, key) {
  const record = dataverseVerify && dataverseVerify.lis;
  if (!record) return "";
  if (key === "prAmount") {
    return record.prAmount || record.hkd || record.usdOthers || "";
  }
  return record && record[key] ? String(record[key]) : "";
}

// ATQ Excel value for a field key, read off the dataverseVerify state's `atqExcel` record.
function atqExcelCellValue(dataverseVerify, key) {
  const record = dataverseVerify && dataverseVerify.atqExcel;
  return record && record[key] ? String(record[key]) : "";
}

function verifyFieldLabel(label) {
  return String(label || "").replace(/[:\uFF1A]\s*$/, "").replace(/\s+/g, " ").trim();
}

function htmlTextContent(html) {
  return String(html || "")
    .replace(/<br\s*\/?>/gi, " ")
    .replace(/<[^>]*>/g, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">")
    .replace(/&quot;/gi, '"')
    .replace(/&#39;/g, "'")
    .replace(/\s+/g, " ")
    .trim();
}

function worksheetRows(sheet) {
  if (!sheet || !sheet.html) return [];
  return (String(sheet.html).match(/<tr[\s\S]*?<\/tr>/gi) || []).map(rowHtml => {
    const cells = [];
    String(rowHtml).replace(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi, (_, cellHtml) => {
      cells.push(htmlTextContent(cellHtml));
      return "";
    });
    return cells;
  }).filter(cells => cells.length);
}

function worksheetValueByLabel(attachments, source, sheetPattern, labelPatterns, layout) {
  if (!source || !sheetPattern || !labelPatterns || !labelPatterns.length) return "";
  const entry = attachments && attachments[source.typeKey];
  const doc = docAt(attachments, source);
  const sheet = sheetPagesFor(entry, doc).find(s => sheetPattern.test(String(s.sheetName || "")));
  if (!sheet || !sheet.html) return "";
  const rows = worksheetRows(sheet);
  if (layout === "horizontal") {
    for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
      const headerIndex = rows[rowIndex].findIndex(cell => {
        const label = verifyFieldLabel(cell);
        return labelPatterns.some(p => p.test(label));
      });
      if (headerIndex < 0) continue;
      for (let dataIndex = rowIndex + 1; dataIndex < rows.length; dataIndex++) {
        const value = rows[dataIndex][headerIndex];
        if (String(value || "").trim()) return String(value);
      }
      return "";
    }
    return "";
  }
  for (const cells of rows) {
    if (cells.length < 2) continue;
    const label = verifyFieldLabel(cells[0]);
    if (!labelPatterns.some(p => p.test(label))) continue;
    const value = cells.slice(1).find(c => String(c || "").trim());
    return value ? String(value) : "";
  }
  return "";
}

function lastSemicolonName(value) {
  const parts = String(value || "").split(";");
  return (parts[parts.length - 1] || "").trim().replace(/[.。]\s*$/, "").trim();
}

function transformAtqExcelValue(value, transform) {
  if (!String(value || "").trim()) return "";
  if (transform === "lastSemicolonName") return lastSemicolonName(value);
  return String(value);
}

function atqWorkbookField(attachments, census, key) {
  const row = VERIFY_TABLE_ROWS.find(r =>
    (r.atqExcelValueKey || r.key) === key && (r.atqExcelValueKey || r.atqExcelLabels));
  if (!row) return "";
  const column = EXTRACTED_FIELD_COLUMNS.find(c => c.key === "atq-excel");
  const source = columnDocSource(census, column);
  const value = worksheetValueByLabel(attachments, source, row.atqExcelSheet, row.atqExcelLabels, row.atqExcelLayout);
  return transformAtqExcelValue(value, row.atqExcelTransform);
}

// The Verify Table has two modes, and this is the switch between them.
//
//   Document mode  -- reached by Process. Every column is what the documents
//                     said, which is what this page has always been.
//   Dataverse mode -- entered deliberately by sending to n8n. The Agreement and
//                     Quotation columns then answer for Dataverse and for
//                     nothing else.
//
// `source === "n8n"` is the mode flag: only the n8n path sets it, and it stays
// set for the life of that upload. The mode is a property of how the page was
// reached, NOT of whether the last read succeeded -- which is why the status is
// checked separately below rather than folded in here.
function dataverseIsActive(dataverseVerify, roleKey) {
  return !!(DATAVERSE_VERIFY_SOURCES[roleKey] && dataverseVerify &&
    dataverseVerify.source === "n8n");
}

// In Dataverse mode, what Dataverse said about this Record_ID -- and a blank
// when it said nothing.
//
// The blank is deliberate and was asked for. A document's value standing in the
// Agreement column reads as "Dataverse holds this", which is the single
// question this mode exists to answer; falling back to the extracted value
// would answer a different question in the same cell with no way to tell. The
// row being empty is the finding.
//
// What makes an empty column safe here is dataverseVerifyNotice, which now says
// on the page which of the reasons it is -- still loading, no Record_ID, not
// inside the Model-Driven App, Dataverse refused the request, or no row carries
// this Record_ID. Before that existed, all five looked identical and looked
// like the documents had gone missing.
function verifyCellValue(crosschecks, key, roleKey, dataverseVerify, recordId, kind) {
  if (!dataverseIsActive(dataverseVerify, roleKey)) {
    return roleCellValue(crosschecks, key, roleKey, kind);
  }
  // A read for a different Record_ID is not an answer about this one: changing
  // the item tab moves the Record_ID while the rows in hand belong to the old.
  if (dataverseVerify.status !== "ready" || dataverseVerify.recordId !== recordId) return "";
  return dataverseCellValue(dataverseVerify, key, roleKey);
}

// What the table says about the Dataverse read, on screen rather than in the
// console. Every one of these was previously a console.warn nobody opens dev
// tools to see, and the only visible symptom was a table that had quietly got
// worse. "" when there is nothing to report.
//
// The "ready but nothing came back" case is the one worth spelling out in full:
// it is the normal outcome of pressing Refresh before the n8n flow has finished
// writing, and it is also exactly what a wrong table or column name looks like
// from here. Naming the tables and the value queried is what lets a reviewer
// tell those two apart without reading the source.
function dataverseVerifyNotice(dataverseVerify, recordId) {
  const dv = dataverseVerify;
  const sourceFor = key => DATAVERSE_VERIFY_SOURCES[key] || (key === "lis" ? DATAVERSE_LIS_SOURCE : null) || (key === "atqExcel" ? DATAVERSE_ATQ_EXCEL_SOURCE : null);
  if (!dv || !dv.status || dv.status === "idle") return "";
  if (dv.status === "loading") {
    return { tone: "info", text: "Reading Agreement, Quotation, ATQ Excel, and LIS from Dataverse\u2026" };
  }
  if (dv.status === "unavailable") {
    return { tone: "warn", text: dv.recordId
      ? "Dataverse is not reachable from here — this page is not running inside the Model-Driven App. The columns below are what the documents said."
      : "No Record ID yet, so there is nothing to look up. The columns below are what the documents said." };
  }
  if (dv.status === "timeout") {
    return { tone: "warn", text: "Waited " + Math.round(N8N_POLL_TIMEOUT_MS / 60000) + " minutes, but n8n had not written both Agreement and Quotation to Dataverse for " +
      (dv.recordId || recordId) + " yet. n8n may still be processing this item — press Refresh to check again." };
  }
  if (dv.status === "error") {
    return { tone: "warn", text: "Dataverse refused the request: " + (dv.error || "unknown error") +
      " \u2014 check that " + DATAVERSE_VERIFY_SOURCES.agreement.entity + ", " +
      DATAVERSE_VERIFY_SOURCES.quotation.entity + ", " +
      DATAVERSE_ATQ_EXCEL_SOURCE.entity + ", and " +
      DATAVERSE_LIS_SOURCE.entity + " exist and that each table's own primary name column (" +
      DATAVERSE_LIS_SOURCE.titleField + " on " + DATAVERSE_LIS_SOURCE.entity + ", " +
      DATAVERSE_VERIFY_SOURCES.agreement.titleField + " on the others) is its reference column." };
  }
  if (dv.recordId !== recordId) {
    return { tone: "warn", text: "The Dataverse values on this page were read for " + (dv.recordId || "another item") +
      ", not " + (recordId || "this item") + ". The columns below are what the documents said — press Refresh to re-read." };
  }
  const missing = ["agreement", "quotation", "lis"].filter(k => !dv[k]);
  if (missing.length === 3) {
    return { tone: "warn", text: "No row in " + DATAVERSE_VERIFY_SOURCES.agreement.entity + " or " +
      DATAVERSE_VERIFY_SOURCES.quotation.entity + " has admin_title2 = “" + recordId +
      "”. Either the n8n flow has not written them yet — press Refresh — or it keys them by something other than the Record ID." };
  }
  if (missing.length === 1) {
    return { tone: "warn", text: "Read " + sourceFor(missing[0] === "agreement" ? "quotation" : "agreement").entity +
      ", but no row in " + sourceFor(missing[0]).entity + " has " + sourceFor(missing[0]).titleField +
      " = “" + recordId + "”." };
  }
  return { tone: "ok", text: "Agreement, Quotation, ATQ Excel, and LIS below are live from Dataverse for " + recordId + "." };
}

// Read-only preview shown after Process, before Verify: one field per row,
// one document per column, so a reviewer sees at a glance what each document
// actually said and where they disagree. Built entirely on computeCrosschecks
// (the same per-role grouping Verify's own cross-check capsules read) rather
// than a second comparison pass, so the two surfaces can never disagree with
// each other about what "different" means, or about which document answers
// for a role. Nothing here is saved -- Continue just advances to Verify, same
// as goProcess would have gone directly before this page existed.
// The Verify Table's whole visual point: a real conflict is the only thing
// that should catch the eye. Colour and weight are spent on "different"
// only -- a strong red, bold, on a tinted chip; "similar" (a split every
// rule already softened to wording) gets a quieter amber mark; agreement and
// a lone, uncorroborated reading both stay plain text, because a page where
// everything is coloured teaches the eye to scan past colour entirely.
const VERIFY_VALUE_TONE = {
  different: { text: "text-[var(--red)] font-bold", bg: "bg-[#FEE2E2]", glyph: "", icon: "equalNot", iconColor: "text-[var(--red)]" },
  similar:   { text: "text-[var(--amber)] font-medium", bg: "bg-[#FEF3C7]", glyph: "≈ " },
  same:      { text: "text-[#1A1A1A]", bg: "", glyph: "" },
  unchecked: { text: "text-[var(--muted)]", bg: "", glyph: "" },
};

// The chip only draws when there is a value to carry it -- an empty cell
// painted red would report a finding with nothing behind it. The tooltip is
// crosscheckSentence's own sentence, so this table can never disagree with
// Verify's Automatic Checks about what "different" means or why.
function verifyValueTone(cc, value) {
  const severity = cc ? cc.severity : "unchecked";
  const tone = VERIFY_VALUE_TONE[severity] || VERIFY_VALUE_TONE.unchecked;
  const flagged = severity === "different" || severity === "similar";
  return {
    text: tone.text,
    bg: value ? tone.bg : "",
    glyph: value ? tone.glyph : "",
    icon: value ? tone.icon : "",
    iconColor: tone.iconColor || "",
    title: value && flagged && cc ? crosscheckSentence(cc) : "",
  };
}

function ExtractedFieldsPage({ attachments, crosschecks, census, itemIndex, goLis, openViewer, uid, recordId, emailSubject, dataverseVerify, refreshDataverse, dismissedDiffs, toggleDismissDiff, adminMode = false }) {
  // The one column this table shows: the ATQ workbook's own reading of each
  // field. Agreement / Quotation / the email subject still feed the severity
  // that colours this value (via crosschecks[key].severity below) -- they no
  // longer get a column of their own, per the redesign that collapsed the
  // document-vs-document grid into one value plus a conflict signal.
  const valueColumn = EXTRACTED_FIELD_COLUMNS.find(c => c.key === "atq-excel");
  // Keyed by the same names SPANNING_ROWS uses, so the row list stays one
  // list. atqRefNo reads through the same ATQ-Excel path as any other row;
  // uid/recordId are not per-document at all (see SPANNING_ROWS above).
  const spanValues = {
    uid: uid || "",
    recordId: recordId || "",
  };
  // The chop being looked at full size, or null. Local rather than lifted to
  // App: nothing outside this page can open it and nothing outside this page
  // survives it -- it is a look at a picture, not a selection.
  const [chopZoom, setChopZoom] = useState(null);
  const [selectedLisValues, setSelectedLisValues] = useState({});
  const [selectedLisSources, setSelectedLisSources] = useState({});
  // What the "Pair" button beside Product Type last came back with.
  //   status  "idle" | "loading" | "done" | "none" | "error"
  //   options the distinct Works Order Codes this Product Type allows
  // Local to this page on purpose: it is the result of one lookup against a
  // reference table, not part of the record. Nothing downstream reads it --
  // "Continue to save" reads the three LIS boxes, which is where the values
  // actually land, so a reviewer who pairs and then types over a box saves
  // what they typed.
  const [pair, setPair] = useState({ status: "idle", message: "", options: [] });
  const notice = dataverseVerifyNotice(dataverseVerify, recordId);
  const n8nVerifyMode = dataverseVerify && dataverseVerify.source === "n8n";
  const items = recordsBearingEntry(attachments) || [];
  const agreementSource = census.assigned.agreement && census.assigned.agreement.doc;
  const agreementDoc = agreementSource && docAt(attachments, agreementSource);
  // Read-only status for the two checkboxes in the reference strip -- whether
  // a document actually landed in that role slot, same truthy test as
  // agreementSource above, not whether OCR/extraction has finished on it.
  const quotationSource = census.assigned.quotation && census.assigned.quotation.doc;
  const signing = agreementDoc && agreementDoc.signing;
  // In Dataverse mode this is what n8n itself wrote to admin_signaturedetection2
  // on the Agreement record -- not a re-derivation of the local ink pass, same
  // "blank is deliberate" rule verifyCellValue follows for every other column
  // (see its comment above). Outside Dataverse mode there is no such record,
  // so it falls back to the local detection as it always did.
  const chop = dataverseIsActive(dataverseVerify, "agreement") &&
    dataverseVerify.status === "ready" && dataverseVerify.recordId === recordId
    ? dataverseCellValue(dataverseVerify, "chop", "agreement")
    : signatureDetectionLabel(signing);
  const chops = markDetections(signing, "chop");
  const signatures = markDetections(signing, "signature");
  // admin_pagenumber2 on the Dataverse Agreement record -- when it's ready for
  // THIS record, it's the page n8n confirmed the chop/signature sits on, and
  // overrides every mark's own OCR-guessed page for the View link below. Blank
  // (0) falls back to each mark's own page, same as verifyCellValue does for
  // the other fields on this page. When local OCR found no mark at all, this
  // is also what the Verify Table's Company Chop row falls back to instead of
  // going straight to "not extracted" -- see the chopAttachment render below.
  const chopPageOverride = dataverseIsActive(dataverseVerify, "agreement") &&
    dataverseVerify.status === "ready" && dataverseVerify.recordId === recordId
    ? (parseInt(dataverseCellValue(dataverseVerify, "chopPage", "agreement"), 10) || 0)
    : 0;
  // The link is only offered when there is something to open. A demo document
  // and a dropped-blob one both have signing to describe and no bytes to show,
  // and a link that opens an empty preview is worse than no link.
  const viewChop = openViewer && agreementSource && agreementDoc && agreementDoc.blob
    ? (page) => openViewer(agreementSource.typeKey, agreementSource.docIndex, page)
    : null;
  // The header's document button: still the same resolution as before
  // (columnDocSource, scoped to the ATQ role's workbook side), just no longer
  // repeated per column since there is only one left.
  const valueSrc = columnDocSource(census, valueColumn);
  const valueDoc = valueSrc && docAt(attachments, valueSrc);
  const openValueDoc = openViewer && valueDoc && valueDoc.blob
    ? () => openViewer(valueSrc.typeKey, valueSrc.docIndex, null, true)
    : null;
  // The page's own way into the Documents Viewer, sat beside "Document
  // Received" because that panel is where a reviewer first notices a document
  // exists and wants to look at it. Deliberately the OPPOSITE call to
  // openValueDoc above: no `only`, so the viewer's picker offers every
  // document of the entry. A column header narrows because the cells under it
  // answer from one file; this button is a reviewer browsing, which is the
  // case the whole pile is right for.
  const viewerSrc = [agreementSource, quotationSource].find(s => {
    const d = s && docAt(attachments, s);
    return !!(d && d.blob);
  }) || firstViewableSource(attachments);
  const openDocsViewer = openViewer && viewerSrc
    ? () => openViewer(viewerSrc.typeKey, viewerSrc.docIndex)
    : null;

  // Currency selection for PR Amount (HKD / USD), keyed by itemIndex so multi-item
  // uploads preserve each item's selection independently. Defaults to "HKD", or "USD"
  // if the extracted/saved values indicate USD.
  const [prCurrencies, setPrCurrencies] = useState({});
  const [prApprovalTooltipOpen, setPrApprovalTooltipOpen] = useState(false);
  useEffect(() => {
    if (!prApprovalTooltipOpen) return;
    const closeTooltip = () => setPrApprovalTooltipOpen(false);
    document.addEventListener("click", closeTooltip);
    return () => document.removeEventListener("click", closeTooltip);
  }, [prApprovalTooltipOpen]);

  const selectLisValue = (rowId, value, sourceKey) => {
    const v = String(value == null ? "" : value).trim();
    if (!v) return;
    if (FEATURES.prAmountCurrency && rowId === "prAmount") {
      if (/\bUSD\b/i.test(v)) setPrCurrency("USD");
      else if (/\bHKD\b/i.test(v)) setPrCurrency("HKD");
      const cleanAmt = v.replace(/\b(?:HKD|HK\$|USD|US\$)\b/gi, "").trim();
      setSelectedLisValues(prev => Object.assign({}, prev, { [rowId]: cleanAmt || v }));
    } else {
      setSelectedLisValues(prev => Object.assign({}, prev, { [rowId]: v }));
    }
    setSelectedLisSources(prev => Object.assign({}, prev, { [rowId]: sourceKey }));
  };
  // An own-property check, not a truthiness one: the reviewer can now CLEAR the
  // cell, and `|| lisCellValue(...)` would quietly refill it from Dataverse the
  // moment they emptied it -- a field that will not stay blank looks like a bug
  // in the box, not a policy about the column.
  //
  // `autoValue` is the Passed-row auto-fill (see verifyRowPassed) -- it only
  // ever supplies what Dataverse itself left blank, same priority as the
  // Dataverse LIS reading it sits beside, and the own-property check above it
  // still wins: a reviewer who clears an auto-filled cell gets to keep it
  // empty rather than have agreement silently refill it.
  // `row.lisSourceKey` overrides `key` (== row.key everywhere else) for rows
  // whose crosscheck key is shared with another row but whose saved-Dataverse
  // column is not -- currently just quotationStartDate/quotationEndDate, see
  // their VERIFY_TABLE_ROWS comment.
  //
  // `row.lisSeedPrefersValue` flips the two AUTOMATIC tiers -- and only those
  // two. The reviewer's own box still wins above it, unchanged.
  const lisValueForRow = (row, key, autoValue) => {
    if (Object.prototype.hasOwnProperty.call(selectedLisValues, row.id)) {
      return selectedLisValues[row.id];
    }
    const lisValue = lisCellValue(dataverseVerify, row.lisSourceKey || key);
    return row.lisSeedPrefersValue
      ? (autoValue || lisValue || "")
      : (lisValue || autoValue || "");
  };
  // The LIS column is the one the reviewer OWNS. The two buttons beside it are
  // shortcuts for the common answer, not the only answer, so the cell itself is
  // a text box. Typing sets the row's source to "manual" on purpose: otherwise a
  // typed value would sit under a still-highlighted "Selected" ATQ button and
  // claim to have come from a document it was never in.
  const setLisText = (rowId, text) => {
    setSelectedLisValues(prev => Object.assign({}, prev, { [rowId]: text }));
    setSelectedLisSources(prev => Object.assign({}, prev, { [rowId]: "manual" }));
  };
  // "Pair": read procurement's Product Type -> coding table and fill the three
  // code rows from it. Charge CCC and Account Code go straight in; Works Order
  // Code becomes a dropdown, because one Product Type legitimately allows
  // several and picking one for the reviewer would be choosing on their behalf
  // exactly where the table stops being able to.
  //
  // The single Works Order Code case still fills the box AND still offers the
  // dropdown -- a list of one is honest about there being one, whereas filling
  // it silently would leave the reviewer unable to tell "the table gave one
  // answer" from "the table was never asked".
  const runPair = async () => {
    // The value the Product Type ROW is currently showing, not the raw ATQ
    // reading: a reviewer who corrected that box has corrected what to pair on.
    // Same precedence lisValueForRow gives every other row -- manual edit >
    // saved Dataverse value > extracted value.
    const ptRow = rowById("productType");
    const productType = ptRow
      ? lisValueForRow(ptRow, ptRow.key, valueForVerifyRow(ptRow)) : "";
    if (!String(productType || "").trim()) {
      setPair({ status: "none", message: "No Product Type to pair on -- fill the Product Type row first.", options: [] });
      return;
    }
    setPair({ status: "loading", message: "Reading the coding table…", options: [] });
    let rows;
    try {
      rows = await fetchCccLookupRows();
    } catch (e) {
      // The server's own message, on screen. Same reasoning as
      // recordsLoadError / fieldSaveError: a wrong column name fails the WHOLE
      // query and says which one -- but only where somebody can read it.
      setPair({ status: "error", message: "Could not read the coding table: " + (e && e.message ? e.message : String(e)), options: [] });
      return;
    }
    if (rows === null) {
      setPair({ status: "error", message: "No coding table is configured for this side.", options: [] });
      return;
    }
    const found = pairCodesFromLookup(rows, productType, SCHEMA.cccLookup.fields);
    if (!found) {
      setPair({ status: "none", message: "“" + String(productType).trim() + "” is not in the coding table.", options: [] });
      return;
    }
    setLisText("chargeCcc", found.chargeCcc);
    setLisText("accountCode", found.accountCode);
    setLisText("issueBy", found.issueBy);
    // One option: fill the box too, so the common case needs no second click.
    // Several: leave the box as it was and let the dropdown be the only way in
    // -- prefilling the first of several is a choice disguised as a default.
    if (found.worksOrderCodes.length === 1) setLisText("worksOrderCode", found.worksOrderCodes[0]);
    setPair({
      status: "done",
      message: found.conflict
        ? "Warning: the " + found.matchedCount + " rows for this Product Type do not agree on Charge CCC / Account Code / Issue By. The first row's values were used — check them."
        : (found.worksOrderCodes.length > 1
            ? "Charge CCC, Account Code and Issue By filled. Pick a Works Order Code below."
            : "Charge CCC, Account Code, Issue By and Works Order Code filled."),
      options: found.worksOrderOptions || found.worksOrderCodes,
    });
  };
  // The Pair button and its result line, drawn in the Product Type row's LABEL
  // cell. The label cell and not the value cell, because what it acts on is
  // three OTHER rows -- a control inside this row's own box would read as
  // filling this row.
  //
  // One helper, called from BOTH render paths: Dataverse/n8n mode and document
  // mode draw the Verify Table's rows through separate branches of the same
  // map. Writing the markup twice is how the two modes start disagreeing about
  // whether the button is there at all, which is exactly what the first cut of
  // this did -- inline in the n8n branch, and absent from the mode a reviewer
  // is in before any Dataverse read has happened.
  const pairControl = row => {
    if (!FEATURES.verifyCodePair || row.id !== "productType") return null;
    return (
      <span className="block">
        <button type="button" onClick={runPair}
          disabled={pair.status === "loading"}
          title="Look this Product Type up in the coding table and fill Charge CCC / Account Code / Issue By / Works Order Code"
          className={"mt-1 inline-flex items-center gap-1 rounded-full border-[1.5px] px-3 py-1 fs-12-19 font-semibold ui-transition pressable " +
            (pair.status === "loading"
              ? "border-[var(--line)] text-[#B0AAA3] cursor-wait"
              : "border-[var(--orange)] text-[var(--orange)] hover:bg-[#FFF3E2]")}>
          {pair.status === "loading" ? "Pairing…" : "Pair"}
        </button>
        {pair.message && (
          <span className={"mt-1 block max-w-[220px] fs-12-19 font-normal " +
            (pair.status === "error" || pair.status === "none" ? "text-[#B0453A]"
              : pair.message.indexOf("Warning") === 0 ? "text-[#B78312]" : "text-[#3D8B5F]")}>
            {pair.message}
          </span>
        )}
      </span>
    );
  };
  // A `lisOnly` row has no Value and no Cross Check cell, so the document its
  // value was read from has nowhere else to be reachable from -- the button
  // those two columns carry went with them. This is the one case the LIS
  // column takes one: it is NOT a general re-adding of the Open pill that was
  // removed from this column on both sides at the user's request (see the
  // uid/solo branch's note), and every other row still reaches its document
  // from Value or Cross Check.
  const lisDocButton = row => {
    if (!row.lisOnly) return null;
    const csrc = crossCheckDocSource(row);
    const open = openDocButton(csrc, row.sourceRole);
    if (!open) return null;
    return <DocOpenButton onClick={open} title={"Open " + sourceBaseName(csrc)} />;
  };
  // Whether this row's box should be the Works Order Code picker rather than a
  // text input. True only AFTER Pair has read the coding table: before that
  // (and when it found nothing) the row stays a plain box, so it still shows
  // whatever BTB_LIS_Excel_Datas already held and can still be typed into by
  // hand -- a reviewer must not need this button to fill a field they already
  // know the answer to.
  const worksOrderPicker = row =>
    FEATURES.verifyCodePair && row.id === "worksOrderCode" && pair.options.length > 0;
  const worksOrderSelect = (row, value) => (
    <AnimatedSelect
      value={value || ""}
      onChange={v => setLisText(row.id, v)}
      options={pair.options.map(c => (typeof c === "object" && c !== null)
        ? { value: c.code || c.value, label: c.code || c.label, description: c.description || "" }
        : { value: c, label: c })}
      placeholder="Select a Works Order Code"
      title="Works Order Codes this Product Type allows"
      fullWidth

  // the cells beside it answer from that file alone, so offering every other

      const indexes = [csrc.docIndex, ...extraQuotationDocs(census)

  // the same fact stated twice, so they had better share one source of truth.
  const verifyRowPassed = (row, value, crossValue, severity) => {
    const left = String(value == null ? "" : value).trim();
    const right = String(crossValue == null ? "" : crossValue).trim();
    if (!left || !right || severity === "similar") return false;

  // catch, since that gate triggers on N and would wave a blank straight
  // through. Nothing drawn, so the card looks exactly as it did before.
  // btbTypeOf, not a second Y/N ternary: this pill and the admin_btbtype /
  // new_btb_type value the Document Workbench's Start writes are the same
  // claim about the same case, so they read one function. A reviewer who sees
  // NON-BTB here and finds BTB in Master Records has no way to tell which one

  const btbCaseLabel = btbTypeOf(btbValue);
  const btbCase = !btbCaseLabel ? null

  const [btbConfirmedItems, setBtbConfirmedItems] = useState({});

  const LIS_EXCEL_ROW_IDS = ["customerName", "vendor", "contractNo", "prAmount",

  // Back-to-Back = "N"). A "Y" case needs no extra paperwork here, so a period
  // mismatch alone must not raise this reminder.
  const friendlyReminderActive = periodMismatch && btbGated;
  // Quotation Expire Date is the one LIS column on this page that is a real
  // Dataverse DATE, so buildLisExcelPayload runs parseIsoDate on it and
  // mapPayload drops whatever that cannot read. Dropping is the right call --
  // Dataverse rejects the WHOLE update on a bad date, which would lose every
  // other field in the same Save -- but a value the reviewer can see sitting in
  // the box, silently not arriving, is the exact failure this file spends its
  // comments avoiding. So the drop is said out loud, before the click.
  //
  // Read through lisExcelValueForRow, not the raw extraction: it is the value
  // that would actually be WRITTEN, reviewer's own edit included, so the
  // warning cannot disagree with what the save does.
  const quotationExpiryRow = rowById("quotationExpireDate");
  const quotationExpiryShown = quotationExpiryRow
    ? String(lisExcelValueForRow(quotationExpiryRow) || "").trim() : "";
  const quotationExpiryUnwritable = quotationExpiryShown && !parseIsoDate(quotationExpiryShown)
    ? quotationExpiryShown : "";
  // An EXPIRED quotation stops the save outright: the LIS row would otherwise
  // be created against a quotation that is no longer valid, and nothing
  // downstream asks the question again.
  //
  // "Expired" is STRICTLY BEFORE today, and today itself is its own state:
  // URGENT. A quotation expiring today is still valid today, so stopping the
  // save would be refusing the one day it can still be used -- the reviewer is
  // told to hurry instead. Yesterday's is past saving, and that one is blocked.
  // The two must not be collapsed in either direction: blocking today loses a
  // valid case, and allowing yesterday saves an invalid one.
  //
  // Read through the same `quotationExpiryShown` the unwritable warning uses
  // -- that is the value that would actually be WRITTEN, the reviewer's own
  // edit included, so the gate and the save cannot disagree about which date
  // they are judging. Normalised with `normDate` rather than `parseIsoDate`
  // because the box legitimately holds the Quotation's own printed spelling
  // ("14-Oct-26"), which `new Date()` reads inconsistently and normDate reads
  // the way every other date on this page is read (see lisDateOf above).
  //
  // Today is built from the LOCAL clock, not `toISOString()`: in Hong Kong
  // that is +8, so a UTC day string is yesterday's date for the first eight
  // hours of every working day -- exactly the window in which a quotation
  // expiring today would be let through. One helper rather than a second copy
  // of that reasoning: buildLisStartPayload's Rec'd Date needs the same reading
  // of "today" for the same reason.
  const todayIsoDate = localIsoDay();
  const tomorrowIsoDate = localIsoTomorrow();
  const future3IsoDate = localIsoTomorrow(new Date(), 3);
  const quotationExpiryIso = normDate(quotationExpiryShown);
  const quotationExpired = !!(quotationExpiryIso && quotationExpiryIso < todayIsoDate);
  const quotationExpiresToday = !!(quotationExpiryIso && quotationExpiryIso === todayIsoDate);
  const quotationExpiresSoon = !!(quotationExpiryIso && new Date(quotationExpiryIso).valueOf() <= new Date(future3IsoDate).valueOf());
  // const quotationExpiresTomorrow = !!(quotationExpiryIso && new Date(quotationExpiryIso).valueOf() <= Date(tomorrowIsoDate).valueOf());
  // The row's treatment is keyed off ONE pair of tests, and the row is matched
  // by `key` rather than by `id` so the two spellings cannot drift. `lisOnly`
  // rows draw in two different branches (n8n mode and document mode), and the
  // LIS box is drawn in three places, so leaving the class inline would be four
  // chances to colour three of them.
  //
  // Expired, Urgent (today), and Warning (tomorrow) are mutually exclusive by
  // construction (`<` vs `=== today` vs `=== tomorrow`), so the ternaries below
  // never have to decide which wins.
  const isQuotationExpiryRow = row => row.key === "quotationExpireDate";
  const rowExpired = row => quotationExpired && isQuotationExpiryRow(row);
  const rowUrgent = row => quotationExpiresToday && isQuotationExpiryRow(row);
  const rowWarning = row => quotationExpiresSoon && isQuotationExpiryRow(row);
  // Urgent is drawn in the SAME red as Expired, at the user's request -- it was
  // amber. What still tells the two apart is the wording in the row ("Expired"
  // against "Urgent - expires today !!!") and the disabled button, not a hue.
  // Tomorrow's expiry is drawn in Orange with an urgent processing reminder.
  const rowAlarm = row => rowExpired(row) || rowUrgent(row);
  const lisInputClass = row => `w-full min-w-[120px] rounded-lg border px-3 py-1.5 text-right fs-14-19 ui-transition focus:outline-none focus:ring-2 focus:ring-[#FFE2B0] ${rowAlarm(row)
    ? "border-[var(--red)] bg-white font-bold text-[var(--red)] focus:border-[var(--red)]"
    : rowWarning(row)
      ? "border-2 border-[var(--orange-dark)] bg-[var(--orange)] font-bold text-[var(--ink)] focus:border-[var(--orange-dark)]"
      : "border-[var(--line)] bg-white text-[#1A1A1A] focus:border-[var(--orange)]"}`;
  // The whole row, not just its text. `verify-row-alarm` and `verify-row-warning`
  // are plain CSS classes (see the stylesheet) rather than Tailwind `bg-[...]`:
  // the table's own `.verify-stage tbody tr` rule is more specific than a utility
  // class and would win, leaving the row looking exactly as it did before.
  const verifyRowClass = row => "border-b border-[#EEE7DE]" + (rowAlarm(row) ? " verify-row-alarm" : rowWarning(row) ? " verify-row-warning" : "");
  const fieldCellClass = row => `px-3 py-2 ${rowAlarm(row)
    ? "font-bold text-[var(--red)]" : rowWarning(row) ? "font-bold text-[var(--orange-dark)]" : "font-medium text-[#3D3D3D]"}`;
  // The word "Urgent", UNDER the field name rather than beside it. The reviewer
  // is not being stopped here -- Continue to save still works -- so the state
  // has to say itself in the row -- with Urgent now painted the same red as
  // Expired, the words are the ONLY thing left that tells a reviewer which of
  // the two they are looking at. Same reasoning as the glyph vocabulary the
  // Verify Table already uses: never let colour alone carry the meaning.
  //
  // Returns null for every other row and for the ordinary case, so it can be
  // dropped into every `{label}` cell unconditionally.
  // The same reminder again, INSIDE the row, at the user's request. The panel
  // at the top of the card has scrolled out of sight by the time a reviewer has
  // reached this field — which is precisely the moment they need to read it.
  //
  // Its own <tr> spanning every column rather than more text in the field cell:
  // the sentence then gets the full width instead of squashing the label into
  // two characters per line, and the table's `border-spacing-y-2` makes it read
  // as a bar attached under the row. `cols` is passed in because the two
  // branches that draw this row have different column counts (n8n mode carries
  // a status cell, document mode does not) and a short colSpan would leave a
  // ragged white gap at the end of the bar.
  //
  // Returns null for every other row, so it can be dropped in unconditionally.
  const alarmNoteRow = (row, cols) => {
    if (!rowAlarm(row) && !rowWarning(row)) return null;
    const isWarn = rowWarning(row);
    return (
      <tr key={row.id + "-alarm"} className={isWarn ? "verify-row-warning" : "verify-row-alarm"}>
        <td colSpan={cols} className={`px-3 py-2 fs-13-19 leading-5 font-bold ${isWarn ? "text-[var(--orange-dark)]" : "text-[var(--red)]"}`}>
          {rowExpired(row)
            ? `This quotation expired on ${quotationExpiryShown}. Continue to save is off until the vendor re-issues it — then correct the date in the box above.`
            : rowUrgent(row)
              ? `Urgent !!! This quotation expires today (${quotationExpiryShown}). It is still valid, so you can continue to save — but it has to be done today.`
              : `Urgent !!! The quotation expires soon (${quotationExpiryShown}). The quotation is expiring soon, please process it Urgently.`}
        </td>
      </tr>
    );
  };
  const fieldCellNote = row => {
    if (rowExpired(row)) return (
      <span className="mt-0.5 block fs-11-19 font-bold uppercase tracking-[0.06em] text-[var(--red)]">Expired</span>
    );
    // Louder than the Expired line above it, at the user's request: bigger
    // (fs-14-19, the table's own body size, against Expired's fs-11-19) and
    // with "!!!" on the end. It is the state that does
    // NOT stop the reviewer, so it has to earn attention on its own — Expired
    // has a disabled button doing that for it.
    if (rowUrgent(row)) return (
      <span className="mt-0.5 block fs-14-19 font-bold uppercase tracking-[0.06em] text-[var(--red)]">Urgent — expires today !!!</span>
    );
    if (rowWarning(row)) return (
      <span className="mt-0.5 block fs-14-19 font-bold uppercase tracking-[0.06em] text-[var(--orange-dark)]">Urgent — expires tomorrow !!!</span>
    );
    return null;
  };
  // The Friendly reminder used to be pure information -- now the reviewer must
  // click "Noted" on it before Continue to save is allowed through, same
  // enforcement style as the Back-to-Back gate above (just no checklist, one
  // button). Keyed by itemIndex for the same reason btbConfirmedItems is: one
  // ATQ can cover several items, and noting item 2's reminder must not
  // silently wave item 3's through.
  const [friendlyReminderConfirmedItems, setFriendlyReminderConfirmedItems] = useState({});
  const friendlyReminderConfirmed = !!friendlyReminderConfirmedItems[itemIndex];
  // Scrolled to only when a blocked "Continue to save" click asks for it (see
  // blockedByFriendlyReminder) -- NOT on mount or on switching items. The
  // panel appearing because of a date mismatch is not itself an action the
  // reviewer took, so it must not move the page out from under them; only
  // their own click should do that.
  const friendlyReminderRef = useRef(null);
  // The reminder is RAISED BY THE CLICK, not by the page. friendlyReminderActive
  // only says the condition holds; this says the reviewer has actually pressed
  // "Continue to save" and been stopped by it. Keeping the panel up from the
  // moment two dates disagreed put a dimmed, blocking modal in front of a
  // reviewer who had not asked to save yet -- and often had not finished
  // reading the table the modal was covering. Same shape as btbConfirmOpen: a
  // bare boolean, not keyed by itemIndex, because it is transient UI state
  // rather than a record of what the reviewer has agreed to (that is
  // friendlyReminderConfirmedItems, which IS keyed).
  const [friendlyReminderOpen, setFriendlyReminderOpen] = useState(false);
  // Scrolled to when the gate opens, for the same reason btbConfirmOpen is:
  // the panel renders near the top of the card and the button that raised it
  // sits far below, so without this the click looks like it did nothing. The
  // effect (not a scroll inside the click handler) is what makes it work at
  // all now -- on the click that opens it the panel has not rendered yet, so
  // friendlyReminderRef.current is still null.
  useEffect(() => {
    if (friendlyReminderOpen && friendlyReminderRef.current) {
      friendlyReminderRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }, [friendlyReminderOpen]);
  const noteFriendlyReminder = () => {
    setFriendlyReminderConfirmedItems(prev => Object.assign({}, prev, { [itemIndex]: true }));
    setFriendlyReminderOpen(false);
    // Mirrors toggleBtbCheck's own continuation, minus the gate that just
    // passed. Noted only ever walks past ITS OWN gate: if Back-to-Back is
    // still outstanding for this item, this click must not save on the
    // reviewer's behalf -- they still have to open that panel and tick its
    // three boxes themselves, same as if Continue to save were pressed fresh
    // and blocked on Back-to-Back first.
    if (btbGated && !btbConfirmed) return;
    if (lisExcelWritten) { writeLisAndAdvance(null); return; }
    continueToSaveAfterGate();
  };
  // Shared by handleContinueToSave and toggleBtbCheck's own continuation --
  // returns true (and OPENS the reminder, scrolling to it) when it is still
  // standing in the way, so neither entry point can walk past it. Opening here
  // rather than rendering the panel unconditionally is what makes the reminder
  // a response to the reviewer's click instead of a modal that was already in
  // front of them.
  const blockedByFriendlyReminder = () => {
    if (!(friendlyReminderActive && !friendlyReminderConfirmed)) return false;
    setFriendlyReminderOpen(true);
    if (friendlyReminderRef.current) friendlyReminderRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
    return true;
  };
  const writeLisAndAdvance = async (existingId) => {
    const webApi = writeApi();
    const err = await writeLisExcelRecord(lisExcelValues(), recordId, lisExcelWritten, () => setLisExcelWritten(true), webApi, existingId);
    if (err) { console.error(err); setLisSaveError(err); return; }
    setLisSaveError("");
    goLis(lisExcelValues());
  };
  const handleContinueToSave = async () => {
    setLisSaveError("");
    // The button is already disabled while the quotation is expired, so this
    // never fires from a click. It is here because the save has two OTHER
    // entry points -- toggleBtbCheck's third tick and noteFriendlyReminder --
    // and a gate enforced only at the button is one refactor away from being
    // walked past by whichever of them opens next.
    if (!adminMode && quotationExpired) return;
    // Back-to-Back = N: open the confirmation panel instead of saving. Checked
    // before anything else so the gate cannot be walked past by a retry.
    if (btbGated && !btbConfirmed) { setBtbChecks([false, false, false]); setBtbConfirmOpen(true); return; }
    if (blockedByFriendlyReminder()) return;
    if (lisExcelWritten) { await writeLisAndAdvance(null); return; }
    await continueToSaveAfterGate();
  };
  // Ticking the third box both closes the panel and continues the save the
  // reviewer already asked for -- they pressed "Continue to save" to get here,
  // so making them press it again would be asking the same question twice.
  const toggleBtbCheck = (i) => {
    const next = btbChecks.map((v, j) => (j === i ? !v : v));
    setBtbChecks(next);
    if (!next.every(Boolean)) return;
    setBtbConfirmedItems(prev => Object.assign({}, prev, { [itemIndex]: true }));
    setBtbConfirmOpen(false);
    // Mirrors handleContinueToSave's own body, minus the gate that just passed.
    if (blockedByFriendlyReminder()) return;
    if (lisExcelWritten) { writeLisAndAdvance(null); return; }
    continueToSaveAfterGate();
  };
  // The half of handleContinueToSave that runs once the Back-to-Back gate is
  // satisfied. The Document Workbench's "Start" button now creates this
  // Record_ID's BTB_LIS_Excel_Datas row ahead of time (writeLisStartRecord), so
  // finding one here is the expected case, not a surprise needing reviewer
  // confirmation -- update it straight through instead of asking. null means no
  // row exists yet (Start was skipped, demo/standalone mode, or its write
  // failed) and falls back to create, same as before Start pre-created it. ""
  // means a row was found but its id (required to call updateRecord) could not
  // be resolved -- the one case that must still stop rather than risk a second
  // create against the same key. The read itself is otherwise best-effort: if
  // it throws (same reasoning as fetchDataverseVerifyRecords's own LIS read),
  // that is not a reason to block the save the reviewer actually asked for --
  // fall through to the create path exactly as before this check existed.
  const continueToSaveAfterGate = async () => {
    const webApi = writeApi();
    setLisChecking(true);
    let existingId = null;
    try {
      existingId = await findExistingLisRecordId(recordId, webApi);
    } catch (checkErr) {
      console.error(checkErr);
    }
    setLisChecking(false);
    if (existingId === "") {
      setLisSaveError("A BTB_LIS_Excel_Datas row already exists for this Record_ID, but its Dataverse row id could not be resolved -- check admin_btb_lis_excel_datas in Dataverse directly.");
      return;
    }
    await writeLisAndAdvance(existingId);
  };
  return (
    <React.Fragment>
      <TopBar title="Verify Table" desc="Check and Confirm the values to save"
        right={<React.Fragment>
          {adminMode && <Pill className="bg-[#FFF4DE] text-[var(--orange-dark)] border border-[var(--orange)]">Admin bypass</Pill>}
          {/* Dataverse mode only. In document mode this column is not
              answering for Dataverse at all, so a button that re-reads it would
              be offering to change what the page means rather than to refresh
              what it shows. `recordId` is required on top: the read is a lookup
              by Record_ID and there is nothing to look up without one. */}
          {refreshDataverse && recordId && dataverseVerify && dataverseVerify.source === "n8n" && <GhostButton onClick={refreshDataverse}
            disabled={dataverseVerify && dataverseVerify.status === "loading"}
            title={"Read Agreement, Quotation, ATQ Excel, and LIS from Dataverse for " + recordId}>
            <span className="inline-flex items-center gap-1.5"><Icon name="refresh" className="w-3.5 h-3.5" />
              {dataverseVerify && dataverseVerify.status === "loading" ? "Refreshing..." : "Refresh"}
            </span>
          </GhostButton>}
          <PrimaryButton onClick={handleContinueToSave} disabled={lisChecking || btbConfirmOpen || friendlyReminderOpen || (!adminMode && quotationExpired)}>
            <span className="inline-flex items-center gap-2"><Icon name="check" className="w-4 h-4" />
              {lisChecking ? "Checking..." : "Continue to save"}</span>
          </PrimaryButton>
        </React.Fragment>} />
      <div className="px-5 md:px-8 pb-8 verify-stage">
        <Card className="p-5 md:p-6 flex flex-col gap-5 overflow-hidden">
          {/* Why the ATQ value says what it says, in Dataverse mode. Every one
              of these states used to be a console.warn, so the only visible
              symptom of a failed read was a table that had quietly got worse. */}
          {notice && (
            <div className={`fs-14-19 leading-6 px-4 py-3 rounded-xl border ${
              notice.tone === "warn" ? "bg-[#FBEEDB] border-[#E3C88F] text-[#8A5A12]"
              : notice.tone === "ok" ? "bg-[#EFF5EF] border-[#C4D9C4] text-[#3D8B5F]"
              : "bg-[#F3EBE2] border-[#C5BEB6] text-[#6B6B6B]"}`}>
              {notice.text}
            </div>
          )}
          {/* Replaces the console.error-only failure -- the button used to move
              the reviewer on to LIS & Remark regardless of whether the write
              succeeded, so a failed save had no visible symptom at all. */}
          {lisSaveError && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[#B23B3B] rounded-lg">
              <div className="flex-1 fs-13-19 leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[#B23B3B]">Could not save to LIS.</span>{" "}
                {lisSaveError} Nothing moved on -- press Continue to save again to retry.
              </div>
            </div>
          )}
          {/* Why Continue to save is off. PrimaryButton takes only
              children/onClick/disabled/className -- a `title` on it is dropped
              without a word -- so a greyed button with no panel beside it and
              a greyed button the reviewer can act on are the same pixel. */}
          {quotationExpired && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[var(--red)] rounded-lg">
              <div className="flex-1 fs-13-19 leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[var(--red)]">The quotation has expired.</span>{" "}
                Quotation Expire Date is {quotationExpiryShown} ({quotationExpiryIso}), which is before
                today. Continue to save is off until a valid quotation is in hand -- ask the vendor for
                a re-issued one, then correct the date in the row below.
              </div>
            </div>
          )}
          {/* Urgent, NOT a gate. The quotation is still valid today, so nothing
              is disabled and no confirmation is asked for -- the reviewer is
              told to finish today and left to get on with it. Red like Expired
              at the user's request, which is exactly why the sentence has to
              say "you can continue to save" out loud: the colour no longer
              distinguishes the two states, so only the words do. */}
          {quotationExpiresToday && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FDECEC] border-l-4 border-[var(--red)] rounded-lg">
              <div className="flex-1 fs-13-19 leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[var(--red)]">Urgent !!! This quotation expires today.</span>{" "}
                Quotation Expire Date is {quotationExpiryShown} ({quotationExpiryIso}). It is still valid,
                so you can continue to save -- but it has to be done today. From tomorrow this case is
                blocked until the vendor re-issues the quotation.
              </div>
            </div>
          )}
          {quotationExpiresSoon && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FED7AA] border-l-4 border-[var(--orange)] rounded-lg">
              <div className="flex-1 fs-13-19 leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[var(--orange-dark)]">Urgent !!! The quotation expires tomorrow.</span>{" "}
                Quotation Expire Date is {quotationExpiryShown} ({quotationExpiryIso}). The quotation was expiry on Tomorrow,
                please process it Urgently.
              </div>
            </div>
          )}
          {quotationExpiryUnwritable && (
            <div className="w-full flex gap-2 px-4 py-3 bg-[#FBEEDB] border-l-4 border-[#E3C88F] rounded-lg">
              <div className="flex-1 fs-13-19 leading-5 text-[#3D3D3D]">
                <span className="font-bold text-[#8A5A12]">Quotation Expire Date will not be saved.</span>{" "}
                The LIS column is a date, and “{quotationExpiryUnwritable}” is not one. Everything
                else on this table still saves -- edit the box to a real date (YYYY-MM-DD) if you
                want this column filled.
              </div>
            </div>
          )}
          {/* The Back-to-Back gate. Opened by "Continue to save" when the Cost
              sheet's Back-to-Back is "N"; ticking all three closes it and
              continues the save. Close leaves the three unticked, so the gate
              stands and the button reopens this rather than saving -- the
              reviewer can read the table again first, which is the whole
              reason closing without confirming is allowed at all. */}
          {btbConfirmOpen && (
            // Fixed, covers the whole viewport regardless of where this panel
            // sits in the page's scroll -- a backdrop confined to the Card
            // would leave the sidebar and TopBar undimmed, which is the part
            // of the screen a reviewer's eye is most likely to still be on.
            <div className="fixed inset-0 z-40 bg-black/45" aria-hidden="true" />
          )}
          {btbConfirmOpen && (
            <div ref={btbPanelRef} role="group" aria-label="Back-to-Back confirmation"
              className="relative z-50 w-full flex flex-col gap-3 px-4 py-3.5 bg-[#FBEEDB] border-l-4 border-[#E3C88F] rounded-lg shadow-[0_16px_40px_rgba(0,0,0,0.25)]">
              <div className="flex items-start gap-3">
                <div className="flex-1 fs-13-19 leading-5 text-[#3D3D3D]">
                  <span className="font-bold text-[#8A5A12]">Back-to-Back = N.</span>{" "}
                  Confirm all three before saving.
                </div>
                <button type="button" onClick={() => setBtbConfirmOpen(false)} aria-label="Close"
                  className="shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[#8A5A12] hover:bg-[#E3C88F]/40 ui-transition pressable">
                  <Icon name="close" className="w-3.5 h-3.5" />
                </button>
              </div>
              <div className="flex flex-col gap-2.5">
                {[
                  "Confirm this case as NON-BTB.",
                  'Check "Non-Back-To-Back" order confirmation; please state the reason in the ATQ cost item remarks/email body',
                  "Check if the case involves ad hoc onsite support requested by the customer without a signed contract.",
                ].map((text, i) => (
                  <label key={i} className="flex items-start gap-2.5 fs-13-19 leading-5 text-[#3D3D3D] cursor-pointer">
                    <input type="checkbox" checked={btbChecks[i]} onChange={() => toggleBtbCheck(i)}
                      className="mt-0.5 w-4 h-4 shrink-0 accent-[var(--orange-dark)]" />
                    <span>{text}</span>
                  </label>
                ))}
              </div>
              <div className="fs-13-19 leading-5 text-[#3D3D3D] pt-1 border-t border-[#E3C88F]">
                If so, require written customer confirmation with a price quotation. Please refer to the
                ATQ approval grid and seek either AVP or SVP approval. Click 4: Check the
                "Agreement Chop &amp; Signed" status.
              </div>
            </div>
          )}
          {/* Contract period vs quotation period. Only raised when the
              Back-to-Back gate itself is active (Back-to-Back = "N") -- a "Y"
              case needs no extra paperwork here, so a period mismatch alone
              must not enable this reminder (see friendlyReminderActive). Both
              branches are shown because whether this is a renewal (接龍) is
              not something any document on this page states -- the reviewer
              picks the line that applies.
              No longer pure information -- "Continue to save" now refuses to
              proceed until "Noted" is clicked (see blockedByFriendlyReminder).
              It is also RAISED BY that click and not before: the condition
              holding (friendlyReminderActive) is not the reviewer asking to
              save, and a dimmed modal standing over the Verify Table from the
              moment two dates disagreed covered the very rows the reviewer
              needed to read. friendlyReminderOpen is the click; "Noted" closes
              it again, the same way ticking the third Back-to-Back box does. */}
          {friendlyReminderActive && friendlyReminderOpen && !friendlyReminderConfirmed && (
            // Same fixed, whole-viewport backdrop as the Back-to-Back gate --
            // up only while the reminder is open and unread.
            <div className="fixed inset-0 z-40 bg-black/45" aria-hidden="true" />
          )}
          {friendlyReminderActive && friendlyReminderOpen && (
            // Always the raised, above-the-backdrop style: the panel is only
            // on screen while the gate is open, and "Noted" closes it.

                        {statusCell}
                        <td className={fieldCellClass(row) + " align-top"}>{label}{fieldCellNote(row)}</td>

                            // No local mark at all -- but admin_pagenumber2 on the

                            : chopPageOverride
                              ? <span className="flex flex-col gap-0.5 items-end">
                                  <span className="fs-13-19 text-[#8E8E93] italic">Not detected locally</span>
                                  {viewChop &&
                                    <button onClick={() => viewChop(chopPageOverride)}

                                      className="fs-10-19 text-[#D4916E] font-semibold underline underline-offset-2 ui-transition pressable hover:text-[#B87551]">

                  // Handled By / IPT Unit Mgr / UID: none of these is a thing

                          ? <span className="fs-14-19 text-[#1A1A1A]">{chop}</span>

                if (row.special === "chopAttachment") {

                                      className="self-end mb-1 rounded-md border border-[#C5BEB6] overflow-hidden ui-transition pressable hover:border-[#D4916E]">
                                      <img src={m.crop} alt={`Company chop on page ${m.page}${m.name ? ", " + m.name : ""}`}

                // Document mode's half of `lisOnly`. Placed ABOVE the solo
                // test on purpose: quotationExpireDate satisfies `soloRole &&

                // untouched outside Dataverse mode.
                if (row.lisOnly) {
                  return (
                    <React.Fragment key={row.id}>
                    <tr className={verifyRowClass(row)}>
                      <td className={fieldCellClass(row)}>{label}{fieldCellNote(row)}</td>
                      <td className="px-3 py-2 align-top"></td>
                      <td className="px-3 py-2 align-top"></td>
                      {lisValueCell(row, key, row.lisAutoFill ? lisAutoFillValueForRow(row) : undefined)}

                    {alarmNoteRow(row, 4)}
                    </React.Fragment>
                  );
                }
                const excelValue = verifyCellValue(crosschecks, key, "atq", dataverseVerify, recordId, "excel");

                // Solo rows (Product Type / Service Type / Back-to-Back): the
                // ATQ workbook is the only document that ever states these,
                // so there is nothing to cross-check -- flagging them against
                // documents that were never asked would manufacture a
                // disagreement out of silence. Plain value, no colour, no
                // breakdown.
                //
                // Quotation No. reaches the same plain treatment, but
                // conditionally: only when the ATQ workbook left this blank
                // (soloRole), so the row falls back to the Quotation
                // document's own reading instead of reporting "not
                // extracted" for a value one document plainly states.
                const solo = config.solo || (config.soloRole && !excelValue);
                if (solo) {
                  // Solo rows: prefer ATQ Excel Dataverse value, fall back to extracted
                  const atqExcelVal = atqExcelValueForRow(config) || atqExcelCellValue(dataverseVerify, key);
                  // ...except an `atqExcelDataverseOnly` row, which has no
                  // fallback by design. Document mode is where this branch is
                  // easiest to miss: atqExcelValueForRow already refuses the
                  // worksheet, and leaving `|| excelValue` here would hand the
                  // row the very reading the flag exists to suppress -- one
                  // page showing Dataverse and the other the workbook.
                  const value = config.atqExcelDataverseOnly ? atqExcelVal
                    : atqExcelVal || (config.solo ? excelValue
                    : verifyCellValue(crosschecks, key, config.soloRole, dataverseVerify, recordId,
                        (EXTRACTED_FIELD_COLUMNS.find(c => c.roleKey === config.soloRole) || {}).kind));
                  const soloTitle = config.solo ? "" : "The ATQ workbook has no value here — shown from the Quotation document directly.";

                    <tr key={row.id} className={verifyRowClass(row)}>
                      <td className={fieldCellClass(row)}>{label}{pairControl(row)}{fieldCellNote(row)}</td>

                        {value
                          ? <span className="fs-14-19 text-[#1A1A1A]">{value}</span>

                      </td>
                      <td className="px-3 py-2 text-[#C5BEB6] italic align-top"></td>
                      {lisValueCell(row, key, row.lisAutoFill ? value : undefined)}
